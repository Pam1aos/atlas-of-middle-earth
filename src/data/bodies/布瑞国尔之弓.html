<p><strong>布瑞国尔之弓</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bow_of_Bregor" target="_blank" rel="noopener noreferrer">Bow of Bregor</a></strong>）是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>的<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>族长<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%9B%BD%E5%B0%94/">布瑞国尔</a>的大弓，后来成为了<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>的传家之宝。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>初年，<a class="wiki-link" href="/entry/%E4%BC%8A%E7%94%B8%E4%BA%BA/">伊甸人</a>将布瑞国尔之弓带带到了<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>，它从此成为努门诺尔王室的家传之宝。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>3319年，努门诺尔沦亡，布瑞国尔之弓也随着岛屿一起沉入大海。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
