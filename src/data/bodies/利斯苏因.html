<h1>利斯苏因</h1>
<p><strong>利斯苏因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lissuin" target="_blank" rel="noopener noreferrer">Lissuin</a></strong>）是一种生长在<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚岛</a>的芳香花卉，其芬芳沁人心脾。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>870年，当新婚的努门诺尔王储<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>与<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D/">埃仁迪丝</a>在<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E5%B0%BC%E4%BE%9D/">安督尼依</a>筹办盛宴时，前来道贺的<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE/">埃尔达精灵</a>带来许多鲜花装点宴会，这其中就包括利斯苏因。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“利斯苏因”这个名称是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>，它包含有<code>lissë</code>（意为“甜美的”）这一词根。</p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4/">未完的传说</a>，<a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4-%E7%AC%AC%E4%BA%8C%E8%BE%91-%E7%AC%AC%E4%BA%8C%E7%AF%87/">第二辑-第二章</a>，阿勒达瑞安与埃仁迪丝。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
