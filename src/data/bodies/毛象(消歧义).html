<p><strong>毛象</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Oliphaunts_(disambiguation" target="_blank" rel="noopener noreferrer">Oliphaunts</a>)</strong>），又称<strong>猛犸</strong>（Mumakil），可以指：</p>
<ul>
<li>毛象，一种哈拉德地区的巨兽。</li>
<li>毛象(诗歌)，一首霍比特人的诗歌。</li>
<li>猛犸(音乐)，影视作品《指环王：王者无敌》（加长版）完整配乐中的一首歌，由霍华德·肖创作。</li>
</ul>
