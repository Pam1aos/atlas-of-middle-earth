<h1>鲑鱼</h1>
<p><strong>鲑鱼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Salmons" target="_blank" rel="noopener noreferrer">Salmons</a></strong>），是一种一部分时间生活在海里，但有时会进入河流的鱼类。第二纪元<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>岛上的<a class="wiki-link" href="/entry/%E8%A5%BF%E5%88%A9%E5%B0%94%E6%B2%B3/">西利尔河</a>和<a class="wiki-link" href="/entry/%E5%8A%AA%E6%81%A9%E9%83%BD%E5%9B%A0%E5%B0%BC%E6%B2%B3/">努恩都因尼河</a>里都能找到鲑鱼。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
