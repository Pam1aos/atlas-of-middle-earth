<h1>欧尔洛斯塔</h1>
<p><strong>欧尔洛斯塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Orrostar" target="_blank" rel="noopener noreferrer">Orrostar</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>东境的海岬，气候凉爽，因为海岬东北方向的高地的保护故而免受东北寒风的影响。该地的内陆地区种植了大批谷物，尤其是靠近<a class="wiki-link" href="/entry/%E9%98%BF%E5%85%B0%E5%A4%9A/">阿兰多</a>边界的地区。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>Orrostar是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“东方的土地”。由表示东方的前缀<code>orró-</code>和表示土地的后缀<code>-sta</code>构成。结尾的<code>-r</code>表示复数。</p>
