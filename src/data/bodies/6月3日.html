<h1>6月3日</h1>
<h2>现实世界</h2>
<ul>
<li>1911年－翻译家奥克·奥尔马克斯出生。他第一个将《魔戒》翻译成瑞典语。</li>
<li>1930年－作家玛丽昂·布拉德利出生。</li>
<li>1945年－J·R·R·托尔金写下一封信（信件101号）。</li>
<li>1947年－演员马修·洛里基奥出生，他为1979年版《魔戒》广播剧配音，饰伊奥梅尔。</li>
<li>1998年－制片人威廉·劳伦斯·斯奈德去世。他曾参与制作了1967年版《霍比特人》动画电影》。</li>
<li>2004年－指环王交响乐团在美国亚特兰大举行首场演出。</li>
<li>2005年－Tolkien Gateway启动维基项目。</li>
</ul>
