<h1>德鲁恩</h1>
<p><strong>德鲁恩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Drûn" target="_blank" rel="noopener noreferrer">Drûn</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%9A%E6%9D%BE%E5%B0%BC%E5%AE%89/">多松尼安</a>的北部地区，位于塔恩艾路因湖以北。<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>在多松尼安躲避<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>的追捕时，曾在德鲁恩和魔苟斯的爪牙交锋，时人在传唱贝伦英雄功绩的歌谣中提到了“<a class="wiki-link" href="/entry/%E6%8B%89%E5%BE%B7%E6%B4%9B%E6%96%AF/">拉德洛斯</a>的伏击，德鲁恩的大火”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
