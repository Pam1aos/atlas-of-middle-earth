<h1>年代计法</h1>
<p><strong>《年代计法》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Reckoning_of_Years" target="_blank" rel="noopener noreferrer">The Reckoning of Years</a></strong>），是<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里阿道克·白兰地鹿</a>在<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>某时撰写的一本学术著作。在这部书中，梅里探讨了<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>与<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>的历法，与<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>、<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>和<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>等地使用的历法之间的关系。这是梅里最广为人知的作品之一（他的另一部著名作品是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E8%8D%AF%E8%8D%89%E5%AD%A6/">《夏尔药草学》</a>），被保存在<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87/">雄鹿镇</a>的图书馆之中。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">《魔戒》</a>附录中关于历法的部分内容，可能是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>教授从该书中摘录并翻译的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
