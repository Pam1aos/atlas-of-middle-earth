<p><strong>埃尔达泷迪</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eldalondë" target="_blank" rel="noopener noreferrer">Eldalondë</a></strong>），也被称为“绿港”。它地处<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>西海岸、<a class="wiki-link" href="/entry/%E5%8A%AA%E6%81%A9%E9%83%BD%E5%9B%A0%E5%B0%BC%E6%B2%B3/">努恩都因尼河</a>入海口处，位于广大的<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E5%A8%9C%E6%B9%BE/">埃尔达娜</a>海湾中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>港口临近<a class="wiki-link" href="/entry/%E5%B0%BC%E8%A5%BF%E5%A7%86%E9%98%BF%E5%8B%92%E8%BE%BE/">尼西姆阿勒达</a>地区，有许多自<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚</a>移植的<a class="wiki-link" href="/entry/%E8%8A%B3%E9%A6%99%E6%A0%91/">芳香树</a>在此生长。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>词源</h2>
<p>埃尔达泷迪在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中意为“埃尔达港口”，由<code>eldar</code>（<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE/">埃尔达</a>）与<code>londë</code>（港口）组成。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
