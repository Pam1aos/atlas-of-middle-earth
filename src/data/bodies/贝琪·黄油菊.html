<p><strong>贝琪·黄油菊</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Betsy_Butterbur" target="_blank" rel="noopener noreferrer">Betsy Butterbur</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E5%8F%B2%E7%9F%9B%E9%9D%A9%E4%B9%8B%E6%88%98/">《霍比特人：史矛革之战》</a>中原创的<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">人类</a>角色，由<a class="wiki-link" href="/entry/%E5%BD%BC%E5%BE%97%C2%B7%E6%9D%B0%E5%85%8B%E9%80%8A/">彼得·杰克逊</a>的女儿凯蒂·杰克逊客串出演。</p>
<h2>生平</h2>
<p>贝琪·黄油菊是布理镇的<a class="wiki-link" href="/entry/%E8%B7%83%E9%A9%AC%E5%AE%A2%E6%A0%88/">跃马客栈</a>的女招待，她是某位“老黄油菊”的亲戚。<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>和<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%C2%B7%E6%A9%A1%E6%9C%A8%E7%9B%BE/">梭林·橡木盾</a>在跃马客栈碰面时，她为两人提供了服务。</p>
