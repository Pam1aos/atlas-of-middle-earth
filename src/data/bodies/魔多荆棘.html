<h1>魔多荆棘</h1>
<p><strong>魔多荆棘</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Brambles_of_Mordor" target="_blank" rel="noopener noreferrer">Brambles of Mordor</a></strong>），是<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>生长的少数植物之一，分布在<a class="wiki-link" href="/entry/%E5%9F%83%E6%96%90%E5%B0%94%E5%BA%A6%E9%98%BF%E6%96%AF/">埃斐尔度阿斯</a>山脉脚下。这种荆棘纠结缠绕，刺又尖又长，长着刀一般的倒钩。在荆棘丛的上方，常有大团带红眼形状斑点的<a class="wiki-link" href="/entry/%E8%8B%8D%E8%9D%87/">苍蝇</a>飞舞，荆棘的芽苞上爬满蛆虫。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月15日晚，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>和<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>就是在魔多荆棘丛中过夜。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
