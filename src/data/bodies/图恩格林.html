<p><strong>图恩格林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/House_of_the_Swan" target="_blank" rel="noopener noreferrer">Tunglin</a></strong>），是《失落的传说之书》中提到的一支人类民族。他们应召自东方前来参与<a class="wiki-link" href="/entry/%E6%B3%AA%E9%9B%A8%E4%B9%8B%E6%88%98/">泪雨之战</a>，但却来得太晚，大队人马在“微光迷雾”<a class="wiki-link" href="/entry/%E5%B8%8C%E6%96%AF%E8%B7%AF%E5%A7%86/">希斯罗迷</a>定居下来。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
