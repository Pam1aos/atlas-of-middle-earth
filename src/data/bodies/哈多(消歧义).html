<p><strong>哈多</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hador(disambiguation" target="_blank" rel="noopener noreferrer">Hador</a>)</strong>），是以下人物的名字：</p>
<ul>
<li>哈多·罗林多（第一纪元390年 - 455年），是第一纪元的多尔罗明领主，战死于骤火之战。<ul>
<li>以他为名的哈多家族是第一纪元进入贝烈瑞安德的伊甸人中的第三支家族。</li>
</ul>
</li>
<li>哈多（第三纪元2245年 - 2395年），是刚铎第七位执政宰相。</li>
</ul>
