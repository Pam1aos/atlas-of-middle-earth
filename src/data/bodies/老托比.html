<h1>老托比</h1>
<blockquote>
<p>本词条叙述的对象是夏尔的烟叶品种。想要了解第一位在夏尔种植<a class="wiki-link" href="/entry/%E7%83%9F%E6%96%97%E8%8D%89/">烟斗草</a>的霍比特人，请参看<a class="wiki-link" href="/entry/%E6%89%98%E5%8D%9A%E5%BE%B7%C2%B7%E5%90%B9%E5%8F%B7/">托博德·吹号</a>。</p>
</blockquote>
<p><strong>老托比</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Toby" target="_blank" rel="noopener noreferrer">Old Toby</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>最优质的三种家产烟斗草之一（另外两种是<a class="wiki-link" href="/entry/%E9%95%BF%E8%B0%B7%E5%8F%B6/">长谷叶</a>和<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%BA%E4%B9%8B%E6%98%9F/">南区之星</a>）。这一种烟草的名称取自<a class="wiki-link" href="/entry/%E6%89%98%E5%8D%9A%E5%BE%B7%C2%B7%E5%90%B9%E5%8F%B7/">托博德·吹号</a>：他是第一个种植真正的烟斗草的人，那时候是<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E6%A0%BC%E9%87%8C%E5%A7%86%E4%BA%8C%E4%B8%96%C2%B7%E5%9B%BE%E5%85%8B/">艾森格里姆二世</a>统治夏尔的时代，大约<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2670年左右。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
