<p><strong>信件293号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_293" target="_blank" rel="noopener noreferrer">Letter 293</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给威廉·福克斯的一封信，写信日期为1966年12月29日。托尔金回复了采访的相关事宜<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>《苏格兰人报》的记者William·Foster要求采访他。托尔金很看重《苏格兰人报》，但表示由于时间限制，他无法接受采访。当他的下一本书出版时，会有新的采访。</p>
