<p><strong>信件289a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter289a" target="_blank" rel="noopener noreferrer">Letter289a</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1966年8月。托尔金对采访内容不太满意<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金说他真希望当初听从直觉拒绝那次采访。他希望那次采访不要发布，但如果非得发布的话，他希望能对采访内容加以修改。</p>
