<h1>Matěj Čadil</h1>
<p><strong>Matěj Čadil</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Matěj_Čadil" target="_blank" rel="noopener noreferrer">Matěj Čadil</a></strong>）是一位捷克画家。他创作了大量关于<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>作品的画作，尤以比较冷门的地点和角色为主。他绘制的<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E5%9B%BD%E7%8E%8B/">刚铎诸王</a>具有鲜明的拜占庭风格。Matěj Čadil授权本维基使用他的作品，详见授权信息。</p>
