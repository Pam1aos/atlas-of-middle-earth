<h1>诺斯特-那-洛希安</h1>
<p><strong>诺斯特-那-洛希安</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nost-na-Lothion" target="_blank" rel="noopener noreferrer">Nost-na-Lothion</a></strong>），又称<strong>百花诞辰</strong>（Birth of Flowers），据<a class="wiki-link" href="/entry/%E5%A4%B1%E8%90%BD%E7%9A%84%E4%BC%A0%E8%AF%B4%E4%B9%8B%E4%B9%A6%E4%B9%8B%E4%BA%8C-%E7%AC%AC%E4%B8%89%E7%AB%A0/">《失落的传说之书》</a>记载，是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的居民们在早春庆祝的节日。彼时寒意褪去、大地回春，<a class="wiki-link" href="/entry/%E7%8E%AF%E6%8A%B1%E5%B1%B1%E8%84%89/">环抱山脉</a>的冰雪消融，潺潺流向<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A7%86%E6%8B%89%E7%99%BB%E8%B0%B7/">图姆拉登谷</a>，绿野间因此繁花盛开。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E6%B0%91/">刚多林民</a>欢庆冬日的逝去，孩童们尽情嬉闹狂欢。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
