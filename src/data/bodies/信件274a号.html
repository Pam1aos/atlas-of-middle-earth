<p><strong>信件274a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter274a" target="_blank" rel="noopener noreferrer">Letter274a</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给奥斯汀·奥尔尼的一封信，写信日期为1965年7月31日。托尔金需要继续完善修订任务<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金曾致信美国版《魔戒III-双塔奇兵》的出版商<a class="wiki-link" href="/entry/%E9%9C%8D%E9%A1%BF%C2%B7%E7%B1%B3%E5%A4%AB%E6%9E%97%E5%87%BA%E7%89%88%E5%85%AC%E5%8F%B8/">霍顿·米夫林出版公司</a>，提及对第一版进行了三项修改。托尔金预料到<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92III-%E7%8E%8B%E8%80%85%E5%BD%92%E6%9D%A5/">《魔戒III-王者归来》</a>需要比《双塔奇兵》多更多的修改内容。</p>
