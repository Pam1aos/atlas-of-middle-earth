<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>典礼大道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Road_of_Pomps" target="_blank" rel="noopener noreferrer">Road of Pomps</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一条街道，连接着<a class="wiki-link" href="/entry/%E5%B0%8F%E9%9B%86%E5%B8%82/">小集市</a>和王之广场，途径诸神之地。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E7%9A%84%E9%99%B7%E8%90%BD/">刚多林陷落</a>时，<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>带领<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E6%B0%91/">刚多林民</a>从王之广场突围后，通过典礼大道抵达诸神之地，在那里和失散的妻子<a class="wiki-link" href="/entry/%E4%BC%8A%E7%BC%80%E5%B0%94/">伊缀尔</a>重聚。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
