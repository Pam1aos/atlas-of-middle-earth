<h1>捷足家族</h1>
<blockquote>
<p>本词条叙述的对象是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。想要了解<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a><a class="wiki-link" href="/entry/%E9%A9%AC/">马匹</a>，请参看<a class="wiki-link" href="/entry/%E6%8D%B7%E8%B6%B3/">捷足</a>。</p>
</blockquote>
<p><strong>捷足家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lightfoot_Family" target="_blank" rel="noopener noreferrer">Lightfoot Family</a></strong>），是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。唯一已知成员是<a class="wiki-link" href="/entry/%E5%B0%BC%E5%A8%9C%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">尼娜·捷足</a>。她与<a class="wiki-link" href="/entry/%E8%A5%BF%E5%A5%A5%E5%8D%9A%E5%B0%94%E5%BE%B7%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">西奥博尔德·博尔杰</a>成婚并育有一子<a class="wiki-link" href="/entry/%E5%A8%81%E5%88%A9%E5%8D%9A%E5%B0%94%E5%BE%B7%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">威利博尔德·博尔杰</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92III-%E7%8E%8B%E8%80%85%E5%BD%92%E6%9D%A5/">魔戒III-王者归来</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E9%99%84%E5%BD%95%E4%B8%89/">附录三 家族谱系（霍比特人）</a>。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
