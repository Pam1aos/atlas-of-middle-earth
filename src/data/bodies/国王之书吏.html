<h1>国王之书吏</h1>
<p><strong>国王之书吏</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/King's_Writer" target="_blank" rel="noopener noreferrer">King&#39;s Writer</a></strong>）是<a class="wiki-link" href="/entry/%E9%87%8D%E8%81%94%E7%8E%8B%E5%9B%BD/">重联王国</a>的皇家抄写员，负责重要典籍的抄录与复刻。国王之书吏<a class="wiki-link" href="/entry/%E8%8A%AC%E5%BE%B7%E5%90%89%E5%B0%94/">芬德吉尔</a>曾受<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">佩里格林·图克</a>的曾孙之托，制作了一份<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>的《<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98%E4%B9%8B%E4%B9%A6/">长官之书</a>》的精确抄本。该项工作于<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>172年（即<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E7%BA%AA%E5%B9%B4/">夏尔历</a>1592年）完成。此后，该抄本被一直保存在<a class="wiki-link" href="/entry/%E5%A4%A7%E6%96%AF%E5%AF%86%E5%A5%A5/">大斯密奥</a>中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
