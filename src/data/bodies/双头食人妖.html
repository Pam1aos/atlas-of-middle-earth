<p><strong>双头食人妖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Two-headed_Trolls" target="_blank" rel="noopener noreferrer">Two-headed Trolls</a></strong>）是一种真实性存疑的<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>。在<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">《霍比特人》</a>一书中，<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>曾这样写道：“是的，食人妖一般来说都是这副德性，即使那些只有一颗头的家伙也是如此。”<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>这句话暗示拥有两颗、甚至更多头颅的食人妖的存在。事实上，虽然双头食人妖在托尔金的作品里从未真正出场，但它们早已是很多民间传说中的常客。</p>
