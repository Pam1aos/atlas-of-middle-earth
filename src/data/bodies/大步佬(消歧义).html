<p><strong>大步佬</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Strider_(disambiguation" target="_blank" rel="noopener noreferrer">Strider</a>)</strong>）是原著中多个角色和章节的名字：</p>
<ul>
<li>阿拉贡，他的外号是“大步佬”。</li>
<li>大步佬(马)，弗罗多的坐骑。</li>
<li>大步佬(章节)，《魔戒I-魔戒同盟》第一卷的第十章节。</li>
<li>大步佬(音乐)，影视作品《指环王：护戒使者》（加长版）完整配乐中的一首歌，由霍华德·肖创作。</li>
</ul>
