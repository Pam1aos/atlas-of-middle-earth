<h1>阿尔达诸国</h1>
<p>《阿尔达诸国（<em>Kingdoms Of Arda</em>）》是由玩家开发的一款<a class="ext-link" href="https://www.taleworlds.com/en/Games/Bannerlord/" target="_blank" rel="noopener noreferrer">《骑马与砍杀Ⅱ：霸主》</a><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E4%B9%A6%E7%B1%8D)/">《魔戒》</a>题材单机/联机模组，以<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>打造的奇幻世界为舞台，将包括来自《<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">指环王</a>》、《<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>》、《<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">精灵宝钻</a>》和其他托尔金的作品以及各色同人作品中的各种角色、地点和武器等内容。模组正在开发中，上线时间待定。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>本词条将简单介绍游戏设定，详细设定请前往<a class="ext-link" href="http://wiki.mountbladecn.com/index.php?title=Kingdoms_of_Arda" target="_blank" rel="noopener noreferrer">骑砍中文百科的阿尔达诸国词条</a>。</p>
