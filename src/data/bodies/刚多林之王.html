<h1>刚多林之王</h1>
<p><strong>刚多林之王</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/King_of_Gondolin" target="_blank" rel="noopener noreferrer">King of Gondolin</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>之主所冠有的头衔。自刚多林建成直至它毁灭，有且只有一名刚多林之王。他就是<a class="wiki-link" href="/entry/%E8%8A%AC%E5%9B%BD%E6%98%90/">芬国昐</a>之子——<a class="wiki-link" href="/entry/%E5%9B%BE%E5%B0%94%E5%B7%A9/">图尔巩</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">精灵宝钻</a>，<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB-%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E5%BE%81%E6%88%98%E5%8F%B2-%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%B8%89%E7%AB%A0/">精灵宝钻征战史-第二十三章</a>，图奥与刚多林的陷落。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
