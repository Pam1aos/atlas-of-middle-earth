<p><strong>火足</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Firefoot" target="_blank" rel="noopener noreferrer">Firefoot</a></strong>）是<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>的坐骑。当伊奥梅尔从<a class="wiki-link" href="/entry/%E5%9F%83%E5%A4%9A%E6%8B%89%E6%96%AF/">埃多拉斯</a>前往<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>、参加海尔姆深谷之战时，他和<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>一同骑乘着火足。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>火足此后就没有再被提及，但有理由认为，它也随伊奥梅尔奔赴了<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>。</p>
