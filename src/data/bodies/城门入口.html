<h1>城门入口</h1>
<p><strong>城门入口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gateway" target="_blank" rel="noopener noreferrer">Gateway</a></strong>），特指<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>首都<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>城<a class="wiki-link" href="/entry/%E7%99%BD%E5%9F%8E%E5%A4%A7%E9%97%A8/">大门</a>前的一条短路，长度一弗隆（约合两百米），它从城门延伸到<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E/">佩兰诺平野</a>，与原野上的大道交错的路口相接。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3021年5月1日，<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>在城口入口处举行了加冕为<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E5%9B%BD%E7%8E%8B/">刚铎国王</a>的典礼，然后才进入城市，开始统治刚铎。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
