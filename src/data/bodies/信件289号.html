<p><strong>信件289号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_289" target="_blank" rel="noopener noreferrer">Letter 289</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E8%BF%88%E5%85%8B%E5%B0%94%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">迈克尔·托尔金</a>的一封信，写信日期为1966年7月29日。托尔金解释了<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>一词的起源<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金解释了“黑森林”这个词的起源，并不是他自己发明的，而是取材自Myrkviðr，Myrkviðr是哥特人和匈奴人之间传统上的边界。</p>
