<h1>北端</h1>
<p><strong>北端</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/North_end" target="_blank" rel="noopener noreferrer">North end</a></strong>），指<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>城邦<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>的北部区域，雄伟的<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%B8%80%E5%A4%A7%E5%8E%85/">第二十一大厅</a>与储存着文献的<a class="wiki-link" href="/entry/%E9%A9%AC%E6%89%8E%E5%B8%83%E5%B0%94%E5%AE%A4/">马扎布尔室</a>就坐落于此。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2989年，<a class="wiki-link" href="/entry/%E5%B7%B4%E6%9E%97%E7%9A%84%E6%AE%96%E6%B0%91%E9%98%9F/">巴林的殖民队</a>返回墨瑞亚，占领了第二十一大厅，并将马扎布尔室作为指挥所。三十年后，护戒远征队在穿过墨瑞亚时经过此处，在一地狼藉的马扎布尔室找到了巴林的坟墓。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
