<h1>捷足</h1>
<blockquote>
<p>本词条叙述的对象是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的<a class="wiki-link" href="/entry/%E9%A9%AC/">马匹</a>。想要了解<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族，请参看<a class="wiki-link" href="/entry/%E6%8D%B7%E8%B6%B3%E5%AE%B6%E6%97%8F/">捷足家族</a>。</p>
</blockquote>
<p><strong>捷足</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lightfoot" target="_blank" rel="noopener noreferrer">Lightfoot</a></strong>）是一匹<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的<a class="wiki-link" href="/entry/%E9%A9%AC/">马</a>，是<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿</a>王的坐骑<a class="wiki-link" href="/entry/%E9%9B%AA%E9%AC%83/">雪鬃</a>的父亲。捷足在雪鬃的墓志铭上被提到。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92III-%E7%8E%8B%E8%80%85%E5%BD%92%E6%9D%A5/">魔戒III-王者归来</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E4%BA%94-%E7%AC%AC%E5%85%AD%E7%AB%A0/">卷V-第六章</a>，佩兰诺平野之战。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
