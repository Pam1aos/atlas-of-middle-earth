<p>Jenny Dolfen</p>
<p>《<strong>诺多兰提</strong>》（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Noldolantë" target="_blank" rel="noopener noreferrer">Noldolantë</a></strong>），意为“诺多的堕落”，是一首由<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA/">费艾诺</a>的次子、著名的诗人与歌者<a class="wiki-link" href="/entry/%E7%8E%9B%E6%A0%BC%E6%B4%9B%E5%B0%94/">玛格洛尔</a>所著的哀歌。它讲述了费艾诺的叛离与<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E6%97%8F/">诺多族</a>的流亡，<a class="wiki-link" href="/entry/%E7%8E%9B%E6%A0%BC%E6%B4%9B%E5%B0%94/">玛格洛尔</a>自身就曾参与其中。哀歌还讲述了发生在澳阔泷迪的第一次亲族残杀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><em><strong>Noldolantë</strong></em> 在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中意为“诺多的堕落”，由 <em>Noldo</em>（“诺多族”）与 <em>lantë</em>（“下落”）组成。</p>
