<h1>金贵家族</h1>
<p><strong>金贵家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Goldworthy_Family" target="_blank" rel="noopener noreferrer">Goldworthy Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。已知的成员有<a class="wiki-link" href="/entry/%E6%B1%89%E5%A8%9C%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">汉娜·金贵</a>，她与<a class="wiki-link" href="/entry/%E9%A9%AC%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">马道克·白兰地鹿</a>成婚并育有一子<a class="wiki-link" href="/entry/%E9%A9%AC%E5%B0%94%E9%A9%AC%E8%BE%BE%E6%96%AF%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">马尔马达斯</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
