<p><strong>戴因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dáin(disambiguation" target="_blank" rel="noopener noreferrer">Náin</a>)</strong>）可以指代下列两位矮人：</p>
<ul>
<li>戴因一世(第三纪元2440年 - 2589年)，都林矮人之王，被一头冷龙杀死。</li>
<li>“铁足”戴因(第三纪元2767年 - 3019年)，山下之王，在梭林二世去世后立为都林矮人之王。</li>
</ul>
