<p><strong>西方大军</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Host_of_the_West_(disambiguation" target="_blank" rel="noopener noreferrer">Host of the West</a>)</strong>），可以指代下列数支军队：</p>
<ul>
<li>维拉大军，又称“西方大军”，在愤怒之战中推翻魔苟斯的军队；</li>
<li>西方大军(安格玛战争)，由精灵、刚铎人、阿尔诺人、霍比特人等组成的进攻安格玛王国的大军；</li>
<li>西方大军(魔戒大战)，由阿拉贡领导的人类联军，负责吸引索隆的注意力，协助弗罗多完成毁戒任务。</li>
</ul>
