<h1>爱努的第二乐章</h1>
<p><strong>爱努的第二乐章</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Second_Music_of_the_Ainur" target="_blank" rel="noopener noreferrer">Second Music of the Ainur</a></strong>），是<a class="wiki-link" href="/entry/%E6%9C%AB%E6%97%A5%E5%86%B3%E6%88%98/">世界终结</a>后，众<a class="wiki-link" href="/entry/%E7%88%B1%E5%8A%AA/">爱努</a>与<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94%E7%9A%84%E5%84%BF%E5%A5%B3/">伊露维塔的儿女</a>将在<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94/">伊露维塔</a>的面前合唱的一首乐曲。</p>
<p>据说，第二乐章将比创世的<a class="wiki-link" href="/entry/%E7%88%B1%E5%8A%AA%E7%9A%84%E5%A4%A7%E4%B9%90%E7%AB%A0/">大乐章</a>更加恢弘和谐，因为那时，每位乐章的参与者都将彻底领悟伊露维塔赋予自己的角色，并且知晓彼此的领悟。伊露维塔的所有主题将在第二首大乐章中得到正确的演绎，而伊露维塔将感到大喜，用<a class="wiki-link" href="/entry/%E7%A7%98%E7%81%AB/">不灭之火</a>使每位歌手的构想在唱出的那一瞬间化作现实，崭新的宇宙从而诞生。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
