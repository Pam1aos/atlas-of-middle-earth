<h1>座狼语</h1>
<blockquote>
<p><strong>这个词条叙述的对象出现于<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的作品中，但它并没有被给予确定的名称。</strong> 本维基为方便查阅，酌情暂定该词条的名称。</p>
</blockquote>
<p><strong>座狼语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Warg-language" target="_blank" rel="noopener noreferrer">Warg-language</a></strong>），是<a class="wiki-link" href="/entry/%E8%8D%92%E9%87%8E%E8%BE%B9%E7%BC%98/">荒野边缘</a>的<a class="wiki-link" href="/entry/%E5%BA%A7%E7%8B%BC/">座狼</a>使用的语言。</p>
<p>当<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>误入座狼与奥克的集会后，甘道夫听懂了座狼的语言，比尔博形容这种语言“听起来很糟”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">霍比特人</a>，<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA-%E7%AC%AC%E5%85%AD%E7%AB%A0/">第六章</a>，才出煎锅又入火坑。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
