<p><strong>阿塞拉斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Athelas_(journal" target="_blank" rel="noopener noreferrer">Athelas</a>)</strong>），是丹麦托尔金学社的丹麦语期刊，自<a class="wiki-link" href="/entry/1993%E5%B9%B4/">1993年</a>起出版。<a class="wiki-link" href="/entry/1997%E5%B9%B4/">1997年</a>，学社创始人拉斯-泰耶·莱斯莫斯辞去编辑一职后，期刊转变成电子报，只持续了一年就于<a class="wiki-link" href="/entry/1998%E5%B9%B4/">1998年</a>停刊。本期刊每年四期，每期约50页，每年也会定期出版英文版期刊。</p>
