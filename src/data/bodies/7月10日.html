<h1>7月10日</h1>
<h2>现实世界</h2>
<ul>
<li>1964年－J·R·R·托尔金给艾伦·怀特写了一封信。</li>
<li>1990年－乔治·艾伦与昂温有限公司被哈珀柯林斯出版社收购。</li>
<li>2003年－第五届托尔金大会举办。</li>
<li>2004年－翻译家汉斯·J·许茨去世。他曾将《未完的传说》、《失落的传说》和《罗弗兰登》译为德语。</li>
<li>2008年－第十届托尔金大会举办，为期四天（7月10日-13日）。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元3018年－甘道夫抵达艾森加德，发现萨茹曼叛变，被其囚禁于欧尔桑克塔顶。</li>
</ul>
