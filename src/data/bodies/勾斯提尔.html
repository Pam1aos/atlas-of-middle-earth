<p>Jack Dullahan</p>
<p><strong>勾斯提尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gostir" target="_blank" rel="noopener noreferrer">Gostir</a></strong>），是<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>麾下的一条<a class="wiki-link" href="/entry/%E6%81%B6%E9%BE%99/">恶龙</a>。除名称外，没有关于它的任何记载。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>勾斯提尔（Gostir）是一个<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>名称，意为“恐怖的一瞥”。它由<code>gost</code>（“恐怖”）和<code>thîr</code>（“看，面部，表情”）组成。该名称较旧的形式是 Gorsthir。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
