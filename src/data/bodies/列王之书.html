<h1>列王之书</h1>
<p><strong>《列王之书》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Book_of_the_Kings" target="_blank" rel="noopener noreferrer">Book of the Kings</a></strong>）是一部<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的编年史。它记载了<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E5%9B%BD%E7%8E%8B/">刚铎诸王</a>及其家族成员的生平事迹。</p>
<p>《列王之书》可能具有官方性质，其编撰会受到政治影响。例如，在<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A6%82%E5%B8%8C%E5%B0%94/">贝如希尔王后</a>被她的丈夫<a class="wiki-link" href="/entry/%E5%A1%94%E6%A0%8F%E5%86%9C%C2%B7%E6%B3%95%E6%8B%89%E6%96%AF%E5%9B%BE%E5%B0%94/">塔栏农王</a>逐出<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>之后，她的名字也被从《列王之书》里除去了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
