<h1>金树(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>金树</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Golden_Tree" target="_blank" rel="noopener noreferrer">Golden Tree</a></strong>）可以指代两种不同的树木：</p>
<ul>
<li>劳瑞林，阿门洲双圣树中的金圣树。她有着金色的枝叶和花朵，在一天中晚些的时候绽放。</li>
<li>瑁珑，大海以东只生长在洛丝罗瑞恩的高大树木，在春天绽放金色的花朵。</li>
</ul>
