<h1>5月2日</h1>
<h2>现实世界</h2>
<ul>
<li>1924年－演员西奥多·比凯尔出生。他为1980年版《王者归来》动画电影配音，饰阿拉贡。</li>
<li>1955年－J·R·R·托尔金给特恩布尔小姐写了一封信。</li>
<li>1968年－J·R·R·托尔金写下一封信（信件302号）。</li>
<li>1981年－《阿蒙汉》第50期出版。</li>
<li>1995年－演员迈克尔·霍登出生。他为1981年版《魔戒》广播剧配音，饰甘道夫。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元2942年－凌晨，幽谷的精灵在河边欢唱，纪念斯毛格之死与五军之战的胜利，吵醒了比尔博。</li>
</ul>
