<h1>科玛瑞</h1>
<p><strong>科玛瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Cormarë" target="_blank" rel="noopener noreferrer">Cormarë</a></strong>），又称<strong>魔戒日</strong>，是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>在<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>时的一个节日。它定于每年的9月22日（按照刚铎历法，则是<a class="wiki-link" href="/entry/%E4%B9%9D%E6%9C%88/">丰实之月</a>的30日），这一天是摧毁<a class="wiki-link" href="/entry/%E8%87%B3%E5%B0%8A%E6%88%92/">至尊戒</a>的英雄<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多·巴金斯</a>的生日，节日的意义就是向他致敬。刚铎历法中的闰年通过将此节日加倍的方法来实现。</p>
<h2>名称释义</h2>
<p>“科玛瑞”（Cormarë）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，它包含<code>corma</code>（“戒指”）一词。</p>
<h2>轶闻</h2>
<p>9月22日，也就是“科玛瑞节”这一天，是很多托尔金社团选择的创立日，其中包括荷兰的乌昆多社、瑞典的埃瑞丹社和丹麦的伊姆拉缀斯社。</p>
