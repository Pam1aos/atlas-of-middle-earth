<h1>北岬</h1>
<p><strong>北岬</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/North_Cape" target="_blank" rel="noopener noreferrer">North Cape</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>最北端的海岬，位于岛屿北部的贫瘠岩地<a class="wiki-link" href="/entry/%E4%BD%9B%E6%B4%9B%E6%96%AF%E5%A1%94/">佛洛斯塔</a>的尽头。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
