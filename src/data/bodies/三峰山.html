<h1>三峰山</h1>
<p><strong>三峰山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Thrihyrne" target="_blank" rel="noopener noreferrer">Thrihyrne</a></strong>），是<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>中的一座陡峭高山，因为由三座连峰构成而得名。它坐落在呈东南－西北走向的白色山脉的最北端，同时也是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97%E8%B1%81%E5%8F%A3/">洛汗豁口</a>的最南端。三峰山脚下是著名的<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>，洛汗王国的军事要塞<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>就位于深谷之中、依山而建。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>三峰山（Thrihyrne）的原名是一个古英语词汇，意为“三座角峰”。</p>
