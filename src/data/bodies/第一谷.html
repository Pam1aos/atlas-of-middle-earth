<h1>第一谷</h1>
<p><strong>第一谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/First_Deep" target="_blank" rel="noopener noreferrer">First Deep</a></strong>），是<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>城邦<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>的负一层（以<a class="wiki-link" href="/entry/%E9%BB%AF%E6%BA%AA%E9%97%A8/">墨瑞亚东门</a>的所在层为第一层）。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E5%A4%A7%E5%8E%85/">第二大厅</a>位于第一谷，它和向上通往第一层<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E5%A4%A7%E5%8E%85/">第一大厅</a>以及<a class="wiki-link" href="/entry/%E9%BB%AF%E6%BA%AA%E9%97%A8/">墨瑞亚东门</a>的阶梯之间，隔着无底深渊，仅通过细长的<a class="wiki-link" href="/entry/%E5%8D%A1%E6%89%8E%E7%9D%A3%E5%A7%86%E6%A1%A5/">卡扎督姆桥</a>相连，这是为阻止占领第一大厅的敌人侵入第一谷的防御措施。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年1月15日，护戒远征队在墨瑞亚<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%83%E5%B1%82/">第七层</a>的<a class="wiki-link" href="/entry/%E9%A9%AC%E6%89%8E%E5%B8%83%E5%B0%94%E5%AE%A4/">马扎布尔室</a>与敌人激战后，向下连奔七层阶梯，来到第一谷的第二大厅。<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>在此遭遇了炎魔<a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E7%9A%84%E5%85%8B%E6%98%9F/">都林的克星</a>，并和它双双坠下卡扎督姆桥。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
