<h1>色尔尼河</h1>
<p><strong>色尔尼河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Serni" target="_blank" rel="noopener noreferrer">Serni</a></strong>），是刚铎王国的南方封地<a class="wiki-link" href="/entry/%E8%8E%B1%E6%9C%AC%E5%AE%81/">莱本宁</a>境内的一条河流。它发源于<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>的南麓，一路向南穿过莱本宁，最后和<a class="wiki-link" href="/entry/%E5%90%89%E5%B0%94%E8%8E%B1%E6%81%A9%E6%B2%B3/">吉尔莱恩河</a>在<a class="wiki-link" href="/entry/%E6%9E%97%E5%B8%8C%E5%B0%94/">林希尔镇</a>的附近汇流。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup> 虽然色尔尼河比吉尔莱恩河的流程要短，但汇流之后的河流依然以它为名，直到入海。它的入海口被砺石滩阻挡，不宜通航。</p>
<h2>名称释义</h2>
<p>“色尔尼”（Serni）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>地名，它是“萨恩”（小圆石，鹅卵石）一词的形容词形式，意为“多石的”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
