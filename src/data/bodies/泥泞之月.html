<h1>泥泞之月</h1>
<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>
</blockquote>
<p><strong>泥泞之月</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Solmath" target="_blank" rel="noopener noreferrer">Solmath</a></strong>），是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E9%99%84%E5%BD%95%E5%9B%9B/">夏尔历法</a>中的二月，大约对应现实中的1月22日至2月20日。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
