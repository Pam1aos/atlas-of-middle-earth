<p><strong>沃隆威</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Voronwë_(disambiguation" target="_blank" rel="noopener noreferrer">Voronwë</a>)</strong>）是一个昆雅语名字，意为“坚定的”，它可能是指：</p>
<ul>
<li>沃隆威，第一纪元的一位精灵，他带图奥进入了刚多林。</li>
<li>马迪尔·沃隆威，刚铎的第一位执政宰相。</li>
<li>沃隆威(努门诺尔人)，是一位随埃兰迪尔逃离努门诺尔沉没的西方人类。</li>
</ul>
