<p><strong>遗忘客栈</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Forsaken_Inn" target="_blank" rel="noopener noreferrer">The Forsaken Inn</a></strong>）位于<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>东边一天路程的地方。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年10月6日，<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">大步佬</a>带着<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>等四位霍比特人抵达<a class="wiki-link" href="/entry/%E9%A3%8E%E4%BA%91%E9%A1%B6/">风云顶</a>。在风云顶上，梅里问大步佬：“<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>还有多远？”大步佬回答：</p>
<blockquote>
<p>布理东边一天路程的地方，有个‘<strong>遗忘客栈</strong>’，我不知道过了那里之后大道是否曾经用哩来衡量过。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
</blockquote>
