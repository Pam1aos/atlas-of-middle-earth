<h1>晶辉洞之王</h1>
<p><strong>晶辉洞之王</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lord_of_the_Glittering_Caves" target="_blank" rel="noopener noreferrer">Lord of the Glittering Caves</a></strong>），是<a class="wiki-link" href="/entry/%E6%A0%BC%E7%BD%97%E5%9B%A0(%E5%90%89%E5%A7%86%E5%88%A9%E7%9A%84%E7%88%B6%E4%BA%B2)/">格罗因</a>之子、矮人<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>创设的头衔，指矮人殖民地<a class="wiki-link" href="/entry/%E6%99%B6%E8%BE%89%E6%B4%9E/">晶辉洞</a>的领主。</p>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>结束、<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>覆灭后，<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>将一部分<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%8D%9A%E7%9A%84%E7%9F%AE%E4%BA%BA/">埃瑞博的矮人</a>带到<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>境内、<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>中的<a class="wiki-link" href="/entry/%E6%99%B6%E8%BE%89%E6%B4%9E/">晶辉洞</a>，建起了一座矮人殖民地，吉姆利成为首代晶辉洞之王。他和他率领的矮人为<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>和<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>做了许多出色的工作，尤其是为<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>用<a class="wiki-link" href="/entry/%E7%A7%98%E9%93%B6/">秘银</a>和钢铁铸造了新的城门，替换在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E4%BA%94-%E7%AC%AC%E5%9B%9B%E7%AB%A0/">刚铎围城</a>期间被<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8E%9B%E5%B7%AB%E7%8E%8B/">安格玛巫王</a>摧毁的<a class="wiki-link" href="/entry/%E7%99%BD%E5%9F%8E%E5%A4%A7%E9%97%A8/">大门</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
