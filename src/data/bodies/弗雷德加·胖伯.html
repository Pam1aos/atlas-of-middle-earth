<p><strong>弗雷德加·胖伯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fredegar_Chubb" target="_blank" rel="noopener noreferrer">Fredegar Chubb</a></strong>），是《霍比特人：意外之旅》加长版中登场的原创<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由演员 Eric Vespe 饰演。</p>
<h2>生平</h2>
<p>《霍比特人：意外之旅》加长版中，<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>意外拜访<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>后不久，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>到<a class="wiki-link" href="/entry/%E7%BB%BF%E9%BE%99%E9%85%92%E9%A6%86/">绿龙酒馆</a>外的市场上购物，他从弗雷德加·胖伯的手头买了一条鱼。</p>
