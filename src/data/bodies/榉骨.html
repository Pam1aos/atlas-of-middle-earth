<p><strong>榉骨</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Beechbone" target="_blank" rel="noopener noreferrer">Beechbone</a></strong>）是一名生活在<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>的<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>。在<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>们看来，他既高大又英俊。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月3日，榉骨和其他<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>一起参加了讨伐<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>的<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7%E4%B9%8B%E6%88%98/">艾森加德之战</a>。在激烈的战斗中，他被从地底喷出的、燃烧的液体射中，不幸牺牲。不过，榉骨惨烈的死状彻底惹怒了其余恩特，他们随即对<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7/">艾森加德</a>展开了一轮毁灭性的攻势。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
