<p><strong>杜伊林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Duilin_(disambiguation" target="_blank" rel="noopener noreferrer">Duilin</a>)</strong>）可以指：</p>
<ul>
<li>杜伊林（卒于第一纪元510年），第一纪元中刚多林城的飞燕家族领主。</li>
<li>杜伊林（卒于第三纪元3019年），刚铎的黑源河山谷领主杜因希尔之子，战死于佩兰诺平野之战。</li>
<li>杜伊林，第四纪元的刚铎人，赛隆之父。</li>
</ul>
