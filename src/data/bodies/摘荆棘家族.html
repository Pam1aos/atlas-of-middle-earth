<h1>摘荆棘家族</h1>
<p><strong>摘荆棘家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Pickthorn_Family" target="_blank" rel="noopener noreferrer">Pickthorn Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>的人类家族。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E6%91%98%E8%8D%86%E6%A3%98/">汤姆·摘荆棘</a>在布理的斗殴中遇害。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
