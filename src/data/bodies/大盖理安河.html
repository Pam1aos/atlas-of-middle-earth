<p><strong>大盖理安河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Greater_Gelion" target="_blank" rel="noopener noreferrer">Greater Gelion</a></strong>）是位于贝烈瑞安德东部的一条河流，发源于<a class="wiki-link" href="/entry/%E7%91%9E%E5%88%A9%E5%B0%94%E5%B1%B1/">瑞利尔山</a>，自东北向西南方向流淌，最终与西边的小盖理安河交汇，形成了<a class="wiki-link" href="/entry/%E7%9B%96%E7%90%86%E5%AE%89%E6%B2%B3/">盖理安河</a>，而盖理安河便是<a class="wiki-link" href="/entry/%E6%AC%A7%E8%A5%BF%E7%91%9E%E5%AE%89%E5%BE%B7/">欧西瑞安德</a>的西边界。在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7%E8%AF%B8%E6%AC%A1%E5%A4%A7%E6%88%98/">精灵宝钻争夺战</a>时期，大盖理安河和<a class="wiki-link" href="/entry/%E5%B0%8F%E7%9B%96%E7%90%86%E5%AE%89%E6%B2%B3/">小盖理安河</a>之间的土地由<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA/">费艾诺</a>之子<a class="wiki-link" href="/entry/%E7%8E%9B%E6%A0%BC%E6%B4%9B%E5%B0%94/">玛格洛尔</a>负责防卫。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">精灵宝钻</a>，<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB-%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E5%BE%81%E6%88%98%E5%8F%B2-%E7%AC%AC%E5%8D%81%E5%9B%9B%E7%AB%A0/">精灵宝钻征战史-第十四章</a>，贝烈瑞安德及其诸国。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
