<p><strong>隐秘的癖好：托尔金关于人造语言的演讲</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/A_Secret_Vice:_Tolkien_on_Invented_Languages" target="_blank" rel="noopener noreferrer">A Secret Vice: Tolkien on Invented Languages</a></strong>），是由迪米特拉·费米和安德鲁·希金斯编写的书籍，包含了托尔金1931年的演讲<a class="wiki-link" href="/entry/%E9%9A%90%E7%A7%98%E7%9A%84%E7%99%96%E5%A5%BD/">《隐秘的癖好》</a>的内容和以前未发表的草稿与注释，并附有对托尔金语言发明的大量介绍和贯穿始终的编辑说明。本书于2016年出版精装版，此后于2020年出版了修订后的平装版，这次修订包括“修复了一些此前难以辨认的名字”。</p>
