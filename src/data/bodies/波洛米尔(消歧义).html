<p><strong>波洛米尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Boromir_(disambiguation" target="_blank" rel="noopener noreferrer">Boromir</a>)</strong>）是原著中多位角色的名字：</p>
<ul>
<li>玻尔之子波洛米尔，东来者玻尔之子玻拉赫在早期版本中的名字。</li>
<li>波洛米尔（第一纪元338年 - 432年），第一纪元贝奥家族的一位族长，是第一位拉德洛斯领主。</li>
<li>波洛米尔（第三纪元2410年 - 2489年），第三纪元刚铎的第十一位执政宰相。</li>
<li>波洛米尔（第三纪元2978年 - 3019年），德内梭尔二世的长子，护戒远征队成员。</li>
</ul>
