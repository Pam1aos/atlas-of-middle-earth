<p>John Howe</p>
<p><strong>洞穴食人妖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Cave-trolls" target="_blank" rel="noopener noreferrer">Cave-trolls</a></strong>）是一种生活在幽暗山洞里的<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>。它们体型庞大，肤色黝黑，皮肤上覆盖着发绿的鳞片，足部扁平、没有脚趾。当护戒远征队穿过<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚矿坑</a>时，曾遭到数只洞穴食人妖的袭击。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
