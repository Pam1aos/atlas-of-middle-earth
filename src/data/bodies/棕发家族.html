<h1>棕发家族</h1>
<p><strong>棕发家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Brownlock_Family" target="_blank" rel="noopener noreferrer">Brownlock Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的霍比特人家族。<a class="wiki-link" href="/entry/%E5%90%89%E8%8E%89%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">吉莉·棕发</a>是家族中仅知的一名成员。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
