<h1>斯托克</h1>
<p><strong>斯托克</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Stock" target="_blank" rel="noopener noreferrer">Stock</a></strong>），是位于泽地北部的城镇，坐落在<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>河岸附近的<a class="wiki-link" href="/entry/%E6%96%AF%E6%89%98%E5%85%8B%E6%BA%AA/">斯托克溪</a>，位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>的<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E6%A1%A5/">白兰地桥</a>南部。斯托克溪是穿过夏尔城镇的主道的汇合点。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>据说斯托克的<a class="wiki-link" href="/entry/%E9%87%91%E9%B2%88%E9%85%92%E9%A6%86/">金鲈酒馆</a>拥有东区最上乘的啤酒。</p>
<p>在<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>去往<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>的途中，弗罗多表示希望径直穿过村庄去往<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87%E6%B8%A1%E5%8F%A3/">雄鹿镇渡口</a>。<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>反对走捷径，且提到了金鲈酒馆。为了防止皮平到金鲈酒馆而耽搁旅行，霍比特们绕开了斯托克。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>名称释义</h2>
<p><code>Stock</code>也许意为现代化的古英语<code>Stoc</code>“地方、边远的农场或小村庄”。</p>
