<p>Liz Danforth</p>
<p><strong>吸血鬼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Vampires" target="_blank" rel="noopener noreferrer">Vampires</a></strong>），是一种类蝙蝠的邪恶生物，侍奉<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>和<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>。<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>历史上唯一有记载的吸血鬼是<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>的信使<a class="wiki-link" href="/entry/%E5%A4%99%E6%9E%97%E6%A0%BC%E5%A8%81%E5%B8%8C%E5%B0%94/">夙林格威希尔</a>，她有着生长钩爪的庞大骨翼，频繁往返于<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E8%A5%BF%E7%91%9E%E5%AE%89/">妖狼之岛</a>和<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8F%AD/">安格班</a>之间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>索隆本人被<a class="wiki-link" href="/entry/%E9%9C%B2%E8%A5%BF%E6%81%A9/">露西恩</a>和<a class="wiki-link" href="/entry/%E8%83%A1%E5%AE%89/">胡安</a>击败后，曾变身为吸血鬼逃往<a class="wiki-link" href="/entry/%E5%A4%9A%E6%9D%BE%E5%B0%BC%E5%AE%89/">多松尼安</a>：</p>
<blockquote>
<p>一只肉翅的巨大吸血魔鬼，
从地底窜出，尖啸着飞远，
污血滴洒在林梢。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p>—— 《蕾西安之歌》描写索隆的逃亡</p>
</blockquote>
