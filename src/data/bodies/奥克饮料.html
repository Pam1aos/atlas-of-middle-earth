<p><strong>奥克饮料</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Orc-draught" target="_blank" rel="noopener noreferrer">Orc-draught</a></strong>），是一种<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>饮用的热辣液体。它的滋味虽然糟糕，但能让饮用者感到一股热流烧过全身，迅速达到振作精神、减缓痛觉的效果。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年2月26日 - 28日期间，霍比特人<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>被<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>抓获，为了让俘虏尽快赶路，奥克多次给他们灌下这种饮料。奥克饮料的制作成分不明，<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>认为最好还是别知道。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
