<p>Alarie</p>
<p><strong>木之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Wood" target="_blank" rel="noopener noreferrer">Gate of Wood</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第一道大门。木之门是一道宽大的拱门，门两侧都有自岩石中凿出的高柱，中间悬着一道用十字交叉的木条制成巨大吊门，雕刻精美，铆以铁钉。</p>
<p>木之门后面的一道大门是<a class="wiki-link" href="/entry/%E7%9F%B3%E4%B9%8B%E9%97%A8/">石之门</a>，它距此门有半里格距离。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
