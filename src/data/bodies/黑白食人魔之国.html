<p><strong>《黑白食人魔之国：希拉里·托尔金失落的传说》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Black_&amp;_White_Ogre_Country:_The_Lost_Tales_of_Hilary_Tolkien" target="_blank" rel="noopener noreferrer">Black &amp; White Ogre Country: The Lost Tales of Hilary Tolkien</a></strong>），是一部作品集，收录了<a class="wiki-link" href="/entry/%E5%B8%8C%E6%8B%89%E9%87%8C%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">希拉里·托尔金</a>生前未出版的作品，由安吉拉·加德纳编辑，<a class="wiki-link" href="/entry/%E6%9D%B0%E5%A4%AB%C2%B7%E9%BB%98%E9%87%8C/">杰夫·默里</a>插画。书中使用的手稿由希拉里的孙子克里斯·托尔金持有。此外，书中还包括一幅托尔金一家的照片，以及<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>写给弟弟希拉里的一封信。</p>
