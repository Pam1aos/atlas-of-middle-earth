<p><strong>灰港</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Grey_Havens_(soundtrack" target="_blank" rel="noopener noreferrer">The Grey Havens</a>)</strong>），可以指：</p>
<ul>
<li>灰港，又称“米斯泷德”，中洲西北方海岸上的港口。精灵们由此处启航，去往西方的“不死之地”。</li>
<li>灰港(章节)，《魔戒III-王者归来》第六卷的第九章。</li>
<li>灰港(中洲历史Ⅳ章节)，《中洲历史》第九卷《索隆的败亡》第一辑的第十章。</li>
<li>灰港(音乐)，影视作品《指环王：王者无敌》（院线版）原声配乐中的一首歌，由霍华德·肖创作。</li>
</ul>
