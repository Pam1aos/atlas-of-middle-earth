<h1>精灵语译文集</h1>
<p><strong>精灵语译文集</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Translations_from_the_Elvish" target="_blank" rel="noopener noreferrer">Translations from the Elvish</a></strong>）是<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>待在<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>时在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3001年到<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年之间撰写的三卷著作。它们组成了<a class="wiki-link" href="/entry/%E8%A5%BF%E7%95%8C%E7%BA%A2%E7%9A%AE%E4%B9%A6/">西界红皮书</a>的一个重要部分，不过在一些其他版本中被遗漏了。它们只在<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98%E4%B9%8B%E4%B9%A6/">长官之书</a>及其抄本中被保存下来。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>显然它包含着<a class="wiki-link" href="/entry/%E7%88%B1%E5%8A%AA%E7%9A%84%E5%A4%A7%E4%B9%90%E7%AB%A0/">爱努的大乐章</a>和<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB-%E7%BB%B4%E6%8B%89%E6%9C%AC%E7%BA%AA/">维拉本纪</a>这样的著作。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
