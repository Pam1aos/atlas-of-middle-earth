<p><strong>扎敏</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Zamîn" target="_blank" rel="noopener noreferrer">Zamîn</a></strong>），是<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D/">埃仁迪丝</a>的<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D%E7%9A%84%E7%99%BD%E5%A2%85/">白墅</a>中的一名老年使女。她来自农村，谈吐无忌，即使<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D/">埃仁迪丝</a>也不能轻易吓住她。埃仁迪丝在家从不向女儿安卡理梅提起关于丈夫<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>的事情，安卡理梅直到七岁时，才从扎敏口中得知父亲的姓名，以及父亲正在海外远航的事实。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E5%AE%89%E5%8D%A1%E7%90%86%E6%A2%85/">安卡理梅</a>长大成人、被<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>立为王储后，她厌烦了成群求婚者的骚扰，于是在扎敏的协助下，偷偷藏到了<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E6%96%AF%E6%89%98%E5%B0%BC/">哈拉斯托尼</a>领主<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%8B%89%E5%9D%A6/">哈尔拉坦</a>的领地边界的一座农场里，隐姓埋名为牧羊女。在那里，她遇到了未来的丈夫<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%8B%89%E5%8D%A1/">哈尔拉卡</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p><strong>扎敏</strong>（Zamîn）是一个<a class="wiki-link" href="/entry/%E9%98%BF%E7%9D%A3%E8%80%90%E5%85%8B%E8%AF%AD/">阿督耐克语</a>名字，含义不明。</p>
