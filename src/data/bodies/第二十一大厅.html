<h1>第二十一大厅</h1>
<p><strong>第二十一大厅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Twenty-first_Hall" target="_blank" rel="noopener noreferrer">Twenty-first Hall</a></strong>），是<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>城邦<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>北端<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%83%E5%B1%82/">第七层</a>的一座大厅。这座巨大的厅堂里有许多岩石凿就的巨柱，它黑色的墙面平滑如镜。第二十一大厅有三个拱门形入口，分别朝向北面、南面和东面。北边的拱门连接着一条宽阔的走廊，<a class="wiki-link" href="/entry/%E9%A9%AC%E6%89%8E%E5%B8%83%E5%B0%94%E5%AE%A4/">马扎布尔室</a>位于走廊右侧。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年1月14日，护戒远征队在第二十一大厅过夜，<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>和<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>为霍比特人们简述了卡扎督姆的历史。第二天，他们发现了马扎布尔室，甘道夫由此得以确认，远征队昨晚所在的位置是第二十一大厅。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
