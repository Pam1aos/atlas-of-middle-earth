<p><strong>纳因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Náin_(disambiguation" target="_blank" rel="noopener noreferrer">Náin</a>)</strong>），是以下三位<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>的名字：</p>
<ul>
<li>纳因一世（第三纪元1832年 - 1981年），是卡扎督姆的最后一位国王，他被都林的克星杀死。</li>
<li>纳因二世（第三纪元2338年 - 2585年），在灰色山脉统领都林一族的国王。</li>
<li>纳因（第三纪元2665年 - 2799年），是格罗尔之子，他于阿扎努比扎之战中战死。</li>
</ul>
