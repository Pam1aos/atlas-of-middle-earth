<p><strong>信件343号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_343" target="_blank" rel="noopener noreferrer">Letter 343</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给斯特林·拉尼尔的一封信，写信日期为1972年11月21日。托尔金给瑟斯顿的牛取名字<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金很高兴拉尼尔获得了奖金，但对奖金被证明毫无用处并不感到惊讶。当一位粉丝送给他一只刻有魔戒可怕文字的高脚杯时，他也同样感到失望。他从不用它喝水，而是把它当作烟灰。</p>
