<h1>索恩</h1>
<blockquote>
<p><strong>这个词条描述的对象是改编作品中的原创角色。</strong> 该角色未出现于<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的任何作品中，因此可能和托尔金的设定存在矛盾。</p>
</blockquote>
<p><strong>索恩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Throne" target="_blank" rel="noopener noreferrer">Throne</a></strong>），是<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%B4%9B%E6%B1%97%E4%B9%8B%E6%88%98/">《指环王：洛汗之战》</a>中<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的叛徒领主。</p>
