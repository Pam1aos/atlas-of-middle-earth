<h1>过山村</h1>
<p><strong>过山村</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Overhill" target="_blank" rel="noopener noreferrer">Overhill</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>的一座村庄。顾名思义，它坐落在<a class="wiki-link" href="/entry/%E5%B0%8F%E4%B8%98/">小丘</a>的北面，对处在<a class="wiki-link" href="/entry/%E5%B0%8F%E4%B8%98/">小丘</a>南边的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>来说，确实是需要翻过山才能到达的地方。</p>
<p><a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>的叔叔<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%BC%97%E9%9B%B7%E5%BE%B7%C2%B7%E7%94%98%E5%A7%86%E5%90%89(1369%E5%B9%B4%E5%87%BA%E7%94%9F)/">哈尔弗雷德·甘姆吉</a>定居在过山村，他因此也被人们称为“过山村的<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%BC%97%E9%9B%B7%E5%BE%B7%C2%B7%E7%94%98%E5%A7%86%E5%90%89(1369%E5%B9%B4%E5%87%BA%E7%94%9F)/">哈尔弗雷德</a>”。<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%BC%97%E9%9B%B7%E5%BE%B7%C2%B7%E7%94%98%E5%A7%86%E5%90%89(1369%E5%B9%B4%E5%87%BA%E7%94%9F)/">哈尔弗雷德</a>的儿子<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">哈尔法斯特·甘姆吉</a>同样住在过山村，并且为村里一位姓<a class="wiki-link" href="/entry/%E5%8D%9A%E8%8A%AC%E5%AE%B6%E6%97%8F/">博芬</a>的先生工作。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
