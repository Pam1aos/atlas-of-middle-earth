<h1>永恒殿堂</h1>
<p><strong>永恒殿堂</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Timeless_Halls" target="_blank" rel="noopener noreferrer">Timeless Halls</a></strong>），是<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94/">伊露维塔</a>和诸多<a class="wiki-link" href="/entry/%E7%88%B1%E5%8A%AA/">爱努</a>的居所，其中有伊露维塔的宝座。它位于<a class="wiki-link" href="/entry/%E4%B8%80%E4%BA%9A/">宇宙</a>的边界外，不受<a class="wiki-link" href="/entry/%E6%97%B6%E9%97%B4/">时间</a>概念的束缚。<a class="wiki-link" href="/entry/%E7%88%B1%E5%8A%AA%E7%9A%84%E5%A4%A7%E4%B9%90%E7%AB%A0/">爱努的大乐章</a>正是在永恒殿堂里演奏的。乐章结束、宇宙诞生后，包括<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a>在内的许多爱努离开永恒殿堂，进入了宇宙。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>在<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>的诗歌<a class="wiki-link" href="/entry/%E5%9F%83%E9%9B%85%E4%BB%81%E8%BF%AA%E5%B0%94%E4%B9%8B%E6%AD%8C/">《埃雅仁迪尔之歌》</a>中，<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>和<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>的居所也被称作永恒殿堂，但它指的其实是<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%BC%E9%AD%81%E6%8F%90%E5%B0%94/">塔尼魁提尔</a>山巅的<a class="wiki-link" href="/entry/%E4%BC%8A%E5%B0%94%E7%8E%9B%E6%9E%97/">伊尔玛林</a>宫。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
