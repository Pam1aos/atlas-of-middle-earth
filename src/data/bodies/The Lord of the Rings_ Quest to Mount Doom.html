<h1>The Lord of the Rings: Quest to Mount Doom</h1>
<p><em>The Lord of the Rings: Quest to Mount Doom</em>是一款由Games Workshop推出的冒险桌游，于2024年5月25日开始接受预订<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。游戏以魔戒故事为背景，可供2-5名8岁及以上的玩家同时游戏，单局用时30-45分钟。</p>
