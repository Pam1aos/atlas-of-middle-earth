<h1>宁洛德尔桥</h1>
<p><strong>宁洛德尔桥</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bridge_of_Nimrodel" target="_blank" rel="noopener noreferrer">Bridge of Nimrodel</a></strong>），是一座跨越<a class="wiki-link" href="/entry/%E5%AE%81%E6%B4%9B%E5%BE%B7%E5%B0%94%E6%BA%AA/">宁洛德尔溪</a>的桥梁，位于宁洛德尔溪和<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E5%85%B0%E7%89%B9%E6%B2%B3/">凯勒布兰特河</a>汇流处附近。它是连接<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">卡扎督姆</a>和<a class="wiki-link" href="/entry/%E6%B4%9B%E4%B8%9D%E7%BD%97%E7%91%9E%E6%81%A9/">洛丝罗瑞恩</a>之间的道路的一部分。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年1月15日晚，护戒远征队抵达宁洛德尔溪畔，但宁洛德尔桥在当时早已坍塌。于是，<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>带领众人涉水趟过了宁洛德尔溪。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
