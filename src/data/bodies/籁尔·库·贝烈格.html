<h1>籁尔·库·贝烈格</h1>
<p><strong>籁尔·库·贝烈格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Laer_Cú_Beleg" target="_blank" rel="noopener noreferrer">Laer Cú Beleg</a></strong>），<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中意为“<strong>强弓之歌</strong>”，是<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林·图伦拔</a>为悼念挚友<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E6%A0%BC%C2%B7%E5%BA%93%E6%B2%99%E7%90%86%E5%AE%89/">贝烈格·库沙理安</a>而谱写的歌。这首歌在<a class="wiki-link" href="/entry/%E4%BC%8A%E8%8A%99%E6%9E%97%E6%B9%96/">伊芙林湖</a>上久久回荡，稍许抚慰了图林误杀贝烈格后内心的悲痛。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">精灵宝钻</a>，<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB-%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E5%BE%81%E6%88%98%E5%8F%B2-%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%B8%80%E7%AB%A0/">精灵宝钻征战史-第二十一章</a>，图林·图伦拔。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
