<h1>哈拉德语</h1>

<p><strong>哈拉德语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Language_of_Harad" target="_blank" rel="noopener noreferrer">Language of Harad</a></strong>），是<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7%E4%BA%BA/">哈拉德人</a>所使用的语言。对于刚铎人来说，哈拉德人的语言粗砺刺耳，如同禽兽的叫声。</p>
<p>我们对哈拉德人的语言知之甚少。已知的唯一一个来自哈拉德语言的词汇是“<a class="wiki-link" href="/entry/%E6%AF%9B%E8%B1%A1/">毛象</a>”（Mûmak），意指哈拉德人驯服的战象。在早期的手稿中，<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>的别名“因卡努斯”（Incanús）也源于哈拉德人的语言，意为“北方间谍”，但这个设想后来被抛弃了。</p>
