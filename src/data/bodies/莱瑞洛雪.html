<h1>莱瑞洛雪</h1>
<p><strong>莱瑞洛雪</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lairelossë" target="_blank" rel="noopener noreferrer">Lairelossë</a></strong>）是一种生长在<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔岛</a>西部海岸<a class="wiki-link" href="/entry/%E5%B0%BC%E8%A5%BF%E5%A7%86%E9%98%BF%E5%8B%92%E8%BE%BE/">尼西姆阿勒达</a>地区的芳香长青树木。这种<a class="wiki-link" href="/entry/%E8%8A%B3%E9%A6%99%E6%A0%91/">芳香树</a>是<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE/">埃尔达精灵</a>从<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">埃瑞西亚岛</a>带来的，它的花、叶和树皮都能散发出甜美的芳香。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>莱瑞洛雪（Lairelossë）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字，意为“夏日的雪白”，它由<code>lairë</code>（“夏天”）和<code>lossë</code>（“洁白，雪白”）两个部分组成。</p>
