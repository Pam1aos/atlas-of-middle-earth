<p><strong>信件305号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_305" target="_blank" rel="noopener noreferrer">Letter 305</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给雷纳·昂温的一封信，写信日期为1968年6月26日。托尔金回复雷纳自己受伤的事<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>6月17日，在准备搬家时，托尔金从楼梯上摔了下来。他和雷纳说，他在牛津医院的残疾将对他的工作和安排造成灾难性的影响。直到八月底，他才失去了他的拐杖。</p>
