<h1>流亡者昆雅语</h1>
<p><strong>流亡者昆雅语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Exilic_Quenya" target="_blank" rel="noopener noreferrer">Exilic Quenya</a></strong>），是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a><a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E6%97%8F/">诺多族</a>的<a class="wiki-link" href="/entry/%E6%B5%81%E4%BA%A1%E8%80%85/">流亡者</a>所说的<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>方言。后来，它成为<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>通用的昆雅语方言。</p>
