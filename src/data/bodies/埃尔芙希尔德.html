<p><strong>埃尔芙希尔德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elfhild" target="_blank" rel="noopener noreferrer">Elfhild</a></strong>）是洛汗第十七代国王<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿</a>的王后。</p>
<h2>生平</h2>
<p>埃尔芙希尔德的生平大都不详。我们只知道，<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2978年，她在生育<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E6%9D%B0%E5%BE%B7/">希奥杰德</a>时因难产而死。此后，<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿王</a>没有再娶<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
