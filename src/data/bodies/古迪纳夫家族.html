<h1>古迪纳夫家族</h1>
<p><strong>古迪纳夫家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Goodenough_Family" target="_blank" rel="noopener noreferrer">Goodenough Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族，已知的成员有<a class="wiki-link" href="/entry/%E8%89%BE%E8%96%87%C2%B7%E5%8D%9A%E8%8A%AC/">艾薇·古迪纳夫</a>，她与<a class="wiki-link" href="/entry/%E5%B7%B4%E7%A6%8F%C2%B7%E5%8D%9A%E8%8A%AC/">巴福·博芬</a>成婚并育有四位子女。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
