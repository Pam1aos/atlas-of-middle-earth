<h1>托尔乌妮</h1>
<p><strong>托尔乌妮</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tol_Uinen" target="_blank" rel="noopener noreferrer">Tol Uinen</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>东海岸<a class="wiki-link" href="/entry/%E7%BD%97%E9%97%A8%E5%A8%9C/">罗门娜</a>湾中的一个小岛。这座岛屿是诸海之后<a class="wiki-link" href="/entry/%E4%B9%8C%E5%A6%AE/">乌妮</a>亲手创造的，<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>对这位神祇格外尊崇。由努门诺尔第六代国王<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>创建的<a class="wiki-link" href="/entry/%E6%8E%A2%E9%99%A9%E8%80%85%E5%85%AC%E4%BC%9A/">探险者公会</a>，其总部设在舰船<a class="wiki-link" href="/entry/%E5%9F%83%E9%9B%85%E5%A7%86%E5%B7%B4%E5%B0%94/">埃雅姆巴尔</a>上，而埃雅姆巴尔号通常停泊在托尔乌妮岛。阿勒达瑞安还在托尔乌妮上修建了一座名叫<a class="wiki-link" href="/entry/%E5%8D%A1%E5%B0%94%E6%98%8E%E7%99%BB/">卡尔明登</a>的灯塔。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
