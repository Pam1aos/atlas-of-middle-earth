<p><strong>格力尔胡因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Glirhuin" target="_blank" rel="noopener noreferrer">Glirhuin</a></strong>），是一位生活在<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%B8%8C%E5%B0%94%E6%A3%AE%E6%9E%97/">布瑞希尔森林</a>的<a class="wiki-link" href="/entry/%E5%93%88%E7%83%88%E4%B8%9D%E5%AE%B6%E6%97%8F/">哈拉丁人</a>竖琴手与先知。</p>
<p>英雄<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>之母<a class="wiki-link" href="/entry/%E5%A2%A8%E7%8E%9F%C2%B7%E5%9F%83%E5%88%97%E5%85%B9%E7%8E%9F/">墨玟</a>在布瑞希尔森林附近悲惨地逝世后，格力尔胡因替她创作了一首歌曲。他在歌中预言道，埋葬墨玟的<a class="wiki-link" href="/entry/%E4%B8%8D%E5%B9%B8%E8%80%85%E4%B9%8B%E7%A2%91/">不幸之碑</a>既不会遭到<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>的玷污，也永远不会倒塌，即使海水淹没了大地。日后，格力尔胡因的预言果然应验了：虽然<a class="wiki-link" href="/entry/%E6%84%A4%E6%80%92%E4%B9%8B%E6%88%98/">愤怒之战</a>摧毁了<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>全境，陆地坠入深海，但墨玟的墓碑依然屹立在海面上，形成了一座孤悬的岛屿<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%A2%A8%E7%8E%9F/">托尔墨玟</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
