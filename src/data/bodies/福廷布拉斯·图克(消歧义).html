<p><strong>福廷布拉斯·图克</strong>可以代表两名不同的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，他们都曾担任过<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>。</p>
<ul>
<li>福廷布拉斯一世·图克（<a class="ext-link" href="https://tolkiengateway.net/wiki/Fortinbras_Took_I" target="_blank" rel="noopener noreferrer">Fortinbras Took I</a>）是夏尔第25任长官。</li>
<li>福廷布拉斯二世·图克（<a class="ext-link" href="https://tolkiengateway.net/wiki/Fortinbras_Took_II" target="_blank" rel="noopener noreferrer">Fortinbras Took II</a>）是夏尔第29任长官。</li>
</ul>
