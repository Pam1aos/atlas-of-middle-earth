<h1>三区石</h1>
<p><strong>三区石</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Three-Farthing_Stone" target="_blank" rel="noopener noreferrer">Three-Farthing Stone</a></strong>），位于<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>路旁，是一块标示<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>、<a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>和<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%BA/">南区</a>三个区划相交界点的石头，它被认为是最接近夏尔地理中心的地方。三区石距离<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87/">傍水镇</a>西南方向大约四英里，距离<a class="wiki-link" href="/entry/%E8%9B%99%E6%B3%BD%E5%B1%AF/">蛙泽屯</a>以西十四英里。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年年末，<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>来到三区石，抛洒了<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%BE%B7%E7%91%9E%E5%B0%94/">加拉德瑞尔</a>赠予他的<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E7%9A%84%E8%8A%B1%E5%9B%AD%E7%9B%92%E5%AD%90/">花园盒子</a>中剩下的最后一些泥土：这些泥土拥有让树木迅速生长的魔力，但山姆不确定该将它们用在哪里，所以他认为，在夏尔中心的三区石处任其迎风飘散，最为公平。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
