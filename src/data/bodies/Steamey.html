<h1>Steamey</h1>
<p><strong>Steamey</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Steamey" target="_blank" rel="noopener noreferrer">Steamey</a></strong>）是一位俄罗斯女性艺术家。她的作品以描述情境为主，风格逼真细腻，绝妙的捕捉到特殊环境下人物的动态与情感。Steamey授权本维基使用她的作品，详见授权信息。</p>
