<p>托尔金</p>
<p><strong>小丘</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hobbiton_Hill" target="_blank" rel="noopener noreferrer">The Hill</a></strong>），也被称为<strong>霍比屯丘</strong>，位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>北部。由<a class="wiki-link" href="/entry/%E9%82%A6%E6%9E%9C%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">邦果·巴金斯</a>建造的<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>就位于小丘之内。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>建造袋底洞时挖出的泥土被抛下小丘的陡坡，在地面上堆积起来，日后的<a class="wiki-link" href="/entry/%E8%A2%8B%E4%B8%8B%E8%B7%AF/">袋下路</a>就坐落在这里。一些泥土被收集起来，用于建设花园或堆砌土墙。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
