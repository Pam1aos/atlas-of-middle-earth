<p><strong>信件322号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_322" target="_blank" rel="noopener noreferrer">Letter 322</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给威廉·卡特的一封信，写信日期为1971年3月18日。托尔金回应了《精灵宝钻》的进度<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金告诉William·Cater，他在《精灵宝钻》上的工作比以前进展得更好，他可能会在那年晚些时候给昂温出版社送去一个角色。</p>
