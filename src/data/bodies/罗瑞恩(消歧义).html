<p><strong>罗瑞恩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lórien_(disambiguation" target="_blank" rel="noopener noreferrer">Lórien</a>)</strong>）是原著中多个地点和角色的名字：</p>
<ul>
<li>伊尔牟，维拉之一。也被称为罗瑞恩，那是他住所的名字。</li>
<li>罗瑞恩的花园，维拉伊尔牟的住所。</li>
<li>洛丝罗瑞恩，第二纪元与第三纪元时中洲的精灵王国，也被称为罗瑞恩。</li>
<li>东罗瑞恩，魔戒大战结束后黑森林南部林区，属于洛丝罗瑞恩的管辖。</li>
</ul>
