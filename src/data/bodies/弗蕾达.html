<p><strong>弗蕾达</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Freda" target="_blank" rel="noopener noreferrer">Freda</a></strong>），是<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E5%8F%8C%E5%A1%94%E5%A5%87%E5%85%B5/">《指环王：双塔奇兵》</a>中原创的<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>角色，由新西兰演员 Olivia Tennet 饰演。</p>
<h2>生平</h2>
<p>电影<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E5%8F%8C%E5%A1%94%E5%A5%87%E5%85%B5/">《指环王：双塔奇兵》</a>中，当<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的一个村庄遭到<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E5%9C%B0%E4%BA%BA/">黑蛮地人</a>洗劫，女村民<a class="wiki-link" href="/entry/%E5%A2%A8%E7%8E%9F(%E7%94%B5%E5%BD%B1%E8%A7%92%E8%89%B2)/">墨玟</a>让自己年幼的儿子<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%B3%B0%E5%9B%A0(%E7%94%B5%E5%BD%B1%E8%A7%92%E8%89%B2)/">伊奥泰因</a>和女儿弗蕾达赶紧骑马前往<a class="wiki-link" href="/entry/%E5%9F%83%E5%A4%9A%E6%8B%89%E6%96%AF/">埃多拉斯</a>，向国王<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿</a>通风报信。伊奥泰因和弗蕾达抵达埃多拉斯时，王子<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E6%9D%B0%E5%BE%B7/">希奥杰德</a>的葬礼刚刚结束，希奥顿在城外的平野上远远看见了两人。</p>
<p>兄妹两人在王宫里受到款待。他们随后跟着洛汗军队、妇孺老人，离开埃多拉斯前往<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>。在那里，他们和母亲墨玟重逢了。</p>
