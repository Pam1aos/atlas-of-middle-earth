<p>严酷寒冬</p>
<p><strong>白狼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/White_Wolves" target="_blank" rel="noopener noreferrer">White Wolves</a></strong>），是一种分布在中洲北部冰原地区的犬科动物。它们在<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>比较少见，可能主要生存在佛洛德地区和更北部的地方。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2911年，中洲遭遇了有史以来最寒冷的冬季之一，史称<a class="wiki-link" href="/entry/%E4%B8%A5%E9%85%B7%E5%AF%92%E5%86%AC(%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83)/">严酷寒冬</a>。寒流使得<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的白兰地河结冰封冻，白色狼群随即越过河流，侵入夏尔东区大肆劫掠。这是夏尔的霍比特人经历过的少数几次灾难之一，当时为了抵抗狼群，雄鹿地的白兰地鹿家族甚至罕见地吹响了<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0%E7%9A%84%E5%8A%A8%E5%91%98%E5%8F%B7%E8%A7%92/">动员号角</a>，这号角直到一百多年后的<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期才被再次吹响。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
