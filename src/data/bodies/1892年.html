<ul>
<li>1月3日－亚瑟·托尔金与梅贝尔·萨菲尔德的长子，约翰·罗纳德·鲁埃尔·托尔金（<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J·R·R·托尔金</a>），出生于南非<a class="wiki-link" href="/entry/%E5%B8%83%E9%9A%86%E6%96%B9%E4%B8%B9/">布隆方丹</a>。</li>
<li>1月4日－亚瑟·托尔金写信告诉母亲玛丽·简·斯托，自己喜得一子。</li>
<li>1月31日－J·R·R·托尔金在布隆方丹的英国圣公会教堂受洗。</li>
<li>11月15日－亚瑟、梅贝尔、两名家仆，以及一名抱着J·R·R·托尔金的保姆，在花园中拍摄合影。托尔金一家将合照附在圣诞贺卡上，寄送亲友。《托尔金传》和《托尔金家族相册》中重印了该照片。</li>
</ul>
