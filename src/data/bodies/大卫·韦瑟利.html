<p><strong>大卫·韦瑟利</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/David_Weatherley" target="_blank" rel="noopener noreferrer">David Weatherley</a></strong>），新西兰演员。他在<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%8A%A4%E6%88%92%E4%BD%BF%E8%80%85/">《指环王：护戒使者》</a>中饰演<a class="wiki-link" href="/entry/%E9%BA%A6%E6%9B%BC%C2%B7%E9%BB%84%E6%B2%B9%E8%8F%8A/">麦曼·黄油菊</a>。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/1939%E5%B9%B4/">1939年</a>3月1日，大卫·韦瑟利在伦敦出生。他于<a class="wiki-link" href="/entry/1956%E5%B9%B4/">1956年</a>移居加拿大，在军队中服役了五年。1960年代初，他移居新西兰从事表演行业，并在所有主要的艺术体裁中都有所涉足，包括广播剧、戏剧、电视和电影等。<a class="wiki-link" href="/entry/2024%E5%B9%B4/">2024年</a>12月12日，他在新西兰奥克兰去世。</p>
