<h1>霍比特武装队</h1>
<p><strong>霍比特武装队</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hobbitary-in-arms" target="_blank" rel="noopener noreferrer">Hobbitary-in-arms</a></strong>），是指<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>在紧急状况下组建的临时武装，夏尔<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>兼任武装队指挥官。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>的历史中没有关于武装队被召集的记载，虽然他们有可能参与了<a class="wiki-link" href="/entry/%E7%BB%BF%E9%87%8E%E4%B9%8B%E6%88%98/">绿野之战</a>和<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>。</p>
