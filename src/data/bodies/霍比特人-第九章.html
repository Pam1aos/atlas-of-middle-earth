<p><strong>乘桶而逃</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Barrels_Out_of_Bond" target="_blank" rel="noopener noreferrer">Barrels Out of Bond</a></strong>）是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">《霍比特人》</a>的第九章。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>为搜寻下落不明的矮人，落单的<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>追逐森林精灵的踪迹进入地宫，在那里众人发现了地板下连接<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E5%9F%8E/">河谷城</a>的<a class="wiki-link" href="/entry/%E5%AF%86%E6%9E%97%E6%B2%B3/">密林河</a>，于是紧锣密鼓的越狱计划开始了。</p>
<h2>概要</h2>
<p>经过一番激战，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>终于摆脱了蜘蛛群的袭击。为救助伙伴，比尔博顺着精灵们的脚步进入了庞大的精灵王国。夜晚，比尔博趁精灵酒会潜入了关押矮人的牢狱，于是众人藏入了精灵买酒的空木桶，顺着地下通道流进<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E5%9F%8E/">河谷镇</a>。</p>
