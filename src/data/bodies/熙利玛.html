<h1>熙利玛</h1>
<p><strong>熙利玛</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Silima" target="_blank" rel="noopener noreferrer">Silima</a></strong>），是<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA/">费艾诺</a>为了制造<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">精灵宝钻</a>而创造出来的物质。它晶莹剔透，并且坚不可摧。尽管费艾诺宣称熙利玛是由<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA%E7%9A%84%E5%8F%8C%E5%9C%A3%E6%A0%91/">双圣树</a>的光辉制成，但真正的原材料只有他一人知晓。铺成宝石般的晶体结构使它们在黑暗中仍旧能绽放光辉；如果暴露在光线下，它们的光芒将会更加闪耀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><strong>Silima</strong>是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>，来自于词根<code>SIL</code>闪耀。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
