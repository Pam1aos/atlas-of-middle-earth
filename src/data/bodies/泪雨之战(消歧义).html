<p><strong>泪雨之战</strong>一词，有以下两种含义：</p>
<ul>
<li>托尔金作品胡林的儿女中的一章，章名为<strong>泪雨之战</strong>（<a class="ext-link" href="https://tolkiengateway.net/wiki/The_Battle_of_Unnumbered_Tears" target="_blank" rel="noopener noreferrer">The Battle of Unnumbered Tears</a>）。</li>
<li>在贝烈瑞安德发生的第五场大规模战役，名为<a class="wiki-link" href="/entry/%E6%B3%AA%E9%9B%A8%E4%B9%8B%E6%88%98/">泪雨之战</a>（<a class="ext-link" href="https://tolkiengateway.net/wiki/Battle_of_Unnumbered_Tears" target="_blank" rel="noopener noreferrer">Battle of Unnumbered Tears</a>）。</li>
</ul>
