<p><strong>黑蛇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Black_Serpent" target="_blank" rel="noopener noreferrer">Black Serpent</a></strong>），是<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>中的一位<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7%E4%BA%BA/">哈拉德人</a>将领。他的旗帜是猩红底色上的一条黑蛇。</p>
<h2>生平</h2>
<p>在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月15日的<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>中，黑蛇负责统领哈拉德大军的骑兵部队。当<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿王</a>率领<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>骠骑抵达佩兰诺战场时，黑蛇发现希奥顿的近卫军脱离了主力部队，于是立刻冲杀过去。但是，希奥顿及其护卫不但没有退缩，反而正面迎战，他们凭借更加高超的骑术和战斗技巧，切入了敌阵深处。希奥顿用长矛刺死了黑蛇本人，然后挥剑砍断了黑蛇的军旗，其他哈拉德骑兵见状望风而逃。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
