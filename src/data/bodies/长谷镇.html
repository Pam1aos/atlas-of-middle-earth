<p>Matěj Čadil</p>
<p><strong>长谷镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Longbottom" target="_blank" rel="noopener noreferrer">Longbottom</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>南区的一个村镇，其居民可能以<a class="wiki-link" href="/entry/%E5%90%B9%E5%8F%B7%E5%AE%B6%E6%97%8F/">吹号家族</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>为主。谷地的地形使镇子气候温暖、不受恶劣天气影响，因而十分适宜种植<a class="wiki-link" href="/entry/%E7%83%9F%E6%96%97%E8%8D%89/">烟斗草</a>。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2670年（<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E7%BA%AA%E5%B9%B4/">夏尔历</a>1070年），长谷居民<a class="wiki-link" href="/entry/%E6%89%98%E5%8D%9A%E5%BE%B7%C2%B7%E5%90%B9%E5%8F%B7/">托博德·吹号</a>最早在自家的园子里种植了真正的烟斗草，长谷随后成为了夏尔烟斗草种植业的中心。直到第三纪元末期，由长谷出产的<a class="wiki-link" href="/entry/%E9%95%BF%E8%B0%B7%E5%8F%B6/">长谷叶</a>依然是最优质的家产烟斗草品牌之一。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
