<h1>玻吉尔</h1>
<p><strong>玻吉尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Borgil" target="_blank" rel="noopener noreferrer">Borgil</a></strong>），是<a class="wiki-link" href="/entry/%E7%BE%8E%E5%B0%BC%E5%B0%94%E7%8E%9B%E5%8D%A1/">美尼尔玛卡</a>旁的红色星辰<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>灵感来源</h2>
<p>根据猜测，玻吉尔可能对应现实世界中的<a class="ext-link" href="https://zh.wikipedia.org/wiki/%E5%8F%83%E5%AE%BF%E5%9B%9B" target="_blank" rel="noopener noreferrer">参宿四</a>或<a class="ext-link" href="https://zh.wikipedia.org/wiki/%E7%95%A2%E5%AE%BF%E4%BA%94" target="_blank" rel="noopener noreferrer">毕宿五</a><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
<h2>名字与词源</h2>
<p>玻吉尔（Borgil）在<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中的意思是“炽红的星”：born，“炽热的，红色的”；gil，“星”。</p>
