<h1>鹰(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p>鹰可能指以下三种生物：</p>
<ul>
<li>大鹰（<a class="ext-link" href="https://tolkiengateway.net/wiki/Eagles" target="_blank" rel="noopener noreferrer">Eagles</a>），体型最大，飞行能力极强，是曼威的信使。</li>
<li>鹰（<a class="ext-link" href="https://tolkiengateway.net/wiki/Hawks" target="_blank" rel="noopener noreferrer">Hawks</a>），体型略逊于大鹰，但依然有极强的飞行能力。</li>
<li>隼（<a class="ext-link" href="https://tolkiengateway.net/wiki/Falcons" target="_blank" rel="noopener noreferrer">Falcons</a>），也称猎鹰，体型较前两者都小一些，飞行能力也弱一些。</li>
</ul>
<p>影视作品<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E7%8E%8B%E8%80%85%E6%97%A0%E6%95%8C/">《指环王：王者无敌》</a>（加长版）完整配乐中的一首歌也叫<a class="wiki-link" href="/entry/%E5%A4%A7%E9%B9%B0(%E9%9F%B3%E4%B9%90)/">《大鹰》</a>（Eagles）。</p>
