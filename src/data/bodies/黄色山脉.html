<p><strong>黄色山脉</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Yellow_Mountains" target="_blank" rel="noopener noreferrer">Yellow Mountains</a></strong>）是<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE%E4%B9%8B%E6%98%A5/">阿尔达之春</a>结束后，<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a>改造<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>时在<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>远东产生的一座南北走向的山脉。</p>
<h2>地理</h2>
<p>黄色山脉位于中洲的东南部。<a class="wiki-link" href="/entry/%E4%BC%97%E7%A5%9E%E4%B9%8B%E6%88%98/">众神之战</a>前，即<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>的均匀对称还没被损坏时，黄色山脉北端与<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E5%8D%A1%E5%B0%BC/">红色山脉</a>南端相邻，它们一同构成<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>的东墙，与构成西墙的<a class="wiki-link" href="/entry/%E8%93%9D%E8%89%B2%E5%B1%B1%E8%84%89/">蓝色山脉</a>与<a class="wiki-link" href="/entry/%E7%81%B0%E8%89%B2%E5%B1%B1%E8%84%89(%E8%BF%9C%E5%8F%A4)/">灰色山脉</a>相对称。</p>
<p>但旷日持久的<a class="wiki-link" href="/entry/%E4%BC%97%E7%A5%9E%E4%B9%8B%E6%88%98/">众神之战</a>最终摧毁了原本的大陆地貌。在地形重塑的过程中，黄色山脉的命运再无更多记载<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
