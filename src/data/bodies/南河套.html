<h1>南河套</h1>
<p><strong>南河套</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/South_Undeep" target="_blank" rel="noopener noreferrer">South Undeep</a></strong>），是<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>流经<a class="wiki-link" href="/entry/%E5%8C%97%E9%AB%98%E5%8E%9F/">北高原</a>与<a class="wiki-link" href="/entry/%E8%A4%90%E5%9C%B0/">褐地</a>之间的两个河套中的较南而较小的那个。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E5%8F%8C%E6%B2%B3%E5%A5%97/">双河套</a>都有许多宽阔的浅滩，可以为军队提供方便的渡口。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>与<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的历史中均有多次使用记录。</p>
