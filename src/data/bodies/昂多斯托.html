<h1>昂多斯托</h1>
<p><strong>昂多斯托</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ondosto" target="_blank" rel="noopener noreferrer">Ondosto</a></strong>）是努门诺尔王国的北境<a class="wiki-link" href="/entry/%E4%BD%9B%E6%B4%9B%E6%96%AF%E5%A1%94/">佛洛斯塔</a>南部的一座城市。王国最古老的、横贯东西的主道途径此城，车辆会从这里运出北境出产的石料，它们是全国最受推崇的建材。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“昂多斯托”（Ondosto）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>地名，意为“石头堡垒”。</p>
