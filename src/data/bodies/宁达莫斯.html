<h1>宁达莫斯</h1>
<p><strong>宁达莫斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nindamos" target="_blank" rel="noopener noreferrer">Nindamos</a></strong>）是努门诺尔岛南岸的大渔村，位于<a class="wiki-link" href="/entry/%E8%A5%BF%E5%88%A9%E5%B0%94%E6%B2%B3/">西利尔河</a>入海口的广大沼泽间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>在<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B4%9B%E6%96%AF%E5%A1%94/">哈尔洛斯塔</a>与<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%8A%AA%E6%96%AF%E5%A1%94/">哈尔努斯塔</a>地区之间散落着诸多小村落，而宁达莫斯是其中规模最大的一个。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
