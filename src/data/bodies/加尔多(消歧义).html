<p><strong>加尔多</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Galdor_(disambiguation" target="_blank" rel="noopener noreferrer">Galdor</a>)</strong>）可以指：</p>
<ul>
<li>加尔多，第一纪元中刚多林城的绿树家族领主。</li>
<li>加尔多（第一纪元417年 - 462年），第一纪元的一位多尔罗明领主。他是哈多之子，是胡林与胡奥的父亲。</li>
<li>灰港的加尔多，奇尔丹派往幽谷的使者，他参与了第三纪元3018年10月25日召开的埃尔隆德会议。</li>
</ul>
