<p><strong>信件330号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_330" target="_blank" rel="noopener noreferrer">Letter 330</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给威廉·卡特的一封信，写信日期为1971年11月1日。托尔金为没有及时回信道歉<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金为没有回复卡特10月19日的信而道歉，他称这是他收到的最友好、最鼓舞人心的信之一。他说，对于一个孤独的人来说，任何长度的信都像面包给一个在塔里挨饿的囚犯。</p>
