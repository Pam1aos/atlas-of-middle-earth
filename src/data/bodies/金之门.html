<h1>金之门</h1>
<p><strong>金之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Gold" target="_blank" rel="noopener noreferrer">Gate of Gold</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第六道大门。金之门极似<a class="wiki-link" href="/entry/%E9%93%B6%E4%B9%8B%E9%97%A8/">银之门</a>，只是护墙以黄大理石筑成，石球与扶墙都是赤金。石球共六个，正中有一座金色四棱锥塔，塔顶立着<a class="wiki-link" href="/entry/%E5%8A%B3%E7%91%9E%E6%9E%97/">劳瑞林</a>的雕塑。大门装饰着众多光束的金盘，状若太阳，嵌在石榴石、黄玉与黄钻组成的图案中。门后站着三百名长弓手，铠甲镀金，头盔上竖有高高的金色羽饰，大圆盾牌鲜红如火。</p>
<p>金之门后面的一道大门是<a class="wiki-link" href="/entry/%E9%92%A2%E4%B9%8B%E9%97%A8/">钢之门</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
