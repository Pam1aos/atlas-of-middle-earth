<h1>东埃姆内特</h1>
<p><strong>东埃姆奈特</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eastemnet" target="_blank" rel="noopener noreferrer">Eastemnet</a></strong>），是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>最东边的广袤土地，从<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E6%B2%B3/">恩特河</a>以东一直延申至<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>。</p>
<p>东埃姆奈特上只有些许固定居所，但是不少<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>游牧民在这片土地上放牧。他们住在临时搭建的可拆卸的帐篷里，驱赶着牲口在这片丰美的草场上游荡。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><code>emnet</code>在<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97%E8%AF%AD/">洛汗语</a>中意为“平原”，结合<code>east</code>的翻译，东埃姆奈特可大致译为“东部平原”。</p>
