<p><strong>路格都什</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lugdush" target="_blank" rel="noopener noreferrer">Lugdush</a></strong>），是一位<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>手下的<a class="wiki-link" href="/entry/%E4%B9%8C%E9%B2%81%E5%85%8B%E6%97%8F/">乌鲁克族</a>战士。他隶属于<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>的队伍。</p>
<h2>生平</h2>
<p>路格都什作为<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>队伍的一员，参加了在<a class="wiki-link" href="/entry/%E5%B8%95%E6%96%AF%E5%98%89%E5%85%B0/">帕斯嘉兰</a>草地对护戒远征队的突袭，他们在这场袭击中俘虏了<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>与<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>，将这两位<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>押送回<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7/">艾森加德</a>。从<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>在行军途中对路格都什所下达的命令来看，路格都什可能是小队的二把手，并负责看守俘虏。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年2月28日夜晚，乌格鲁克小队在<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>边缘遭到了<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>骑兵的包围，他们于次日凌晨尝试突围，结果全军覆没，路格都什被洛希尔人所杀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
