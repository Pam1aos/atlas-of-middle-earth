<h1>精灵宝钻(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>精灵宝钻</strong>一词，有以下两种含义：</p>
<ul>
<li>由克里斯托弗·托尔金于1977年编辑出版的托尔金作品<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">精灵宝钻</a>（<a class="ext-link" href="https://tolkiengateway.net/wiki/The_Silmarillion" target="_blank" rel="noopener noreferrer">The Silmarillion</a>）。</li>
<li>费艾诺制造的三颗蕴含双圣树光芒的宝石，名为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">精灵宝钻</a>（<a class="ext-link" href="https://tolkiengateway.net/wiki/Silmarils" target="_blank" rel="noopener noreferrer">Silmarils</a>）。</li>
</ul>
