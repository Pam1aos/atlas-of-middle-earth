<h1>布朗家族</h1>
<p><strong>布朗家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Brown_Family" target="_blank" rel="noopener noreferrer">Brown Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的霍比特人家族。<a class="wiki-link" href="/entry/%E8%8E%89%E8%8E%89%C2%B7%E7%A7%91%E9%A1%BF/">莉莉·布朗</a>是家族中仅知的一名成员，她嫁给了<a class="wiki-link" href="/entry/%E5%86%9C%E5%9C%BA%E4%B8%BB%E7%A7%91%E9%A1%BF/">农场主科顿</a>，两人诞下四男一女，其中女儿罗丝·科顿是<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>的妻子。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
