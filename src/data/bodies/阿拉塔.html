<h1>阿拉塔</h1>
<p><strong>阿拉塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Aratar" target="_blank" rel="noopener noreferrer">Aratar</a></strong>），即“阿尔达的主神”，是指<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a>中力量最强的八位：<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>、<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>、<a class="wiki-link" href="/entry/%E4%B9%8C%E6%AC%A7%E7%89%9F/">乌欧牟</a>、<a class="wiki-link" href="/entry/%E9%9B%85%E5%87%A1%E5%A8%9C/">雅凡娜</a>、<a class="wiki-link" href="/entry/%E5%A5%A5%E5%8A%9B/">奥力</a>、<a class="wiki-link" href="/entry/%E7%BA%B3%E7%89%9F/">曼督斯</a>、<a class="wiki-link" href="/entry/%E6%B6%85%E5%A8%9C/">涅娜</a>、<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E7%B1%B3/">欧洛米</a>。虽然曼威是他们的王，但这八位拥有同等权威，余众甚至其他的维拉都远远不能与他们相比。</p>
<p>阿拉塔起初有九位，但米尔寇已被除名，故只余八位。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>阿拉塔在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中意为“尊贵崇高者”，单数形式是<em>Arata</em>，复数形式是<em>Aratar</em>。<em>arat-<em>衍生自</em>ar(a)-</em>，意为“高尚的，高贵的，王室的”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
