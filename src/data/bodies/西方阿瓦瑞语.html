<h1>西方阿瓦瑞语</h1>
<p><strong>西方阿瓦瑞语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/West_Avarin" target="_blank" rel="noopener noreferrer">West Avarin</a></strong>），是<a class="wiki-link" href="/entry/%E9%98%BF%E7%93%A6%E7%91%9E%E8%AF%AD/">阿瓦瑞语</a>的一种分支，被部分<a class="wiki-link" href="/entry/%E9%98%BF%E7%93%A6%E7%91%9E/">阿瓦瑞</a>使用。这是最接近<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E8%AF%AD/">埃尔达语</a>的<a class="wiki-link" href="/entry/%E9%98%BF%E7%93%A6%E7%91%9E%E8%AF%AD/">阿瓦瑞语</a>分支。</p>
