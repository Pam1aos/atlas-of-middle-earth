<h1>夏警头头</h1>
<p><strong>夏警头头</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Chief_Shirrff" target="_blank" rel="noopener noreferrer">Chief Shirrff</a></strong>），简称<strong>头头</strong>，是<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>侵占<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>时期，跟恶棍相勾结的<a class="wiki-link" href="/entry/%E6%B4%9B%E7%B4%A2%C2%B7%E8%90%A8%E5%85%8B%E7%BB%B4%E5%B0%94-%E5%B7%B4%E9%87%91%E6%96%AF/">洛索·萨克维尔-巴金斯</a>的自称。他实际上并非恶棍头目，只是幕后黑手<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>的傀儡。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
