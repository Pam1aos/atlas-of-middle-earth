<p><strong>哈尔门达奇尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hyarmendacil" target="_blank" rel="noopener noreferrer">Hyarmendacil</a></strong>）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字，意为“南方胜利者”。这个名字可以指以下人物。</p>
<ul>
<li>哈尔门达奇尔一世，原名奇尔雅赫尔，刚铎第十五位国王，四船王中的最后一位，其统治下刚铎达到极盛。</li>
<li>哈尔门达奇尔二世，原名温瑞雅安，刚铎第二十四位国王。</li>
</ul>
