<h1>高尔夫球</h1>
<p><strong>高尔夫球</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Golf" target="_blank" rel="noopener noreferrer">Golf</a></strong>）是一项<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的球类运动。虽然没有详细描述，但它的玩法应该和现实生活中的高尔夫球运动类似。</p>
<p>高尔夫球是由著名的“吼牛”<a class="wiki-link" href="/entry/%E7%8F%AD%E5%A4%9A%E5%B8%83%E6%8B%89%E6%96%AF%C2%B7%E5%9B%BE%E5%85%8B/">班多布拉斯·图克</a>发明的。<a class="wiki-link" href="/entry/%E7%8F%AD%E5%A4%9A%E5%B8%83%E6%8B%89%E6%96%AF%C2%B7%E5%9B%BE%E5%85%8B/">班多布拉斯·图克</a>是一位非常高大强壮的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，他在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2747年的<a class="wiki-link" href="/entry/%E7%BB%BF%E9%87%8E%E4%B9%8B%E6%88%98/">绿野之战</a>中直冲<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>的阵地，一棒敲掉了敌军首领<a class="wiki-link" href="/entry/%E9%AB%98%E5%B0%94%E5%A4%AB%E9%85%8B/">高尔夫酋</a>的脑袋。这颗脑袋在空中飞了一百码，最后滚进了一个兔子洞：<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>的高尔夫球运动就是这样诞生了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
