<h1>塔克领</h1>
<p><strong>塔克领</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tuckborough" target="_blank" rel="noopener noreferrer">Tuckborough</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>一个古老而重要的居住地，坐落在<a class="wiki-link" href="/entry/%E7%BB%BF%E4%B8%98%E4%B9%A1%E9%87%8E/">绿丘乡野</a>。一条道路自西向东连接了塔克领、<a class="wiki-link" href="/entry/%E8%80%B6%E9%B2%81/">耶鲁</a>和<a class="wiki-link" href="/entry/%E6%96%AF%E6%89%98%E5%85%8B/">斯托克</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>塔克领是<a class="wiki-link" href="/entry/%E5%A4%A7%E6%96%AF%E5%AF%86%E5%A5%A5/">大斯密奥</a>的所在地，大斯密奥是世代继承夏尔<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>职位的<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%AE%B6%E6%97%8F/">图克家族</a>的祖居。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
