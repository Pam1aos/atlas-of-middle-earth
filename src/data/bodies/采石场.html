<h1>采石场</h1>
<p><strong>采石场</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Quarry" target="_blank" rel="noopener noreferrer">Quarry</a></strong>），坐落于<a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>北部，<a class="wiki-link" href="/entry/%E6%96%AF%E5%8D%A1%E9%87%8C%E4%B8%98%E9%99%B5/">斯卡里丘陵</a>的南边，<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>与<a class="wiki-link" href="/entry/%E6%96%AF%E5%8D%A1%E9%87%8C/">斯卡里</a>之间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p><code>quarry</code>一词通过法语从拉丁语的<code>quarreria</code>派生而来。</p>
