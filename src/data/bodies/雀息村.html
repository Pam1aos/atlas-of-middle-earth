<h1>雀息村</h1>
<p><strong>雀息村</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Pincup" target="_blank" rel="noopener noreferrer">Pincup</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一座小村庄，位于夏尔<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%BA/">南区</a>的北部，距离北边的、标志着<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>中心的<a class="wiki-link" href="/entry/%E4%B8%89%E5%8C%BA%E7%9F%B3/">三区石</a>约有数哩之遥。雀息村坐落在<a class="wiki-link" href="/entry/%E7%BB%BF%E4%B8%98%E4%B9%A1%E9%87%8E/">绿丘乡野</a>（这是一片东西走向的丘陵地区）的南麓，仅有一条从南而来的道路通往此地。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“雀息村”这一地名由两个部分组成。前半部分<code>pinc-</code>来源于<code>pinnuc</code>一词，意为“麻雀”；后半部分<code>-up</code>源于<code>hop</code>，意为“休息，退却”。</p>
