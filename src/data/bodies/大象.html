<p>哈拉德</p>
<p>John Howe</p>
<p><strong>大象</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elephants" target="_blank" rel="noopener noreferrer">Elephants</a></strong>），是一种来自<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7/">哈拉德地区</a>的生物。体型如同现实世界尺寸的象，实际上并没有在中洲系列作品里出现过，不过它们体型庞大的亲族<a class="wiki-link" href="/entry/%E6%AF%9B%E8%B1%A1/">毛象</a>则有多次登场。</p>
<p><a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中称呼大象为<code>andamunda</code>，而<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>（<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>的前身）称其为<code>andabon</code>或<code>annabon</code>，显然和昆雅语名同源。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
