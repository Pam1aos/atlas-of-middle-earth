<p><strong>信件88号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_88" target="_blank" rel="noopener noreferrer">Letter 88</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给克里斯托弗的一封信，写信日期为1944年10月28日。这封信写了托尔金对这一年的感慨<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金哀叹又是空虚的一年在黑暗中消逝了，他现在很想知道新的一年会发生什么。</p>
