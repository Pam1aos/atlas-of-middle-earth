<h1>6月12日</h1>
<h2>现实世界</h2>
<ul>
<li>1925年－J·R·R·托尔金给阿什顿夫人写了一封信。</li>
<li>1932年－演员迈克尔·埃尔斯沃斯出生。他在《指环王》系列电影中饰演奇尔丹。</li>
<li>1967年－唐纳德·斯旺和威廉·埃尔文录制了《旅途永不绝》中的音乐。</li>
<li>1997年－《1998年托尔金年历》出版。</li>
<li>2002年－《〈护戒使者〉中的艺术》（The Art of The Fellowship of the Ring）出版。</li>
<li>2007年－粉丝电影《夏尔危机》（The Peril to the Shire）向一个私人观众首映。</li>
<li>2015年－《埃尔达语言之书》第22期出版。</li>
</ul>
