<h1>9月17日</h1>
<h2>现实世界</h2>
<ul>
<li>1928年－演员罗迪·麦克道尔出生。他为1980年版《王者归来》动画电影配音，饰山姆。</li>
<li>1945年－演员布鲁斯·斯宾斯出生，他在《指环王：王者无敌》中饰演索隆之口。</li>
<li>1962年－阿丽娜·达德利兹给J·R·R·托尔金写了一封信。</li>
<li>1972年－J·R·R·托尔金写下一封信（信件341号）。</li>
<li>1993年－第二十届牛津大会举办，为期三天（9月17日-19日）。</li>
<li>2004年－第三十一届牛津大会举办，为期三天（9月17日-19日）。</li>
</ul>
