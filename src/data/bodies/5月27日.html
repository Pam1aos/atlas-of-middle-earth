<h1>5月27日</h1>
<h2>现实世界</h2>
<ul>
<li>1922年－演员克里斯托弗·李出生。他在《指环王》系列电影中饰演萨茹曼。</li>
<li>1930年－牛津大学出版社给J·R·R·托尔金寄去一本《中古英语读本》。</li>
<li>1932年－J·R·R·托尔金给A·F·科尔伯恩写了一封信。</li>
<li>2021年－新版平装本《〈高文爵士与绿骑士〉、〈珍珠〉和〈奥菲欧爵士〉》（Sir Gawain and the Green Knight, Pearl, and Sir Orfeo）出版。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元3019年－阿尔玟及护卫队离开洛丝罗瑞恩，朝米那斯提力斯继续前进。</li>
</ul>
