<h1>美塞德拉斯</h1>
<p><strong>美塞德拉斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Methedras" target="_blank" rel="noopener noreferrer">Methedras</a></strong>）是<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>的最南端的高峰。</p>
<h2>地理</h2>
<p>美塞德拉斯位于迷雾山脉的最南端，是迷雾山脉的最后一座山峰<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>，艾森河<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>与恩特河<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup>的发源地。美塞德拉斯的东麓是<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>，西边的丘陵地区是<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E5%9C%B0/">黑蛮地</a>。<a class="wiki-link" href="/entry/%E5%8D%97%E5%BA%93%E8%8C%B9%E5%B0%BC%E5%B0%94/">南库茹尼尔</a>则位于美塞德拉斯南侧的山脚下。<sup class="fn-ref"><a href="#fn-4" id="fnref-4">4</a></sup></p>
<h2>名称释义</h2>
<p><strong>美塞德拉斯</strong>（<em>Methedras</em>）是一个辛达语名字，意思是“最后的山峰”。</p>
