<p><strong>老霍伯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Hob" target="_blank" rel="noopener noreferrer">Old Hob</a></strong>），是电影《霍比特人：意外之旅》加长版中登场的原创<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Tim Gordon 饰演。</p>
<h2>生平</h2>
<p>老霍伯仅在《霍比特人：意外之旅》加长版中有短暂镜头，没有台词。他在<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>造访<a class="wiki-link" href="/entry/%E7%BB%BF%E9%BE%99%E9%85%92%E9%A6%86/">绿龙酒馆</a>外的集市时，作为背景角色出场。</p>
