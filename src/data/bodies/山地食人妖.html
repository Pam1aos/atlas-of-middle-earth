<p>John Howe</p>
<p><strong>山地食人妖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mountain-trolls" target="_blank" rel="noopener noreferrer">Mountain-trolls</a></strong>）是<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>的一种，<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>曾在<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>中利用它们来挥动巨型撞城槌<a class="wiki-link" href="/entry/%E6%A0%BC%E9%BE%99%E5%BE%97(%E6%94%BB%E5%9F%8E%E6%A7%8C)/">格龙得</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>除此之外，我们对山地食人妖一无所知，但可以猜测它们生活在中洲的高山地区，体型应比一般的食人妖更加庞大强壮。</p>
