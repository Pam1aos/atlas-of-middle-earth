<p><strong>埃伦弥瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elemmírë_(Elf" target="_blank" rel="noopener noreferrer">Elemmírë</a>)</strong>）是一位<a class="wiki-link" href="/entry/%E5%87%A1%E9%9B%85%E6%97%8F/">凡雅族</a>精灵，其名声来源于为黑暗降临的<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>创作的挽歌：“<a class="wiki-link" href="/entry/%E9%98%BF%E5%8B%92%E9%83%BD%E8%BF%AA%E5%B0%BC%E4%BE%9D/">阿勒都迪尼依</a>”。当<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>袭击<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA%E7%9A%84%E5%8F%8C%E5%9C%A3%E6%A0%91/">双圣树</a>的时候，凡雅族正和其他的精灵在<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%BC%E9%AD%81%E6%8F%90%E5%B0%94/">塔尼魁提尔</a>欢庆节日，因此埃伦弥瑞很有可能亲眼目睹了双圣树的毁灭。所有<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE/">埃尔达</a>都知晓这首哀悼双圣树之死的挽歌。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>很显然，埃伦弥瑞是以星辰<a class="wiki-link" href="/entry/%E5%9F%83%E4%BC%A6%E5%BC%A5%E7%91%9E(%E6%98%9F%E8%BE%B0)/">埃伦弥瑞(星辰)</a>命名的。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p>值得注意的是，我们无法通过这个词语的组成得知埃伦弥瑞的性别。</p>
