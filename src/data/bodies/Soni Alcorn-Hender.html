<p><strong>Soni Alcorn-Hender</strong>，是一名英国籍女性画家，现居葡萄牙。她的作品曾在<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E5%AD%A6%E7%A4%BE/">托尔金协会</a>于<a class="wiki-link" href="/entry/2014%E5%B9%B4/">2014年</a>和<a class="wiki-link" href="/entry/2015%E5%B9%B4/">2015年</a>举办的画展上，和<a class="wiki-link" href="/entry/%E6%B3%B0%E5%BE%B7%C2%B7%E7%BA%B3%E5%8F%B2%E5%AF%86%E6%96%AF/">泰德·纳史密斯</a>等名家的画作共同展出。她也为 Topps 和 Cryptozoic Entertainment 公司的中洲主题集换卡牌游戏提供商稿。Soni Alcorn-Hender 授权本维基使用她的作品，详见授权信息。</p>
