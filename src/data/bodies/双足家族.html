<h1>双足家族</h1>
<p><strong>双足家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Twofoot_Family" target="_blank" rel="noopener noreferrer">Twofoot Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族，已知的成员有居住在<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a><a class="wiki-link" href="/entry/%E8%A2%8B%E4%B8%8B%E8%B7%AF/">袋下路</a>的<a class="wiki-link" href="/entry/%E5%8F%8C%E8%B6%B3%E8%80%81%E7%88%B9/">双足老爹</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92I-%E9%AD%94%E6%88%92%E5%90%8C%E7%9B%9F/">魔戒I-魔戒同盟</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E4%B8%80-%E7%AC%AC%E4%B8%80%E7%AB%A0/">卷I-第一章</a>，盼望已久的宴会。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
