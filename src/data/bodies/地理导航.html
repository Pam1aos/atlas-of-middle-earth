<p>地理简介</p>
<ul>
<li><a class="wiki-link" href="/entry/%E9%98%BF%E9%97%A8%E6%B4%B2/">阿门洲</a>：坐落在世界最西端的大陆，和中洲隔大海相望。它的中部是维拉和精灵的繁荣家园维林诺，北部和南部则是黑暗寒冷的荒地。阿门洲的东海岸边矗立着不可逾越的佩罗瑞山脉，保护维林诺免受邪恶的侵袭。第二纪元末期以后，阿门洲被移出了世界，从此只有精灵可以籍由笔直航道抵达。区域：维林诺 · 阿拉曼 · 阿瓦沙</li>
</ul>
