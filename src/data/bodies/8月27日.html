<h1>8月27日</h1>
<h2>现实世界</h2>
<ul>
<li>1940年－在中断一段时间后，J·R·R·托尔金回归了《魔戒》的写作，为“新剧情”写下新的大纲。他设定了新人物萨茹曼作为甘道夫迟到的原因。</li>
<li>1987年－《中洲历史》第五卷在英国出版。</li>
<li>2007年－《弗罗多特权：〈指环王〉与现代好莱坞》（The Frodo Franchise: The Lord of the Rings and Modern Hollywood）出版。</li>
<li>2015年－《库勒沃的传说》在英国出版。</li>
<li>2024年－《指环王：重返墨瑞亚》在Steam平台发售。</li>
</ul>
