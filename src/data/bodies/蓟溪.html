<h1>蓟溪</h1>
<p><strong>蓟溪</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Thistle_Brook" target="_blank" rel="noopener noreferrer">Thistle Brook</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>的一条溪流。蓟溪发源自<a class="wiki-link" href="/entry/%E7%BB%BF%E4%B8%98%E4%B9%A1%E9%87%8E/">绿丘乡野</a>，朝东南方向流淌，穿过<a class="wiki-link" href="/entry/%E6%9F%B3%E8%B0%B7%E9%95%87/">柳谷镇</a>，最后注入<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E6%B2%B3/">夏尔河</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
