<h1>塔底居</h1>
<p><strong>塔底居</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Undertowers" target="_blank" rel="noopener noreferrer">Undertowers</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E7%95%8C/">西界</a><a class="wiki-link" href="/entry/%E5%A1%94%E4%B8%98/">塔丘</a>上的一座住宅，属于<a class="wiki-link" href="/entry/%E7%BE%8E%E8%A3%94%E5%AE%B6%E6%97%8F/">美裔家族</a>。</p>
<p>塔底居始建于<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>，它的奠基者是<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>之女<a class="wiki-link" href="/entry/%E5%9F%83%E6%8B%89%E8%AF%BA%C2%B7%E7%BE%8E%E8%A3%94/">埃拉诺·美裔</a>与她的丈夫、西界守护绿丘的法斯特雷德，两人是<a class="wiki-link" href="/entry/%E7%BE%8E%E8%A3%94%E5%AE%B6%E6%97%8F/">美裔家族</a>的祖先。此后，美裔家族的霍比特人世代生活于塔底居，这幢宅第中保存着他们的传家之宝《<a class="wiki-link" href="/entry/%E8%A5%BF%E7%95%8C%E7%BA%A2%E7%9A%AE%E4%B9%A6/">西界红皮书</a>》。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
