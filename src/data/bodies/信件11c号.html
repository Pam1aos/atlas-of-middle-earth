<p><strong>信件11c号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_11c" target="_blank" rel="noopener noreferrer">Letter 11c</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E6%99%AE%E8%8E%89%E8%A5%BF%E6%8B%89%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">普莉西拉·托尔金</a>的一封信，写信日期为1937年4月。托尔金说自己正在邓斯坦度假<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金目前正与<a class="wiki-link" href="/entry/C%C2%B7S%C2%B7%E5%88%98%E6%98%93%E6%96%AF/">C·S·刘易斯</a>在萨默塞特郡的邓斯坦徒步度假，他说他“看到了教堂，但没有看到城堡”。他写道，那天晚上他可能会呆在迈恩黑德，然后从那里乘火车回家。</p>
