<h1>伊希尔博</h1>
<p><strong>伊希尔博</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Itilbor" target="_blank" rel="noopener noreferrer">Itilbor</a></strong>）是一位南多<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>，有可能是第一次大战后在<a class="wiki-link" href="/entry/%E9%98%BF%E7%B4%A2%E7%91%9E%E6%81%A9/">阿索瑞恩</a>寻求保护的精灵之一。这些寻求庇护的南多精灵被称为 <em>Guest-elves</em> 。</p>
<p>他的事迹并没有记载，只知道他是<a class="wiki-link" href="/entry/%E8%B5%9B%E6%B4%9B%E6%96%AF/">赛洛斯</a>的父亲，而赛洛斯是<a class="wiki-link" href="/entry/%E5%A4%9A%E7%91%9E%E4%BA%9A%E6%96%AF/">多瑞亚斯</a>的<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛</a>王的重要谋臣。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字词源</h2>
<p>书中他的名字没有解释，但可能由<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>词汇“Ithil”（“月亮”）和“-paur”（“拳”），组合而成。</p>
