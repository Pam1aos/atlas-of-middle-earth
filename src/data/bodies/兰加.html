<h1>兰加</h1>
<p><strong>兰加</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ranga" target="_blank" rel="noopener noreferrer">Ranga</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>长度单位制中的距离度量单位之一。“兰加”是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“整步”。它的长度约等于成年男子“快速但轻松的行走时一步的长度，从后脚跟到前脚趾”。确切的说，一兰加大约是38英寸（即96.5厘米）。五千兰加计为一<a class="wiki-link" href="/entry/%E6%8B%89%E5%B0%94/">拉尔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>在<a class="wiki-link" href="/entry/%E6%9D%9C%E5%86%85%E4%B8%B9%E4%BA%BA/">杜内丹人</a>的身材有所变矮的后世，两兰加一般被称为“一人高”（这就是说，后世的<a class="wiki-link" href="/entry/%E6%9D%9C%E5%86%85%E4%B8%B9%E4%BA%BA/">杜内丹人</a>平均身高约为1.93米）。因为杜内丹人称呼<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>为“半身人”，所以<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的平均身高大约在一兰加左右。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
