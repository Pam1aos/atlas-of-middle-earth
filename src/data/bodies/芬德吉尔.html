<p><strong>芬德吉尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Findegil" target="_blank" rel="noopener noreferrer">Findegil</a></strong>）是<a class="wiki-link" href="/entry/%E9%87%8D%E8%81%94%E7%8E%8B%E5%9B%BD/">重联王国</a>国王<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E7%91%9E%E5%AE%89/">埃尔达瑞安</a>的书吏。</p>
<h2>生平</h2>
<p>作为书吏，芬德吉尔生平最著名的事迹，是誊写了一份<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98%E4%B9%8B%E4%B9%A6/">《长官之书》</a>的精确抄本（可能是应<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">佩里格林·图克</a>的曾孙之命）。他于<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>172年出色地完成了这项工作，誊本的所有细节都和原书毫无偏差，并且添加了许多注解和修订。不过，这份誊抄本最主要的重要性在于：在《红皮书》的所有抄本中，只有它包含了<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>创作的三卷本《精灵语转译史》。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
