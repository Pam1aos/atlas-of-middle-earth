<p><strong>信件287号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_287" target="_blank" rel="noopener noreferrer">Letter 287</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E4%B9%94%E4%BC%8A%C2%B7%E5%B8%8C%E5%B0%94/">乔伊·希尔</a>的一封信，写信日期为1966年5月10日。托尔金回复了删掉电话薄的事<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>乔伊·希尔曾建议托尔金把他的电话号码从电话簿上删掉。托尔金感谢了她，说他会考虑的。W·H·刘易斯保护弟弟的方法是反复回答“牛津污水处理场”，直到打电话的人走开，搬走似乎比这种方法要好。</p>
