<h1>纳洛格河谷</h1>
<p><strong>纳洛格河谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Vale_of_Narog" target="_blank" rel="noopener noreferrer">Vale of Narog</a></strong>），是<a class="wiki-link" href="/entry/%E8%A5%BF%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">西贝烈瑞安德</a>的<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>在中游形成的河谷。</p>
<p>贝烈瑞安德中部横亘着一长串丘陵地带，从西方的埃格拉瑞斯特丘陵连绵至东方的<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E5%9F%83%E7%91%9E%E5%B8%83/">阿蒙埃瑞布</a>。纳洛格河流经这片丘陵地区时，湍急的水流切出了深邃的纳洛格河谷，河谷的西岸是森林广阔的高地<a class="wiki-link" href="/entry/%E9%99%B6%E5%B0%94-%E6%81%A9-%E6%B3%95%E6%B4%9B%E6%96%AF/">陶尔-恩-法洛斯</a>。<a class="wiki-link" href="/entry/%E8%8A%AC%E7%BD%97%E5%BE%B7/">芬罗德</a>在河谷西岸、<a class="wiki-link" href="/entry/%E5%87%9B%E7%BA%AC%E5%B0%94%E6%BA%AA/">凛纬尔溪</a>与纳洛格河交汇处，修建了<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>要塞。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
