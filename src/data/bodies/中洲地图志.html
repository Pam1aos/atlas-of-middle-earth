<p><strong>《中洲地图志》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Atlas_of_Middle-earth" target="_blank" rel="noopener noreferrer">The Atlas of Middle-earth</a></strong>），是著名托尔金研究者<a class="wiki-link" href="/entry/%E5%8D%A1%E4%BC%A6%C2%B7%E6%96%B9%E6%96%AF%E5%A1%94%E5%BE%B7/">卡伦·温·方斯塔德</a>撰写的一本地图集，此书考证周详、绘制精美，享有广泛的声誉。这本书有1981以及1991两个版本，该条目主要介绍后一版。不过因为即使是最新版本出版的时候，也在<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2%E5%8E%86%E5%8F%B2/">《中洲历史》</a>系列的出版之前，所以其中部分信息和之后披露的官方信息有一定出入。本书尚无中译本。</p>
