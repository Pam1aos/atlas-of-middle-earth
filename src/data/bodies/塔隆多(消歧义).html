<p><strong>塔隆多</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tarondor_(disambiguation" target="_blank" rel="noopener noreferrer">Tarondor</a>)</strong>），是以下两位国王的名字：</p>
<ul>
<li>塔隆多（第三纪元372年 - 602年），是阿尔诺第七位国王。</li>
<li>塔隆多（第三纪元1577年 - 1798年），是刚铎第二十七位国王。他永久性地将刚铎的首都从欧斯吉利亚斯迁到了米那斯阿诺尔。</li>
</ul>
