<p><strong>苍蝇与蜘蛛</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Flies_and_Spiders" target="_blank" rel="noopener noreferrer">Flies and Spiders</a></strong>）是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">《霍比特人》</a>的第八章。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>
辞别<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>后，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>和<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%C2%B7%E6%A9%A1%E6%9C%A8%E7%9B%BE/">梭林</a>一众矮人向着密林开启了新的旅程，精疲力尽的矮人们在意外闯入精灵的境地后被居于<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>深处的精灵王俘获。</p>
<h2>概述</h2>
<p>梭林一众深入了蛛网密布、暗无天日的黑森林，饥肠辘辘人困马乏的矮人意外闯入正举行篝火晚会的精灵里，愤怒的国王以非法入境之名将他们关入森林王国的牢狱。而另一头，与众矮人失散的比尔博落入蜘蛛的巢穴，比尔博举起精灵的匕首与蜘蛛群展开了搏斗。</p>
