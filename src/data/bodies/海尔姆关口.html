<h1>海尔姆关口</h1>
<p><strong>海尔姆关口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Helm's_Gate" target="_blank" rel="noopener noreferrer">Helm&#39;s Gate</a></strong>）指的是<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>的开口处，即两侧峭壁所夹的出入口。位于<a class="wiki-link" href="/entry/%E4%B8%89%E5%B3%B0%E5%B1%B1/">三峰山</a>山脚，<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>的西南方，是从<a class="wiki-link" href="/entry/%E6%B7%B1%E8%B0%B7%E5%AE%BD%E8%B0%B7/">深谷宽谷</a>进入<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>的唯一通口。</p>
<p>在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>的<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，它由<a class="wiki-link" href="/entry/%E6%B7%B1%E8%B0%B7%E9%98%B2%E5%BE%A1%E5%A2%99/">深谷防御墙</a>保卫着，在<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1%E4%B9%8B%E6%88%98/">号角堡之战</a>中是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>居民的避难所<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
