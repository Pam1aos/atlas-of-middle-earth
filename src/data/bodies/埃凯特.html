<h1>埃凯特</h1>
<p><strong>埃凯特</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eket" target="_blank" rel="noopener noreferrer">Eket</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>佩戴的一种短剑。它是尖锐、双刃、适合刺击的宽刃短剑，长一呎到一呎半（0.305米到0.457米）。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>所描述的这种短剑，和古罗马军团配备的<a class="ext-link" href="https://en.m.wikipedia.org/wiki/Gladius" target="_blank" rel="noopener noreferrer">罗马短剑</a>颇多相似之处。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2年，当<a class="wiki-link" href="/entry/%E4%BC%8A%E7%86%99%E5%B0%94%E6%9D%9C/">伊熙尔杜</a>在北方遭遇<a class="wiki-link" href="/entry/%E9%87%91%E9%B8%A2%E5%B0%BE%E6%B2%BC%E5%9C%B0%E4%B9%8B%E7%A5%B8/">金鸢尾沼地之祸</a>时，他就佩戴着这样一把埃凯特短剑。在试图游过<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>逃亡时，<a class="wiki-link" href="/entry/%E4%BC%8A%E7%86%99%E5%B0%94%E6%9D%9C/">伊熙尔杜</a>抛下了身上的所有铠甲武器，只留下了这把短剑。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
