<p><strong>古斯威奈</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gúthwinë" target="_blank" rel="noopener noreferrer">Gúthwinë</a></strong>）是<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>的佩剑。</p>
<h2>历史</h2>
<p>在<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1%E4%B9%8B%E6%88%98/">号角堡之战</a>中，<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>曾操持着古斯威奈与<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>并肩作战，赶走了攻击城堡大门的<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E5%9C%B0%E4%BA%BA/">黑蛮地人</a>。伊奥梅尔亦佩带古斯威奈参加了<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>：当他看见<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>上出现的<a class="wiki-link" href="/entry/%E4%B9%8C%E5%A7%86%E5%B7%B4%E5%B0%94%E7%9A%84%E6%B5%B7%E7%9B%97/">黑舰队</a>时，他高举宝剑，以示蔑视；而当发现黑舰队上搭载的竟然是<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>的援军时，他惊喜地将宝剑抛向天空又接住，随后放声高唱。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>名称释义</h2>
<p>“古斯威奈”是一个<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97%E8%AF%AD/">洛汗语</a>（在书中以古英语代表）名称，意为“战斗之友”。</p>
