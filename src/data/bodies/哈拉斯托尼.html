<p><strong>哈拉斯托尼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hyarastorni" target="_blank" rel="noopener noreferrer">Hyarastorni</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>王国中部<a class="wiki-link" href="/entry/%E7%B1%B3%E5%A1%94%E5%B0%94%E7%8E%9B/">米塔尔玛</a>地区的一块领地。<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E7%BE%8E%E5%B0%BC%E5%B0%94%E9%83%BD%E5%B0%94/">塔尔-美尼尔都尔</a>当政期间，哈拉斯托尼的领主是<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%8B%89%E5%9D%A6/">哈尔拉坦</a>，他被戏称为<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%8B%89%E5%9D%A6/">牧羊领主</a>，因为米塔尔玛的地形以草岗为主，适合牧羊。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>882年，努门诺尔王储<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>和妻子<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D/">埃仁迪丝</a>决裂后，愤怒的他前往哈拉斯托尼，将原本打算送给妻子的一颗红宝石，送给了住在哈拉斯托尼的水手<a class="wiki-link" href="/entry/%E4%B9%8C%E5%B7%B4%E5%B0%94/">乌巴尔</a>的妻子，然后转身离开。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
