<p><strong>拉嘎什</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ragash" target="_blank" rel="noopener noreferrer">Ragash</a></strong>），是电影<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>中原创的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>角色，由 Alan Smith 饰演，Martin Kwok 配音。</p>
<h2>生平</h2>
<p>拉嘎什在<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>中短暂出场，他是<a class="wiki-link" href="/entry/%E9%98%BF%E4%BD%90%E6%A0%BC/">阿佐格</a>的部下。当阿佐格的大军利用<a class="wiki-link" href="/entry/%E5%9C%B0%E8%A0%95%E8%99%AB/">地蠕虫</a>挖掘通往<a class="wiki-link" href="/entry/%E5%AD%A4%E5%B1%B1/">孤山</a>的地下隧道时，拉嘎什检视了工程进度，并向阿佐格汇报道，军队可以在黎明时分发动进攻。</p>
