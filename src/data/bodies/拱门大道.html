<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>拱门大道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Road_of_the_Arches" target="_blank" rel="noopener noreferrer">Road of the Arches</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一条街道，它是王之广场的西北面入口，连接着王之广场和<a class="wiki-link" href="/entry/%E6%B3%89%E4%BA%95%E4%B9%8B%E5%9C%B0/">泉井之地</a>。刚多林陷落之战中，<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>从这条道路带领<a class="wiki-link" href="/entry/%E7%99%BD%E7%BF%BC%E5%AE%B6%E6%97%8F/">白翼家族</a>、<a class="wiki-link" href="/entry/%E6%B6%8C%E6%B3%89%E5%AE%B6%E6%97%8F/">涌泉家族</a>、<a class="wiki-link" href="/entry/%E9%A3%9E%E7%87%95%E5%AE%B6%E6%97%8F/">飞燕家族</a>、<a class="wiki-link" href="/entry/%E5%A4%A9%E8%99%B9%E5%AE%B6%E6%97%8F/">天虹家族</a>和<a class="wiki-link" href="/entry/%E7%BB%BF%E6%A0%91%E5%AE%B6%E6%97%8F/">绿树家族</a>的残兵撤退至王之广场。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
