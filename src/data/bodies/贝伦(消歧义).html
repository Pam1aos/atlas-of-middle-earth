<p><strong>贝伦</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Beren_(disambiguation" target="_blank" rel="noopener noreferrer">Beren</a>)</strong>）在<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中意为“勇敢的”，这个名字可以指：</p>
<ul>
<li>贝伦（生于第一纪元374年），贝烈米尔之子，贝伦·埃尔哈米恩的外祖父。</li>
<li>贝伦·埃尔哈米恩（第一纪元443年 - 503年），巴拉希尔之子，露西恩·缇努维尔的丈夫，第一纪元著名的人类英雄。</li>
<li>贝伦（第三纪元2655年 - 2763年），刚铎的第十九位执政宰相。</li>
</ul>
