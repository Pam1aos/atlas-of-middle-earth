<h1>阶梯瀑布</h1>
<p><strong>阶梯瀑布</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Stair_Falls" target="_blank" rel="noopener noreferrer">Stair Falls</a></strong>）是<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a><a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E4%B9%8B%E9%97%A8/">西门</a>外的瀑布，高约十米，得名于不远处石崖上雕刻着的阶梯。发源自<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E8%BF%AA%E5%B0%94/">银齿峰</a>的<a class="wiki-link" href="/entry/%E8%A5%BF%E6%A0%8F%E5%86%9C%E6%BA%AA/">西栏农溪</a>水在门前下落、形成瀑布，其声激荡在数英里外都可听见。随后溪水在<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%90%89%E5%AE%89/">埃瑞吉安</a>的绿野间流过，最终汇入<a class="wiki-link" href="/entry/%E6%A0%BC%E8%93%9D%E9%83%BD%E5%9B%A0%E6%B2%B3/">格蓝都因河</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
