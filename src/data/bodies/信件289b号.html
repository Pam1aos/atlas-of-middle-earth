<p><strong>信件289b号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter289b" target="_blank" rel="noopener noreferrer">Letter289b</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给克莱德·S·基尔比的一封信，写信日期为1966年10月11日。托尔金描述了自己的近况<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金描述了他近期的一些写作经历，并讲述了他地中海之旅的情况。</p>
