<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>大集市</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Great_Market" target="_blank" rel="noopener noreferrer">Great Market</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一座集市广场，位于城市东部。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E7%9A%84%E9%99%B7%E8%90%BD/">刚多林陷落</a>时，<a class="wiki-link" href="/entry/%E6%A0%BC%E7%BD%97%E8%8A%AC%E5%BE%B7%E5%B0%94/">格罗芬德尔</a>率领<a class="wiki-link" href="/entry/%E9%87%91%E8%8A%B1%E5%AE%B6%E6%97%8F/">金花家族</a>取道大集市前往<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E5%8C%97%E9%97%A8/">北城门</a>参战，他们选择这样一条迂回路线是为了奇袭敌军左翼，不料却在大集市遭到由数个<a class="wiki-link" href="/entry/%E7%82%8E%E9%AD%94/">炎魔</a>带领的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>部队伏击。双方激战了几个小时，最终金花家族因为一条<a class="wiki-link" href="/entry/%E7%81%AB%E9%BE%99/">火龙</a>的加入而被击溃，格罗芬德尔和少数战士突围，大集市的店铺和无数精美商品被付之一炬。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
