<h1>夏警长官</h1>
<p><strong>夏警长官</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/First_Shirriff" target="_blank" rel="noopener noreferrer">First Shirriff</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E6%B2%BB%E5%AE%89%E8%AD%A6%E5%A4%87/">治安警备</a>服务的最高领导，由<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87%E5%B8%82%E9%95%BF/">大洞镇市长</a>兼任。夏尔的治安警备人员包括<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6/">夏警</a>和<a class="wiki-link" href="/entry/%E8%BE%B9%E7%95%8C%E5%AE%88%E5%8D%AB(%E5%A4%8F%E5%B0%94)/">边界守卫</a>。夏警只有十二名，夏尔<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E5%9B%9B%E5%8C%BA/">四区</a>各有三名，通常负责解决类似牲口走失之类的日常琐事；边界守卫人数较多，具体数量根据需求变化。<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>占领夏尔期间，<a class="wiki-link" href="/entry/%E6%B4%9B%E7%B4%A2%C2%B7%E8%90%A8%E5%85%8B%E7%BB%B4%E5%B0%94-%E5%B7%B4%E9%87%91%E6%96%AF/">洛索·萨克维尔-巴金斯</a>曾自封为<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6%E5%A4%B4%E5%A4%B4/">夏警头头</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
