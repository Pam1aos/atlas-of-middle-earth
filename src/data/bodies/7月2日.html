<h1>7月2日</h1>
<h2>现实世界</h2>
<ul>
<li>1962年－J·R·R·托尔金和伊迪丝·托尔金前往伯恩茅斯旅行。</li>
<li>1966年－《星期六晚邮报》（Saturday Evening Post）出版了对J·R·R·托尔金的采访。</li>
<li>2007年－《2008年托尔金年历》出版。</li>
<li>2017年－托尔金学社在希尔顿利兹城市酒店举办学术研讨会，主题为“诗与歌”（Poetry and Song）。</li>
<li>2023年－托尔金学社在希尔顿利兹城市酒店和线上同时举办学术研讨会，主题为“强大又脆弱的努门诺尔”（Númenor, the Mighty and Frail）。</li>
</ul>
