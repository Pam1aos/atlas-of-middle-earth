<p><strong>明霓国斯之桥</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bridge_of_Esgalduin" target="_blank" rel="noopener noreferrer">Bridge of Menegroth</a></strong>），是由<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E6%88%88%E6%96%AF%E7%89%B9/">贝烈戈斯特</a>的矮人建造的一座桥梁。他们以此换取<a class="wiki-link" href="/entry/%E7%BE%8E%E4%B8%BD%E5%AE%89/">美丽安</a>教给他们的知识和<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛</a>国王给他们的珍珠。这座桥用石头建造，是进入<a class="wiki-link" href="/entry/%E6%98%8E%E9%9C%93%E5%9B%BD%E6%96%AF/">明霓国斯</a>大门的唯一途径。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
