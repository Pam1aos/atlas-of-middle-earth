<h1>霍比特洞府</h1>
<p><strong>霍比特洞府</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hobbit-holes" target="_blank" rel="noopener noreferrer">Hobbit-holes</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的一类居所。</p>
<p>很久很久以前，所有的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>都住在洞府里。随着时间的推移，他们发展出了新的建筑类型。而到了<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>生活的年代，只有最穷困和最富裕的霍比特人才住在洞里。穷人们住的是最简陋的地洞，有时甚至连扇窗户也没有；富人们则住进了宽敞豪华的<a class="wiki-link" href="/entry/%E6%96%AF%E5%AF%86%E5%A5%A5/">斯密奥</a>，其内部有多个居室，以通道相互连接。在不适宜掘洞的平原或洼地，霍比特人则住在用木头、砖块或石头打造的地上房屋里面。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
