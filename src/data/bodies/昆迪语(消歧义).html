<h1>昆迪语(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>昆迪语</strong>（Quendian），是<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>在<a class="wiki-link" href="/entry/%E5%A5%8E%E7%BB%B4%E8%80%B6%E8%83%BD/">奎维耶能</a>苏醒后使用的语言：</p>
<ul>
<li>在早期版本《语言的记述》中，指<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E7%B1%B3%E8%AF%AD%E6%97%8F/">欧洛米语族</a>（Oromian）。</li>
<li>在较后期版本中，指<a class="wiki-link" href="/entry/%E5%8E%9F%E5%A7%8B%E6%98%86%E8%BF%AA%E8%AF%AD/">原始昆迪语</a>（Primitive Quandian）。</li>
</ul>
