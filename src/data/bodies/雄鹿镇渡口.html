<h1>雄鹿镇渡口</h1>
<p><strong>雄鹿镇渡口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bucklebury_Ferry" target="_blank" rel="noopener noreferrer">Bucklebury Ferry</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>和<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>之间重要的交通节点。它是位于<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>河边的一座宽阔木制码头，距离<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E6%A1%A5/">白兰地桥</a>大约有20英里，码头边系着一艘平底大渡船。有一条专门的<a class="wiki-link" href="/entry/%E6%B8%A1%E5%8F%A3%E5%B0%8F%E8%B7%AF/">小路</a>从和<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>走势平行的堤道分岔而出，通往渡口，小路的入口用两根高大的白色立柱标识。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
