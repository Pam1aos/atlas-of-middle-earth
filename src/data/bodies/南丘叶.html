<h1>南丘叶</h1>
<p><strong>南丘叶</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Southlinch" target="_blank" rel="noopener noreferrer">Southlinch</a></strong>），是一种<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>出产的<a class="wiki-link" href="/entry/%E7%83%9F%E6%96%97%E8%8D%89/">烟斗草</a>，它们茂盛地生长在<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E5%B1%B1/">布理山</a>的南坡上。<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>是烟斗草的原产地，也是最早吸食烟草的地方，但南丘叶的质量无法跟夏尔南区出产的烟草相比，即使是素来偏袒布理的<a class="wiki-link" href="/entry/%E8%B7%83%E9%A9%AC%E5%AE%A2%E6%A0%88/">跃马客栈</a>店主<a class="wiki-link" href="/entry/%E9%BA%A6%E6%9B%BC%C2%B7%E9%BB%84%E6%B2%B9%E8%8F%8A/">麦曼·黄油菊</a>也不得不承认这一点。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
