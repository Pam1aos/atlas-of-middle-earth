<p><strong>罗弗兰登</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Roverandom" target="_blank" rel="noopener noreferrer">Roverandom</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>的短篇奇幻小说。</p>
<p>1925年，小迈克尔与家人度假时，丢失了心爱的玩具狗。为了安慰他，爸爸J.R.R.托尔金想出了一个故事：一条真狗被魔法师变成玩具狗，后来又给沙滩法师送到月亮和海里……</p>
<p>没有《罗弗兰登》，《<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E4%B9%A6%E7%B1%8D)/">魔戒</a>》也许不会诞生；正因为《罗弗兰登》一类的奇幻故事深受托尔金本人和他子女的喜爱，最终催生了更雄心勃勃的作品——《<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">霍比特人</a>》乃至《魔戒三部曲》。</p>
