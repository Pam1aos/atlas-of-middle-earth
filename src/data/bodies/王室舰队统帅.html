<h1>王室舰队统帅</h1>
<blockquote>
<p>本词条叙述的对象是维安图尔曾拥有的努门诺尔头衔。想要了解卡斯塔米尔曾拥有的刚铎头衔，请参看<a class="wiki-link" href="/entry/%E8%88%B0%E9%98%9F%E7%BB%9F%E5%B8%85/">舰队统帅</a>。</p>
</blockquote>
<p><strong>王室舰队统帅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Captain_of_the_King's_Ships" target="_blank" rel="noopener noreferrer">Captain of the King&#39;s Ships</a></strong>），是努门诺尔王国舰队指挥官的头衔。在历史记载中，仅仅提到<a class="wiki-link" href="/entry/%E7%BB%B4%E5%AE%89%E5%9B%BE%E5%B0%94/">维安图尔</a>拥有此头衔，他是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>首次返回<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>大陆的远航的指挥者，努门诺尔第六代国王<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">塔尔-阿勒达瑞安</a>的外祖父。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
