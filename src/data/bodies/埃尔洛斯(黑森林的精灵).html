<p><strong>埃尔洛斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elros_(Mirkwood_guard" target="_blank" rel="noopener noreferrer">Elros</a>)</strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E5%8F%B2%E7%9F%9B%E9%9D%A9%E4%B9%8B%E6%88%98/">《霍比特人：史矛革之战》</a>中原创的<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97%E7%8E%8B%E5%9B%BD/">森林王国</a>精灵角色，由新西兰演员 Robin Kerr 饰演。</p>
<h2>生平</h2>
<p>埃尔洛斯是<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%9B%BD%E7%8E%8B%E7%9A%84%E5%AE%AB%E6%AE%BF/">瑟兰杜伊的宫殿</a>中地牢的钥匙的保管者，也是一名卫队士兵。他跟随着<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>与<a class="wiki-link" href="/entry/%E9%99%B6%E7%91%9E%E5%B0%94/">陶瑞尔</a>率领的小队，在森林中俘虏了<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>，将他们带回地牢关押。由于埃尔洛斯和瑟兰杜伊的总管<a class="wiki-link" href="/entry/%E5%8A%A0%E7%90%86%E5%AE%89/">加理安</a>疏于职守、喝得烂醉，地牢的钥匙被霍比特人<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>偷走，<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%C2%B7%E6%A9%A1%E6%9C%A8%E7%9B%BE/">梭林</a>等人得以逃出囹圄。随后，当瑟兰杜伊下令关闭进出森林王国的全部通道时，埃尔洛斯告诉莱戈拉斯，陶瑞尔带着武器擅自离开了王国。</p>
