<p><strong>圣山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Holy_Mountain_(disambiguation" target="_blank" rel="noopener noreferrer">Holy Mountain</a>)</strong>），可能是指：</p>
<ul>
<li>塔尼魁提尔，阿门洲的圣山，佩罗瑞山脉的最高峰。</li>
<li>美尼尔塔玛，努门诺尔的圣山，供奉伊露维塔的圣地。</li>
<li>哈利菲瑞恩，又称阿蒙安瓦尔，“敬畏之山”，是刚铎的七座烽火丘中最高的一座。</li>
</ul>
