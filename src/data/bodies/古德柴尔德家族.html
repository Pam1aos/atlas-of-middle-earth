<h1>古德柴尔德家族</h1>
<p><strong>古德柴尔德家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Goodchild_Family" target="_blank" rel="noopener noreferrer">Goodchild Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族，唯一已知的成员是贝尔·古德柴尔德，她与<a class="wiki-link" href="/entry/%E6%B1%89%E5%A7%86%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">汉姆法斯特·甘姆吉</a>成婚并育有六位子女，其中之一便是护戒远征队的成员<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称与词源</h2>
<p>古德柴尔德（Goodchild）是现实中存在的姓氏，由古英语中的Godchid一词演化而来，字面含义是“品行良好、受到喜爱的人”。</p>
