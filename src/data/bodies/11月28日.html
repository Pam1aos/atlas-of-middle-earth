<h1>11月28日</h1>
<h2>现实世界</h2>
<ul>
<li>1915年－J·R·R·托尔金完成诗歌《林中的科尔提力安》。</li>
<li>1930年－圣诞老爸为J·R·R·托尔金的孩子们写了一封信。</li>
<li>1962年－J·R·R·托尔金写下一封信（信件242号）。</li>
<li>1963年－J·R·R·托尔金给乔治·塞耶写了一封信。</li>
<li>1964年－《公主》（Princess）杂志刊登了《霍比特人》的第八节。</li>
<li>1978年－演员安德鲁·莫雷尔（André Morell）去世，他生前为动画电影《魔戒》配音，饰演埃尔隆德。</li>
<li>2003年－《霍比特人》在欧洲发售。</li>
</ul>
