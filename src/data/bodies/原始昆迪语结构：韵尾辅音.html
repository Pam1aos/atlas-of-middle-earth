<h1>原始昆迪语结构：韵尾辅音</h1>
<p>《原始昆迪语结构：韵尾辅音》是一篇托尔金写于1936年的文本，长达九页。文本探讨了原始昆迪语词尾辅音的分布和昆雅语屈折的词源关系。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>，该文后来发表在2013年9月的Parma Eldalamberon第21期上。</p>
