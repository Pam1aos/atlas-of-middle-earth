<h1>欧伊克洛伊</h1>
<p><strong>欧伊克洛伊</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Oikeroi" target="_blank" rel="noopener noreferrer">Oikeroi</a></strong>）是一只大猫，<a class="wiki-link" href="/entry/%E6%B3%B0%E7%BB%B4%E5%A4%9A/">泰维多</a>仆从中的一员大将。它凶恶好斗，最终被<a class="wiki-link" href="/entry/%E8%83%A1%E5%AE%89/">胡安</a>所杀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
