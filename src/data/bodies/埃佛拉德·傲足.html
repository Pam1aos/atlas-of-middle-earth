<p><strong>埃佛拉德·傲足</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Everard_Proudfoot" target="_blank" rel="noopener noreferrer">Everard Proudfoot</a></strong>），是<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B(%E7%B3%BB%E5%88%97%E7%94%B5%E5%BD%B1)/">《指环王》系列电影</a>中原创的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Noel Appleby 饰演。</p>
<h2>生平</h2>
<p>埃佛拉德·傲足是一个生活在<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>的霍比特人老头，一心只在乎自己的花园。他似乎颇为惧内：譬如，他很欣赏<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>的烟花，但<a class="wiki-link" href="/entry/%E5%82%B2%E8%B6%B3%E5%A4%AA%E5%A4%AA/">妻子</a>一靠近，他就装出一副对烟花不满的表情。埃佛拉德·傲足出席了<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%E7%9A%84%E5%91%8A%E5%88%AB%E5%AE%B4%E4%BC%9A/">比尔博的告别宴会</a>。《指环王：王者无敌》加长版中，他在打理花园时，看见了<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>等四位霍比特人重返家园。</p>
