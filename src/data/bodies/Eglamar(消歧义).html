<h1>Eglamar(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>Eglamar</strong>一词可以指代以下地区：</p>
<ul>
<li>埃尔达玛的早期名字</li>
<li>法拉斯诸港的另一个名字</li>
<li>埃敏埃格莱因（Emyn Eglain），又称Hills of Eglamar</li>
<li>阿索瑞恩的另一个名字</li>
</ul>
