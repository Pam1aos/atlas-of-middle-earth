<p><strong>河婆</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/River-woman" target="_blank" rel="noopener noreferrer">River-woman</a></strong>），是一位谜一样的人物，通常被认为是某种水中的神灵。她的居所位于<a class="wiki-link" href="/entry/%E8%80%81%E6%9E%97%E5%AD%90/">老林子</a>中的<a class="wiki-link" href="/entry/%E6%9F%B3%E6%9D%A1%E6%B2%B3/">柳条河</a>里。因为她是<a class="wiki-link" href="/entry/%E9%87%91%E8%8E%93/">金莓</a>的母亲，金莓也被称为“河之女’’。</p>
<p>在诗歌《<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94%E5%8E%86%E9%99%A9%E8%AE%B0/">汤姆·邦巴迪尔历险记</a>》中，金莓曾将路过河边的<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94/">汤姆·邦巴迪尔</a>拖下水中，随后“向着最幽深溪谷中母亲的居所游去”。后来，<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94/">汤姆</a>回到河边请求河婆将女儿托付给他，她没有任何异议。二人随后便结婚了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
