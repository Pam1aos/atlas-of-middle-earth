<h1>埃茹伊河渡口</h1>
<p><strong>埃茹伊河渡口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Crossings_of_Erui" target="_blank" rel="noopener noreferrer">Crossings of Erui</a></strong>），是通往<a class="wiki-link" href="/entry/%E4%BD%A9%E6%8B%89%E5%9F%BA%E5%B0%94/">佩拉基尔</a>的主干道<a class="wiki-link" href="/entry/%E5%8D%97%E5%A4%A7%E9%81%93/">南大道</a>和<a class="wiki-link" href="/entry/%E5%9F%83%E8%8C%B9%E4%BC%8A%E6%B2%B3/">埃茹伊河</a>交汇处的浅滩。它位于刚铎首都米那斯提力斯城以南大约五十哩（约合八十公里）的地方。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>1477年，刚铎第二十一代国王<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E5%8D%A1(%E5%88%9A%E9%93%8E%E5%9B%BD%E7%8E%8B)/">埃尔达卡</a>和篡位者<a class="wiki-link" href="/entry/%E5%8D%A1%E6%96%AF%E5%A1%94%E7%B1%B3%E5%B0%94/">卡斯塔米尔</a>率领的叛军曾在埃茹伊河渡口展开决战，此役中刚铎的大批贵族血洒疆场。最后，埃尔达卡亲自与卡斯塔米尔进行决斗，并将其击杀，从而基本平定了长达十五年之久的<a class="wiki-link" href="/entry/%E4%BA%B2%E6%97%8F%E4%BA%89%E6%96%97/">刚铎内乱</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
