<h1>黑暗之树</h1>
<p><strong>黑暗之树</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dark_Tree" target="_blank" rel="noopener noreferrer">Dark Tree</a></strong>），是对邪恶力量的一种比喻的说法，这一概念是<a class="wiki-link" href="/entry/%E7%8E%BB%E6%8B%89%E6%96%AF/">玻拉斯</a>在跟<a class="wiki-link" href="/entry/%E8%B5%9B%E9%9A%86/">赛隆</a>谈话时提出的。<a class="wiki-link" href="/entry/%E7%8E%BB%E6%8B%89%E6%96%AF/">玻拉斯</a>指出，在<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>世界，邪恶永远无法被彻底铲除，它总会一次又一次卷土重来：这正如一棵根深蒂固、生命顽强的黑暗之树。因此，人们必须经常对它加以砍伐，任何时候都不应该放松警惕。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
