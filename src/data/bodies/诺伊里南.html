<p>Matěj Čadil</p>
<p><strong>诺伊里南</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Noirinan" target="_blank" rel="noopener noreferrer">Noirinan</a></strong>），又称<strong>墓谷</strong>，是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>岛上<a class="wiki-link" href="/entry/%E7%BE%8E%E5%B0%BC%E5%B0%94%E5%A1%94%E7%8E%9B/">美尼尔塔玛</a>山脉南部的山谷。努门诺尔历代国王与女王都长眠在这方浅谷中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>努门诺尔的主要河流<a class="wiki-link" href="/entry/%E8%A5%BF%E5%88%A9%E5%B0%94%E6%B2%B3/">西利尔河</a>也在这里发源，由此向南方流去。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
<h2>名字与词源</h2>
<p>Noirinan是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“坟墓之谷”。由<code>noirë</code> “坟墓”和后缀<code>-nan</code> “山谷”（来自<code>nan(do)</code> “山谷，谷地”）构成。</p>
