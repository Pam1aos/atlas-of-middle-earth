<h1>矮人锁子甲</h1>
<p><strong>矮人锁子甲</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dwarf-mail" target="_blank" rel="noopener noreferrer">Dwarf-mail</a></strong>），是<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>用连缀的金属环打造的甲胄。<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E6%88%88%E6%96%AF%E7%89%B9/">贝烈戈斯特</a>的矮人是这种铠甲的发明者，他们在这方面的工艺无人能敌。直到<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>末期，矮人依然是制造锁子甲的佼佼者，他们替<a class="wiki-link" href="/entry/%E5%90%89%E7%91%9E%E5%AE%89/">吉瑞安</a>之子定制的纯银锁子甲，其强度和硬度三倍于钢铁；而<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>著名的<a class="wiki-link" href="/entry/%E7%A7%98%E9%93%B6/">秘银</a><a class="wiki-link" href="/entry/%E7%A7%98%E9%93%B6%E7%94%B2/">锁子甲</a>，同样出于<a class="wiki-link" href="/entry/%E5%AD%A4%E5%B1%B1/">埃瑞博山</a>的矮人之手。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
