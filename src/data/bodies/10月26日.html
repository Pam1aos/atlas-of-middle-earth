<h1>10月26日</h1>
<h2>现实世界</h2>
<ul>
<li>1916年－J·R·R·托尔金所属的兰开夏燧发枪手团第11营接受道格拉斯·黑格元帅检阅。</li>
<li>1945年－作家简·钱斯出生，她写了许多有关J·R·R·托尔金的作品。</li>
<li>1958年－J·R·R·托尔金给L·M·卡茨写了一封信。</li>
<li>1966年－J·R·R·托尔金在缺少演讲主题的情况下，面向约800人朗读了《大伍屯的铁匠》。</li>
<li>1994年－《泰勒瑞族的欢乐》第2期出版。</li>
<li>2005年－J·R·R·托尔金的学生和好友安格斯·麦金托什去世。</li>
<li>2017年－艺术家罗格·加兰去世。他曾为《魔戒》和《精灵宝钻》等书绘制插图。</li>
</ul>
