<p><strong>当</strong><a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA%E7%9A%84%E5%8F%8C%E5%9C%A3%E6%A0%91/">双圣树</a>的光芒盛放，历史的纪年由此开始；当“黑暗之树”的阴翳渐浓，历史的记载至此告终。<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>的历史就像树木：虽经迁换流转，生命和希望却从未消逝，且在不断成长之中愈发优美坚挺。</p>
