<p><strong>浮木客栈</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Floating_Log" target="_blank" rel="noopener noreferrer">The Floating Log</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一家客栈，位于<a class="wiki-link" href="/entry/%E8%9B%99%E6%B3%BD%E5%B1%AF/">蛙泽屯</a>，靠近<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>。</p>
<h2>魔戒大战时期</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年11月1日，当返乡的<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>途径蛙泽屯时，他们打算在浮木客栈投宿。但是，他们在村口遭到<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6/">夏警</a>逮捕，未能如愿。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
