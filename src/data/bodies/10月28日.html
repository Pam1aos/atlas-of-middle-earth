<h1>10月28日</h1>
<h2>现实世界</h2>
<ul>
<li>1944年－J·R·R·托尔金写下一封信（信件88号）。</li>
<li>1958年－C·S·刘易斯给J·R·R·托尔金写了一封信。</li>
<li>1966年－J·R·R·托尔金写下一封信（信件290号）。</li>
<li>1968年－演员斯蒂芬·亨特出生，他在《霍比特人》系列电影中扮演邦伯。</li>
<li>1971年－J·R·R·托尔金给乔伊·希尔写了一封信。</li>
<li>1988年－注释版《霍比特人》出版。</li>
<li>2018年－牛津大学博德利图书馆的展出“托尔金：中洲缔造者”结束。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元3019年－甘道夫和四位霍比特人抵达布理，入住跃马客栈。</li>
</ul>
