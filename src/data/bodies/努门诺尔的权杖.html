<h1>努门诺尔的权杖</h1>
<p><strong>努门诺尔的权杖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sceptre_of_Númenor" target="_blank" rel="noopener noreferrer">Sceptre of Númenor</a></strong>）是努门诺尔王国的传国重器、王权的象征，每一代<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E5%9B%BD%E7%8E%8B/">努门诺尔国王</a>都曾执掌过它。努门诺尔的早期诸王通常都在自己逝世之前很久，就将王位和权杖自愿地让渡给继承人；但后期的国王们逐渐变得贪恋权势，他们至死方才愿意交出权杖。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3319年，在努门诺尔沦亡的浩劫里，努门诺尔的权杖随着末代国王<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94-%E6%B3%95%E6%8B%89%E5%AE%97/">阿尔-法拉宗</a>一起消失了。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
