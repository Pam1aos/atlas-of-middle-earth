<h1>比尔博的遗嘱</h1>
<p><strong>比尔博的遗嘱</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bilbo's_will" target="_blank" rel="noopener noreferrer">Bilbo&#39;s will</a></strong>），是袋底洞的所有者<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>在离开<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>之前起草的一份法律文件，文件中将袋底洞的所有权转让给了比尔博的侄子<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>，而不是觊觎袋底洞已久的<a class="wiki-link" href="/entry/%E8%90%A8%E5%85%8B%E7%BB%B4%E5%B0%94-%E5%B7%B4%E9%87%91%E6%96%AF%E5%AE%B6%E6%97%8F/">萨克维尔-巴金斯家族</a>。这份遗嘱在措辞上非常清晰准确，不仅完全符合<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的法律惯例，而且还有七位证人的朱笔签字，萨克维尔-巴金斯家族虽然对它嗤之以鼻，却挑不出一点毛病，只能自认倒霉。在<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>消失之后，这份遗嘱连同<a class="wiki-link" href="/entry/%E8%87%B3%E5%B0%8A%E6%88%92/">至尊魔戒</a>一起被封在信封里，留给了弗罗多。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
