<p><strong>拉格尼尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ragnir_(servant" target="_blank" rel="noopener noreferrer">Ragnir</a>)</strong>）是<a class="wiki-link" href="/entry/%E5%A4%9A%E5%B0%94%E7%BD%97%E6%98%8E/">多尔罗明</a>领主<a class="wiki-link" href="/entry/%E8%83%A1%E6%9E%97%C2%B7%E6%B2%99%E7%90%86%E5%AE%89/">胡林·沙理安</a>家中的一位瞎眼仆人。</p>
<p>拉格尼尔的生平事迹不详：实际上，他仅仅在<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>的口中被提及过一次。当<a class="wiki-link" href="/entry/%E8%83%A1%E6%9E%97%C2%B7%E6%B2%99%E7%90%86%E5%AE%89/">胡林</a>的妻子要把<a class="wiki-link" href="/entry/%E8%83%A1%E6%9E%97%C2%B7%E6%B2%99%E7%90%86%E5%AE%89/">胡林</a>之子<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>送往遥远的<a class="wiki-link" href="/entry/%E5%A4%9A%E7%91%9E%E4%BA%9A%E6%96%AF/">多瑞亚斯王国</a>避难时，<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>对此提出了异议，而他的理由是：如此一来，能留在家宅中陪伴、保护母亲的就只有瞎眼的拉格尼尔、瘸腿的<a class="wiki-link" href="/entry/%E8%90%A8%E5%A4%9A/">萨多</a>和一些老妇了，这委实令他无法放心。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
