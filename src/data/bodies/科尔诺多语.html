<h1>科尔诺多语</h1>
<blockquote>
<p>本词条的叙述对象是<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>的前身。想要了解科尔诺多语和伊尔科林语融合而成的语言，请参看<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>；想要了解诺多族精灵在中洲使用的昆雅语，请参看<a class="wiki-link" href="/entry/%E6%B5%81%E4%BA%A1%E8%80%85%E6%98%86%E9%9B%85%E8%AF%AD/">流亡者昆雅语</a></p>
</blockquote>
<p><strong>科尔诺多语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Kornoldorin" target="_blank" rel="noopener noreferrer">Kornoldorin</a></strong>），是在<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>的<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A7%86%E6%97%8F/">诺姆族</a>使用的语言，是<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>的前身。这种语言在<a class="wiki-link" href="/entry/%E7%A7%91%E5%B0%94/">科尔</a>被部分<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>使用。</p>
