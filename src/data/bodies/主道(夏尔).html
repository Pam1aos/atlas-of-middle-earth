<h1>主道(夏尔)</h1>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E4%B8%BB%E9%81%93(%E6%B6%88%E6%AD%A7%E4%B9%89)/">消歧义页面</a>。</p>
<p><strong>主道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Causeway" target="_blank" rel="noopener noreferrer">Causeway</a></strong>）是<a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>的路，从<a class="wiki-link" href="/entry/%E6%9F%B3%E8%B0%B7%E9%95%87/">柳谷镇</a>北部经过<a class="wiki-link" href="/entry/%E7%81%AF%E8%8A%AF%E8%8D%89%E5%B2%9B/">灯芯草岛</a>和<a class="wiki-link" href="/entry/%E6%96%AF%E6%89%98%E5%85%8B/">斯托克</a>，最后止于<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup> 此道平行于<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>沿岸的<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>大道，在一侧修了条排水沟。<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>和<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>曾乘坐<a class="wiki-link" href="/entry/%E5%86%9C%E5%A4%AB%E9%A9%AC%E6%88%88%E7%89%B9/">马戈特</a>的马车，沿主道行驶约五哩路，从马戈特家抵达<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87%E6%B8%A1%E5%8F%A3/">雄鹿镇渡口</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
