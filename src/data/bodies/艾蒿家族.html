<h1>艾蒿家族</h1>
<p><strong>艾蒿家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mugwort_Family" target="_blank" rel="noopener noreferrer">Mugwort Family</a></strong>），是一个<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">布理霍比特人</a>家族。该家族的一位成员，<a class="wiki-link" href="/entry/%E8%89%BE%E8%92%BF%E5%85%88%E7%94%9F/">艾蒿先生</a>，生活在布理镇。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">布理霍比特人</a>喜欢以植物的名字作为姓氏。<strong>艾蒿</strong>（Mugwort）属艾系（Artemisia）植物。</p>
