<h1>河谷城领主</h1>
<p><strong>河谷城领主</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lord_of_Dale" target="_blank" rel="noopener noreferrer">Lord of Dale</a></strong>）是历代<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E5%9F%8E/">河谷城</a>统治者的世袭头衔。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2770年，恶龙<a class="wiki-link" href="/entry/%E6%96%AF%E6%AF%9B%E6%A0%BC/">斯毛格</a>摧毁了<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E5%9F%8E/">河谷城</a>，“河谷城领主”这一头衔此后就不复存在了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2944年，“神箭手”<a class="wiki-link" href="/entry/%E5%B7%B4%E5%BE%B7/">巴德</a>重建了<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E5%9F%8E/">河谷城</a>，并成为其统治者。但是，他没有重新采用“河谷城领主”的头衔，而是新设了“<a class="wiki-link" href="/entry/%E6%B2%B3%E8%B0%B7%E9%82%A6%E4%B9%8B%E7%8E%8B/">河谷邦之王</a>”这一头衔。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>末代河谷城领主<a class="wiki-link" href="/entry/%E5%90%89%E7%91%9E%E5%AE%89/">吉瑞安</a>，是有记载的唯一一位河谷城领主。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
