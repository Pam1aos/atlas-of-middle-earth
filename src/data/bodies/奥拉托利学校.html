<p><strong>奥拉托利学校</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Oratory_School" target="_blank" rel="noopener noreferrer">The Oratory School</a></strong>）是一座英国天主教寄宿制学校。<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>的三个儿子，<a class="wiki-link" href="/entry/%E7%BA%A6%E7%BF%B0%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">约翰</a>、<a class="wiki-link" href="/entry/%E8%BF%88%E5%85%8B%E5%B0%94%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">迈克尔</a>与<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>都曾在此读书。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E4%BC%A0/">托尔金传</a>，第四部 1925-1949年（上）：“在地底的洞府中住着一个霍比特人”，第一章 牛津一天。 <a class="fn-back" href="#fnref-1">↩</a></li><li id="fn-2"><a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E4%BC%A0/">托尔金传</a>，第五部 1925-1949年（下）：第三纪元，第二章 “新《霍比特人》”。 <a class="fn-back" href="#fnref-2">↩</a></li></ol></section>
