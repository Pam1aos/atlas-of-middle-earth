<p><strong>尼西姆阿勒达</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nísimaldar" target="_blank" rel="noopener noreferrer">Nísimaldar</a></strong>）是<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E6%B3%B7%E8%BF%AA/">埃尔达泷迪</a>港口附近的郊区，位于<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>的西海岸上。整个<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>岛上，从<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚</a>带来的<a class="wiki-link" href="/entry/%E7%91%81%E7%8F%91/">瑁珑</a>只在此处生长，而后世生长在<a class="wiki-link" href="/entry/%E6%B4%9B%E4%B8%9D%E7%BD%97%E7%91%9E%E6%81%A9/">洛丝罗瑞恩森林</a>的众多瑁珑树，其最初的树种也是来自这片树林：那是努门诺尔第六代国王<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">塔尔-阿勒达瑞安</a>赠给<a class="wiki-link" href="/entry/%E5%90%89%E5%B0%94-%E5%8A%A0%E6%8B%89%E5%BE%B7/">吉尔-加拉德</a>的礼物。很多其它罕见美丽的树木也在这里生长，它们都是埃尔达精灵赠予努门诺尔人的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>词源</h2>
<p>尼西姆阿勒达的意思是“芳香树”，因为各种各样珍稀而美丽的树木生长在这里。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
