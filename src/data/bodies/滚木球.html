<h1>滚木球</h1>
<p><strong>滚木球</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bowls" target="_blank" rel="noopener noreferrer">Bowls</a></strong>），又称为“草地滚木球”，是一种在平整草坪上进行的、以滚动木球为主要游戏方式的运动。玩家的目标是将球尽可能的滚近某一特定的位置。</p>
<p>在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>存在有滚木球这项运动。<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>从小就擅长投掷石块；而长大以后，他依然在像滚木球这种需要投掷和瞄准的运动上花费不少时间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
