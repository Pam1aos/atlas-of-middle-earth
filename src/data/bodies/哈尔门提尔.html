<h1>哈尔门提尔</h1>
<p><strong>哈尔门提尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hyarmentir" target="_blank" rel="noopener noreferrer">Hyarmentir</a></strong>），是维林诺以南地区最高的一座山，距离北方的<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%BC%E9%AD%81%E6%8F%90%E5%B0%94/">塔尼魁提尔</a>十分遥远。</p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>与<a class="wiki-link" href="/entry/%E4%B9%8C%E8%8B%9F%E7%AB%8B%E5%AE%89%E7%89%B9/">乌苟立安特</a>曾攀上其峰顶，而维拉并未在此处设下警戒。乌苟立安特伏在山顶，编了一条绳梯垂了下去，米尔寇顺着梯子爬到山顶，向下察看<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>。米尔寇跃下长长的西边山坡，乌苟立安特紧随其侧。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>哈尔门提尔在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中意为“南方守卫之处”，<em>Hyarmen</em> 意为“南方”，<em>tir</em> 意为“守望，守卫”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
