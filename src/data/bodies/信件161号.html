<p><strong>信件161号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_161" target="_blank" rel="noopener noreferrer">Letter 161</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E4%B9%94%E6%B2%BB%C2%B7%E8%89%BE%E4%BC%A6%E4%B8%8E%E6%98%82%E6%B8%A9%E5%87%BA%E7%89%88%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/">乔治·艾伦与昂温出版社</a>的 <a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1955年4月14日。托尔金依旧在为地图的事情焦急<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>这张地图简直是地狱，托尔金宣称，他没有注意到距离，大比例地图只是暴露了盔甲上所有的裂缝。他想，为了即将出版的作品，他可能不得不放弃它。</p>
