<h1>图克岸</h1>
<p><strong>图克岸</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tookbank" target="_blank" rel="noopener noreferrer">Tookbank</a></strong>）是夏尔<a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>的一座小村庄，它位于<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%AE%B6%E6%97%8F/">图克家族</a>的固有领地<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%9C%B0/">图克地</a>境内，其东边不远处就是<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%9C%B0/">图克地</a>最主要的城镇<a class="wiki-link" href="/entry/%E5%A1%94%E5%85%8B%E9%A2%86/">塔克领</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“图克岸”事实上是一个不很准确的中文翻译，因为从地图上看，这个村庄并不位于河流附近。这里的<code>bank</code>其实并不是指“河岸”，而是“斜坡”之意，因为所谓的“图克岸”处在一片丘陵的山脚下。</p>
