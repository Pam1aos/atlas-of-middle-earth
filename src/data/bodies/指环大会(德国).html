<h1>指环大会(德国)</h1>
<blockquote>
<p>本词条叙述的对象是在德国举办的Ring*Con。想要了解在美国举办的RingCon，请参看<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E5%A4%A7%E4%BC%9A(%E7%BE%8E%E5%9B%BD)/">指环大会(美国)</a>。</p>
</blockquote>
<p><strong>指环大会</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ring*Con" target="_blank" rel="noopener noreferrer">Ring*Con</a></strong>），是在德国举办的年度托尔金主题大会。在电影<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%8A%A4%E6%88%92%E4%BD%BF%E8%80%85/">《指环王：护戒使者》</a>票房大胜后，马塞尔·比勒斯和斯特凡·泽福斯决定组织一场魔戒粉丝大会。第一届指环大会在<a class="wiki-link" href="/entry/2002%E5%B9%B4/">2002年</a>11月22日-24日举行，共有约1500人参会。</p>
