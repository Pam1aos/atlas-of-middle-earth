<p><strong>加米尔·齐拉克</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/_Gamil_Zirak" target="_blank" rel="noopener noreferrer">Gamil Zirak</a></strong>），又称<strong>齐拉克</strong>、<strong>长者</strong>，是<a class="wiki-link" href="/entry/%E8%AF%BA%E6%A0%BC%E7%BD%97%E5%BE%B7/">诺格罗德</a>的矮人工匠。</p>
<h2>生平</h2>
<p>加米尔·齐拉克是矮人工匠<a class="wiki-link" href="/entry/%E9%93%81%E5%B0%94%E5%93%88/">铁尔哈</a>的师父，后者被认为是<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>历史上最伟大的工匠之一，打造了包括<a class="wiki-link" href="/entry/%E5%A4%9A%E5%B0%94%E7%BD%97%E6%98%8E%E7%9A%84%E9%BE%99%E7%9B%94/">龙盔</a>、<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E5%88%A9%E5%B0%94/">纳熙尔宝剑</a>在内的诸多杰作。加米尔·齐拉克自身也是一位著名的工匠，<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛王</a>位于<a class="wiki-link" href="/entry/%E6%98%8E%E9%9C%93%E5%9B%BD%E6%96%AF/">明霓国斯</a>地下的武器库中，堆满了各式铠甲和武器，除去由<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>制作的那些以外，剩余的装备全部是加米尔和徒弟铁尔哈铸造的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字释义</h2>
<p>加米尔（Gamil）在<a class="wiki-link" href="/entry/%E5%BA%93%E5%85%B9%E9%83%BD%E8%AF%AD/">库兹都语</a>中意为“年长的”，齐拉克（Zirak）意为“尖刺”或“白银”。</p>
