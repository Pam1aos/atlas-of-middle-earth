<h1>奈芙拉斯特沼泽</h1>
<p><strong>奈芙拉斯特沼泽</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Marshes_of_Nevrast" target="_blank" rel="noopener noreferrer">Marshes of Nevrast</a></strong>），是<a class="wiki-link" href="/entry/%E5%A5%88%E8%8A%99%E6%8B%89%E6%96%AF%E7%89%B9/">奈芙拉斯特</a>地区中央的大湖<a class="wiki-link" href="/entry/%E5%88%A9%E8%80%90%E6%B8%A9%E6%B9%96/">利耐温湖</a>周围的宽广沼泽，密布芦苇和水塘，有许多鸟儿栖居。因为利耐温湖被沼泽包围，所以它没有明确的湖岸。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
