<p><strong>墨瑞亚群山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mountains_of_Moria" target="_blank" rel="noopener noreferrer">Mountains of Moria</a></strong>），是指<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>的三座连峰<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E8%BF%AA%E5%B0%94/">凯勒布迪尔</a>、<a class="wiki-link" href="/entry/%E5%8D%A1%E6%8B%89%E5%85%B9%E6%8B%89%E6%96%AF/">卡拉兹拉斯</a>和<a class="wiki-link" href="/entry/%E6%B3%95%E5%8A%AA%E4%BC%8A%E7%B4%A2%E5%B0%94/">法努伊索尔</a>，矮人城邦<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">卡扎督姆</a>（<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>）就挖凿在三座大山底部。卡扎督姆的主体部分位于<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E8%BF%AA%E5%B0%94/">凯勒布迪尔</a>山下，凯勒布兰迪尔山巅建有<a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E4%B9%8B%E5%A1%94/">都林之塔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
