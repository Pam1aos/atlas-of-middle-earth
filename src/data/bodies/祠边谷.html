<h1>祠边谷</h1>
<p><strong>祠边谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Harrowdale" target="_blank" rel="noopener noreferrer">Harrowdale</a></strong>），是指<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>之中一座呈南北走向的山谷。它的南端被崇山峻岭阻隔，那里耸立着雄伟的<a class="wiki-link" href="/entry/%E5%B0%96%E5%88%BA%E5%B1%B1/">尖刺山</a>，以及山脚下古老的<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E7%A5%A0/">黑蛮祠</a>要塞；北端则是山谷的谷口，发源于白色山脉中的<a class="wiki-link" href="/entry/%E9%9B%AA%E6%B2%B3/">雪河</a>正是从祠边谷的北面谷口泄入平原。洛汗王国的国都<a class="wiki-link" href="/entry/%E5%9F%83%E5%A4%9A%E6%8B%89%E6%96%AF/">埃多拉斯</a>就坐落在距离祠边谷谷口不远的地方，两地能够遥相眺望。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，祠边谷的百姓由<a class="wiki-link" href="/entry/%E6%95%A6%E8%B5%AB%E9%9B%B7/">敦赫雷</a>领主统治。在大战中，这座山谷曾作为洛汗王国全军集结的营地，整整六千名骑兵在希奥顿王的号令下云集祠边谷，为支援刚铎王国作最后的准备。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
