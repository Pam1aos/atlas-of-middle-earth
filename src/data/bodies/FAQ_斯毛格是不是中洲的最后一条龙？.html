<h1>FAQ/斯毛格是不是中洲的最后一条龙？</h1>
<p><a class="wiki-link" href="/entry/%E6%96%AF%E6%AF%9B%E6%A0%BC/">斯毛格</a>不是中洲的最后一条<a class="wiki-link" href="/entry/%E6%81%B6%E9%BE%99/">恶龙</a>，尽管它确实是<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>中出现的最后一条龙。<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>世界就是古代地球，而恶龙直到中世纪依然是传说中的常客，这证明恶龙并未灭绝。<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>明确指出斯毛格并非最后一条龙：</p>
<blockquote>
<p>它们（恶龙）并没有灭绝；因为它们许久以后——在离我们的时代不远的过去——仍很活跃。 我是否说过什么让你以为恶龙已经灭绝的话？如果有，我会作出修正。我能想到的、具有这种含义的段落，只有第一卷中的一处：“拥有足够炽热的古老烈火的恶龙，现在世界上一只也不剩了。”不过我想这句话是说，恶龙依然是存在的，只是力量已经不复以往。</p>
<p>—— 信件144号</p>
</blockquote>
