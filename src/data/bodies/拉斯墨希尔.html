<h1>拉斯墨希尔</h1>
<p><strong>拉斯墨希尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ras_Morthil" target="_blank" rel="noopener noreferrer">Ras Morthil</a></strong>），是<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>西端向南侧伸出的支脉的最后一座山峰，而这条支脉坐落在<a class="wiki-link" href="/entry/%E5%AE%89%E5%BE%B7%E6%8B%89%E6%96%AF%E7%89%B9/">安德拉斯特海岬</a>上。包括拉斯墨希尔在内的安德拉斯特群山曾经是<a class="wiki-link" href="/entry/%E5%BE%B7%E9%B2%81%E4%BC%8A%E7%94%B8%E4%BA%BA/">德鲁伊甸人</a>部落的居住地；直到第三纪元末期，<a class="wiki-link" href="/entry/%E5%AE%89%E6%B3%95%E6%8B%89%E6%96%AF/">安法拉斯</a>一带的人类仍然相信有些德鲁伊甸人还秘密生活在此地的山洞里。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“拉斯墨希尔”是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，意为“黑色的角峰”。</p>
