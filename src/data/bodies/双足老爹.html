<p><strong>双足老爹</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Daddy_Twofoot" target="_blank" rel="noopener noreferrer">Daddy Twofoot</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，<a class="wiki-link" href="/entry/%E6%B1%89%E5%A7%86%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">汉姆法斯特</a>的邻居。</p>
<h2>生平</h2>
<p>双足老爹住在<a class="wiki-link" href="/entry/%E8%A2%8B%E4%B8%8B%E8%B7%AF/">袋下路</a>2号，是<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>一家的邻居。<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E7%BA%AA%E5%B9%B4/">夏尔历</a>1401年（<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3001年）9月的一天傍晚，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>的111岁生日前夕，双足老爹和老头儿汉姆法斯特、<a class="wiki-link" href="/entry/%E7%A3%A8%E5%9D%8A%E4%B8%BB%E5%B1%B1%E8%BF%AA%E6%9B%BC/">磨坊主山迪曼</a>及<a class="wiki-link" href="/entry/%E8%80%81%E8%AF%BA%E5%85%8B%E6%96%AF/">老诺克斯</a>在<a class="wiki-link" href="/entry/%E9%95%BF%E6%98%A5%E8%97%A4/">长春藤</a>酒馆喝酒闲谈。他们在谈论<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>去世的父母。双足老爹说<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>对岸的人家都很古怪，因为他们就住在古怪的<a class="wiki-link" href="/entry/%E8%80%81%E6%9E%97%E5%AD%90/">老林子</a>边上。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
