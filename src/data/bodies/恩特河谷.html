<h1>恩特河谷</h1>
<p><strong>恩特河谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Entwash_Vale" target="_blank" rel="noopener noreferrer">Entwash Vale</a></strong>），是<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E6%B2%B3/">恩特河</a>在下游形成的河谷地区。恩特河谷地势平坦，沼泽密布，常有迷雾笼罩。<a class="wiki-link" href="/entry/%E6%B3%A2%E6%B4%9B%E7%B1%B3%E5%B0%94/">波洛米尔</a>曾提议护戒远征队从恩特河谷前往<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>，但被<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>否决。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
