<h1>西瑞安沼泽</h1>
<p><strong>西瑞安沼泽</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fens_of_Sirion" target="_blank" rel="noopener noreferrer">Fens of Sirion</a></strong>），是指<a class="wiki-link" href="/entry/%E8%89%BE%E6%9E%97%E5%BE%AE%E5%A5%A5/">艾林微奥</a>周围的沼泽地区，它位于<a class="wiki-link" href="/entry/%E5%A4%9A%E7%91%9E%E4%BA%9A%E6%96%AF/">多瑞亚斯</a>的西南边境，南面紧邻<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E7%80%91%E5%B8%83/">西瑞安瀑布</a>。在<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E6%B2%B3/">西瑞安河</a>与<a class="wiki-link" href="/entry/%E9%98%BF%E6%B4%9B%E6%96%AF%E6%B2%B3/">阿洛斯河</a>的汇流处，因为地势平缓、水流蓄积，所以形成了大片水塘和沼泽区域，即艾林微奥池塘和西瑞安沼泽。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>465年，在接受了<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛</a>提出的夺回<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">精灵宝钻</a>的任务后，<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>离开多瑞亚斯，他在前往<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>、寻求<a class="wiki-link" href="/entry/%E8%8A%AC%E7%BD%97%E5%BE%B7/">芬罗德</a>帮助的途中经过西瑞安沼泽。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
