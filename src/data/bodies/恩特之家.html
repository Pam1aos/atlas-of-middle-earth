<h1>恩特之家</h1>
<p><strong>恩特之家</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ent-houses" target="_blank" rel="noopener noreferrer">Ent-houses</a></strong>），即<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>的家园，其性质似乎与恩特的种类一样多样：一些大而复杂，另一些则相对简陋。但是，所有的恩特之家都有水经过，恩特们会利用河水酿制<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E9%A5%AE%E6%96%99/">恩特饮料</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E6%A0%91%E9%A1%BB/">树须</a>在<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>中拥有多处恩特之家，一处是位于<a class="wiki-link" href="/entry/%E7%BE%8E%E5%A1%9E%E5%BE%B7%E6%8B%89%E6%96%AF/">美塞德拉斯</a>山脚的<a class="wiki-link" href="/entry/%E6%B6%8C%E6%B3%89%E5%8E%85/">涌泉厅</a>，那里有绿树成荫的庭院、泉水倾落形成的雨帘、巨大的石桌和床，床上铺着厚厚的干草和蕨叶。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E6%80%A5%E6%A5%B8/">急楸</a>的恩特之家是一块青苔点点的岩石，坐落在青翠的坡岸底下的草皮上。岩石周围长了一圈花楸树，并有一汪泉水从坡岸上汩汩涌流下来。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
