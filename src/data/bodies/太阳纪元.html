<p><strong>太阳纪元</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Years_of_the_Sun" target="_blank" rel="noopener noreferrer">Years of the Sun</a></strong>）位于<a class="wiki-link" href="/entry/%E5%8F%8C%E6%A0%91%E7%BA%AA%E5%85%83/">双树纪元</a>之后，指的是<a class="wiki-link" href="/entry/%E5%A4%AA%E9%98%B3/">太阳</a>升起之后直至今日的这段时期，包括<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>、<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>、<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>、<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>等。</p>
