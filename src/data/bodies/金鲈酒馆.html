<p><strong>金鲈酒馆</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Golden_Perch" target="_blank" rel="noopener noreferrer">The Golden Perch</a></strong>）位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>东区的<a class="wiki-link" href="/entry/%E6%96%AF%E6%89%98%E5%85%8B/">斯托克</a>。<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>认为这里的啤酒是全东区最好的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年9月24日，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>打算抄近路直穿过<a class="wiki-link" href="/entry/%E7%BB%BF%E4%B8%98%E4%B9%A1%E9%87%8E/">绿丘乡野</a>、直奔<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87%E6%B8%A1%E5%8F%A3/">雄鹿镇渡口</a>。这样，他们将不会经过<a class="wiki-link" href="/entry/%E6%96%AF%E6%89%98%E5%85%8B/">斯托克</a>。<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>不太满意这个安排，他说：</p>
<blockquote>
<p>我本来还盼着在日落前经过斯托克那家<strong>金鲈酒馆</strong>呢，那儿有东区最好的啤酒，至少过去有——我已经很久没去那儿喝一杯了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
</blockquote>
<p>对此，弗罗多调侃道：</p>
<blockquote>
<p>欲速则不达，欲醉就更别想达了！我们得不惜一切代价让你远离<strong>金鲈酒馆</strong>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
</blockquote>
