<h1>挑沙家族</h1>
<p><strong>挑沙家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sandheaver_Family" target="_blank" rel="noopener noreferrer">Sandheaver Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">布理霍比特人</a>家族。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称与词源</h2>
<p>挑沙（Sandheaver）一词由<code>sand</code>（“沙子”）与<code>heave</code>（“拉拽”“挑起”）组成，字面含义是“挑运沙石的人”。这或许意味着家族成员从事着挖掘<a class="wiki-link" href="/entry/%E6%96%AF%E5%AF%86%E5%A5%A5/">斯密奥</a>的工作。</p>
