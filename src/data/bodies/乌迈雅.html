<h1>乌迈雅</h1>
<p><strong>乌迈雅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Úmaiar" target="_blank" rel="noopener noreferrer">Úmaiar</a></strong>），即堕落迈雅。他们或被<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>曾经的伟大与荣光吸引而效忠于他，跟随他一起堕落，或是听从其谎言，接受其不怀好意的赠礼而遭腐化。乌迈雅中最强大的是<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>乌迈雅（Úmaiar）是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>单词，由否定前缀<code>ú-</code>和<em>maia</em>（迈雅）的复数<em>maiar</em> 构成。</p>
