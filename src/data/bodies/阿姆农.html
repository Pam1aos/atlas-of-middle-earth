<h1>阿姆农</h1>
<blockquote>
<p><strong>这个词条描述的对象仅出现于《失落的传说》，即<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>的原始版本。</strong> 慎将该作设定套用至其他作品，它们可能产生矛盾。</p>
</blockquote>
<p><strong>阿姆农</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Amnon" target="_blank" rel="noopener noreferrer">Amnon</a></strong>），为一古代先知，曾做出预言∶“<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的陷落何其惨烈。”至于阿姆农是何许人也，我们似乎不得而知。</p>
