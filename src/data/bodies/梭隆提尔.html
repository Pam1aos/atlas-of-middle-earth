<h1>梭隆提尔</h1>
<p><strong>梭隆提尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sorontil" target="_blank" rel="noopener noreferrer">Sorontil</a></strong>）是一座位于<a class="wiki-link" href="/entry/%E4%BD%9B%E6%B4%9B%E6%96%AF%E5%A1%94/">佛洛斯塔</a>北部靠近北岬的高峰，是很多鹰居住的地方。<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E7%BE%8E%E5%B0%BC%E5%B0%94%E9%83%BD%E5%B0%94/">塔尔-美尼尔都尔</a>曾在此地修建了一座用来观星的高塔。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称与释义</h2>
<p>梭隆提尔在昆雅语中意为“鹰角”，<em>soron</em>意为“鹰”，<em>til</em>意为“尖端，角”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
