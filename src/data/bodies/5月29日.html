<li>1930年－J·R·R·托尔金在《牛津杂志》上发表论文《牛津英语学派》。</li>
<li>1945年－J·R·R·托尔金写下一封信（信件100号）。</li>
<li>1973年－J·R·R·托尔金写下一封信（信件351号）。</li>
<li>1980年：<ul>
<li>《诗歌与故事》（Poems and Stories）出版。</li>
<li>演员亚当·布朗（Adam Brown）出生，他在《霍比特人》三部曲中饰演欧瑞。</li>
</ul>
</li>
<li>1981年－卡伦·温·方斯塔德著所著的《中洲地图志》出版。</li>
<li>2002年－邮件列表拉姆贝英葛墨上线。</li>
</ul>
