<p><strong>伊希尔晶石</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ithil-stone" target="_blank" rel="noopener noreferrer">Ithil-stone</a></strong>）放置于<a class="wiki-link" href="/entry/%E4%BC%8A%E7%86%99%E5%B0%94%E6%9D%9C/">伊熙尔杜</a>的古老堡垒<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E9%AD%94%E5%8F%A4%E5%B0%94/">米那斯伊希尔</a>，就在这座城市建立后不久。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2002年，<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E9%AD%94%E5%8F%A4%E5%B0%94/">米那斯伊希尔</a>陷落，这颗晶石被<a class="wiki-link" href="/entry/%E9%82%A3%E5%85%B9%E5%8F%A4%E5%B0%94/">那兹古尔</a>夺走。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>利用这颗晶石来诱使<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>和<a class="wiki-link" href="/entry/%E5%BE%B7%E5%86%85%E6%A2%AD%E5%B0%94%E4%BA%8C%E4%B8%96/">德内梭尔二世</a>进入他的圈套，受其迷惑。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>这颗晶石极有可能在<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E7%9D%A3%E5%B0%94/">巴拉督尔</a>倒塌时一并被毁坏了。</p>
