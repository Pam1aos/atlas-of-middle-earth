<p><strong>埃伦弥瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elemmírë" target="_blank" rel="noopener noreferrer">Elemmírë</a></strong>），是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名词，意为“珠宝星辰”。它可以指代以下两个对象：</p>
<ul>
<li>埃伦弥瑞(凡雅精灵)，是挽歌《阿勒都迪尼依》的作者。</li>
<li>埃伦弥瑞(星辰)，是瓦尔妲创造的一颗星辰。</li>
</ul>
