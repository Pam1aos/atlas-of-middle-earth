<h1>神话之地学院</h1>
<p><strong>神话之地学院</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mythgard_Institute" target="_blank" rel="noopener noreferrer">Mythgard Institute</a></strong>），是<a class="wiki-link" href="/entry/%E5%B8%8C%E6%A0%BC%E7%BA%B3%E5%A7%86%E5%A4%A7%E5%AD%A6/">希格纳姆大学</a>下属学院，提供托尔金研究和其他奇幻文学的在线课程。学院每年会举行<a class="wiki-link" href="/entry/%E7%A5%9E%E8%AF%9D%E5%A4%A7%E4%BC%9A(%E7%A5%9E%E8%AF%9D%E4%B9%8B%E5%9C%B0%E5%AD%A6%E9%99%A2)/">神话大会</a>，时间选在每年6月父亲节后的星期四至星期日。</p>
