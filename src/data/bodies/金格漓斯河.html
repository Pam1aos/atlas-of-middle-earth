<h1>金格漓斯河</h1>
<p><strong>金格漓斯河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ginglith" target="_blank" rel="noopener noreferrer">Ginglith</a></strong>），是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的一条河流，为<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>支流。</p>
<p>金格漓斯河发源于<a class="wiki-link" href="/entry/%E5%8A%AA%E9%98%BF%E6%96%AF%E6%A3%AE%E6%9E%97/">努阿斯森林</a>，后者广阔分布在<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%BE%B7%E5%A8%81%E6%96%AF%E6%9E%97/">埃瑞德威斯林</a>山脉西段支脉的南麓。河流自北向南穿过<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A7%86%E5%93%88%E6%8B%89%E5%BE%B7/">图姆哈拉德</a>平原，最后在<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>北面不远处汇入<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
