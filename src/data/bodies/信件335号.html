<p><strong>信件335号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_335" target="_blank" rel="noopener noreferrer">Letter 335</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给迈克尔·萨尔蒙的一封信，写信日期为1972年5月18日。托尔金感谢读者的来信<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>读者Michael·Salmon写了一封友好的信，表示对托尔金的作品感兴趣，显然还问了一些问题。托尔金告诉他，如果他想完成《精灵宝钻》，他就不会有时间回复粉丝的来信。</p>
