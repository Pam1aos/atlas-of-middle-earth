<p>阿贝尔·皮特（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Abel_Pitt" target="_blank" rel="noopener noreferrer">Abel Pitt</a></strong>），生于1928年。曾是三一学院的牧师；现在是<a class="ext-link" href="https://en.wikipedia.org/wiki/Bishop_of_Buckingham" target="_blank" rel="noopener noreferrer">白金汉宫的主教</a>。学者，偶尔作诗。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
