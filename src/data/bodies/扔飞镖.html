<h1>扔飞镖</h1>
<p><strong>扔飞镖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dart-throwing" target="_blank" rel="noopener noreferrer">Dart-throwing</a></strong>）是一种以投掷飞镖为主要方式的游戏。玩家需要向靶子抛出飞镖，他们所投中的环数将决定他们所获得的分数。</p>
<p>在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>存在有扔飞镖这种游戏，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>对此就颇为热衷，在上面花费了不少时间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
