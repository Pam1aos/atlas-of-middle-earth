<p>Matěj Čadil</p>
<p><strong>针眼镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Needlehole" target="_blank" rel="noopener noreferrer">Needlehole</a></strong>）是位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>靠近<a class="wiki-link" href="/entry/%E5%8C%97%E5%8C%BA/">北区</a>边界的城镇。<a class="wiki-link" href="/entry/%E5%B0%8F%E6%B2%B3/">小河</a>途经此地向南流到<a class="wiki-link" href="/entry/%E7%81%AF%E8%8A%AF%E8%8D%89%E6%B3%BD/">灯芯草泽</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
