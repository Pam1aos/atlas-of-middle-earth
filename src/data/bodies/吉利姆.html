<h1>吉利姆</h1>
<p><strong>吉利姆</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gilim" target="_blank" rel="noopener noreferrer">Gilim</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E6%9B%BC/">埃如曼</a>的<a class="wiki-link" href="/entry/%E5%B7%A8%E4%BA%BA/">巨人</a>，<a class="wiki-link" href="/entry/%E9%9C%B2%E8%A5%BF%E6%81%A9/">露西恩</a>对自己的秀发咏唱“增长魔咒”时提到了这个名称。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><em><strong>Gilim</strong></em> 在<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A7%86%E6%97%8F%E8%AF%AD/">诺姆族语</a>中意为“冬天”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
