<h1>边界守卫(夏尔)</h1>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E8%BE%B9%E7%95%8C%E5%AE%88%E5%8D%AB(%E6%B6%88%E6%AD%A7%E4%B9%89)/">消歧义页面</a>。</p>
<p><strong>边界守卫</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bounders" target="_blank" rel="noopener noreferrer">Bounders</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>边境的护卫人员，也负责确保任何外地人（不论<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">大人族</a>或者<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>）不惹麻烦。边界守卫属于夏尔的两类<a class="wiki-link" href="/entry/%E6%B2%BB%E5%AE%89%E8%AD%A6%E5%A4%87/">治安警备</a>人员之一，另一类是<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6/">夏警</a>。全夏尔只有十二名夏警，而边界守卫的人数更多，具体数量视需求增减。边界守卫和夏警的最高领导是<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6%E9%95%BF%E5%AE%98/">夏警长官</a>，由<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87%E5%B8%82%E9%95%BF/">大洞镇市长</a>兼任。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>末期，夏尔边界守卫的人数大大增加，因为有许多报告表明，陌生的人员和生物在夏尔边界潜行，或是越过边界。这意味着魔影愈发深重，夏尔的宁静生活将被打破。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
