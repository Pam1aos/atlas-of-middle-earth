<h1>老谷仓</h1>
<p><strong>老谷仓</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Grange" target="_blank" rel="noopener noreferrer">Old Grange</a></strong>），位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>，在从小桥通往霍比特丘的道路的西侧。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>后，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>和<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>从科顿家带二十个强壮的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>去对付<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">沙基</a>，过了跨<a class="wiki-link" href="/entry/%E5%B0%8F%E6%B2%B3/">小河</a>的桥，看到被拆的老谷仓，取而代之是一排涂了焦油的窝棚。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
