<p><strong>杰夫·默里</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Jef_Murray" target="_blank" rel="noopener noreferrer">Jef Murray</a></strong>），是一位美国奇幻作家和艺术家，曾绘制多幅<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>和<a class="wiki-link" href="/entry/C%C2%B7S%C2%B7%E5%88%98%E6%98%93%E6%96%AF/">C·S·刘易斯</a>作品相关画作。他为<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E6%B1%89(%E6%9C%9F%E5%88%8A)/">《阿蒙汉》</a>绘制过封面，也为<a class="wiki-link" href="/entry/%E7%91%81%E7%8F%91(%E6%9C%9F%E5%88%8A)/">《瑁珑》</a>、<a class="wiki-link" href="/entry/%E5%AD%A6%E8%AF%86%E4%B9%8B%E4%B9%A6/">《学识之书》</a>等期刊绘制插图。2006年，他与<a class="wiki-link" href="/entry/%E6%B3%B0%E5%BE%B7%C2%B7%E7%BA%B3%E5%8F%B2%E5%AF%86%E6%96%AF/">泰德·纳史密斯</a>一起成为多伦多同盟聚会（The Gathering of the Fellowship）的荣誉艺术嘉宾。2009年，他为<a class="wiki-link" href="/entry/%E5%B8%8C%E6%8B%89%E9%87%8C%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">希拉里·托尔金</a>的小说<a class="wiki-link" href="/entry/%E9%BB%91%E7%99%BD%E9%A3%9F%E4%BA%BA%E9%AD%94%E4%B9%8B%E5%9B%BD/">《黑白食人魔的国家》</a>绘制插图。</p>
