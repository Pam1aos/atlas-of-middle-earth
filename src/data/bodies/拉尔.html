<h1>拉尔</h1>
<p><strong>拉尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lár" target="_blank" rel="noopener noreferrer">Lár</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>长度单位制中的距离度量单位之一。“拉尔”是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“停顿”，因为只要不是在强行军，<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>的军队每走完一拉尔的距离，都会短暂停顿。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>在<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的作品中，“拉尔”一般被转换为现代的度量单位“里格”。但这种转换只是近似的：因为一里格等于4828米，而一拉尔等于4825米；或者，按照<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>的长度单位制，一拉尔等于5000<a class="wiki-link" href="/entry/%E5%85%B0%E5%8A%A0/">兰加</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
