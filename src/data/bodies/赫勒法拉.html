<p><strong>赫勒法拉</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Herefara" target="_blank" rel="noopener noreferrer">Herefara</a></strong>）是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期的一位洛希尔人。</p>
<h2>生平</h2>
<p>赫勒法拉是一位洛希尔人骑兵。他随同<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿王</a>援助<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>，战死于佩兰诺平野大战之中。他的名称在《<a class="wiki-link" href="/entry/%E8%92%99%E5%BE%B7%E5%A0%A1%E5%A2%93%E5%86%A2%E4%B9%8B%E6%AD%8C/">蒙德堡墓冢之歌</a>》中久久传颂。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p><em>Herefara</em> 在古英语中大致意为“战斗旅人”。</p>
