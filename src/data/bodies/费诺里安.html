<p><strong>费诺里安</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fëanorian_(disambiguation" target="_blank" rel="noopener noreferrer">Fëanorian</a>)</strong>）可以指以下几种事物：</p>
<ul>
<li>费艾诺家族，成员包括费艾诺本人，他的七个儿子，以及他们所有的追随者。</li>
<li>费艾诺字母，也被称为腾格瓦字母。</li>
<li>费艾诺方言，东贝烈瑞安德的诺多族所使用的一种方言。</li>
<li>费艾诺之灯，一种罕见的诺多族宝物。</li>
</ul>
