<p><strong>灰响水</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Greylin" target="_blank" rel="noopener noreferrer">Greylin</a></strong>）位于<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>北方，是一条发源于<a class="wiki-link" href="/entry/%E7%81%B0%E8%89%B2%E5%B1%B1%E8%84%89/">灰色山脉</a>西部的河流。它向西南方向奔流，最后与<a class="wiki-link" href="/entry/%E9%95%BF%E5%B7%9D%E6%BA%90/">长川源</a>汇合。这两条河流的汇流处，就是大河<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>的源头。</p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E5%B8%8C%E5%A5%A5%E5%BE%B7%E4%BA%BA/">伊奥希奥德人</a>唯一的城堡，<a class="wiki-link" href="/entry/%E5%BC%97%E6%8B%89%E5%A7%86%E6%96%AF%E5%A0%A1/">弗拉姆斯堡</a>，就建在灰响水和<a class="wiki-link" href="/entry/%E9%95%BF%E5%B7%9D%E6%BA%90/">长川源</a>两河之间。</p>
<h2>名称释义</h2>
<p>该名称的第二个元素<code>-lin</code>无疑来自古英语中的<code>hlynn</code>（“激流”），其字面意义则是“喧闹的”。</p>
