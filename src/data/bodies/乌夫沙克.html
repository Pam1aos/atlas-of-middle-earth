<p><strong>乌夫沙克</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ufthak" target="_blank" rel="noopener noreferrer">Ufthak</a></strong>）是一名<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>。</p>
<h2>生平</h2>
<p>乌夫沙克曾不幸被大蜘蛛<a class="wiki-link" href="/entry/%E5%B8%8C%E6%B4%9B%E5%B8%83/">希洛布</a>捕获，希洛布用蛛网将其捆绑、留待享用。数天后，<a class="wiki-link" href="/entry/%E6%B2%99%E6%A0%BC%E6%8B%89%E7%89%B9/">沙格拉特</a>的小队在希洛布巢穴的角落里找到了被挂起来的乌夫沙克。乌夫沙克还活着、神志清醒，但他的同伴们并没有搭救他，因为他们觉得不应该打搅希洛布享用猎物。乌夫沙克此后的命运并无记载，不过他应该最终葬身蛛口。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
