<p><strong>灯匠街</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lampwrights'_Street" target="_blank" rel="noopener noreferrer">Lampwrights&#39; Street</a></strong>），在辛达语中又称<strong>拉斯凯勒尔丹</strong>，位于<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>的第一环城内，是一条通往主城门的宽阔街道。街道上有一栋叫作<a class="wiki-link" href="/entry/%E8%80%81%E5%AE%BE%E9%A6%86/">老宾馆</a>的客栈。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月9日，<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>来到灯匠街上的<a class="wiki-link" href="/entry/%E8%80%81%E5%AE%BE%E9%A6%86/">老宾馆</a>，寻找<a class="wiki-link" href="/entry/%E8%B4%9D%E7%91%9E%E5%88%9A%E5%BE%B7/">贝瑞刚德</a>之子<a class="wiki-link" href="/entry/%E8%B4%9D%E5%B0%94%E5%90%89%E5%B0%94/">贝尔吉尔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p><strong>拉斯凯勒尔丹</strong>（Rath Celerdain）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名字，意为“制灯匠人的街道”。</p>
