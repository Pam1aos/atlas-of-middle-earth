<p><strong>拉得布格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Radbug" target="_blank" rel="noopener noreferrer">Radbug</a></strong>）是一位<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>。</p>
<h2>生平</h2>
<p>拉得布格是<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F/">奇立斯乌苟</a>塔楼长官<a class="wiki-link" href="/entry/%E6%B2%99%E6%A0%BC%E6%8B%89%E7%89%B9/">沙格拉特</a>的下属。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月14日，奇立斯乌苟塔楼的奥克和和<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E9%AD%94%E5%8F%A4%E5%B0%94/">米那斯魔古尔</a>的奥克发生了内讧，拉得布格也参与其中。在战斗中，因为拉得布格轻视上级<a class="wiki-link" href="/entry/%E6%B2%99%E6%A0%BC%E6%8B%89%E7%89%B9/">沙格拉特</a>的命令，沙格拉特把他的眼睛挖了出来、杀了他<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
