<p>贝伦</p>
<p>Jack Dullahan</p>
<p><strong>屠夫戈格尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gorgol" target="_blank" rel="noopener noreferrer">Gorgol the Butcher</a></strong>），是一个<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>。关于他的生平没有记载，仅知道他可能是<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>的手下，搜捕<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>时反被贝伦所杀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
