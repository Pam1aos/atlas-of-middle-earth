<h1>晨礼</h1>
<p><strong>晨礼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Morning-gift" target="_blank" rel="noopener noreferrer">Morning-gift</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>中洲传说中出现在<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>婚姻制度中的一种习俗，由丈夫在婚后早晨赠予新娘的礼物。</p>
<p>在《<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E4%BA%89%E5%A4%BA%E6%88%98-%E7%AC%AC%E4%B8%80%E8%BE%91/">灰精灵编年史</a>》中，托尔金使用了&quot;morrowgift&quot;一词，这是&quot;morning gift&quot;在古语语境中的变体。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>晨礼是古日耳曼婚姻习俗中丈夫赠予新娘的晨间礼物，托尔金将其融入精灵的婚姻制度中。</p>
