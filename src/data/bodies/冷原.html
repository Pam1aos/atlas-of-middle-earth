<h1>冷原</h1>
<p><strong>冷原</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Coldfells" target="_blank" rel="noopener noreferrer">Coldfells</a></strong>），是位于<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>以北的一片荒原地区。冷原的具体位置从未在任何地图和文稿中指明，也许它只是<a class="wiki-link" href="/entry/%E5%9F%83%E6%BB%95%E8%8D%92%E5%8E%9F/">埃滕荒原</a>的另一个名字。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2930年，第十四代杜内丹人族长<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E5%A4%9A/">阿拉多</a>在冷原被<a class="wiki-link" href="/entry/%E5%B1%B1%E5%8C%BA%E9%A3%9F%E4%BA%BA%E5%A6%96/">山区食人妖</a>俘虏并杀害了，他的儿子<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E6%9D%BE%E4%BA%8C%E4%B8%96/">阿拉松二世</a>随后即位成为杜内丹人族长；一年后，阿拉松与妻子<a class="wiki-link" href="/entry/%E5%90%89%E5%B0%94%E8%95%BE%E6%81%A9/">吉尔蕾恩</a>生下了未来的<a class="wiki-link" href="/entry/%E9%87%8D%E8%81%94%E7%8E%8B%E5%9B%BD/">刚铎与阿尔诺联合王国</a>国王——<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡二世</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
