<h1>钢之门</h1>
<p><strong>钢之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Steel" target="_blank" rel="noopener noreferrer">Gate of Steel</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第七道也是最后一道大门，扼守着<a class="wiki-link" href="/entry/%E6%AC%A7%E5%B0%94%E6%B3%95%E8%B5%AB%C2%B7%E5%9F%83%E9%9C%8D%E5%B0%94/">欧尔法赫·埃霍尔</a>的宽阔入口。这道大门由<a class="wiki-link" href="/entry/%E8%BF%88%E6%A0%BC%E6%9E%97/">迈格林</a>在<a class="wiki-link" href="/entry/%E6%B3%AA%E9%9B%A8%E4%B9%8B%E6%88%98/">泪雨之战</a>后建造。</p>
<p>钢之门没有护墙，两侧各有一座极高的圆塔。两塔之间是一道永不锈蚀的雄伟钢栅，钢栅有七根巨大的钢柱，柱尖锐利如尖刺。每道钢柱之间有七根横向的钢棒，每处间隙中又竖立着七七四十九根钢杆，尖头就像长矛的阔刃。正中最大的钢柱顶上有一座遍镶钻石的巨像——<a class="wiki-link" href="/entry/%E5%9B%BE%E5%B0%94%E5%B7%A9/">图尔巩</a>王的头盔。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
