<p><strong>奇林克</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Kirinki" target="_blank" rel="noopener noreferrer">Kirinki</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔岛</a>众多鸟类中的一种，<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>可能没有这种鸟栖息。奇林克的体型不超过鹪鹩，通身羽毛猩红，叫声极为尖锐，以至于<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">人类</a>的耳力几乎无法听见。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
