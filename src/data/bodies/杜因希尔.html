<p><strong>杜因希尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Duinhir" target="_blank" rel="noopener noreferrer">Duinhir</a></strong>）是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期的<a class="wiki-link" href="/entry/%E9%BB%91%E6%BA%90%E6%B2%B3%E5%B1%B1%E8%B0%B7/">黑源河山谷</a>领主。他有两个儿子：<a class="wiki-link" href="/entry/%E6%9D%9C%E4%BC%8A%E6%9E%97(%E6%9D%9C%E5%9B%A0%E5%B8%8C%E5%B0%94%E4%B9%8B%E5%AD%90)/">杜伊林</a>和<a class="wiki-link" href="/entry/%E5%BE%B7%E8%8C%B9%E8%8A%AC/">德茹芬</a>。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月9日，杜因希尔带着儿子<a class="wiki-link" href="/entry/%E6%9D%9C%E4%BC%8A%E6%9E%97(%E6%9D%9C%E5%9B%A0%E5%B8%8C%E5%B0%94%E4%B9%8B%E5%AD%90)/">杜伊林</a>和<a class="wiki-link" href="/entry/%E5%BE%B7%E8%8C%B9%E8%8A%AC/">德茹芬</a>援助危急中的<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯城</a>。他们带来了五百名弓箭手。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月15日，<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>打响。鉴于歌颂阵亡将士的<a class="wiki-link" href="/entry/%E8%92%99%E5%BE%B7%E5%A0%A1%E5%A2%93%E5%86%A2%E4%B9%8B%E6%AD%8C/">《蒙德堡墓冢之歌》</a>中没有提及杜因希尔，所以他可能在战争中得以幸存。然而，他的两个儿子都在大战中丧生了。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
