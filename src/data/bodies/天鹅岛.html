<h1>天鹅岛</h1>
<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>
</blockquote>
<p><strong>天鹅岛</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elvet-isle" target="_blank" rel="noopener noreferrer">Elvet-isle</a></strong>），是<a class="wiki-link" href="/entry/%E8%80%81%E6%9E%97%E5%AD%90/">老林子</a>里<a class="wiki-link" href="/entry/%E6%9F%B3%E6%9D%A1%E6%B2%B3/">柳条河</a>中的一座小岛。岛上栖息着天鹅。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>词源</h2>
<p><em><strong>Elvet</strong></em> 是古语，意为“天鹅”，源自古英语 <em>elfetu</em> 或 <em>ilfetu</em>。</p>
