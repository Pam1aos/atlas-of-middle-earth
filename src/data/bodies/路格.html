<p><strong>路格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lug" target="_blank" rel="noopener noreferrer">Lug</a></strong>）是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>的一名<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>510年，路格参加了<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>对<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>发起的大举进攻。在大军摧破<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林城</a>的西面城墙之后，路格随大军涌入城内。但是，<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>随后挥动大斧<a class="wiki-link" href="/entry/%E5%BE%B7%E6%8B%89%E5%A7%86%E5%8D%9A%E7%83%88%E6%A0%BC/">德拉姆博烈格</a>，将路格的双腿齐膝斩断。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
