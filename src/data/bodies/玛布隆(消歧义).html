<p><strong>玛布隆</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mablung" target="_blank" rel="noopener noreferrer">Mablung</a></strong>），是以下两位角色的名字：</p>
<ul>
<li>玛布隆，又称“重手”玛布隆，是第一纪元多瑞亚斯的一名辛达精灵。</li>
<li>玛布隆，是第三纪元的一名刚铎人，伊希利恩突击队的一员。</li>
</ul>
