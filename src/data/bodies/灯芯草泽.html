<h1>灯芯草泽</h1>
<p><strong>灯芯草泽</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Rushock_Bog" target="_blank" rel="noopener noreferrer">Rushock Bog</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a><a class="wiki-link" href="/entry/%E5%B0%8F%E6%B2%B3/">小河</a>上的一片沼泽，在<a class="wiki-link" href="/entry/%E9%92%88%E7%9C%BC%E9%95%87/">针眼镇</a>的南部和<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>的西北部。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>词源</h2>
<p>David Salo 提出了一个来自古霍比特语的词源<code>*Ryscuc</code>，意为“灯芯草之地”。</p>
