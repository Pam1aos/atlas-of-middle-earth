<p>克里斯托弗·托尔金</p>
<p><strong>努门诺瑞地图</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Númenórë_(map" target="_blank" rel="noopener noreferrer">Map of Númenórë</a>)</strong>），是<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>根据<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>绘制的唯一一份努门诺尔草图重新绘制的地图<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>，现收录在<a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4/">《未完的传说》</a>的封里。</p>
