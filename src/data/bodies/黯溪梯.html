<h1>黯溪梯</h1>
<p><strong>黯溪梯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dimrill_Stair" target="_blank" rel="noopener noreferrer">Dimrill Stair</a></strong>），是指翻越<a class="wiki-link" href="/entry/%E5%8D%A1%E6%8B%89%E5%85%B9%E6%8B%89%E6%96%AF%E9%9A%98%E5%8F%A3/">红角口</a>隘口的山路在<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>东侧的部分，它从红角口一直延伸到<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>东门外的<a class="wiki-link" href="/entry/%E9%BB%AF%E6%BA%AA%E8%B0%B7/">黯溪谷</a>。沿着这条深凿的山路，有一道急流奔腾而下，形成无数级小瀑布，最终落入黯溪谷中的<a class="wiki-link" href="/entry/%E9%95%9C%E5%BD%B1%E6%B9%96/">镜影湖</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
