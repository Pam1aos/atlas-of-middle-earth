<h1>第三谷</h1>
<p><strong>第三谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Third_Deep" target="_blank" rel="noopener noreferrer">Third Deep</a></strong>），是<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>城邦<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">墨瑞亚</a>的负三层（以<a class="wiki-link" href="/entry/%E9%BB%AF%E6%BA%AA%E9%97%A8/">墨瑞亚东门</a>的所在层为第一层）。墨瑞亚的武器库位于第三谷，<a class="wiki-link" href="/entry/%E5%B7%B4%E6%9E%97%E7%9A%84%E6%AE%96%E6%B0%91%E9%98%9F/">巴林的殖民队</a>曾派<a class="wiki-link" href="/entry/%E6%AC%A7%E5%9B%A0(%E6%A2%AD%E6%9E%97%E7%9A%84%E5%90%8C%E4%BC%B4)/">欧因</a>去寻找此处的武器库。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
