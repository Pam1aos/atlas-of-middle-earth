<h1>黑王座</h1>
<p><strong>黑王座</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dark_Throne" target="_blank" rel="noopener noreferrer">Dark Throne</a></strong>），是指黑暗魔君<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>安置于北方<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8F%AD/">安格班</a>要塞深处的宝座，<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>在进行<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E8%BF%9C%E5%BE%81/">精灵宝钻远征</a>时，曾披着妖狼<a class="wiki-link" href="/entry/%E8%82%87%E6%A0%BC%E8%B7%AF%E5%9B%A0/">肇格路因</a>的外皮躲在黑王座底下。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>魔君<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>的王座在<a class="wiki-link" href="/entry/%E8%87%B3%E5%B0%8A%E6%88%92%E4%B9%8B%E8%AF%97/">至尊戒之诗</a>中也曾被称为“黑王座”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
