<h1>美塞德-恩-格拉德</h1>
<p><strong>美塞德-恩-格拉德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Methed-en-glad" target="_blank" rel="noopener noreferrer">Methed-en-glad</a></strong>）是在<a class="wiki-link" href="/entry/%E6%B3%B0%E6%A0%BC%E6%9E%97%E6%B8%A1%E5%8F%A3/">泰格林渡口</a>以南的森林边缘的一座堡垒，建立于<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>与<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E6%A0%BC%C2%B7%E5%BA%93%E6%B2%99%E7%90%86%E5%AE%89/">贝烈格</a>驻扎在<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E5%A6%82%E5%85%B9/">阿蒙如兹</a>期间。这座堡垒由在先前的诸次大战中失去领导的人类与精灵看守。这里有着对阿蒙如兹以南地区的良好视野，讯息和指令都能够发出与抵达此地。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>名字与词源</h2>
<p>美塞德-恩-格拉德(Methed-en-glad)是<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，意为“森林的终点”，由<code>methed</code>(终点)、<code>en</code>(单数冠词)与<code>glad</code>(森林)组成。</p>
