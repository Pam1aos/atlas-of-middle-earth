<h1>宁洛德尔瀑布</h1>
<p><strong>宁洛德尔瀑布</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Falls_of_Nimrodel" target="_blank" rel="noopener noreferrer">Falls of Nimrodel</a></strong>），是<a class="wiki-link" href="/entry/%E6%B4%9B%E4%B8%9D%E7%BD%97%E7%91%9E%E6%81%A9/">洛丝罗瑞恩</a><a class="wiki-link" href="/entry/%E5%AE%81%E6%B4%9B%E5%BE%B7%E5%B0%94%E6%BA%AA/">宁洛德尔溪</a>的瀑布。<a class="wiki-link" href="/entry/%E5%AE%81%E6%B4%9B%E5%BE%B7%E5%B0%94/">宁洛德尔</a>在宁洛德尔溪的瀑布旁的一棵树上搭建了一座树屋，独自生活在瀑布边。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4/">未完的传说</a>，<a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4-%E7%AC%AC%E4%BA%8C%E8%BE%91-%E7%AC%AC%E5%9B%9B%E7%AF%87/">第二辑-第四章</a>，加拉德瑞尔与凯勒博恩的历史。 <a class="fn-back" href="#fnref-1">↩</a></li><li id="fn-2"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92I-%E9%AD%94%E6%88%92%E5%90%8C%E7%9B%9F/">魔戒I-魔戒同盟</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E4%BA%8C-%E7%AC%AC%E5%85%AD%E7%AB%A0/">卷II-第六章</a>，洛丝罗瑞恩。 <a class="fn-back" href="#fnref-2">↩</a></li></ol></section>
