<p><strong>奇幻远足</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fantasy_Hike" target="_blank" rel="noopener noreferrer">Fantasy Hike</a></strong>），是一款中洲主题移动端计步类应用。由于该应用并未获得官方授权，因此应用内的人名、地名均在《魔戒》原著基础上做了一定处理（如Rivendale, Mount Fire）。应用会记录用户每日行走的里程数，让用户在虚拟世界中跟随<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>和<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>的足迹完成毁戒之旅，并与Mr. Underhill，Jon Snowflake，Alice Wonderfoot和Harryfoot Potter“一争高下”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>该应用的免费版每日最多可记录3公里里程，付费版不设里程上限。</p>
