<h1>战斗坑</h1>
<p><strong>战斗坑</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Battle_Pit" target="_blank" rel="noopener noreferrer">Battle Pit</a></strong>）是<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>结束之后，用来掩埋<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>尸体的埋葬坑。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年11月3日，100名<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>成员与超过300名<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>在<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E8%B7%AF/">傍水路</a>展开激战。<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>在路的两头设下障碍，而愚蠢的<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>撞进了他们的埋伏圈，超过70人在随即发生的战斗中身亡。战乱平息后，<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>将敌人的尸体装车拉走，埋在附近的一个沙坑中，这里也由此得名战斗坑。另有19名<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>在战斗中遇害。众人怀着敬意将他们安葬在山坡上。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
