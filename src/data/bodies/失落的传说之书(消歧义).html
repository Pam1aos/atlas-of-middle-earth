<h1>失落的传说之书(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>《失落的传说之书》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Book_of_Lost_Tales_(disambiguation" target="_blank" rel="noopener noreferrer">The Book of Lost Tales</a>)</strong>），简称**《失落的传说》**，是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>创作的传说故事集的最早版本，写作时间可以追溯至1917年。<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>编辑的《中洲历史》中，第一卷和第二卷即题为《失落的传说之书》。</p>
<ul>
<li>《失落的传说之书之一》：《中洲历史》第一卷；</li>
<li>《失落的传说之书之二》：《中洲历史》第二卷。</li>
</ul>
