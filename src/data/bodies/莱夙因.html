<p><strong>莱夙因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lethuin" target="_blank" rel="noopener noreferrer">Lethuin</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E5%8F%B2%E7%9F%9B%E9%9D%A9%E4%B9%8B%E6%88%98/">《霍比特人：史矛革之战》</a>中原创的<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97%E7%8E%8B%E5%9B%BD/">森林王国</a>精灵角色，由演员 Eli Kent 饰演。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>在<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>里遭遇<a class="wiki-link" href="/entry/%E8%9C%98%E8%9B%9B/">蜘蛛</a>攻击时，<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>和<a class="wiki-link" href="/entry/%E9%99%B6%E7%91%9E%E5%B0%94/">陶瑞尔</a>率领一群精灵战士杀死蜘蛛，俘虏了梭林一行，莱夙因也在这支队伍中。随后，当<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>在<a class="wiki-link" href="/entry/%E7%91%9F%E5%85%B0%E6%9D%9C%E4%BC%8A/">瑟兰杜伊</a>的宫殿里四处游荡、寻找解救梭林等人的方法时，有一个莱夙因和瑟兰杜伊的总管<a class="wiki-link" href="/entry/%E5%8A%A0%E7%90%86%E5%AE%89/">加理安</a>谈话的镜头。</p>
<h2>名称释义</h2>
<p>莱夙因（Lethuin）这个名字并无确切含义，它很可能只是一个文字游戏，是打乱重组“<a class="wiki-link" href="/entry/%E9%9C%B2%E8%A5%BF%E6%81%A9/">露西恩</a>”（Lúthien）一词后得到的。<a class="wiki-link" href="/entry/%E5%BD%BC%E5%BE%97%C2%B7%E6%9D%B0%E5%85%8B%E9%80%8A/">彼得·杰克逊</a>多次以这种方式，给电影中的背景人物取名。</p>
