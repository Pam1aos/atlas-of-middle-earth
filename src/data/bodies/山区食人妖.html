<p><strong>山区食人妖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hill-trolls" target="_blank" rel="noopener noreferrer">Hill-trolls</a></strong>）是<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>的一种，它们生活在丘陵地区，或是地势较高的荒原中。山区食人妖的体型高大壮硕，咆哮声如同野兽，身上裹着一层鳞片突起的厚皮，使用沉重的铁锤和巨盾作战；它们的血液是乌黑色的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>的祖父<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E5%A4%9A/">阿拉多</a>就是死于山区食人妖之手<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>；在<a class="wiki-link" href="/entry/%E9%AD%94%E6%A0%8F%E5%86%9C%E4%B9%8B%E6%88%98/">魔栏农之战</a>中，<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>把山区食人妖作为突破敌军防线的先锋部队。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
