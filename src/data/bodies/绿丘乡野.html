<p><strong>绿丘乡野</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Green_Hill_Country" target="_blank" rel="noopener noreferrer">Green Hill Country</a></strong>）是夏尔的一片村落，散落在<a class="wiki-link" href="/entry/%E7%BB%BF%E4%B8%98%E9%99%B5/">绿丘陵</a>上，绿丘陵自西向东横跨夏尔四区中的<a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>、<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%BA/">南区</a>、<a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>绿丘陵的西边山麓发源于<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%9C%B0/">图克地</a>。群丘穿过南区的北角，雀息村就座落在那儿南边的山麓。穿过边界进入东区，那里的群丘枝繁叶茂，最后止于<a class="wiki-link" href="/entry/%E6%9E%97%E5%B0%BE%E5%9C%B0/">林尾地</a>和<a class="wiki-link" href="/entry/%E6%9E%97%E6%9C%A8%E5%8E%85/">林木厅</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p><a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>从<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>出发的旅途经过<a class="wiki-link" href="/entry/%E5%A1%94%E5%85%8B%E9%A2%86/">塔克领</a>，一条自西向东穿过绿丘乡野的路。</p>
