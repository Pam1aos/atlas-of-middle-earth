<p><strong>信件265号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_265" target="_blank" rel="noopener noreferrer">Letter 265</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给大卫·科尔布的一封信，写信日期为1964年11月11日。托尔金不喜欢<a class="wiki-link" href="/entry/C%C2%B7S%C2%B7%E5%88%98%E6%98%93%E6%96%AF/">C·S·刘易斯</a>的一些作品<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金说，《纳尼亚传奇》和刘易斯的所有作品都不在他的共情范围之内，因为他的大部分作品都是为刘易斯写的。托尔金称刘易斯给Malcolm的信令人痛苦和恐怖。</p>
