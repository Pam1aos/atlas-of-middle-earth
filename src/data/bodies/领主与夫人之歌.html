<h1>领主与夫人之歌</h1>
<p><strong>领主与夫人之歌</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Lay_of_Aotrou_and_Itroun" target="_blank" rel="noopener noreferrer">The Lay of Aotrou and Itroun</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>于<a class="wiki-link" href="/entry/1930%E5%B9%B4/">1930年</a>创作的一首长诗，后发表于<a class="wiki-link" href="/entry/1945%E5%B9%B4/">1945年</a>的《威尔士评论》上。Aotrou和Itroun在布列塔尼语中分别意为“领主”和“夫人”，这首诗借鉴了12世纪中古英语文学流行体裁“布列塔尼歌谣”（Breton lai），探讨了英雄或骑士价值观与基督教间的冲突，以及它们与婚姻制度的关联。</p>
