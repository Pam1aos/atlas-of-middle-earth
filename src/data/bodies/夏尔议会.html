<h1>夏尔议会</h1>
<p><strong>夏尔议会</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Shire-moot" target="_blank" rel="noopener noreferrer">Shire-moot</a></strong>），是指由夏尔<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>组织的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>议事集会，长官兼任议会议长。夏尔议会仅在紧急状况下召开，而紧急状况在夏尔几乎从未发生过。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
