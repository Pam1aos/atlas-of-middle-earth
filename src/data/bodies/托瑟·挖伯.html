<p><strong>托瑟·挖伯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tosser_Grubb" target="_blank" rel="noopener noreferrer">Tosser Grubb</a></strong>），是电影<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>中原创的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Merv Smith 饰演。</p>
<h2>生平</h2>
<p>托瑟·挖伯登场于<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>的结尾部分，他是<a class="wiki-link" href="/entry/%E6%8C%96%E4%BC%AF%E5%85%84%E5%BC%9F%E4%B8%8E%E6%8E%98%E6%B4%9E%E5%85%88%E7%94%9F%E4%BA%8B%E5%8A%A1%E6%89%80/">挖伯兄弟与掘洞先生事务所</a>的拍卖师，负责拍卖据称已故的<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>先生的财产，包括洞府<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>和其中的各种物品。出乎所有人意料的是，比尔博不仅活着，而且赶上了这场拍卖会。托瑟·挖伯要求比尔博出示带有签名的文件证明身份，于是比尔博出示了<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%C2%B7%E6%A9%A1%E6%9C%A8%E7%9B%BE/">梭林</a>雇佣自己担任飞贼的合同，终止了这场闹剧。</p>
