<p><strong>信件42b号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_42b" target="_blank" rel="noopener noreferrer">Letter 42b</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>的一封信，写信日期为1941年2月1日。托尔金说了<a class="wiki-link" href="/entry/%E6%99%AE%E8%8E%89%E8%A5%BF%E6%8B%89%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">普莉希拉·托尔金</a>的近况<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金报告说普莉希拉已经脱离隔离。她一直用打字机在打<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">《霍比特人》</a>，然后和伊迪丝一起去了哑剧剧院。他过去很忙，现在仍然很忙。</p>
