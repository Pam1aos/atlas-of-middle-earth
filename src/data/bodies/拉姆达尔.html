<h1>拉姆达尔</h1>
<p><strong>拉姆达尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ramdal" target="_blank" rel="noopener noreferrer">Ramdal</a></strong>）是位于<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>东部的一片低矮的山丘，在<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E5%9F%83%E7%91%9E%E5%B8%83/">阿蒙埃瑞布</a>西边几英里的地方。“长墙”<a class="wiki-link" href="/entry/%E5%AE%89%E5%BE%B7%E6%8B%89%E5%A7%86/">安德拉姆</a>从<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>附近的山丘起向东延伸，至拉姆达尔结束。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>词源</h2>
<p><a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中的拉姆达尔意为“墙尾”，由<code>ram</code>（城墙）和<code>dal</code>（末尾）组成。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup><sup class="fn-ref"><a href="#fn-4" id="fnref-4">4</a></sup></p>
