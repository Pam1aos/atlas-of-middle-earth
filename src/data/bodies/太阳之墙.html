<h1>太阳之墙</h1>
<p><strong>太阳之墙</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Walls_of_the_Sun" target="_blank" rel="noopener noreferrer">Walls of the Sun</a></strong>）是一条位于<a class="wiki-link" href="/entry/%E5%A4%AA%E9%98%B3%E4%B9%8B%E5%9C%B0/">太阳之地</a>的高大山脉，它和西方<a class="wiki-link" href="/entry/%E9%98%BF%E9%97%A8%E6%B4%B2/">阿门洲</a>的佩罗瑞山脉相对称，但高度逊于后者。因为大海的分隔，太阳之墙的面貌无人知晓，也许只有飞鸟例外。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
