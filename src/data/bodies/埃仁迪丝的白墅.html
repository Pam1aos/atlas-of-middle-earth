<h1>埃仁迪丝的白墅</h1>
<p><strong>埃仁迪丝的白墅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/White_House_of_Erendis" target="_blank" rel="noopener noreferrer">White House of Erendis</a></strong>），是<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E7%BE%8E%E5%B0%BC%E5%B0%94%E9%83%BD%E5%B0%94/">塔尔-美尼尔都尔</a>赠给<a class="wiki-link" href="/entry/%E5%9F%83%E4%BB%81%E8%BF%AA%E4%B8%9D/">埃仁迪丝</a>的一栋别墅，以纪念她与<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>的订婚。房子坐落在<a class="wiki-link" href="/entry/%E5%9F%83%E6%A2%85%E7%91%9E%E4%BE%9D/">埃梅瑞依</a>的山坡上，面朝西方，四周都是广阔的草坪，没有院墙和树篱阻断，与牧场融为一体。阿勒达瑞安与埃仁迪丝发生矛盾后，埃仁迪丝终日居于此地，直到死前最后一次离开。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4/">未完的传说</a>，<a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4-%E7%AC%AC%E4%BA%8C%E8%BE%91-%E7%AC%AC%E4%BA%8C%E7%AF%87/">第二辑-第二章</a>，阿勒达瑞安与埃仁迪丝。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
