<h1>瑁洛斯</h1>
<p><strong>瑁洛斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mallos" target="_blank" rel="noopener noreferrer">Mallos</a></strong>），是一种分布在<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>境内<a class="wiki-link" href="/entry/%E8%8E%B1%E6%9C%AC%E5%AE%81/">莱本宁</a>地区的花朵，形状和颜色类似于金色铃铛。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>瑁洛斯（Mallos）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，意为“金色花朵”，由<code>malt</code>（“金色”）和<code>loth/loss</code>（“花朵）组成。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
