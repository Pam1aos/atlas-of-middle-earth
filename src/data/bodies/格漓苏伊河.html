<p><strong>格漓苏伊河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Glithui" target="_blank" rel="noopener noreferrer">Glithui</a></strong>），发源于<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%BE%B7%E5%A8%81%E6%96%AF%E6%9E%97/">埃瑞德威斯林</a>山脉，是<a class="wiki-link" href="/entry/%E6%B3%B0%E6%A0%BC%E6%9E%97%E6%B2%B3/">泰格林河</a>的一条支流。</p>
<h2>地理概况</h2>
<p>格漓苏伊河从<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E8%BE%BE%E5%B8%8C%E5%B0%94/">阿蒙达希尔</a>的南麓流下，穿过陡峭而险峻的隘口离开<a class="wiki-link" href="/entry/%E5%A4%9A%E5%B0%94%E7%BD%97%E6%98%8E/">多尔罗明</a>，绵延至少五十英里，在西<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>汇入泰格林河。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>历史</h2>
<p>当<a class="wiki-link" href="/entry/%E6%B2%83%E9%9A%86%E5%A8%81/">沃隆威</a>带领<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>沿着埃瑞德威斯林山脚一路向东，前往<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>时，他们渡过了格漓苏伊河。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p>后来<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>自多尔罗明逃离之际，也行径格漓苏伊河的隘口。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
