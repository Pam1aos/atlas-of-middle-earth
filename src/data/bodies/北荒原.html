<h1>北荒原</h1>
<blockquote>
<p>本词条叙述的对象是位于夏尔北部边境的荒原。想要了解中洲极北的寒冷地区，请参看<a class="wiki-link" href="/entry/%E5%8C%97%E8%8D%92%E5%9C%B0/">北荒地</a>。</p>
</blockquote>
<p><strong>北荒原</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/North_Moors" target="_blank" rel="noopener noreferrer">North Moors</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E5%8C%97%E5%8C%BA/">北区</a>边境处的一片高地荒原。北荒原冬天时会下大雪，这对夏尔来说十分少见。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年春季，<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">哈尔法斯特·甘姆吉</a>在北荒原打猎时，看见了一个像是树人或者巨人的东西。他的奇遇被堂弟<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>说给了霍比屯的居民听，但人们普遍不信。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
