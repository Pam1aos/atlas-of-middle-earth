<h1>5月14日</h1>
<h2>现实世界</h2>
<ul>
<li>1944年－J·R·R·托尔金写下一封信（信件69号）。</li>
<li>1961年－J·R·R·托尔金与剑桥大学皇后学院的一个粉丝俱乐部一起度过了一个愉快的周日。</li>
<li>1969年－演员凯特·布兰切特出生，她在《指环王》系列电影中扮演加拉德瑞尔。</li>
<li>1996年－托尔金学社创始人薇拉·查普曼去世。</li>
<li>2021年－《指环王：王者无敌》在中国大陆重映。</li>
<li>2022年－《中洲战略游戏：北方的防御》(Middle-earth Strategy Battle Game: Defence of the North)发布。</li>
</ul>
