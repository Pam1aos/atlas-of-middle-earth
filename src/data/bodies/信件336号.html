<p><strong>信件336号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_336" target="_blank" rel="noopener noreferrer">Letter 336</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给帕特里克·布朗的一封信，写信日期为1972年5月23日。托尔金表达了对成名的看法<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金向帕特里克·布朗爵士讲述了成名的代价，以及他对成为一个受人崇拜的人物的看法:这一点也不令人愉快。这让他感到渺小和不足，他感到受宠若惊。</p>
