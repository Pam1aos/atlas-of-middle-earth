<h1>恩特娃</h1>
<p><strong>恩特娃</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Entings" target="_blank" rel="noopener noreferrer">Entings</a></strong>），指<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>中的年幼个体。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>末期的<a class="wiki-link" href="/entry/%E6%9C%80%E5%90%8E%E8%81%94%E7%9B%9F%E5%A4%A7%E6%88%98/">最后联盟大战</a>中，<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>摧毁了<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E5%A9%86/">恩特婆</a>位于<a class="wiki-link" href="/entry/%E8%A4%90%E5%9C%B0/">褐地</a>的家园，恩特婆从此销声匿迹。由于恩特婆的失踪，到了<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，新生的恩特娃已经三千余年不曾出现，恩特族群的数量只减不增，趋于消亡。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
