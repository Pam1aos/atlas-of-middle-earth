<h1>獾地洞</h1>
<p><strong>獾地洞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Brockenborings" target="_blank" rel="noopener noreferrer">Brockenborings</a></strong>），是位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>北部的村落，有着许多隧道，它东邻<a class="wiki-link" href="/entry/%E6%96%AF%E5%8D%A1%E9%87%8C/">斯卡里</a>，西邻<a class="wiki-link" href="/entry/%E7%BB%BF%E9%87%8E/">绿野</a>，北面为<a class="wiki-link" href="/entry/%E6%96%AF%E5%8D%A1%E9%87%8C%E4%B8%98%E9%99%B5/">斯卡里丘陵</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E5%BC%97%E9%9B%B7%E5%BE%B7%E5%8A%A0%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">弗雷德加·博尔杰</a>曾率领一群反抗<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">沙基</a>的霍比特人躲在獾地洞里，被恶棍用烟熏出来而被抓，囚禁在<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
