<p><strong>库勒沃</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Kullervo" target="_blank" rel="noopener noreferrer">Kullervo</a></strong>），是芬兰史诗Kalevala中的人物，《胡林的子女》中悲剧人物图林的原型之一。</p>
<p>卡勒沃之子库勒沃也许是托尔金所有角色中最黑暗、最悲惨的一个，托尔金称他为“倒霉的库勒沃”。</p>
