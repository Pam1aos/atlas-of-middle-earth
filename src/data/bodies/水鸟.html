<h1>水鸟</h1>
<p>水鸟（微博ID：Osmiz ）是中国托尔金粉兼书法美术爱好者。</p>
<p>他手绘了许多中洲相关地图，还尝试以<a class="ext-link" href="https://en.wikipedia.org/wiki/Insular_art" target="_blank" rel="noopener noreferrer">海岛风格</a>绘制《<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">精灵宝钻</a>》的标题页，受到包括《精灵宝钻》中文译者在内的众多托尔金粉丝好评。</p>
