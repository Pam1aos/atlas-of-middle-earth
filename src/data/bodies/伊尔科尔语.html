<p><strong>伊尔科尔语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ilkorin" target="_blank" rel="noopener noreferrer">Ilkorin</a></strong>）是早期设定中伊尔科尔使用的语言。</p>
<h2>早期构想</h2>
<p>在托尔金的早期构想中，生活在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的泰勒瑞族精灵（即辛达族）所说的语言即为伊尔科尔语。在使用旧诺多语的诺多族精灵离开维林诺来到中土后，他们的语言被伊尔科尔语影响，并逐渐演变为之后的诺多语。</p>
