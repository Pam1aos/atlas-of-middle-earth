<p>白树</p>
<p>Alan Lee</p>
<p><strong>喷泉广场</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Court_of_the_Fountain" target="_blank" rel="noopener noreferrer">Court of the Fountain</a></strong>），是刚铎都城<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>的最高层（即<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E7%8E%8B%E5%9F%8E/">刚铎王城</a>）的一处广场，位于<a class="wiki-link" href="/entry/%E5%9F%83%E5%85%8B%E5%A1%9E%E7%90%86%E5%AE%89%E4%B9%8B%E5%A1%94/">埃克塞理安之塔</a>的脚下。在铺着白色石板的喷泉广场中，有一块涌出甜美清泉的青翠草地，广场因为这股泉水而得名。草地中央伫立着著名的<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E7%99%BD%E6%A0%91/">刚铎白树</a>，喷泉的水珠飞上白树的枝头，又顺着树干滴落回池水中。由于<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E7%99%BD%E6%A0%91/">白树</a>种植于此的缘故，喷泉广场前有<a class="wiki-link" href="/entry/%E7%8E%8B%E5%9F%8E%E7%A6%81%E5%8D%AB%E5%86%9B/">王城禁卫军</a>驻扎看守。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
