<h1>伊瓦瑞</h1>
<blockquote>
<p><strong>这个词条描述的对象仅出现于《失落的传说》，即<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>的原始版本。</strong> 慎将该作设定套用至其他作品，它们可能产生矛盾。</p>
</blockquote>
<p><strong>伊瓦瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ivárë" target="_blank" rel="noopener noreferrer">Ivárë</a></strong>），是一位著名的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>吟游诗人，“总在海边演奏”，与<a class="wiki-link" href="/entry/%E9%87%91%E5%97%93%E5%BB%B7%E6%96%B9/">金嗓廷方</a>和<a class="wiki-link" href="/entry/%E6%88%B4%E9%9A%86/">戴隆</a>齐名为“精灵最神奇的三大乐手”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
