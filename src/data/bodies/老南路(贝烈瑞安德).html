<h1>老南路(贝烈瑞安德)</h1>
<blockquote>
<p>本词条叙述的对象是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的道路。想要了解<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">绿大道</a>在<a class="wiki-link" href="/entry/%E5%9F%83%E5%A5%88%E5%BE%B7%E5%9C%B0%E5%8C%BA/">埃奈德地区</a>的延伸部分，请参看<a class="wiki-link" href="/entry/%E8%80%81%E5%8D%97%E8%B7%AF/">老南路</a>。</p>
</blockquote>
<p><strong>老南路</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_South_Road_(Beleriand" target="_blank" rel="noopener noreferrer">Old South Road</a>)</strong>），或称<strong>南大道</strong>，是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的一条古道，始于<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E8%A5%BF%E7%91%9E%E5%AE%89/">托尔西瑞安</a>岛，经过<a class="wiki-link" href="/entry/%E6%B3%B0%E6%A0%BC%E6%9E%97%E6%B8%A1%E5%8F%A3/">泰格林渡口</a>、通往<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
