<h1>费诺里安方言</h1>
<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>
</blockquote>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E8%B4%B9%E8%AF%BA%E9%87%8C%E5%AE%89/">消歧义页面</a>。</p>
<p><strong>费诺里安方言</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fëanorian_dialect" target="_blank" rel="noopener noreferrer">Fëanorian dialect</a></strong>），也被称为东贝烈瑞安德方言，是<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E8%AF%AD/">诺多语</a>在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">东贝烈瑞安德</a>的一种方言，由<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA%E4%BC%97%E5%AD%90/">费艾诺众子</a>及其子民所使用。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
