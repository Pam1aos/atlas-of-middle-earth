<h1>维林诺昆雅语</h1>
<p><strong>维林诺昆雅语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Valinorean_Quenya" target="_blank" rel="noopener noreferrer">Valinorean Quenya</a></strong>），是一种<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>方言，为居留在<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>所使用。</p>
<p>其与<a class="wiki-link" href="/entry/%E6%B5%81%E4%BA%A1%E8%80%85%E6%98%86%E9%9B%85%E8%AF%AD/">流亡者昆雅语</a>有着发音上的区别。<a class="wiki-link" href="/entry/%E5%87%A1%E9%9B%85%E8%AF%AD/">凡雅语</a>是一种有名的维林诺昆雅语次方言。</p>
