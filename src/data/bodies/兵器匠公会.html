<h1>兵器匠公会</h1>
<p><strong>兵器匠公会</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Guild_of_Weaponsmiths" target="_blank" rel="noopener noreferrer">Guild of Weaponsmiths</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔王国</a>的武器铸造匠组成的行会。兵器匠公会建立的初衷，在于存续<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E6%97%8F/">诺多精灵</a>传授给<a class="wiki-link" href="/entry/%E4%BC%8A%E7%94%B8%E4%BA%BA/">伊甸人</a>的高超武器铸造技艺，而非为战争服务，他们虽然造剑，但把大部分精力都用于设计和制造非作战用的工具。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
