<p><strong>埃雅尼尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eärnil_(disambiguation" target="_blank" rel="noopener noreferrer">Eärnil</a>)</strong>）是以下两位人物的名字：</p>
<ul>
<li>埃雅尼尔一世，刚铎的第十三代国王、刚铎历史上四位“船王”中的第二位。</li>
<li>埃雅尼尔二世，在他前任昂多赫尔及其两个儿子战死沙场后被选为刚铎第三十二任国王。</li>
</ul>
