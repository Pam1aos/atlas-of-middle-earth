<p><strong>市政洞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Town_Hole" target="_blank" rel="noopener noreferrer">Town Hole</a></strong>）位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>西区的<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>，建造在<a class="wiki-link" href="/entry/%E7%99%BD%E5%B2%97/">白岗</a>的白垩质山丘中。它是市长的办公场所。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3013年 - 3018年之间的某时，市政洞曾发生屋顶垮塌的事故。时任市长<a class="wiki-link" href="/entry/%E5%A8%81%E5%B0%94%C2%B7%E7%99%BD%E8%B6%B3/">威尔·白足</a>浑身上下都沾满了白垩粉，因此获得了“白面汤团”的绰号。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称</h2>
<p><em>Town Hole</em> 可能是双关语，既谐音 <em>Town Hall</em> （“市政厅”），又意指这是一座<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的洞府。</p>
