<p>Matěj Čadil</p>
<p><strong>林木厅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Woodhall" target="_blank" rel="noopener noreferrer">Woodhall</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>东区<a class="wiki-link" href="/entry/%E6%9E%97%E5%B0%BE%E5%9C%B0/">林尾地</a>树林中的一座村庄。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>在一条通往林木厅上方山丘的道路上，遇见了<a class="wiki-link" href="/entry/%E5%90%89%E5%B0%94%E5%A4%9A%C2%B7%E8%8B%B1%E6%A0%BC%E7%BD%97%E7%91%9E%E5%AE%89/">吉尔多·英格罗瑞安</a>和他的同伴们。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>三位霍比特人后来又在即将到达<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87%E6%B8%A1%E5%8F%A3/">雄鹿镇渡口</a>时，经过了林木厅附近。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
