<p><strong>杜内丹之星</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Star_of_the_Dúnedain" target="_blank" rel="noopener noreferrer">Star of the Dúnedain</a></strong>），是<a class="wiki-link" href="/entry/%E5%8C%97%E6%96%B9%E7%9A%84%E6%B8%B8%E6%B0%91/">北方游民</a>扣在斗篷上的银质别针，形状就像一颗放射光芒的星星。</p>
<p>杜内丹之星是<a class="wiki-link" href="/entry/%E5%8C%97%E6%96%B9%E7%9A%84%E6%9D%9C%E5%86%85%E4%B8%B9%E4%BA%BA/">北方的杜内丹人</a>的身份象征：例如，以<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%B7%B4%E6%8B%89%E5%BE%B7/">哈尔巴拉德</a>为领队、援助<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>的<a class="wiki-link" href="/entry/%E7%81%B0%E8%A1%A3%E5%8A%B2%E6%97%85/">灰衣劲旅</a>，其成员不带任何徽章或标记，只是在左肩的斗篷上别了一枚杜内丹之星。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>而在<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%AF%BA/">北方王国</a>复兴之后，杜内丹之星也被视为一种可以颁发的荣誉证明：<a class="wiki-link" href="/entry/%E7%AC%AC%E5%9B%9B%E7%BA%AA%E5%85%83/">第四纪元</a>15年，<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">埃莱萨王</a>将一颗杜内丹之星授予了夏尔市长与魔戒大战中的英雄<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
