<h1>泰路门迪尔</h1>
<p><strong>泰路门迪尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Telumendil" target="_blank" rel="noopener noreferrer">Telumendil</a></strong>），是<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生子女</a>创造的星座<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p>泰路门迪尔（Telumendil），在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅</a>中的意思是“天空之友”：telume（“天空”）和表示友情或投入的词根<code>-ndil</code>。</p>
