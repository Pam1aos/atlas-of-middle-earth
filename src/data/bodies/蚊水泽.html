<p><strong>蚊水泽</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Midgewater_Marshes" target="_blank" rel="noopener noreferrer">Midgewater Marshes</a></strong>）是<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>境内的一片沼泽，蚊虫孽生。</p>
<p>蚊水泽位于<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>以东，它的西侧是<a class="wiki-link" href="/entry/%E5%88%87%E7%89%B9%E6%A3%AE%E6%9E%97/">切特森林</a>，东侧是<a class="wiki-link" href="/entry/%E9%A3%8E%E4%BA%91%E4%B8%98%E9%99%B5/">风云丘陵</a>，<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>从沼泽的南侧绕过。蚊水泽泥泞危险，小径时有时无，芦苇与草丛密布。它的空中布满了细小蚊虫组成的云团，草丛里还滋生着一种被<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>称为“<a class="wiki-link" href="/entry/%E5%90%B1%E5%92%AF%E5%90%B1%E5%98%8E%E8%99%AB/">吱咯吱嘎虫</a>”的虫子：这种昆虫叫声很大，可能和蛐蛐有着亲缘。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年10月2日，“大步佬”<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>带着<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>等四位霍比特人们走入蚊水泽。在沼泽里，他们度过了两个倍感煎熬的日夜<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
