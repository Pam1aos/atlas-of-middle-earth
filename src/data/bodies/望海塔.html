<p><strong>望海塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sea-ward_Tower" target="_blank" rel="noopener noreferrer">Sea-ward Tower</a></strong>），又称<strong>提力斯艾尔</strong>，是<a class="wiki-link" href="/entry/%E5%A4%9A%E9%98%BF%E5%A7%86%E6%B4%9B%E6%96%AF/">多阿姆洛斯</a>城中或其附近的一座临海的塔楼。<a class="wiki-link" href="/entry/%E8%A5%BF%E7%95%8C%E7%BA%A2%E7%9A%AE%E4%B9%A6/">《西界红皮书》</a>收录的一首题为《月仙下来得太早》的诗歌中，提到了望海塔传出的缓慢钟声。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><strong>提力斯艾尔</strong>（Tirith Aear）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名字，意为“海塔”，由<code>tirith</code>（“塔楼”）和<code>aear</code>(“海洋”）组成。</p>
