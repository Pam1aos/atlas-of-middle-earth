<h1>4月11日</h1>
<h2>现实世界</h2>
<ul>
<li>1910年－自即日起，J·R·R·托尔金在伯明翰的威尔士亲王剧院观看了《彼得·潘》的演出。</li>
<li>1953年－J·R·R·托尔金写下一封信（信件137号）。</li>
<li>1955年－大约是这一天，J·R·R·托尔金给艾伦与昂温出版社寄了《魔戒》附录的一份额外副本。</li>
<li>1956年－J·R·R·托尔金写下一封信（信件189号）。</li>
<li>1961年－J·R·R·托尔金给乔伊·希尔写了一封信。</li>
<li>2006年－《同盟！》（Fellowship!）获得了洛杉矶周刊戏剧奖年度音乐奖。</li>
</ul>
