<h1>学识之书</h1>
<p><strong>学识之书</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Parma_Nölé" target="_blank" rel="noopener noreferrer">Parma Nölé</a></strong>），是纽约托尔金学社的期刊，自<a class="wiki-link" href="/entry/2001%E5%B9%B4/">2001年</a>起出版。学社会员可以订阅这份期刊，会员价格是每年30美元。</p>
<h2>名字与词源</h2>
<p><strong>parma</strong>是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>单词，意为“书籍”。</p>
<p><strong>nölé</strong>可能来自nólë，后者是昆雅语单词，意为“学识”，但需注意两者的变音符号相反。</p>
