<p><strong>《中洲地图》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/A_Map_of_Middle-earth" target="_blank" rel="noopener noreferrer">A Map of Middle-earth</a></strong>），有时也被称为“<strong>波琳·贝恩斯地图</strong>”，是一张<a class="wiki-link" href="/entry/%E6%B3%A2%E7%90%B3%C2%B7%E8%B4%9D%E6%81%A9%E6%96%AF/">波琳·贝恩斯</a>绘制的、由<a class="wiki-link" href="/entry/%E4%B9%94%E6%B2%BB%C2%B7%E8%89%BE%E4%BC%A6%E4%B8%8E%E6%98%82%E6%B8%A9%E5%87%BA%E7%89%88%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/">乔治·艾伦与昂温出版社</a>出版于1970年的<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>西北部地图。</p>
