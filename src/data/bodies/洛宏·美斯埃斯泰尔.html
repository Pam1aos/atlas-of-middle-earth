<h1>洛宏·美斯埃斯泰尔</h1>
<p><strong>洛宏·美斯埃斯泰尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Rochon_Methestel" target="_blank" rel="noopener noreferrer">Rochon Methestel</a></strong>），意即**“身负最后希望的骑手”**，是一首记载了<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>士兵<a class="wiki-link" href="/entry/%E6%B3%A2%E9%9A%86%E8%BF%AA%E5%B0%94/">波隆迪尔·乌达尔拉夫</a>的壮举的歌谣。波隆迪尔是一位勇敢且技艺高超的骑手，<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E5%85%B0%E7%89%B9%E5%8E%9F%E9%87%8E%E4%B9%8B%E6%88%98/">凯勒布兰特原野之战</a>中，波隆迪尔指引着<a class="wiki-link" href="/entry/%E5%9F%83%E5%A5%A5%E5%B0%94/">埃奥尔</a>的援军及时赶到扭转了战局，而他本人却不幸身亡。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><em><strong>Rochon Methestel</strong></em> 在<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中意为“身负最后希望的骑手”。其中 <em>rochon</em> 意为“骑手”；<em>meth</em> 来自词根<code>MET</code>，意为“最后”；<em>estel</em> 意为“希望”。</p>
