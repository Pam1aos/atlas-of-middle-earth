<p>John Howe</p>
<p><strong>斯那嘎</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Snaga" target="_blank" rel="noopener noreferrer">Snaga</a></strong>），是<a class="wiki-link" href="/entry/%E4%B9%8C%E9%B2%81%E5%85%8B%E6%97%8F/">乌鲁克族</a>对普通<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>的一种侮辱性名称。在<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>和<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7/">艾森加德</a>等地，强壮善战的乌鲁克族士兵经常用这个词来称呼矮小猥琐的其他种类奥克。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>词源分析</h2>
<p>斯那嘎（Snaga）一词来自<a class="wiki-link" href="/entry/%E9%BB%91%E8%AF%AD/">黑语</a>，意为“奴隶”。</p>
