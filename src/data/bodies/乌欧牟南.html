<h1>乌欧牟南</h1>
<blockquote>
<p><strong>这个词条描述的对象仅出现于《失落的传说》，即<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>的原始版本。</strong> 慎将该作设定套用至其他作品，它们可能产生矛盾。</p>
</blockquote>
<p><strong>乌欧牟南</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ulmonan" target="_blank" rel="noopener noreferrer">Ulmonan</a></strong>）只出现在早期版本的故事中，是<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a><a class="wiki-link" href="/entry/%E4%B9%8C%E6%AC%A7%E7%89%9F/">乌欧牟</a>位于<a class="wiki-link" href="/entry/%E5%9F%83%E5%87%AF%E4%BA%9A%E6%B5%B7/">外环海</a>的殿堂。</p>
