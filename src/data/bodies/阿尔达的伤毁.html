<h1>阿尔达的伤毁</h1>
<p><strong>阿尔达的伤毁</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Marring_of_Arda" target="_blank" rel="noopener noreferrer">The Marring of Arda</a></strong>），是托尔金作品的一个重要概念，即世界原本尽善尽美，但因<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>的恶行而遭到伤毁，这伤毁又给世界添加了难以言传的美和哀伤。遭到伤毁的世界又被称为“被伤毁的阿尔达”（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Arda_Marred" target="_blank" rel="noopener noreferrer">Arda Marred</a></strong>）。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
