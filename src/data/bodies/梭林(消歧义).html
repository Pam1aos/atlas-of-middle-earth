<p><strong>梭林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/_Thorin_(disambiguation" target="_blank" rel="noopener noreferrer">Thorin</a>)</strong>）是一个<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>名字，可以指以下人物。</p>
<ul>
<li>梭林一世（第三纪元2035年 - 2289年），带领矮人离开孤山前往灰色山脉的矮人国王。</li>
<li>梭林二世（橡木盾，第三纪元2746年 - 2941年），霍比特人中矮人们的领袖，带领矮人们收复孤山。</li>
<li>梭林三世（石盔，生于第三纪元2866年），铁足戴因之子，第四纪元的山下之王。</li>
</ul>
