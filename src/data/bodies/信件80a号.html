<p><strong>信件80a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_80a" target="_blank" rel="noopener noreferrer">Letter 80a</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给G·E·塞尔比的一封信，写信日期为1944年9月19日。<a class="wiki-link" href="/entry/%E6%99%AE%E8%8E%89%E8%A5%BF%E6%8B%89%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">普莉西拉·托尔金</a>正在用打字机打<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">《魔戒》</a><sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金亲自向塞尔比问好。他注意到他的女儿普莉西拉正在打《魔戒》的前几章，他认为“如果他们能找到足够的纸的话，<a class="wiki-link" href="/entry/%E4%B9%94%E6%B2%BB%C2%B7%E8%89%BE%E4%BC%A6%E4%B8%8E%E6%98%82%E6%B8%A9%E5%87%BA%E7%89%88%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/">乔治·艾伦与昂温出版社</a>可以接手。”</p>
