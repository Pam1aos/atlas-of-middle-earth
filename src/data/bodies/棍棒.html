<h1>棍棒</h1>
<p><strong>棍棒</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Clubs" target="_blank" rel="noopener noreferrer">Clubs</a></strong>），是<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>比较常见的一类武器。最著名的棍棒使用者是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E6%97%8F/">诺多</a>贵族<a class="wiki-link" href="/entry/%E7%BB%BF%E6%A0%91%E5%AE%B6%E6%97%8F/">绿树家族</a>，他们以镶有钢钉的棍棒作为武器，实际上类似于狼牙棒。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
