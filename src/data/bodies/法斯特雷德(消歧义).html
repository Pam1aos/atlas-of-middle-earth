<p><strong>法斯特雷德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fastred_(disambiguation" target="_blank" rel="noopener noreferrer">Fastred</a>)</strong>）可以指：</p>
<ul>
<li>法斯特雷德（卒于第三纪元2885年），洛汗国王伏尔克威奈之子，和双胞胎哥哥伏尔克雷德战死于波罗斯河渡口之战。</li>
<li>法斯特雷德（卒于第三纪元3019年），洛汗骑士，战死于佩兰诺平野之战。</li>
<li>法斯特雷德·美裔（第四纪元），或称绿丘的法斯特雷德，是埃拉诺·加德纳的丈夫，第一代西界守护。</li>
</ul>
