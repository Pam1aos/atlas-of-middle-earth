<h1>顽固家族</h1>
<p><strong>顽固家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Headstrong_Family" target="_blank" rel="noopener noreferrer">Headstrong Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。该家族唯一已知人员<a class="wiki-link" href="/entry/%E7%8E%9B%E5%B0%94%E5%A8%83%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">玛尔娃·顽固</a>嫁给了<a class="wiki-link" href="/entry/%E6%88%88%E9%A9%AC%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">戈马道克·白兰地鹿</a>，二人育有三子。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92III-%E7%8E%8B%E8%80%85%E5%BD%92%E6%9D%A5/">魔戒III-王者归来</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E9%99%84%E5%BD%95%E4%B8%89/">附录三 家族谱系（霍比特人）</a>。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
