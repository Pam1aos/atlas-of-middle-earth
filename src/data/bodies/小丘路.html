<h1>小丘路</h1>
<p><strong>小丘路</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hill_Road" target="_blank" rel="noopener noreferrer">Hill Road</a></strong>）是一条从<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>通向<a class="wiki-link" href="/entry/%E8%BF%87%E5%B1%B1%E6%9D%91/">过山村</a>的道路，从<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>附近绕过。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年9月23日<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>晚间，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>在小丘路上走着，焦急地等待着<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>的到来。此时，他听到了<a class="wiki-link" href="/entry/%E8%A2%8B%E4%B8%8B%E8%B7%AF/">袋下路</a>的拐角处，<a class="wiki-link" href="/entry/%E6%B1%89%E5%A7%86%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">老甘姆吉</a>在与一位陌生人谈话，前者听起来颇为恼火。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
