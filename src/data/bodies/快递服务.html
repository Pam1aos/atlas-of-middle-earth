<h1>快递服务</h1>
<p><strong>快递服务</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Quick_Post" target="_blank" rel="noopener noreferrer">Quick Post</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%82%AE%E9%80%92%E6%9C%8D%E5%8A%A1/">邮递服务</a>的一部分，它可能是在夏尔境内传递消息的最快方法。快递服务的具体运作方式不详，或许是由数名信差接力寄送。</p>
<p><a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>及<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>占领夏尔期间，禁止普通民众使用快递服务，但自己仍通过快递传送情报。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年10月31日晚，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>返回夏尔之后，快递邮差立刻将这条消息送到了<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87/">傍水镇</a>。次日下午，傍水镇的命令传到<a class="wiki-link" href="/entry/%E8%9B%99%E6%B3%BD%E5%B1%AF/">蛙泽屯</a>，要求逮捕弗罗多等人。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
