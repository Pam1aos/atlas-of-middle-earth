<h1>乌路慕瑞</h1>
<p><strong>乌路慕瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ulumúri" target="_blank" rel="noopener noreferrer">Ulumúri</a></strong>）是<a class="wiki-link" href="/entry/%E8%90%A8%E5%B0%94%E7%8E%9B/">萨尔玛</a>为<a class="wiki-link" href="/entry/%E4%B9%8C%E6%AC%A7%E7%89%9F/">乌欧牟</a>制作的大号角。它由白色贝壳制成，听过它声响的人将永生难忘，他们再也不能摆脱对大海的渴望。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
