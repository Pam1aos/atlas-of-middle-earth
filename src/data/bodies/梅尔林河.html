<p><strong>梅尔林河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mering_Stream" target="_blank" rel="noopener noreferrer">Mering Stream</a></strong>）是<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>上的一条河流，在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>时构成了<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>与<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>之间的边界。</p>
<h2>地理</h2>
<p>梅尔林河发源于<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">埃瑞德宁莱斯</a>山脉的菲瑞恩山谷，流经<a class="wiki-link" href="/entry/%E8%8F%B2%E7%91%9E%E6%81%A9%E9%9C%8D%E5%B0%94%E7%89%B9/">菲瑞恩霍尔特</a>，最后汇入<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E6%B2%B3/">恩特河</a>，在交汇处有着难以逾越的沼泽<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。它的西岸是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的<a class="wiki-link" href="/entry/%E4%B8%9C%E4%BC%8F%E5%B0%94%E5%BE%B7/">东伏尔德</a>，东岸是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的<a class="wiki-link" href="/entry/%E9%98%BF%E8%AF%BA%E7%91%9E%E6%81%A9/">阿诺瑞恩</a>。可在梅尔林河渡口处渡过河流。</p>
<h2>名称释义</h2>
<p>“梅尔林河”这个名字来自于洛汗语，在辛达语中，被称为“格蓝希尔河”，二者意思均为“界河”。</p>
