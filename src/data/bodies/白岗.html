<p><strong>白岗</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/White_Downs" target="_blank" rel="noopener noreferrer">White Downs</a></strong>），是位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>的一片丘陵，<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>就在此处。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>每七年的<a class="wiki-link" href="/entry/%E8%8E%B1%E6%96%AF%E6%97%A5/">莱斯日</a>，<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>在这里举行为期三天的<a class="wiki-link" href="/entry/%E8%87%AA%E7%94%B1%E9%9B%86%E4%BC%9A/">自由集会</a>，并推选出下一任<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87%E5%B8%82%E9%95%BF/">大洞镇市长</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
