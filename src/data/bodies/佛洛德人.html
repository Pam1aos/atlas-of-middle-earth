<h1>佛洛德人</h1>
<p><strong>佛洛德人</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Forodwaith_(people" target="_blank" rel="noopener noreferrer">Forodwaith</a>)</strong>），是<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>大陆极北地区的一支神秘的民族，他们在那里的定居史似乎可以追溯远古的<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>。佛洛德人性情坚毅，他们设法适应了冰天雪地和邪恶力量的肆虐，创造出一套独特的生活方式，北方的雪原也因他们而命名为佛洛德地区。到了<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>，佛洛德人已经十分稀少了，他们最后的残余是一支生活在<a class="wiki-link" href="/entry/%E4%BD%9B%E6%B4%9B%E8%B5%AB%E5%B0%94%E5%86%B0%E6%B9%BE/">佛洛赫尔冰湾</a>附近的、叫作<a class="wiki-link" href="/entry/%E6%B4%9B%E6%96%AF%E7%B4%A2%E6%96%AF%E4%BA%BA/">洛斯索斯人</a>的古怪民族。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>佛洛德人是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，它由<code>forod</code>（北方）和<code>gwaith</code>（民族）两个部分构成。</p>
