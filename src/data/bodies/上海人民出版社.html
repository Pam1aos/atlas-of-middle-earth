<h1>上海人民出版社</h1>
<p><strong>上海人民出版社</strong>，是一家出版各学科各专业的综合性图书出版机构，成立于1951年3月，如今是上海世纪出版集团成员之一。<a class="wiki-link" href="/entry/%E5%8C%97%E4%BA%AC%E4%B8%96%E7%BA%AA%E6%96%87%E6%99%AF%E6%96%87%E5%8C%96%E4%BC%A0%E6%92%AD%E5%85%AC%E5%8F%B8/">北京世纪文景</a>的“托尔金在文景”系列书籍均由该出版社出版。</p>
