<h1>梭隆努米</h1>
<p><strong>梭隆努米</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Soronúmë" target="_blank" rel="noopener noreferrer">Soronúmë</a></strong>）是<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生子女</a>创造的星座。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与语源</h2>
<p>梭隆努米(Soronúmë)在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅</a>中的意思是“西方之鹰”：soron，“老鹰”；númë，“西方的”。因此它可能对应现实中的天鹰座。</p>
