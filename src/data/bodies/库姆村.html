<p><strong>库姆村</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Combe" target="_blank" rel="noopener noreferrer">Combe</a></strong>）是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E5%9C%B0%E5%8C%BA/">布理地区</a>的一处村庄。它位于<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>东边的深谷中、<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>北边。</p>
<h2>魔戒大战时的库姆村</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年9月30日，许多居民从库姆村赶去<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>，目送<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>和<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>一行人出发。而在<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>等人沿着东大道走时，他们看见了库姆村缕缕上升的炊烟。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
