<p><strong>砾斯拉德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lithlad" target="_blank" rel="noopener noreferrer">Lithlad</a></strong>），是<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>的北方山障<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%BE%B7%E7%A0%BE%E8%8B%8F%E4%BC%8A/">埃瑞德砾苏伊</a>下的灰烬平原。它坐落在魔多的东部，<a class="wiki-link" href="/entry/%E6%88%88%E5%9F%9A%E6%B4%9B%E6%96%AF%E5%B9%B3%E5%8E%9F/">戈埚洛斯</a>与<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E7%9D%A3%E5%B0%94/">巴拉督尔</a>以东。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><em><strong>Lithlad</strong></em> 在<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中意为“灰烬平原”，由 <em>lith</em>（“灰烬”）和 <em>lad</em>（“平原”）组成。</p>
