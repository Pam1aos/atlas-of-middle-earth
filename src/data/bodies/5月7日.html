<h1>5月7日</h1>
<h2>现实世界</h2>
<ul>
<li>1908年－演员瓦伦泰恩·戴尔出生。他为1955年版《魔戒》广播剧配音，饰希奥顿和树须。</li>
<li>1957年－J·R·R·托尔金前往剑桥观看中古英语作品《隐修女指南》的手稿。</li>
<li>1969年－制片人里克·波拉斯出生，他参与制作了《指环王》系列电影》。</li>
<li>2009年－《电影圣经：〈指环王〉拍摄设备的架构与使用》（Cinematic Scripture: The Structure and Usage of The Lord of the Rings as Equipment for Living）出版。</li>
</ul>
