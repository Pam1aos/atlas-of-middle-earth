<h1>第三纪元2510年</h1>
<ul>
<li>3月10日－刚铎宰相奇瑞安向伊奥希奥德人派出使者求援。</li>
<li>3月25日－刚铎使者波隆迪尔向伊奥希奥德人首领埃奥尔传达了宰相奇瑞安的求援口信，埃奥尔决定发起大规模驰援。</li>
<li>4月6日－伊奥希奥德人在首领埃奥尔的带领下出发驰援刚铎。</li>
<li>4月13日－伊奥希奥德大军接近多古尔都，洛丝罗瑞恩散出白雾驱退阴影，遮蔽大军的动向。</li>
<li>4月15日－奇瑞安领导的刚铎北路军在北高原被巴尔寇斯人击败后被赶过利姆清河，接着遭到奥克大军袭击，被迫退往安都因河。埃奥尔率伊奥希奥德大军自北方赶到，攻入敌人后方，取得了凯勒布兰特原野之战的胜利。</li>
</ul>
