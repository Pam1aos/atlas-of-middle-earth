<h1>青铜之门</h1>
<p><strong>青铜之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Bronze" target="_blank" rel="noopener noreferrer">Gate of Bronze</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第三道大门。青铜之门分两扇，挂满了青铜盾和青铜盘。门楣上方有三座方塔，塔面和塔顶都覆铜。城墙上则是盏盏红灯。门后庭院的卫士大多是来自<a class="wiki-link" href="/entry/%E5%A5%88%E8%8A%99%E6%8B%89%E6%96%AF%E7%89%B9/">奈芙拉斯特</a>的<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E6%97%8F/">辛达族</a>精灵，他们的铠甲如闷燃之火般发光，战斧的锋刃是红色的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>青铜之门后面的一道大门是<a class="wiki-link" href="/entry/%E7%BB%9E%E9%93%81%E4%B9%8B%E9%97%A8/">绞铁之门</a>。在这两道大门之间的路段最难攀爬。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
