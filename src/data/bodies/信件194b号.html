<p><strong>信件194b号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter194b" target="_blank" rel="noopener noreferrer">Letter194b</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1956年11月24日。托尔金回答了关于<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">《魔戒》</a>的荷兰语译本<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金表示，他没有足够的时间对译文进行仔细审查，而且他认为即便进行仔细审查也无法使译文得到改进。他还重申了自己的观点，即翻译名称是不正确的做法。</p>
