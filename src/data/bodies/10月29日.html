<h1>10月29日</h1>
<h2>现实世界</h2>
<ul>
<li>1925年－演员保罗·达纳曼出生。他为1968年版《霍比特人》广播剧配音，饰比尔博·巴金斯。</li>
<li>1938年－导演拉尔夫·巴克希出生，他指导了1978年版《魔戒》动画电影的拍摄。</li>
<li>1939年－演员伊丽莎白·穆迪出生。她在《指环王：护戒使者》中扮演洛比莉亚·萨克维尔-巴金斯。</li>
<li>1963年－演员杰德·布罗菲出生，他在《霍比特人》系列电影中扮演诺瑞。</li>
<li>2010年－游戏《指环王：阿拉贡的冒险》在欧洲发布。</li>
<li>2020年－百年纪念版《圣诞老爸的来信》出版。</li>
</ul>
