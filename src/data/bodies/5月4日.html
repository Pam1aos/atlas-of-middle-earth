<h1>5月4日</h1>
<h2>现实世界</h2>
<ul>
<li>1944年－J·R·R·托尔金写下一封信（信件65号）。</li>
<li>1958年－J·R·R·托尔金写下一封信（信件209号）。</li>
<li>1981年－演员特里斯坦·格拉韦尔（Trystan Gravelle）出生，他在电视剧《指环王：力量之戒》中饰演阿尔-法拉宗。</li>
<li>2003年－艺术家本杰明·詹姆斯·李去世。他生前是托尔金学社的活跃成员。</li>
<li>2012年－《J·R·R·托尔金：真正的众戒之主》（JRR Tolkien: The True Lord of the Rings）出版。</li>
<li>2017年－《贝伦与露西恩》出版。</li>
</ul>
