<h1>路姆比</h1>
<p><strong>路姆比</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lumbi" target="_blank" rel="noopener noreferrer">Lumbi</a></strong>）是在<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>的早期内容中，<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>首次被<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a>抓住之后关押的居所。<a class="wiki-link" href="/entry/%E7%BA%B3%E7%89%9F/">曼督斯</a>的猎犬<a class="wiki-link" href="/entry/%E6%88%88%E5%8F%A4%E8%8E%AB%E6%96%AF/">戈古莫斯</a>在这里看守着米尔寇。</p>
<p>路姆比的另一个名称是路姆法德（Lumfad）<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<p>路姆比和戈古莫斯都在正式出版的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB%E5%BE%81%E6%88%98%E5%8F%B2(%E6%B6%88%E6%AD%A7%E4%B9%89)/">精灵宝钻征战史</a>中移除。</p>
