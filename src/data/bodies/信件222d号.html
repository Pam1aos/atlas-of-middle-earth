<p><strong>信件222d号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter222d" target="_blank" rel="noopener noreferrer">Letter222d</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E4%B9%94%E6%B2%BB%C2%B7%E8%89%BE%E4%BC%A6%E4%B8%8E%E6%98%82%E6%B8%A9%E5%87%BA%E7%89%88%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/">乔治·艾伦与昂温出版社</a>的一封信，写信日期为1960年3月1日。托尔金收到了出版社的赠书<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金写信给他的出版商说，他收到了五本<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">《魔戒》</a>瑞典语译本的赠书。他说他对此没有异议，如果弄错了，他可以寄回一些。</p>
