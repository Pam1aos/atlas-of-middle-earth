<h1>捆粮林</h1>
<p><strong>捆粮林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bindbole_Wood" target="_blank" rel="noopener noreferrer">Bindbole Wood</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一片小树林。它位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E5%8C%97%E5%8C%BA/">北区</a>南部。</p>
<h2>名称问题</h2>
<p>“捆粮林”一词仅仅出现于<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>为<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>绘制的地图上。但是在1954年版<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E4%B9%A6%E7%B1%8D)/">《魔戒》</a>的地图中，由于印刷问题，“Bindbole”中的字母“o”模糊不清，显得像是字母“a”。这个错误的拼写以讹传讹、流传很广，它不仅出现在很多他人绘制的地图或是编写的参考书籍里，甚至连<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>本人也曾错误地采用过这一写法。</p>
