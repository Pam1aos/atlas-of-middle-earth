<p><strong>大半兽人</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hobgoblins" target="_blank" rel="noopener noreferrer">Hobgoblins</a></strong>），是指体型比普通<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">半兽人</a>更大的一种半兽人。埃瑞博远征期间，<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>提醒<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>，在<a class="wiki-link" href="/entry/%E7%81%B0%E8%89%B2%E5%B1%B1%E8%84%89/">灰色山脉</a>的山坡上到处都是半兽人和大半兽人。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>灵感来源</h2>
<p>Hobgoblins 的原意是指英国民间传说中喜欢恶作剧的炉灶小妖精。托尔金在书信中承认，自己将 Hobgoblins 描述为体型较大的生物，实际上偏离了该词的本意。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
