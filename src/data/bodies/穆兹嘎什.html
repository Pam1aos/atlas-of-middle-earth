<p><strong>穆兹嘎什</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Muzgash" target="_blank" rel="noopener noreferrer">Muzgash</a></strong>）是一名<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F/">奇立斯乌苟</a>塔楼的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>，隶属<a class="wiki-link" href="/entry/%E6%B2%99%E6%A0%BC%E6%8B%89%E7%89%B9/">沙格拉特</a>的队伍。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月14日，沙格拉特的队伍和<a class="wiki-link" href="/entry/%E6%88%88%E5%B7%B4%E6%A0%BC/">戈巴格</a>的队伍起了内讧。内讧中，穆兹嘎什和另一名奥克<a class="wiki-link" href="/entry/%E6%8B%89%E6%A0%BC%E9%83%BD%E5%A4%AB/">拉格都夫</a>一起逃离塔楼，但他俩都被射杀。当<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆·甘姆吉</a>冲进塔楼救援<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>时，恰好目睹了他们被射杀的一幕<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
