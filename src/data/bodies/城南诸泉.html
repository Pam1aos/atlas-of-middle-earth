<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>城南诸泉</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fountains_of_the_South" target="_blank" rel="noopener noreferrer">Fountains of the South</a></strong>），是指<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>南部的众多泉水，<a class="wiki-link" href="/entry/%E6%B5%81%E6%B0%B4%E4%B9%8B%E8%B7%AF/">流水之路</a>经过城南诸泉。城南诸泉的呢喃水声使刚多林南城的居民变得最精通音乐之道。<a class="wiki-link" href="/entry/%E5%9F%83%E5%85%8B%E5%A1%9E%E7%90%86%E5%AE%89/">埃克塞理安</a>领导的<a class="wiki-link" href="/entry/%E6%B6%8C%E6%B3%89%E5%AE%B6%E6%97%8F/">涌泉家族</a>住在城南诸泉附近。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
