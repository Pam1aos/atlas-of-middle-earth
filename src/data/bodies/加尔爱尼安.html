<p>《失落的传说之书》版本</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>加尔爱尼安</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gar_Ainion" target="_blank" rel="noopener noreferrer">Gar Ainion</a></strong>），意为<strong>诸神之地</strong>，是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a><a class="wiki-link" href="/entry/%E7%8E%8B%E5%AE%AB%E5%B9%BF%E5%9C%BA/">王宫广场</a>南面附近的一片开阔地，和王宫广场通过<a class="wiki-link" href="/entry/%E5%85%B8%E7%A4%BC%E5%A4%A7%E9%81%93/">典礼大道</a>相连，它的中央是刚多林全城的最高点。<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>和<a class="wiki-link" href="/entry/%E4%BC%8A%E7%BC%80%E5%B0%94/">伊缀尔</a>的婚礼就是在加尔爱尼安举办。</p>
<p>刚多林陷落之战中，<a class="wiki-link" href="/entry/%E4%BC%8A%E7%BC%80%E5%B0%94/">伊缀尔</a>将埃雅仁德尔送进<a class="wiki-link" href="/entry/%E4%BC%8A%E7%BC%80%E5%B0%94%E7%9A%84%E5%AF%86%E9%81%93/">出城密道</a>后，因为久候不得<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>的消息，她误以为丈夫已经牺牲，心神狂乱地在城中游走，<a class="wiki-link" href="/entry/%E6%B2%83%E9%9A%86%E5%A8%81/">沃隆威</a>保护着她来到加尔爱尼安。在这里，伊缀尔重逢了从<a class="wiki-link" href="/entry/%E7%8E%8B%E5%AE%AB%E5%B9%BF%E5%9C%BA/">王宫广场</a>撤退下来的<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>和其他幸存者，他们一起远眺目睹了<a class="wiki-link" href="/entry/%E7%8E%8B%E4%B9%8B%E5%A1%94/">王之塔</a>的崩塌。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
