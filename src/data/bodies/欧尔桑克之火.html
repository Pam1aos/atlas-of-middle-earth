<p>欧尔桑克</p>
<p>John Howe</p>
<p><strong>欧尔桑克之火</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fire_of_Orthanc" target="_blank" rel="noopener noreferrer">Fire of Orthanc</a></strong>），是白袍巫师<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>发明的一种神秘的爆炸性物质。这种武器被投入于海尔姆深谷之战中，<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>的军队用它炸开了<a class="wiki-link" href="/entry/%E6%B7%B1%E8%B0%B7%E9%98%B2%E5%BE%A1%E5%A2%99/">深谷防御墙</a>，得以长驱直入，而<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>守军被迫撤退到<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>内。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
