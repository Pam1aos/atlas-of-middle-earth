<h1>安德拉斯</h1>
<p><strong>安德拉斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Andrath" target="_blank" rel="noopener noreferrer">Andrath</a></strong>），位于<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>西北部的<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>地区。它是一条夹在<a class="wiki-link" href="/entry/%E5%8F%A4%E5%86%A2%E5%B2%97/">古冢岗</a>（位于西侧）和<a class="wiki-link" href="/entry/%E5%8D%97%E5%B2%97/">南岗</a>（位于东侧）之间的、南北走向的狭窄隘路，<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">南北大道</a>从中通过。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年，当九位<a class="wiki-link" href="/entry/%E9%82%A3%E5%85%B9%E5%8F%A4%E5%B0%94/">戒灵</a>北上<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>、搜寻<a class="wiki-link" href="/entry/%E8%87%B3%E5%B0%8A%E6%88%92/">至尊戒</a>时，他们的统帅<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8E%9B%E5%B7%AB%E7%8E%8B/">安格玛巫王</a>在安德拉斯扎营。他从此地派出几名<a class="wiki-link" href="/entry/%E9%82%A3%E5%85%B9%E5%8F%A4%E5%B0%94/">戒灵</a>去监视<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的东部边境，自己则前往安德拉斯西侧的<a class="wiki-link" href="/entry/%E5%8F%A4%E5%86%A2%E5%B2%97/">古冢岗</a>，唤醒了彼地的<a class="wiki-link" href="/entry/%E5%8F%A4%E5%86%A2%E5%B0%B8%E5%A6%96/">古冢尸妖</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
