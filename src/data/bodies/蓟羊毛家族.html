<h1>蓟羊毛家族</h1>
<p><strong>蓟羊毛家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Thistlewool_Family" target="_blank" rel="noopener noreferrer">Thistlewool Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>的人类家族。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>Thistlewool可能是英语中thistle-down（意为“蓟种子冠毛”）的同义词。值得一提的是，wool还有植物绒毛的意思。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p>Thistlewool在一些版本中也被拼作“Thistlewood”。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
