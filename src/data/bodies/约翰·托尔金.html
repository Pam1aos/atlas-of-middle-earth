<p><strong>约翰·弗朗西斯·鲁埃尔·托尔金</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/John_Tolkien" target="_blank" rel="noopener noreferrer">John Francis Reuel Tolkien</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>和<a class="wiki-link" href="/entry/%E4%BC%8A%E8%BF%AA%E4%B8%9D%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">伊迪丝·托尔金</a>的长子。他名字中的“弗朗西斯”来自于J.R.R. 托尔金的监护人<a class="wiki-link" href="/entry/%E5%BC%97%E6%9C%97%E8%A5%BF%E6%96%AF%C2%B7%E6%91%A9%E6%A0%B9/">弗朗西斯神父</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
