<h1>斑马</h1>
<p><strong>斑马</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Zebras" target="_blank" rel="noopener noreferrer">Zebras</a></strong>），是一种仅在<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的早期语言学文稿中被提及的动物。根据文稿，斑马的<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A7%86%E6%97%8F%E8%AF%AD/">诺姆族语</a>名字是<code>raibrog</code>，母斑马的名字是<code>raibros</code>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
