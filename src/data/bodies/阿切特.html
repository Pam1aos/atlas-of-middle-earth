<p><strong>阿切特</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Archet" target="_blank" rel="noopener noreferrer">Archet</a></strong>）是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>附近的小村庄，也是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E5%9C%B0%E5%8C%BA/">布理地区</a>最偏远的村镇。它位于<a class="wiki-link" href="/entry/%E5%88%87%E7%89%B9%E6%A3%AE%E6%9E%97/">切特森林</a>的边缘，隐藏在森林的树荫里。</p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年9月30日，在<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>领着<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>一行离开<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>后，他们假装前往阿切特；但是，后来他们向东转，从阿切特的东边离开了布理地区。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，强盗躲在阿切特附近的森林里，抢劫布理人和旅人。不过<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>预言：在国王的使者来到北方后，这帮强盗会被驱逐出去。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
