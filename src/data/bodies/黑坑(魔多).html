<h1>黑坑(魔多)</h1>
<blockquote>
<p>本词条叙述的对象是巴拉督尔的地牢。想要了解墨瑞亚的别称，请参看<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">卡扎督姆</a>。</p>
</blockquote>
<p><strong>黑坑</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Black_Pits" target="_blank" rel="noopener noreferrer">Black Pits</a></strong>） 是<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E7%9D%A3%E5%B0%94/">巴拉督尔</a>之下的黑暗地牢。<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F%E4%B9%8B%E5%A1%94/">奇立斯乌苟之塔</a>的<a class="wiki-link" href="/entry/%E6%B2%99%E6%A0%BC%E6%8B%89%E7%89%B9/">沙格拉特</a>曾在咒骂中提及“叫<a class="wiki-link" href="/entry/%E6%88%88%E5%B7%B4%E6%A0%BC/">戈巴格</a>那个肮脏的叛徒下黑坑去！”，并威胁手下如果不把消息送到路格布尔兹（即“邪黑塔”巴拉督尔），“咱俩都会下黑坑去”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
