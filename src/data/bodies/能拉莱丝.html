<p><strong>能拉莱丝</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nen_Lalaith" target="_blank" rel="noopener noreferrer">Nen Lalaith</a></strong>），是一条源自<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%BE%B7%E5%A8%81%E6%96%AF%E6%9E%97/">黯影山脉</a><a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E8%BE%BE%E5%B8%8C%E5%B0%94/">阿蒙达希尔</a>山峰下的小溪。它向西北流入<a class="wiki-link" href="/entry/%E5%A4%9A%E5%B0%94%E7%BD%97%E6%98%8E/">多尔罗明</a>境内。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>它流经<a class="wiki-link" href="/entry/%E8%83%A1%E6%9E%97%C2%B7%E6%B2%99%E7%90%86%E5%AE%89/">胡林</a>的家宅。据说，胡林与<a class="wiki-link" href="/entry/%E5%A2%A8%E7%8E%9F%C2%B7%E5%9F%83%E5%88%97%E5%85%B9%E7%8E%9F/">墨玟</a>大女儿<a class="wiki-link" href="/entry/%E4%B9%8C%E5%B0%94%E7%8E%9F/">乌尔汶</a>的昵称“拉莱丝”就是因着这条小溪起的。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>词源解释</h2>
<p><em>Nen Lalaith</em> 意为“欢笑之水”：<em>nen</em> 意为“水”<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup>、<em>lalaith</em> 意为“欢笑”。<sup class="fn-ref"><a href="#fn-4" id="fnref-4">4</a></sup></p>
