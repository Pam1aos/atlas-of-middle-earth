<h1>Marya Filatova</h1>
<p><strong>Marya Filatova</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Marya_Filatova" target="_blank" rel="noopener noreferrer">Marya Filatova</a></strong>），<a class="wiki-link" href="/entry/1981%E5%B9%B4/">1981年</a>至今，是一位俄罗斯女艺术家。她绘制了很多魔戒人物主题的画作，尤其是那些其他艺术家鲜有人问津的人物。</p>
