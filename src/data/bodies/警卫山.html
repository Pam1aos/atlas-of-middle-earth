<p><strong>警卫山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hill_of_Guard" target="_blank" rel="noopener noreferrer">Hill of Guard</a></strong>），又称<strong>阿蒙提力斯</strong>，是<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>最东端的一座山丘，刚铎首都<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>就建在这座山上。在米那斯提力斯城大约第五层高度的地方，有一道狭窄的山肩连接着警卫山和白色山脉的主脉，为了防止敌人从山肩攀进城市，刚铎人在其周围修建了巨大的护墙。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“阿蒙提力斯”(Amon Tirith)是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>地名，意为“警卫之山”。</p>
