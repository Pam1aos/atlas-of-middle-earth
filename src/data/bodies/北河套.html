<h1>北河套</h1>
<p><strong>北河套</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/North_Undeep" target="_blank" rel="noopener noreferrer">North Undeep</a></strong>），是<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>流经<a class="wiki-link" href="/entry/%E5%8C%97%E9%AB%98%E5%8E%9F/">北高原</a>与<a class="wiki-link" href="/entry/%E8%A4%90%E5%9C%B0/">褐地</a>之间的两个河套中的较北的那个。北河套的上界与<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E5%85%B0%E7%89%B9%E5%8E%9F%E9%87%8E/">凯勒布兰特原野</a>接壤，<a class="wiki-link" href="/entry/%E5%88%A9%E5%A7%86%E6%B8%85%E6%B2%B3/">利姆清河</a>也是在此汇入安都因河。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E5%8F%8C%E6%B2%B3%E5%A5%97/">双河套</a>都有许多宽阔的浅滩，可以为军队提供方便的渡口。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>与<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的历史中均有多次使用记录。</p>
