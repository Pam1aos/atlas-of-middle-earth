<p>Abe Papakhian</p>
<p><strong>星辰穹顶</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dome_of_Stars" target="_blank" rel="noopener noreferrer">Dome of Stars</a></strong>），是刚铎王国旧都<a class="wiki-link" href="/entry/%E6%AC%A7%E6%96%AF%E5%90%89%E5%88%A9%E4%BA%9A%E6%96%AF/">欧斯吉利亚斯城</a>的一座雄伟的圆顶大殿，它位于欧斯吉利亚斯穹顶之塔的最高层，而这座高塔建在城市中央横跨<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>的巨桥上。星辰穹顶里放置着<a class="wiki-link" href="/entry/%E6%AC%A7%E6%96%AF%E5%90%89%E5%88%A9%E4%BA%9A%E6%96%AF%E6%99%B6%E7%9F%B3/">欧斯吉利亚斯晶石</a>：它是七颗<a class="wiki-link" href="/entry/%E5%B8%95%E8%93%9D%E6%8F%90%E5%B0%94/">真知晶石</a>中的主晶石，也是体积最庞大的晶石之一。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>1437年，欧斯吉利亚斯在<a class="wiki-link" href="/entry/%E4%BA%B2%E6%97%8F%E4%BA%89%E6%96%97/">刚铎内战</a>中遭到<a class="wiki-link" href="/entry/%E5%8D%A1%E6%96%AF%E5%A1%94%E7%B1%B3%E5%B0%94/">卡斯塔米尔</a>叛军围攻，星辰穹顶被毁，欧斯吉利亚斯晶石也落入<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>，从此不知所踪。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
