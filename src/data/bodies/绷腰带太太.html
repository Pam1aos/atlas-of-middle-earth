<p><strong>绷腰带太太</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mrs_Bracegirdle" target="_blank" rel="noopener noreferrer">Mrs. Bracegirdle</a></strong>），是电影<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%8A%A4%E6%88%92%E4%BD%BF%E8%80%85/">《指环王：护戒使者》</a>中原创的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Lori Dungey 饰演。</p>
<h2>生平</h2>
<p>绷腰带太太是应邀参加<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%E7%9A%84%E5%91%8A%E5%88%AB%E5%AE%B4%E4%BC%9A/">比尔博的告别宴会</a>的宾客之一。<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>在宴会上向她问好，并惊讶于她的孩子数量之多。</p>
