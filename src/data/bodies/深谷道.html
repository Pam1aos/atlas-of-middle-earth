<h1>深谷道</h1>
<p><strong>深谷道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Deeping-road" target="_blank" rel="noopener noreferrer">Deeping-road</a></strong>）是一条从<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>起，穿过<a class="wiki-link" href="/entry/%E6%B7%B1%E8%B0%B7%E5%AE%BD%E8%B0%B7/">深谷宽谷</a>向北，在<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E6%B2%B3%E6%B8%A1%E5%8F%A3/">艾森河渡口</a>以东与<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">南北大道</a>会合的路。也被描述为南北大道通往<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>的岔路，分岔向南的大道<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。在<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>绘制的地图，<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83%E6%9C%AB%E6%9C%9F%E7%9A%84%E4%B8%AD%E6%B4%B2%E8%A5%BF%E9%83%A8/">第三纪元末期的中洲西部</a>里，深谷道被标记在<a class="wiki-link" href="/entry/%E8%A5%BF%E4%BC%8F%E5%B0%94%E5%BE%B7/">西伏尔德</a>地区，是一条没有名字的虚线<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
