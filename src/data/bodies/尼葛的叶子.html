<p><strong>尼葛的叶子</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Leaf_by_Niggle" target="_blank" rel="noopener noreferrer">Leaf by Niggle</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>的一个短篇寓言故事，于1945年1月发表在《都柏林评论》上。托尔金曾在写作《魔戒》期间创作了两篇与中洲无关的短篇作品，即《尼葛的叶子》和<a class="wiki-link" href="/entry/%E5%93%88%E8%8E%AB%E5%86%9C%E5%A4%AB%E8%B4%BE%E5%B0%94%E6%96%AF/">《哈莫农夫贾尔斯》</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
