<h1>5月3日</h1>
<h2>现实世界</h2>
<ul>
<li>1966年－J·R·R·托尔金给罗杰·维哈尔斯特写了一封信。</li>
<li>1968年－作家迈克尔·D·C·德鲁特出生，他是《托尔金学术》的创始编辑。</li>
<li>1981年－《魔戒》广播剧第九集在BBC播出。</li>
<li>1989年－演员威廉·斯夸尔去世。他曾为1978年版《魔戒》电影配音，饰甘道夫。</li>
<li>1996年－作家、学者查尔斯·穆尔曼去世。他曾写过许多有关墨象社成员（包括托尔金）的文章。</li>
<li>2009年－粉丝电影《追捕咕噜》在网上发布。</li>
<li>2018年－平装本《贝伦与露西恩》出版。</li>
<li>2019年－传记电影《托尔金》在英国上映。</li>
</ul>
