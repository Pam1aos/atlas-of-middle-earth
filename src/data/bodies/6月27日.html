<h1>6月27日</h1>
<h2>现实世界</h2>
<ul>
<li>1925年－J·R·R·托尔金给牛津大学写了一封求职信（信件7号），希望担任盎格鲁—撒克逊学罗林森与博斯沃思讲席教授。</li>
<li>1944年－J·R·R·托尔金写下一封信（信件73a号）。</li>
<li>1953年－演员洛丽·霍尔特出生，她为2003年版游戏《指环王：王者无敌》配音，饰伊奥温，同时参与额外配音。</li>
<li>1972年－J·R·R·托尔金与薇拉·查普曼会面，他同意成为托尔金学社的名誉主席。</li>
<li>2001年－作家、插画家托芙·扬松去世。</li>
<li>2019年－第六届神话大会举办，为期四天（6月27日-30日）。</li>
</ul>
