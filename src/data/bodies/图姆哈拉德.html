<p><strong>图姆哈拉德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tumhalad" target="_blank" rel="noopener noreferrer">Tumhalad</a></strong>），是<a class="wiki-link" href="/entry/%E8%A5%BF%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">西贝烈瑞安德</a>的一片平原，地处<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>与这条河的支流<a class="wiki-link" href="/entry/%E9%87%91%E6%A0%BC%E6%BC%93%E6%96%AF%E6%B2%B3/">金格漓斯河</a>之间。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>495年，在这片原野上爆发了<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A7%86%E5%93%88%E6%8B%89%E5%BE%B7%E4%B9%8B%E6%88%98/">图姆哈拉德之战</a>，<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E5%BE%B7%E7%91%9E%E6%96%AF/">欧洛德瑞斯</a>和<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>率领<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>的精灵大军，对抗<a class="wiki-link" href="/entry/%E6%A0%BC%E5%8A%B3%E9%BE%99/">格劳龙</a>统率的<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8F%AD/">安格班</a>大军。此战以精灵的惨败告终，欧洛德瑞斯战死，图林逃回纳国斯隆德试图组织防守，结果为时已晚。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
