<p><strong>信件101号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_101" target="_blank" rel="noopener noreferrer">Letter 101</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给小儿子克里斯托弗的一封信，写信日期为1945年6月3日。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>内容梗概</h2>
<p>民防队正在举行一场解散游行，托尔金说他会拖着身子去参加。但他觉得这简直是一场闹剧。战争并未结束，已经结束的那部分也基本算是输了，战争总是会输的，而战争永无止境。这时候泄气可没什么好处。</p>
