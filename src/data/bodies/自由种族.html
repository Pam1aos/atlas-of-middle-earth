<h1>自由种族</h1>
<p><strong>自由种族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Free_Peoples" target="_blank" rel="noopener noreferrer">Free Peoples</a></strong>），即不受黑暗魔君<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>统治的种族。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>后期，黑暗魔君<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>直接统治着<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>、<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>和其他邪恶生物，另有包括<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%B7/">东夷</a>、<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7%E4%BA%BA/">哈拉德人</a>等在内的<a class="wiki-link" href="/entry/%E9%BB%91%E6%9A%97%E4%BA%BA%E7%B1%BB/">黑暗人类</a>与之结盟。因此，自由种族在这一时期是指<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>、<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>、<a class="wiki-link" href="/entry/%E6%9D%9C%E5%86%85%E4%B8%B9%E4%BA%BA/">杜内丹人</a>和<a class="wiki-link" href="/entry/%E4%B8%AD%E7%AD%89%E4%BA%BA%E7%B1%BB/">中等人类</a>，以及其他反抗索隆政权的种族。</p>
<p>护戒远征队的成员各自代表着中洲的主要自由种族：<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>属于<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>代表精灵，<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>代表<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>，<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>和<a class="wiki-link" href="/entry/%E6%B3%A2%E6%B4%9B%E7%B1%B3%E5%B0%94/">波洛米尔</a>代表人类。这是<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E9%9A%86%E5%BE%B7/">埃尔隆德</a>特意做出的安排。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
