<h1>安督利尔的剑鞘</h1>
<p><strong>安督利尔的剑鞘</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Andúril's_sheath" target="_blank" rel="noopener noreferrer">Andúril&#39;s sheath</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%BE%B7%E7%91%9E%E5%B0%94/">加拉德瑞尔夫人</a>赠予<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>的临别礼物。</p>
<p>当护戒远征队准备离开洛丝罗瑞恩森林时，森林的领主夫人<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%BE%B7%E7%91%9E%E5%B0%94/">加拉德瑞尔</a>为队伍中的每一位成员都准备了礼物，阿拉贡所获赠的是为他的宝剑<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E5%88%A9%E5%B0%94/">安督利尔</a>特制的剑鞘。剑鞘上覆盖着以金银雕刻出的花朵与树叶的图案，上面还用宝石镶嵌出精灵的<a class="wiki-link" href="/entry/%E5%A5%87%E5%B0%94%E6%96%AF%E5%AD%97%E6%AF%8D/">如尼文</a>，写的是安督利尔的名字和此剑的历史传承。据说，从这剑鞘中抽出来的剑，即使战败，也不会玷污或断裂。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
