<h1>4月25日</h1>
<h2>现实世界</h2>
<ul>
<li>1954年－J·R·R·托尔金写下一封信（信件144号）。</li>
<li>1966年－J·R·R·托尔金给雷纳·昂温写了一封信。</li>
<li>1985年－《自罗马发出的一条路：一份自传》（A Path from Rome: An Autobiography）出版，其中包含了一篇对J·R·R·托尔金的追忆。</li>
<li>1997年－《泰勒瑞族的欢乐》第10期出版。</li>
<li>2015年－魔戒中文维基官方微博建立。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元2941年－甘道夫拜访比尔博，比尔博拒绝了甘道夫的冒险提议。</li>
</ul>
