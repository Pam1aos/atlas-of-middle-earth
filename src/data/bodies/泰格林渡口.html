<p><strong>泰格林渡口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Crossings_of_Taeglin" target="_blank" rel="noopener noreferrer">Crossings of Taeglin</a></strong>）是位于<a class="wiki-link" href="/entry/%E6%B3%B0%E6%A0%BC%E6%9E%97%E6%B2%B3/">泰格林河</a>中游、<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%B8%8C%E5%B0%94%E6%A3%AE%E6%9E%97/">布瑞希尔森林</a>西南部的渡口。一条南北走向的古道在此与河道交叉。顺着道路，可向北穿过森林，进入<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E9%9A%98%E5%8F%A3/">西瑞安隘口</a>，最终抵达位于<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E8%A5%BF%E7%91%9E%E5%AE%89/">托尔西瑞安</a>的<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF(%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7)/">瞭望塔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
