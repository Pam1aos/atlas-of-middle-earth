<h1>维拉奇尔卡</h1>
<p><strong>维拉奇尔卡</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Valacirca" target="_blank" rel="noopener noreferrer">Valacirca</a></strong>）是位于<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>世界北方天空上的、排列成冠状的七颗大星，被称作“维拉的镰刀”，维拉<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>令它们在空中摆动，作为对黑暗魔君<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>的挑战，也预示着米尔寇在劫难逃的命运。</p>
<p>维拉奇尔卡即现实中的大熊星座，在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E4%B9%A6%E7%B1%8D)/">《魔戒》</a>里，它被<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>称为“镰刀星座”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
