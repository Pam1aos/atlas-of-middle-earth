<p><strong>信件248号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_248" target="_blank" rel="noopener noreferrer">Letter 248</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E6%96%AF%E5%9D%A6%E5%88%A9%C2%B7%E6%98%82%E6%B8%A9/">斯坦利·昂温</a>的一封信，写信日期为1963年10月5日。托尔金给昂温寄出了短篇小说集<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金给昂温寄去了即将出版的短篇小说集的素材。其中有一篇引言和一个建议给出的标题，《Tree and Leaf》。</p>
<p>托尔金随后告诉昂温，由于肩伤，他没有按时完成工作。</p>
