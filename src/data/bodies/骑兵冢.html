<h1>骑兵冢</h1>
<p><strong>骑兵冢</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mound_of_the_Riders" target="_blank" rel="noopener noreferrer">Mound of the Riders</a></strong>），是位于<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E6%B2%B3%E6%B8%A1%E5%8F%A3/">艾森河渡口</a>河中小洲上的坟冢，埋葬着在两次<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E6%B2%B3%E6%B8%A1%E5%8F%A3%E4%B9%8B%E6%88%98(%E6%B6%88%E6%AD%A7%E4%B9%89)/">艾森河渡口之战</a>中牺牲的<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>。墓冢周围砌了一圈石块，冢上插着许多长矛。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>艾森河渡口之战后，溃散的洛希尔人战士被<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>聚集起来，一部分人与<a class="wiki-link" href="/entry/%E8%A5%BF%E4%BC%8F%E5%B0%94%E5%BE%B7/">西伏尔德</a>的<a class="wiki-link" href="/entry/%E6%A0%BC%E9%87%8C%E5%A7%86%E5%8D%9A%E5%BE%B7/">格里姆博德</a>一道投向<a class="wiki-link" href="/entry/%E5%9F%83%E8%82%AF%E5%B8%83%E5%85%B0%E5%BE%B7/">埃肯布兰德</a>，另一部分人建立了这座坟冢，随后在<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E5%A4%AB%E6%B5%B7%E5%B0%94%E5%A7%86/">埃尔夫海尔姆</a>元帅的带领下回援<a class="wiki-link" href="/entry/%E5%9F%83%E5%A4%9A%E6%8B%89%E6%96%AF/">埃多拉斯</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
