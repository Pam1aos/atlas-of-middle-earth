<h1>猿猴</h1>
<blockquote>
<p>有天你会希望自己没有说过这句话。死猴子！</p>
<p>—— 乌格鲁克[1]</p>
</blockquote>
<p><strong>猿猴</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Apes" target="_blank" rel="noopener noreferrer">Apes</a></strong>）是一种灵长类动物，它们生活在<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>南方黑暗的森林中，而中洲北方似乎没有分布。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>也许因为猿猴智力较低的缘故，“猴子”在<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>之间是一句骂人的脏话。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
