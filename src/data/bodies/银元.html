<h1>银元</h1>
<p><strong>银元</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Silver_pennies" target="_blank" rel="noopener noreferrer">Silver pennies</a></strong>），是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期在<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86%E5%9C%B0%E5%8C%BA/">布理地区</a>流通的一种货币。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3018年9月30日的早晨，投宿<a class="wiki-link" href="/entry/%E8%B7%83%E9%A9%AC%E5%AE%A2%E6%A0%88/">跃马客栈</a>的<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>一行人发现自己的坐骑全被人放走了，同样丢失的还有马厩里其他人的马匹和牲口。他们不得不从奸诈的<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%C2%B7%E8%95%A8%E5%B0%BC/">比尔·蕨尼</a>手中以十二银元的价钱买下一匹骨瘦如柴的<a class="wiki-link" href="/entry/%E5%B0%8F%E9%A9%AC%E6%AF%94%E5%B0%94/">小马</a>，这是正常价格的三倍。跃马客栈的店主<a class="wiki-link" href="/entry/%E9%BA%A6%E6%9B%BC%C2%B7%E9%BB%84%E6%B2%B9%E8%8F%8A/">麦曼</a>帮忙偿付了这笔钱，同时又赔给<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>十八银元：虽然他算得上是布理的有钱人，但三十银元的损失还是令他心痛。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
