<p><strong>毛胡尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mauhúr" target="_blank" rel="noopener noreferrer">Mauhúr</a></strong>），是白袍巫师<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>手下的一名<a class="wiki-link" href="/entry/%E4%B9%8C%E9%B2%81%E5%85%8B%E6%97%8F/">乌鲁克族</a>士兵。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年2月26日，<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>的部队俘虏<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>，准备将两人押送返回<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7/">艾森加德</a>。毛胡尔随后奉萨茹曼之命，带领一支队伍前去接应他们。但是，当毛胡尔的部队抵达<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>附近时，他发现乌格鲁克已经遭到了<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>为首的<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>骑兵的围困。2月29日凌晨，毛胡尔率众冲击洛希尔人的包围网，结果一败涂地，毛胡尔本人很可能被杀，或是仓惶逃跑了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
