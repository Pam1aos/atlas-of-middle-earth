<p><strong>阿尔多</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Aldor_(film_character" target="_blank" rel="noopener noreferrer">Aldor</a>)</strong>），是<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E5%8F%8C%E5%A1%94%E5%A5%87%E5%85%B5/">《指环王：双塔奇兵》</a>中原创的<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>角色，由新西兰演员<a class="wiki-link" href="/entry/%E5%B8%83%E9%B2%81%E6%96%AF%C2%B7%E5%A5%A5%E6%99%AE%E8%8E%B1%E6%96%AF/">布鲁斯·奥普莱斯</a>饰演。</p>
<h2>生平</h2>
<p>阿尔多是一名年龄较长的<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>士兵，参加了<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1%E4%B9%8B%E6%88%98/">号角堡之战</a>。他轻举妄动，没有等到军令，就擅自射杀了一名<a class="wiki-link" href="/entry/%E4%B9%8C%E9%B2%81%E5%85%8B%E6%97%8F/">乌鲁克族</a>敌兵，导致<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>下的敌方部队提前发起进攻。无法得知他是否从战役中幸存。</p>
