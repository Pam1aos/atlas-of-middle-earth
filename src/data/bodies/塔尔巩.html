<p><strong>塔尔巩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Targon" target="_blank" rel="noopener noreferrer">Targon</a></strong>）是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期的一位<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>士兵，他是<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>城禁卫军的一员。</p>
<h2>生平</h2>
<p>魔戒大战期间，塔尔巩在禁卫军第三连队的仓库和食品室工作。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月9日，他为队友<a class="wiki-link" href="/entry/%E8%B4%9D%E7%91%9E%E5%88%9A%E5%BE%B7/">贝瑞刚德</a>和初到白城的<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>提供了食物。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
