<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>玫瑰巷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Alley_of_Roses" target="_blank" rel="noopener noreferrer">Alley of Roses</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一条街道，它是王之广场的北面入口。玫瑰巷原本是一处适合观赏或散步的胜地（顾名思义，可能是路边种植有玫瑰的花园街），但在<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E7%9A%84%E9%99%B7%E8%90%BD/">刚多林陷落</a>时被彻底摧毁，唯余漆黑的巷道。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E6%B0%91/">刚多林民</a>坚守王之广场的战斗中，玫瑰巷巷口的防线是被敌军攻破的第一处，一条<a class="wiki-link" href="/entry/%E6%81%B6%E9%BE%99/">恶龙</a>冲垮了此处的路障。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
