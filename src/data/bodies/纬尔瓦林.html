<h1>纬尔瓦林</h1>
<p><strong>纬尔瓦林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Wilwarin" target="_blank" rel="noopener noreferrer">Wilwarin</a></strong>）是<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生子女</a>创造的星座<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>，它可能对应现实中的仙后座<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
<h2>名字与词源</h2>
<p>纬尔瓦林（Wilwarin）在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中的意思是“<a class="wiki-link" href="/entry/%E8%9D%B4%E8%9D%B6/">蝴蝶</a>”。</p>
<p>在早期的版本中，它的名字是Vilvarin。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
