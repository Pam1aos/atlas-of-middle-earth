<p><strong>流亡者</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Exiles_(disambiguation" target="_blank" rel="noopener noreferrer">The Exiles</a>)</strong>）可能是指：</p>
<ul>
<li><p>流亡的诺多族，他们在费艾诺的鼓动下离开维林诺，流亡到贝烈瑞安德，建立了多个王国。</p>
</li>
<li><p>刚多林的流亡者，他们在刚多林陷落后逃到南塔斯仁，后来部分幸存者随图尔来到了西瑞安河口。</p>
</li>
<li><p>努门诺尔的流亡者，他们在努门诺尔岛沉没后逃到了中洲，建立了两个流亡王国。</p>
</li>
</ul>
