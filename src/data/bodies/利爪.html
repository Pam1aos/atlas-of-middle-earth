<h1>利爪</h1>
<p><strong>利爪</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Grip" target="_blank" rel="noopener noreferrer">Grip</a></strong>），是<a class="wiki-link" href="/entry/%E8%B1%86%E5%9B%AD%E5%BA%84/">豆园庄</a>主人<a class="wiki-link" href="/entry/%E5%86%9C%E5%A4%AB%E9%A9%AC%E6%88%88%E7%89%B9/">农夫马戈特</a>驯养的三条像狼一样的大狗之一（另外两条是<a class="wiki-link" href="/entry/%E5%B0%96%E7%89%99/">尖牙</a>和<a class="wiki-link" href="/entry/%E5%A4%A7%E7%8B%BC/">大狼</a>）。它生性凶猛，但对马戈特言听计从，以看家护院为己任。不过，当<a class="wiki-link" href="/entry/%E9%82%A3%E5%85%B9%E5%8F%A4%E5%B0%94/">那兹古尔</a>登门拜访马戈特、打探<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>的消息时，即使利爪也无法抵抗对方带来的恐惧，它嗅了嗅那兹古尔，就夹着尾巴惨叫着逃跑了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
