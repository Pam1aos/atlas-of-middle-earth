<p>詹姆斯·琼斯（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/James_Jones" target="_blank" rel="noopener noreferrer">James Jones</a></strong>），生于1927年。曾任校长、记者和剧作家，现退休居住牛津，把时间花在产出戏剧和私人出版上。他是一个沉默寡言的人，却用他强大的记忆力协助记录员<a class="wiki-link" href="/entry/%E5%B0%BC%E5%8F%A4%E6%8B%89%E6%96%AF%C2%B7%E5%90%89%E5%B0%94%E7%A6%8F%E5%BE%B7/">尼古拉斯·吉尔福德</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
