<p><strong>悍</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ghân" target="_blank" rel="noopener noreferrer">Ghân</a></strong>）是<a class="wiki-link" href="/entry/%E6%82%8D-%E4%B8%8D%E9%87%8C-%E6%82%8D/">悍-不里-悍</a>的父亲，悍-不里-悍显然是以他而命名的。除此之外，我们对悍一无所知。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
