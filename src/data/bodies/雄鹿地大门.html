<h1>雄鹿地大门</h1>
<p><strong>雄鹿地大门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Buckland_Gate" target="_blank" rel="noopener noreferrer">Buckland Gate</a></strong>），<strong>篱大门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hay_Gate" target="_blank" rel="noopener noreferrer">Hay Gate</a></strong>），<strong>北大门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/North_Gate" target="_blank" rel="noopener noreferrer">North Gate</a></strong>）均是在<a class="wiki-link" href="/entry/%E6%A0%91%E7%AF%B1/">树篱</a>北部尽头的一座大门的名称。</p>
<p>离开<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>，穿过<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E6%A1%A5/">白兰地桥</a>，旅者将会来到树篱北部的尽头，此处路旁便是并行的<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">巴兰都因河</a>。一座有人看守的大门立在这里，门外是通向夏尔的东部边界——<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>的路。</p>
