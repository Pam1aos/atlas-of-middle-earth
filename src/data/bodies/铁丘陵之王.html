<h1>铁丘陵之王</h1>
<p><strong>铁丘陵之王</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lord_of_the_Iron_Hills" target="_blank" rel="noopener noreferrer">Lord of the Iron Hills</a></strong>），是位于<a class="wiki-link" href="/entry/%E7%BD%97%E7%93%A6%E5%B0%BC%E5%AE%89/">大荒野</a>东部<a class="wiki-link" href="/entry/%E9%93%81%E4%B8%98%E9%99%B5/">铁丘陵</a>的统治者所拥有的称号。已知的两名享有此头衔的矮人是<a class="wiki-link" href="/entry/%E6%A0%BC%E7%BD%97%E5%B0%94/">格罗尔</a>和他的继承人，即孙子“铁足”<a class="wiki-link" href="/entry/%E9%93%81%E8%B6%B3%E6%88%B4%E5%9B%A0/">戴因二世</a>。在戴因成为<a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E7%9F%AE%E4%BA%BA%E4%B9%8B%E7%8E%8B/">都林矮人之王</a>，定都<a class="wiki-link" href="/entry/%E5%AD%A4%E5%B1%B1/">埃瑞博</a>之后，无人知晓是否有他人继承“铁丘陵之王”这一称号。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
