<h1>莱戈林河</h1>
<p><strong>莱戈林河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Legolin" target="_blank" rel="noopener noreferrer">Legolin</a></strong>），是<a class="wiki-link" href="/entry/%E7%9B%96%E7%90%86%E5%AE%89%E6%B2%B3/">盖理安河</a>在<a class="wiki-link" href="/entry/%E6%AC%A7%E8%A5%BF%E7%91%9E%E5%AE%89%E5%BE%B7/">欧西瑞安德</a>地区六条支流中的第三条。它与其它几条河流一样，都发源于<a class="wiki-link" href="/entry/%E8%93%9D%E8%89%B2%E5%B1%B1%E8%84%89/">蓝色山脉</a>。它迅疾地向西流过欧西瑞安德，<a class="wiki-link" href="/entry/%E6%B2%99%E6%B4%9B%E6%96%AF%E6%B2%B3/">沙洛斯河</a>位于其北，而<a class="wiki-link" href="/entry/%E5%B8%83%E7%92%83%E5%B0%94%E6%A2%AD%E5%B0%94%E6%B2%B3/">布璃尔梭尔河</a>位于其南。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。莱戈林河这一地名意为“自由奔流”。</p>
