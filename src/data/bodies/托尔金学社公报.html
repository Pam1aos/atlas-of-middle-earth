<h1>托尔金学社公报</h1>
<p><strong>托尔金学社公报</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Tolkien_Society_Bulletin" target="_blank" rel="noopener noreferrer">The Tolkien Society Bulletin</a></strong>），是<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E5%AD%A6%E7%A4%BE/">托尔金学社</a>的第一份公报，由菲尔·斯潘塞编辑。公报于<a class="wiki-link" href="/entry/1970%E5%B9%B4/">1970年</a>创刊，一共出版了四期，此后被<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E5%88%A9%E5%B0%94(%E8%8B%B1%E5%9B%BD%E6%9C%9F%E5%88%8A)/">《安督利尔》</a>取代。</p>
