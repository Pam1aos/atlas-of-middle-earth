<h1>埃韦霍尔特</h1>
<p><strong>埃韦霍尔特</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Everholt" target="_blank" rel="noopener noreferrer">Everholt</a></strong>），是洛汗王国境内<a class="wiki-link" href="/entry/%E8%8F%B2%E7%91%9E%E6%81%A9%E9%9C%8D%E5%B0%94%E7%89%B9/">菲瑞恩森林</a>之中的一块区域。该林区以盛产庞大凶残的<a class="wiki-link" href="/entry/%E5%9F%83%E9%9F%A6%E9%9C%8D%E5%B0%94%E7%89%B9%E7%9A%84%E9%87%8E%E7%8C%AA/">野猪</a>而著称，洛汗王国第十三代国王<a class="wiki-link" href="/entry/%E4%BC%8F%E5%B0%94%E5%8D%A1/">伏尔卡</a>曾在狩猎这种野猪时，不幸丧命于埃韦霍尔特。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>埃韦霍尔特（Everholt）是一个古英语词汇，意为“野猪林”。</p>
