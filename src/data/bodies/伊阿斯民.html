<h1>伊阿斯民</h1>
<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>
</blockquote>
<p><strong>伊阿斯民</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Iathrim" target="_blank" rel="noopener noreferrer">Iathrim</a></strong>），或“多瑞亚斯的精灵”，是指生活在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>中部广阔森林（包括<a class="wiki-link" href="/entry/%E5%B0%BC%E5%B0%94%E5%A4%9A%E7%91%9E%E6%96%AF%E6%A3%AE%E6%9E%97/">尼尔多瑞斯</a>和<a class="wiki-link" href="/entry/%E7%91%9E%E5%90%89%E5%AE%89%E6%A3%AE%E6%9E%97/">瑞吉安</a>），受<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛</a>和<a class="wiki-link" href="/entry/%E8%BF%AA%E5%A5%A5/">迪奥</a>统治的<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E6%97%8F/">辛达族</a>精灵。</p>
<h2>名字与词源</h2>
<p>伊阿斯民（Iathrim）在<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中意为“围篱内的人民”，由<code>iâth</code>（围篱）<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>和后缀<code>-rim</code>（表示民族）<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>组成。</p>
