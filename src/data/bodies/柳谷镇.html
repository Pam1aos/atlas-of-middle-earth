<h1>柳谷镇</h1>
<p><strong>柳谷镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Willowbottom" target="_blank" rel="noopener noreferrer">Willowbottom</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a><a class="wiki-link" href="/entry/%E6%9E%97%E5%B0%BE%E5%9C%B0/">林尾地</a>附近的小村庄，坐落在蓟溪河岸附近，恰好位于蓟溪汇入夏尔河的位置。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
