<p><strong>信件102a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_102a" target="_blank" rel="noopener noreferrer">Letter 102a</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>的一封信，写信日期为1945年4月29日<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金写信给他的小儿子克里斯托弗，告诉他墨象社提议考虑让他成为永久成员。</p>
