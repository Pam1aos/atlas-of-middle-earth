<h1>托马斯·韦德·厄普</h1>
<p><strong>托马斯·韦德·厄普</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Thomas_Wade_Earp" target="_blank" rel="noopener noreferrer">Thomas Wade Earp</a></strong>），英国作家、艺术评论家，<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>在<a class="wiki-link" href="/entry/%E7%89%9B%E6%B4%A5%E5%A4%A7%E5%AD%A6/">牛津大学</a>埃塞克特学院的同学。厄普是<a class="wiki-link" href="/entry/1915%E5%B9%B4/">1915年</a>度《牛津诗刊》的编辑之一，托尔金最初的诗歌作品之一《哥布林的脚》就是发表在这一期里。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>托尔金曾在给<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗</a>的<a class="wiki-link" href="/entry/%E4%BF%A1%E4%BB%B683%E5%8F%B7/">信</a>中称呼厄普为“T.W. 厄普，天底下头一位twerp”（俚语，意为“傻瓜”）。<a class="wiki-link" href="/entry/%E6%B1%89%E5%BC%97%E8%8E%B1%C2%B7%E5%8D%A1%E5%BD%AD%E7%89%B9/">汉弗莱·卡彭特</a>认为，这可能是twerp一词的源头。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
