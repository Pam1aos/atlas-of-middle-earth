<p><strong>纳国斯隆德王国</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Realm_of_Nargothrond" target="_blank" rel="noopener noreferrer">Realm of Nargothrond</a></strong>），是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>由<a class="wiki-link" href="/entry/%E8%8A%AC%E7%BD%97%E5%BE%B7/">芬罗德·费拉贡德</a>建立的精灵王国。王国首都位于<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>西岸的<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>要塞，疆域包括<a class="wiki-link" href="/entry/%E8%A5%BF%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">西贝烈瑞安德</a>的大部分地区，是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E6%97%8F/">诺多族</a>诸国之中最大的国家。它建成于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>102年，毁于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>495年的<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7%E7%9A%84%E9%99%B7%E8%90%BD/">纳国斯隆德之劫</a>，存续393年。</p>
