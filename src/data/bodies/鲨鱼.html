<h1>鲨鱼</h1>
<p><strong>鲨鱼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sharks" target="_blank" rel="noopener noreferrer">Sharks</a></strong>），是海里的一种鱼类。第二纪元的<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>只有在远航时才会见到鲨鱼。不知是像努门诺尔人所说的那样靠着“维拉的恩典”，还是其他原因，鲨鱼从不靠近岛国的海岸。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
