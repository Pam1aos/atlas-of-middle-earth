<h1>劳琳魁</h1>
<p><strong>劳琳魁</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Laurinquë" target="_blank" rel="noopener noreferrer">Laurinquë</a></strong>）是一种生长在<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔岛</a>东南部<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B4%9B%E6%96%AF%E5%A1%94/">哈尔洛斯塔</a>地区的树木。它会开出长串垂下的黄色花朵，令人钟爱；不过，除去美丽的花朵，劳琳魁这种树木并没有其他用途。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“劳琳魁”一名是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>，它包含有<code>laure</code>（意为“金色”）这个词根。</p>
