<h1>杜维尔家村</h1>
<p><strong>杜维尔家村</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dwaling" target="_blank" rel="noopener noreferrer">Dwaling</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>东区北部的一座村庄。它位于<a class="wiki-link" href="/entry/%E6%96%AF%E5%8D%A1%E9%87%8C/">斯卡里</a>丘陵的北边，位置颇为偏远。</p>
<h2>名称释义</h2>
<p><a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>指出，<code>Dwaling</code>这个名称是<a class="ext-link" href="https://en.m.wikipedia.org/wiki/Toponymy" target="_blank" rel="noopener noreferrer">地名学</a>中常见的一种给居民点命名的方式，它的意思是“<code>Dwale</code>的后裔（居住的地方）”。<code>Dwale</code>应该并非人名，而是该地居民某位先辈的绰号，意为“愚钝的”。</p>
