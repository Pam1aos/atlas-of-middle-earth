<p><strong>信件222c号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_222c" target="_blank" rel="noopener noreferrer">Letter 222c</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1960年2月29日。托尔金提出了出版方面的问题<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金询问昂温，出版<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E6%B6%88%E6%AD%A7%E4%B9%89)/">《魔戒》</a>中的小篇幅或次要内容是否会有异议。他说自己经常被要求提供这类作品，并表示愿意给出“优厚的条件”。他还指出，他希望出版的内容对<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">《精灵宝钻》</a>来说不重要。</p>
