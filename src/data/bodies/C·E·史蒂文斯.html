<p><strong>C·E·史蒂文斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/C.E._Stevens" target="_blank" rel="noopener noreferrer">Courtenay Edward Stevens</a></strong>），全名考特尼·爱德华·史蒂文斯，生于<a class="wiki-link" href="/entry/1905%E5%B9%B4/">1905年</a>，卒于<a class="wiki-link" href="/entry/1976%E5%B9%B4/">1976年</a>。他是<a class="wiki-link" href="/entry/%E5%A2%A8%E8%B1%A1%E7%A4%BE/">墨象社</a>中同<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>并列的社友，在<a class="wiki-link" href="/entry/%E7%89%9B%E6%B4%A5%E5%A4%A7%E5%AD%A6/">牛津大学</a>讲授古代史。</p>
