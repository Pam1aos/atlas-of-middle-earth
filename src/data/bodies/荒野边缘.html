<p>Alan Lee</p>
<p><strong>荒野边缘</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Edge_of_the_Wild" target="_blank" rel="noopener noreferrer">Edge of the Wild</a></strong>），是<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>与东部的<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>及<a class="wiki-link" href="/entry/%E7%BD%97%E7%93%A6%E5%B0%BC%E5%AE%89/">大荒野</a>间的边界。这是一条南北走向的线形区域，在<a class="wiki-link" href="/entry/%E5%B8%83%E8%8C%B9%E4%BC%8A%E8%83%BD%E6%B8%A1%E5%8F%A3/">布茹伊能渡口</a>以西的范围。甘道夫明白，即使一个人规划好了路线，也很容易在越过荒野边缘时误入歧途。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">霍比特人</a>，<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA-%E7%AC%AC%E5%9B%9B%E7%AB%A0/">第四章</a>，越过山岭钻进山内。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
