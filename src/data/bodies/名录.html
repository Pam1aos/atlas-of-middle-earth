<h1>名录</h1>
<p><strong>《名录》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Roll" target="_blank" rel="noopener noreferrer">The Roll</a></strong>）是一份名单，它收录了<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>中所有参战者的名字。列在《名录》卷首的是<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里阿道克·白兰地鹿</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">佩里格林·图克</a>，他们是<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>的领袖。<a class="wiki-link" href="/entry/%E7%A7%91%E9%A1%BF%E5%AE%B6%E6%97%8F/">科顿家族</a>在<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>中贡献巨大，他们也被收入《名录》：从那以后，<a class="wiki-link" href="/entry/%E7%A7%91%E9%A1%BF%E5%AE%B6%E6%97%8F/">科顿家族</a>的声誉和财富就日益鹊起。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>在此后的岁月中，<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的历史学家都把这份《名录》铭记于心。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
