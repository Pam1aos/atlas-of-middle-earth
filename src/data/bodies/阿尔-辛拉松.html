<p><strong>阿尔-辛拉松</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ar-Zimrathôn" target="_blank" rel="noopener noreferrer">Ar-Zimrathôn</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>第二十一位君主，他是<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94-%E9%98%BF%E7%9D%A3%E9%82%A3%E9%9C%8D%E5%B0%94/">阿尔-阿督那霍尔</a>之子。</p>
<p>从他的父亲开始，以<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>作为君主称号的传统由阿督耐克语取代，但阿尔-辛拉松的<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字塔尔-霍斯塔米尔依旧被记载下来<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<p>塔尔-辛拉松出生于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>2789年，在位71年，逝世于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>3033年<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名称与含义</h2>
<p>zimrathôn意指“珠宝收集者”，这由他的昆雅名hostamir中猜测出的。hosta指“收集”，mir指“珠宝”。</p>
<p>ar指“高”，和tar一样用于君主称号前。</p>
