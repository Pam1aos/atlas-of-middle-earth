<p><strong>贝瑞格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bereg_(film_character" target="_blank" rel="noopener noreferrer">Bereg</a>)</strong>），是<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E5%8F%8C%E5%A1%94%E5%A5%87%E5%85%B5/">《指环王：双塔奇兵》</a>中原创的<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>角色，由新西兰演员 Ray Trickitt 饰演。</p>
<h2>生平</h2>
<p>贝瑞格是一名<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>士兵，参加了<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1%E4%B9%8B%E6%88%98/">号角堡之战</a>。当<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E8%BF%AA%E5%B0%94/">哈尔迪尔</a>率领的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>援军抵达<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>门前时，是贝瑞格命令众人打开城门。无法得知他是否从战役中幸存。</p>
