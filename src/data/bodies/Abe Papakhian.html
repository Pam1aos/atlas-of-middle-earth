<h1>Abe Papakhian</h1>
<p><strong>Abe Papakhian</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Abe_Papakhian" target="_blank" rel="noopener noreferrer">Abe Papakhian</a></strong>）是一位加拿大籍男性艺术家。他的画作涉及许多奇幻作品，其中的战争场景尤其令人印象深刻。他授权本维基使用他的画作，详见授权信息。</p>
