<h1>Jan Pospíšil</h1>
<p><strong>Jan Pospíšil</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Jan_Pospíšil" target="_blank" rel="noopener noreferrer">Jan Pospíšil</a></strong>）是一位捷克籍男性画家，他为《骑马与砍杀：最后之日》绘制了许多概念图。他同时也为 Cubicle 7 这一英国游戏公司工作，为其旗下的《至尊戒》等角色扮演游戏绘制配图。他授权本维基使用他的画作，详见授权信息。</p>
