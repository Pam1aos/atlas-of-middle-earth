<h1>哈尔迪尔(消歧义)</h1>

<p><strong>哈尔迪尔</strong>可以指代以下几位角色：</p>
<ul>
<li>哈尔迪尔，出现在托尔金早期的创作版本中，是精灵欧洛德瑞斯的长子。</li>
<li>哈尔迪尔，第一纪元布瑞希尔的哈尔米尔的儿子；娶了多尔罗明的哈多之女格罗瑞蒂尔；阵亡于泪雨之战中。</li>
<li>哈尔迪尔，第三纪元魔戒大战时期，洛丝罗瑞恩的一名精灵。</li>
</ul>
