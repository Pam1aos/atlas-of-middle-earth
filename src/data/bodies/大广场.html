<h1>大广场</h1>
<p><strong>大广场</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Great_Square" target="_blank" rel="noopener noreferrer">Great Square</a></strong>）位于<a class="wiki-link" href="/entry/%E9%98%BF%E9%97%A8%E6%B4%B2/">阿门洲</a><a class="wiki-link" href="/entry/%E6%8F%90%E5%8A%9B%E5%AE%89/">提力安</a>城内，坐落于<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A8%9C/">图娜</a>山顶的最高塔<a class="wiki-link" href="/entry/%E6%98%8E%E7%99%BB%C2%B7%E5%9F%83%E5%B0%94%E8%BE%BE%E5%86%BD%E7%93%A6/">明登·埃尔达冽瓦</a>脚下。广场内修建有<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A4%9A%E4%B9%8B%E7%8E%8B/">诺多之王</a><a class="wiki-link" href="/entry/%E8%8A%AC%E5%A8%81/">芬威</a>的宫殿，白树<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%B8%8C%E7%90%86%E5%AE%89/">加拉希理安</a>也生长于此。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E5%8F%8C%E6%A0%91%E7%BA%AA%E5%85%83/">双树纪元</a>1495年，<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>摧毁了<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA%E7%9A%84%E5%8F%8C%E5%9C%A3%E6%A0%91/">维林诺的双圣树</a>，又前往<a class="wiki-link" href="/entry/%E4%BD%9B%E7%B1%B3%E8%AF%BA%E6%96%AF/">佛米诺斯</a>，夺走<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">精灵宝钻</a>并杀害了守卫在门前的芬威。愤怒的<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA/">费艾诺</a>违抗禁令回到提力安，在众人的见证下，于大广场立下<a class="wiki-link" href="/entry/%E8%B4%B9%E8%89%BE%E8%AF%BA%E7%9A%84%E8%AA%93%E8%A8%80/">誓言</a>，发誓将不惜一切代价追寻宝钻，并永远仇视一切阻挡他的路途的生灵。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
