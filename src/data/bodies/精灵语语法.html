<h1>精灵语语法</h1>
<p>本页面整理了常见精灵语的语法。注意，本页面的语法包含一些词汇以及其衍生概念的发展过程以及这些词汇的<a class="wiki-link" href="/entry/%E6%96%B0%E7%B2%BE%E7%81%B5%E8%AF%AD/">新精灵语</a>适配版本。同时本页面包含大量细节论证，如果读者仅仅想要对精灵语语法有一个大概的了解，可以先阅读<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD%E6%B3%95/">昆雅语法</a>和<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD%E6%B3%95/">辛达语法</a>这两个页面。</p>
