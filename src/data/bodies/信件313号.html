<p><strong>信件313号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_313" target="_blank" rel="noopener noreferrer">Letter 313</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E8%BF%88%E5%85%8B%E5%B0%94%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">迈克尔·托尔金</a>的一封信，写信日期为1969年11月25日。托尔金讲述了他的写作计划<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金希望他有时间为昆雅语和辛达语编写一个基本的语法和词汇，他还要把《精灵宝钻》改编成《魔戒》的一部分。</p>
