<h1>灰森林</h1>
<p><strong>灰森林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Grey_Wood" target="_blank" rel="noopener noreferrer">Grey Wood</a></strong>），是<a class="wiki-link" href="/entry/%E6%98%8E%E5%A4%9A%E8%B7%AF%E5%9B%A0/">明多路因山</a>以北、<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E4%B8%81/">阿蒙丁烽火丘</a>以南的一片树林，它可以被看作是<a class="wiki-link" href="/entry/%E5%BE%B7%E9%B2%81%E9%98%BF%E4%B8%B9%E6%A3%AE%E6%9E%97/">德鲁阿丹森林</a>的外缘地区。灰森林中隐藏着<a class="wiki-link" href="/entry/%E7%9F%B3%E9%A9%AC%E8%BD%A6%E5%B1%B1%E8%B0%B7/">石马车山谷</a>的入口。</p>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，德鲁伊甸人的首领<a class="wiki-link" href="/entry/%E6%82%8D-%E4%B8%8D%E9%87%8C-%E6%82%8D/">悍-不里-悍</a>将<a class="wiki-link" href="/entry/%E7%9F%B3%E9%A9%AC%E8%BD%A6%E5%B1%B1%E8%B0%B7/">石马车山谷</a>的隐秘道路告诉了<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿</a>，希奥顿因此带领洛汗大军取道山谷和灰森林，得以避开<a class="wiki-link" href="/entry/%E8%A5%BF%E5%A4%A7%E9%81%93/">西大道</a>上的敌人。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>战争结束后，<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">埃莱萨王</a>重返灰森林，宣布把德鲁阿丹森林永远赐给<a class="wiki-link" href="/entry/%E5%BE%B7%E9%B2%81%E4%BC%8A%E7%94%B8%E4%BA%BA/">德鲁伊甸人</a>一族，以此酬谢他们提供的情报。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
