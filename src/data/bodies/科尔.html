<h1>科尔</h1>
<p><strong>科尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Kôr" target="_blank" rel="noopener noreferrer">Kôr</a></strong>）是<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A8%9C/">图娜</a>山的早期名字。</p>
<p>它在<a class="wiki-link" href="/entry/%E5%A4%B1%E8%90%BD%E7%9A%84%E4%BC%A0%E8%AF%B4%E4%B9%8B%E4%B9%A6%E4%B9%8B%E4%B8%80/">《失落的传说之书之一》</a>中作为<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>的<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A7%86%E6%97%8F/">诺姆族</a>的首都，被重点描写。</p>
<h2>名字词源</h2>
<p>在托尔金最早的语言的词源中，科尔山的名称指的是它的圆形。它源于<a class="wiki-link" href="/entry/%E9%80%9A%E7%94%A8%E5%9F%83%E5%B0%94%E8%BE%BE%E8%AF%AD/">通用埃尔达语</a>名称<code>Guord</code>，从它产生了<a class="wiki-link" href="/entry/%E7%90%A8%E9%9B%85%E8%AF%AD/">琨雅语</a>词<code>Qora</code>和<a class="wiki-link" href="/entry/%E8%AF%BA%E5%A7%86%E6%97%8F%E8%AF%AD/">诺姆族语</a>词<code>Gwar</code>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
