<p><strong>格里姆</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Grim" target="_blank" rel="noopener noreferrer">Grim</a></strong>）是一位<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>。当托尔金分析“<a class="wiki-link" href="/entry/%E6%A0%BC%E9%87%8C%E5%A7%86%E6%96%AF%E9%9B%B7%E5%BE%B7/">格里姆斯雷德</a>”这一地名的构成时，他指出：该词中的“格里姆”是人名，他是<a class="wiki-link" href="/entry/%E6%A0%BC%E9%87%8C%E5%A7%86%E5%8D%9A%E5%BE%B7/">格里姆博德</a>的祖先。这是对格里姆仅有的记载。</p>
<h2>名称释义</h2>
<p><em>Grim</em> 在古英语中意为“凶猛、彪悍”。</p>
