<h1>凯瑟琳·麦基尔韦恩</h1>
<p><strong>凯瑟琳·麦基尔韦恩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Catherine_McIlwaine" target="_blank" rel="noopener noreferrer">Catherine McIlwaine</a></strong>），是牛津博德利图书馆的托尔金档案管理人，自<a class="wiki-link" href="/entry/2003%E5%B9%B4/">2003年</a>起管理托尔金档案。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>作品</h2>
<ul>
<li>2018年：《托尔金：中洲缔造者》</li>
<li>2018年：《托尔金：宝藏》<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>（Tolkien: Treasures）</li>
<li>2022年：《伟大传说永不绝》</li>
</ul>
<h2>奖项</h2>
<ul>
<li>2019年托尔金学社奖：最佳图书奖《托尔金：中洲缔造者》</li>
<li>2019年托尔金学社奖：杰出贡献奖</li>
</ul>
