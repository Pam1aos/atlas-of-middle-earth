<p><strong>德内梭尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Denethor(disambiguation" target="_blank" rel="noopener noreferrer">Denethor</a>)</strong>）可能是指：</p>
<ul>
<li>兰威之子<a class="wiki-link" href="/entry/%E5%BE%B7%E5%86%85%E6%A2%AD%E5%B0%94(%E5%8D%97%E5%A4%9A%E7%B2%BE%E7%81%B5)/">德内梭尔</a>，南多精灵领袖，在贝烈瑞安德的第一场大战中死亡。</li>
<li><strong>德内梭尔一世</strong>，刚铎的第十位执政宰相。</li>
<li><strong>德内梭尔二世</strong>，刚铎的第二十六位执政宰相，魔戒大战期间在位。他是波洛米尔和法拉米尔的父亲。</li>
</ul>
