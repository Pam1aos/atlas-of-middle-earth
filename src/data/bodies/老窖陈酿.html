<h1>老窖陈酿</h1>
<p><strong>老窖陈酿</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Winyards" target="_blank" rel="noopener noreferrer">Old Winyards</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>南区出产的一种名贵的烈性红酒。</p>
<p><a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>的修建者、<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>之父<a class="wiki-link" href="/entry/%E9%82%A6%E6%9E%9C%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">邦果·巴金斯</a>在袋底洞的酒窖里珍藏了许多这种红酒。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3001年，当比尔博离开夏尔时，他留言赠送给好客的<a class="wiki-link" href="/entry/%E7%BD%97%E9%87%8C%E9%A9%AC%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">罗里马克·白兰地鹿</a>整整十二瓶香醇的老窖陈酿。十七年之后，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>在启程离开夏尔前往<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>的前夕，喝光了酒窖里剩下的最后一点老窖陈酿。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
