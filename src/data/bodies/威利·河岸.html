<p><strong>威利·河岸</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Willie_Banks" target="_blank" rel="noopener noreferrer">Willie Banks</a></strong>）是<a class="wiki-link" href="/entry/%E6%B2%B3%E5%B2%B8%E5%AE%B6%E6%97%8F/">河岸家族</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，居住在<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>。</p>
<h2>生平</h2>
<h3>布理的斗殴</h3>
<p>威利·河岸是布理斗殴的死者之一。遇害者中还有另一位霍比特人，他是来自<a class="wiki-link" href="/entry/%E6%96%AF%E5%8F%B0%E5%A4%9A/">斯台多</a>的一名<a class="wiki-link" href="/entry/%E5%B1%B1%E4%B8%8B%E5%AE%B6%E6%97%8F/">山下家族</a>成员。此外，还有三位布理居民被杀，分别是<a class="wiki-link" href="/entry/%E9%A9%AC%E7%89%B9%C2%B7%E7%9F%B3%E6%A5%A0%E8%B6%BE/">马特·石楠趾</a>、<a class="wiki-link" href="/entry/%E7%BD%97%E5%88%A9%C2%B7%E8%8B%B9%E6%9E%9C%E6%A0%91/">罗利·苹果树</a>，以及来自小丘的<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E6%91%98%E8%8D%86%E6%A3%98/">汤姆·摘荆棘</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>斗殴的另一方，从<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">绿大道</a>而来的<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍</a>，在早些时候被赶出布理，其后又在<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%C2%B7%E8%95%A8%E5%B0%BC/">比尔·蕨尼</a>和看守西大门的<a class="wiki-link" href="/entry/%E5%93%88%E9%87%8C%C2%B7%E5%B1%B1%E7%BE%8A%E5%8F%B6/">哈里·山羊叶</a>的帮助下进来找麻烦。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h3>死亡</h3>
<p>威利·河岸于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E7%BA%AA%E5%B9%B4/">夏尔历</a>1419年（<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年）1月1日被杀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
