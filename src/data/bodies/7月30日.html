<h1>7月30日</h1>
<h2>现实世界</h2>
<ul>
<li>1955年－J·R·R·托尔金和女儿普莉西拉前往意大利旅游，并在日记里写了几个相关条目。</li>
<li>1993年－第二十四届神话大会举办，为期四天（7月30日-8月2日）。</li>
<li>1999年－第三十届神话大会举办，为期四天（7月30日-8月2日）。</li>
<li>2004年－第三十五届神话大会举办，为期四天（7月30日-8月2日）。</li>
<li>2011年－托尔金学社在约克的Bar Convent举办学术研讨会，主题为“托尔金笔下的树”（Tolkien’s Trees）。</li>
<li>2015年－《2016年托尔金年历》出版。</li>
</ul>
