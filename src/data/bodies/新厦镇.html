<h1>新厦镇</h1>
<p><strong>新厦镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nobottle" target="_blank" rel="noopener noreferrer">Nobottle</a></strong>）是位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>北部的一个小村庄。它坐落在<a class="wiki-link" href="/entry/%E9%92%88%E7%9C%BC%E9%95%87/">针眼镇</a>的西边。</p>
<h2>名称释义</h2>
<p>英语地名中的<code>bottle</code>这一元素，源自于古英语中的<code>botl</code>，意为“（大的）居所”。事实上，<code>Nobottle</code>本身就是一个现实中存在的地名，它位于<a class="ext-link" href="https://en.m.wikipedia.org/wiki/England" target="_blank" rel="noopener noreferrer">英格兰</a>的<a class="ext-link" href="https://en.m.wikipedia.org/wiki/Northamptonshire" target="_blank" rel="noopener noreferrer">北汉普敦郡</a>。</p>
