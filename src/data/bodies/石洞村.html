<h1>石洞村</h1>
<p><strong>石洞村</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Standelf" target="_blank" rel="noopener noreferrer">Standelf</a></strong>）是<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>南部的一个小村庄，它坐落在<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>河畔。</p>
<h2>名称释义</h2>
<p><code>Standelf</code>这个名称是古英语，由<code>stán</code>（“石头”）和<code>delf</code>（“地洞”）两个部分组成。</p>
