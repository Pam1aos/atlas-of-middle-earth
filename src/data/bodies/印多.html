<p><strong>印多</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Indor" target="_blank" rel="noopener noreferrer">Indor</a></strong>），是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>时期<a class="wiki-link" href="/entry/%E5%A4%9A%E5%B0%94%E7%BD%97%E6%98%8E/">多尔罗明</a>的一位<a class="wiki-link" href="/entry/%E4%BC%8A%E7%94%B8%E4%BA%BA/">伊甸人</a>。他是<a class="wiki-link" href="/entry/%E8%89%BE%E7%90%B3/">艾琳</a>的父亲。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>其他版本</h2>
<p>《失落的传说之书》</p>
<p>1917年</p>
<p>《失落的传说之书》中有一位名叫印多的角色，但和<a class="wiki-link" href="/entry/%E8%89%BE%E7%90%B3/">艾琳</a>之父印多的关系仅有姓名相同。他是<a class="wiki-link" href="/entry/%E4%BD%A9%E7%83%88%E6%A0%BC/">佩烈格</a>之父、<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>的祖父。在出版版本的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">《精灵宝钻》</a>中，<a class="wiki-link" href="/entry/%E5%8A%A0%E5%B0%94%E5%A4%9A(%E5%93%88%E5%A4%9A%E4%B9%8B%E5%AD%90)/">加尔多</a>才是图奥的祖父。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
