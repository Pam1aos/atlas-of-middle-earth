<p>伏尔卡</p>
<p><strong>埃韦霍尔特的野猪</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Boar_of_Everholt" target="_blank" rel="noopener noreferrer">Boar of Everholt</a></strong>）生活在<a class="wiki-link" href="/entry/%E8%8F%B2%E7%91%9E%E6%81%A9%E9%9C%8D%E5%B0%94%E7%89%B9/">菲瑞恩森林</a>中的<a class="wiki-link" href="/entry/%E5%9F%83%E9%9F%A6%E9%9C%8D%E5%B0%94%E7%89%B9/">埃韦霍尔特</a>（“野猪林”）一带，亦即生活在<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>的<a class="wiki-link" href="/entry/%E5%93%88%E5%88%A9%E8%8F%B2%E7%91%9E%E6%81%A9/">哈利菲瑞恩山</a>附近。它们脾气凶暴，攻击性强。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2864年，<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的第十三代国王、卓越的猎手<a class="wiki-link" href="/entry/%E4%BC%8F%E5%B0%94%E5%8D%A1/">伏尔卡</a>，就是在狩猎埃韦霍尔特的野猪时被獠牙刺伤而死，尽管他也杀死了野猪。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
