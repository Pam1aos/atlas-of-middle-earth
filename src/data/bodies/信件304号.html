<p><strong>信件304号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_304" target="_blank" rel="noopener noreferrer">Letter 304</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给克莱德·S·基尔比的一封信，写信日期为1968年6月4日。托尔金为了躲避粉丝搬了家<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>退休后，为了躲避粉丝，托尔金前往英格兰南部海岸居住。他告诉克莱德·S·基尔比，<a class="wiki-link" href="/entry/%E4%B9%94%E6%B2%BB%C2%B7%E8%89%BE%E4%BC%A6%E4%B8%8E%E6%98%82%E6%B8%A9%E5%87%BA%E7%89%88%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8/">乔治·艾伦与昂温出版社</a>会转寄他所有的邮件，只有少数人知道他的真实地址。</p>
