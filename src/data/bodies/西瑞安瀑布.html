<h1>西瑞安瀑布</h1>
<p><strong>西瑞安瀑布</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Falls_of_Sirion" target="_blank" rel="noopener noreferrer">Falls of Sirion</a></strong>），位于<a class="wiki-link" href="/entry/%E8%89%BE%E6%9E%97%E5%BE%AE%E5%A5%A5/">艾林微奥</a>南面、<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>以东大约二十五里格，是<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E6%B2%B3/">西瑞安河</a>因为地势陡降而形成的大瀑布，它是西瑞安河上游和下游的分界点。西瑞安瀑布落入一条水流冲刷出的地底大河道，在地下向南流淌三里格之后，再度涌出地面。西瑞安河重新涌出地面的孔洞被称作<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E4%B9%8B%E9%97%A8/">西瑞安之门</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
