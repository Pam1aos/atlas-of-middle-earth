<p><strong>瑞微尔泉源</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Rivil's_Well" target="_blank" rel="noopener noreferrer">Rivil&#39;s Well</a></strong>）是<a class="wiki-link" href="/entry/%E7%91%9E%E5%BE%AE%E5%B0%94%E6%BA%AA/">瑞微尔溪</a>的源泉，瑞微尔溪源自<a class="wiki-link" href="/entry/%E5%A4%9A%E6%9D%BE%E5%B0%BC%E5%AE%89/">多松尼安</a>的高地，向西在<a class="wiki-link" href="/entry/%E8%89%B2%E7%91%9E%E8%B5%AB%E6%B2%BC%E6%B3%BD/">色瑞赫沼泽</a>注入<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E6%B2%B3/">西瑞安河</a>。<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup>
<a class="wiki-link" href="/entry/%E5%A1%94%E6%81%A9%E8%89%BE%E8%B7%AF%E5%9B%A0%E7%9A%84%E5%B1%A0%E6%9D%80/">塔恩艾路因的屠杀</a>后，<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>正是在瑞微尔泉源追踪到杀死他父亲<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E5%B8%8C%E5%B0%94/">巴拉希尔</a>的那支<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>小队。他杀死队长，夺回了父亲被砍下的手以及其上的<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E5%B8%8C%E5%B0%94%E4%B9%8B%E6%88%92/">戒指</a>。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
