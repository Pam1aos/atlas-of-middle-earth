<h1>Joona Kujanen</h1>
<p><strong>Joona Kujanen</strong> ，网名 <strong>Tulikoura</strong> ，是一位生于1988年的芬兰男性画师。他的作品多以<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>为描绘对象、色调以黑白为主，场景富有张力。他授权本维基使用他的画作，详见授权信息。</p>
