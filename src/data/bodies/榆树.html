<h1>榆树</h1>
<p><strong>榆树</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elms" target="_blank" rel="noopener noreferrer">Elms</a></strong>）是遍及<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>北部地区的高大树木。<a class="wiki-link" href="/entry/%E6%A0%91%E9%A1%BB/">树须</a>曾经特别提到过在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>东部，<a class="wiki-link" href="/entry/%E6%AC%A7%E8%A5%BF%E7%91%9E%E5%AE%89%E5%BE%B7/">欧西瑞安德</a>的榆树林<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>的堂哥<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">哈尔</a>声称自己在<a class="wiki-link" href="/entry/%E5%8C%97%E5%B2%97/">北岗</a>见过一只树人或者巨人，称其为“像榆树一样大”，但北岗并没有种植榆树<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
