<p><strong>半兽人书吏</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Goblin_Scribe" target="_blank" rel="noopener noreferrer">Goblin Scribe</a></strong>），是电影<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E6%84%8F%E5%A4%96%E4%B9%8B%E6%97%85/">《霍比特人：意外之旅》</a>中原创的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>角色，由肯尼亚演员 Kiran Shah 通过动作捕捉技术饰演。</p>
<h2>生平</h2>
<p>半兽人书吏在<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E6%84%8F%E5%A4%96%E4%B9%8B%E6%97%85/">《霍比特人：意外之旅》</a>中短暂出境，没有台词。他生活在<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>地底的<a class="wiki-link" href="/entry/%E5%8D%8A%E5%85%BD%E4%BA%BA%E9%95%87/">半兽人镇</a>，是<a class="wiki-link" href="/entry/%E5%8D%8A%E5%85%BD%E4%BA%BA%E7%8E%8B/">半兽人王</a>的书吏和信使。半兽人书吏长相畸形，他相当矮小，双腿萎缩，指爪则很长，手持一块用来记录的羊皮纸。他无法走路，只能坐在一张滑轮吊着的座椅上行动。<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>被半兽人王抓获时，半兽人书吏被派去向<a class="wiki-link" href="/entry/%E9%98%BF%E4%BD%90%E6%A0%BC/">阿佐格</a>报信。</p>
