<p><strong>沃尔特·胡珀</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Walter_Hooper" target="_blank" rel="noopener noreferrer">Walter Hooper</a></strong>），是<a class="wiki-link" href="/entry/%E5%A2%A8%E8%B1%A1%E7%A4%BE/">墨象社</a>的访客，由<a class="wiki-link" href="/entry/C%C2%B7S%C2%B7%E5%88%98%E6%98%93%E6%96%AF/">C·S·刘易斯</a>、<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>和他们的朋友招待。他曾受邀参加一次朗读聚会，当时正在写就的作品《能言马与男孩》《双塔殊途》等就是在聚会上朗读的。他最知名的身份是C·S·刘易斯和<a class="wiki-link" href="/entry/%E6%AC%A7%E6%96%87%C2%B7%E5%B7%B4%E8%8F%B2%E5%B0%94%E5%BE%B7/">欧文·巴菲尔德</a>的文学遗产管理人。</p>
