<h1>会说话的钱包</h1>
<blockquote>
<p><strong>这个词条叙述的对象出现于<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的作品中，但它并没有被给予确定的名称。</strong> 本维基为方便查阅，酌情暂定该词条的名称。</p>
</blockquote>
<p><strong>会说话的钱包</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Talking_Purse" target="_blank" rel="noopener noreferrer">Talking Purse</a></strong>）是食人妖<a class="wiki-link" href="/entry/%E5%A8%81%E5%BB%89/">威廉</a>的钱包，它的尺寸很大，对<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>来说大得就像个提包。当<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>试图把它掏走时，它用尖尖的声音大叫：“呃，你是谁啊？”食人妖<a class="wiki-link" href="/entry/%E5%A8%81%E5%BB%89/">威廉</a>因此警觉、逮住了<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博</a>。据说，<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>的钱包都拥有这种祸害人的能力，这只钱包只是其中一例。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
