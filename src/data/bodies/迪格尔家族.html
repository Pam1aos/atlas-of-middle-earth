<h1>迪格尔家族</h1>
<p><strong>迪格尔家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Diggle_Family" target="_blank" rel="noopener noreferrer">Diggle Family</a></strong>）属于<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。家族成员<a class="wiki-link" href="/entry/%E8%BF%AA%E5%A8%9C%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">迪娜·迪格尔</a>嫁给了<a class="wiki-link" href="/entry/%E7%94%98%E8%BE%BE%E5%93%88%E5%B0%94%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">甘达哈尔·博尔杰</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
