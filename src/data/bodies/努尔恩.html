<p><strong>努尔恩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nurn" target="_blank" rel="noopener noreferrer">Nurn</a></strong>），是位于<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>南部、咸水湖<a class="wiki-link" href="/entry/%E5%8A%AA%E5%B0%94%E8%83%BD%E6%B9%96/">努尔能</a>附近的一片区域。和北部的戈埚洛斯荒原相比，努尔恩的土地远为肥沃，这里有大量的<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">人类</a>奴隶劳作耕种，以维系<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>的庞大军队。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年，在<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>的邪恶势力被推翻之后，<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>国王<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>解放了努尔恩的奴隶，将咸水湖附近的所有土地都赐给他们自己耕耘。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<h2>名称释义</h2>
<p>“努尔恩”（Nurn）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，意为“悲伤”。</p>
