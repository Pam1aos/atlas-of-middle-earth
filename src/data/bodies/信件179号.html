<p><strong>信件179号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter179" target="_blank" rel="noopener noreferrer">Letter179</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E4%BC%91%C2%B7%E5%B8%83%E7%BD%97%E6%A0%B9/">休·布罗根</a>的一封信，写信日期为1955年12月14日。托尔金回复了布罗根的评价<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>布罗根此前曾给托尔金写过一封信，信中批评托尔金，事后看来，他认为这封信既愚蠢又不得体。托尔金回答说，他欢迎布罗根的批评，并邀请他多写一些，因为他对这些书如此关注。</p>
