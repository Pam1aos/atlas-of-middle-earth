<p><strong>克里斯托弗·怀斯曼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Christopher_Wiseman" target="_blank" rel="noopener noreferrer">Christopher Wiseman</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>的好友，与他一道在爱德华国王学校创立<a class="wiki-link" href="/entry/%E8%8C%B6%E7%A4%BE%E5%92%8C%E5%B7%B4%E7%BD%97%E7%A4%BE%E5%9B%A2/">T.C.B.S.</a>。托尔金的小儿子<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>正是以他的名字命名。</p>
