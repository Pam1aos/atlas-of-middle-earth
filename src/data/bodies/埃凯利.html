<h1>埃凯利</h1>
<p><strong>埃凯利</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ecelli" target="_blank" rel="noopener noreferrer">Ecelli</a></strong>），是一种长着长长的黑刺的动物，看起来像是体型很大的海胆或刺猬。它们在第二纪元<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>的有些地区数量众多，受到人们友善的对待，因为它们主要以蠕虫和昆虫为食。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>埃凯利（ecelli）的单数形式为ecellë，这个词可能来源于词根<code>√EK</code>（尖端）。</p>
