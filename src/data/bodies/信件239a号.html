<p><strong>信件239a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_239a" target="_blank" rel="noopener noreferrer">Letter 239a</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1962年7月21日。托尔金面临繁忙的工作任务<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金告知雷纳自己短时的教学重任。他被要求在新的盎格鲁撒克逊语教授到任之前，临时接替即将离职的教授。他形容这一任务“令人愉快但不合时宜”，因为他现有的工作量已经很大了。</p>
