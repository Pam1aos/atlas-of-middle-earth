<p><strong>树精</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dryads" target="_blank" rel="noopener noreferrer">Dryads</a></strong>）可以指：</p>
<ul>
<li>南迪尼（<a class="ext-link" href="https://tolkiengateway.net/wiki/Nandini" target="_blank" rel="noopener noreferrer">Nandini</a>），《失落的传说之书》中的山谷或原野之仙灵，一份与《失落的传说之书》相关的文稿亦称其为树精。</li>
<li>塔瓦瑞（<a class="ext-link" href="https://tolkiengateway.net/wiki/Tavari" target="_blank" rel="noopener noreferrer">Tavari</a>），《失落的传说之书》中的森林之仙灵，1930年代的《词源学》亦称其为树精。</li>
</ul>
