<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>

<p><a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>共有两次漫长而寒冷的<strong>严酷寒冬</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Fell_Winter_(disambiguation" target="_blank" rel="noopener noreferrer">Fell Winter</a>)</strong>），它们分别是：</p>
<ul>
<li>严酷寒冬(第一纪元)，由第一纪元495年11月持续至第一纪元496年3月。</li>
<li>严酷寒冬(第三纪元)，由第三纪元2911年11月持续至第三纪元2912年3月。</li>
</ul>
