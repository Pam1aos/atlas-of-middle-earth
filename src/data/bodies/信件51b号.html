<p><strong>信件51b号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_51b" target="_blank" rel="noopener noreferrer">Letter 51b</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>的一封信，写信日期为1943年11月10日。托尔金说了和<a class="wiki-link" href="/entry/%E6%9F%A5%E5%B0%94%E6%96%AF%C2%B7%E5%A8%81%E5%BB%89%E6%96%AF/">查尔斯·威廉斯</a>的见面<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金提到，他感到很累，但仍在继续他的日常工作，包括撰写论文。他朗读了查尔斯·威廉斯的一本新小说的其中两个章节，并讲述了前一天在白马酒店与威廉斯的一次简短会面。</p>
