<h1>古尔德家族</h1>
<p><strong>古尔德家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Goold_Family" target="_blank" rel="noopener noreferrer">Goold Family</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族，已知的成员有<a class="wiki-link" href="/entry/%E6%A2%85%E5%A6%AE%E5%90%89%E5%B0%94%E8%BE%BE%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅妮吉尔达·古尔德</a>，她与“金老爹”<a class="wiki-link" href="/entry/%E7%BD%97%E9%87%8C%E9%A9%AC%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">罗里马克·白兰地鹿</a>成婚。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称与词源</h2>
<p>古尔德（Goold）是现实中存在的姓氏，由古英语中的“金”（Gold）更变而来。这或许暗示了书中古尔德家族成员较为显赫的身世地位。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
