<p><strong>阿兰威</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Aranwë" target="_blank" rel="noopener noreferrer">Aranwë</a></strong>）是一位<a class="wiki-link" href="/entry/%E8%8A%AC%E5%9B%BD%E6%98%90%E5%AE%B6%E6%97%8F/">芬国昐家族</a>的精灵，他是<a class="wiki-link" href="/entry/%E6%B2%83%E9%9A%86%E5%A8%81/">沃隆威</a>的父亲。除此之外，阿兰威的生平不详。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p><em>aran</em> 意为“君王”，<em>we</em> 是一个表示“某人”的后缀。因此，“阿兰威”这个名字意为“一位贵族”。</p>
<h2>家谱</h2>
<p>（下表按世代分行列出）</p>

<li>阿兰威 生卒年不详 · 姓名不详的母亲 · <a class="wiki-link" href="/entry/%E5%A5%87%E5%B0%94%E4%B8%B9/">奇尔丹</a> 生于<a class="wiki-link" href="/entry/%E5%8F%8C%E6%A0%91%E7%BA%AA%E5%85%83/">双树纪元</a></li>
<li><a class="wiki-link" href="/entry/%E6%B2%83%E9%9A%86%E5%A8%81/">沃隆威</a> 生于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a></li>
</ol>
