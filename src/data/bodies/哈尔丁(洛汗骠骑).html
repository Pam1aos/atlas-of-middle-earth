<p><strong>哈尔丁</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Harding" target="_blank" rel="noopener noreferrer">Harding</a></strong>）是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期的一位洛希尔人战士。</p>
<h2>生平</h2>
<p>魔戒大战中，哈尔丁随同<a class="wiki-link" href="/entry/%E5%B8%8C%E5%A5%A5%E9%A1%BF/">希奥顿王</a>驰援<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>。他战死于<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>之中，他的名称在《<a class="wiki-link" href="/entry/%E8%92%99%E5%BE%B7%E5%A0%A1%E5%A2%93%E5%86%A2%E4%B9%8B%E6%AD%8C/">蒙德堡墓冢之歌</a>》中久久传颂。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p><em>Harding</em> 源自古英语中的 <em>hearding</em> （“坚定的人、强壮的人”）。</p>
