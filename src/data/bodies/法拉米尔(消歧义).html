<p><strong>法拉米尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Faramir_(disambiguation" target="_blank" rel="noopener noreferrer">Faramir</a>)</strong>），是以下四位人物的名字：</p>
<ul>
<li>盖米尔是奇尔丹遣往纳国斯隆德的一位信使，他曾与图奥相遇。他的名字曾被定为法拉米尔。</li>
<li>法拉米尔，是刚铎第31位国王昂多赫尔的次子。他在营地之战中阵亡。</li>
<li>法拉米尔，是刚铎第26任执政宰相德内梭尔二世的次子、波洛米尔之弟。魔戒大战后成为伊希利恩亲王，并仍保留宰相之职。</li>
<li>法拉米尔一世·图克，是佩里格林之子，是夏尔第33任长官。</li>
</ul>
