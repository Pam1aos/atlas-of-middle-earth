<h1>梭洛辛佩语</h1>
<p><strong>梭洛辛佩语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Solosimpilin" target="_blank" rel="noopener noreferrer">Solosimpilin</a></strong>），是<a class="wiki-link" href="/entry/%E6%A2%AD%E6%B4%9B%E8%BE%9B%E4%BD%A9%E6%97%8F/">梭洛辛佩族</a>的语言，它是<a class="wiki-link" href="/entry/%E6%B3%B0%E5%8B%92%E7%91%9E%E8%AF%AD/">泰勒瑞语</a>的前身。</p>
