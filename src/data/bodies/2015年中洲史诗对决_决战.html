<p><a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a></p>
<p>是杜内丹人第16代也是最后一代族长。他是伊熙尔杜第39代直系后裔，是他的时代里最伟大的人类。在魔戒大战中，他领导人类对抗索隆的邪恶势力；他帮助护戒远征队完成了销毁至尊戒的任务、彻底消灭了大敌；在战后，他建立了阿尔诺与刚铎联合王国，阿尔诺与刚铎再次团结在了一起。</p>
<img class="wiki-img" src="/images/160px-Jenny_Dolfen_-_There_will_be_Blood.webp" alt="Wp therewillbeblood col3.jpg" loading="lazy" decoding="async" /><p><a class="wiki-link" href="/entry/%E8%BF%88%E5%85%B9%E6%B4%9B%E6%96%AF/">迈兹洛斯</a></p>
<p>是一位诺多精灵王子，是费艾诺的长子、芬威的长孙。他的母亲是玛赫坦的女儿奈丹妮尔，他的六个弟弟依次是玛格洛尔、凯勒巩、卡兰希尔、库茹芬、阿姆罗德和阿姆拉斯。他被称为“高个子”，并有着红铜色的头发。</p>
