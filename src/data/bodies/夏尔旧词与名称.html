<h1>夏尔旧词与名称</h1>
<p><strong>《夏尔旧词与名称》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Words_and_Names_in_the_Shire" target="_blank" rel="noopener noreferrer">Old Words and Names in the Shire</a></strong>），是<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里阿道克·白兰地鹿</a>撰写的一篇短论文。这篇论文写于<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>结束后，具体时间不详。在这篇论文中，<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>着重探讨了夏尔的旧词（如<a class="wiki-link" href="/entry/%E9%A9%AC%E6%9D%BE/">马松</a>）和地名中的古老元素，同<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97%E8%AF%AD/">洛汗语</a>之间的亲缘关系。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
