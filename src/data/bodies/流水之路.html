<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>流水之路</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Way_of_Running_Waters" target="_blank" rel="noopener noreferrer">Way of Running Waters</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一条街道，它连接着诸神之地和刚多林南面城墙上的一座塔楼，途径<a class="wiki-link" href="/entry/%E5%9F%8E%E5%8D%97%E8%AF%B8%E6%B3%89/">城南诸泉</a>。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E7%9A%84%E9%99%B7%E8%90%BD/">刚多林陷落</a>时，<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>带领逃难的<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E6%B0%91/">刚多林民</a>通过流水之路前往城南自己的家宅，从那里进入<a class="wiki-link" href="/entry/%E4%BC%8A%E7%BC%80%E5%B0%94%E7%9A%84%E5%AF%86%E9%81%93/">伊缀尔的密道</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
