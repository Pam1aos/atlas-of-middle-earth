<h1>图姆拉登谷(刚铎)</h1>
<blockquote>
<p>本词条叙述的对象是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的谷地。想要了解<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的隐匿山谷，请参看<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A7%86%E6%8B%89%E7%99%BB%E8%B0%B7/">图姆拉登谷</a>。</p>
</blockquote>
<p><strong>图姆拉登谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tumladen_(Gondor" target="_blank" rel="noopener noreferrer">Tumladen</a>)</strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>境内的一座谷地，它位于<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>南麓，<a class="wiki-link" href="/entry/%E5%87%AF%E6%B4%9B%E6%96%AF%E6%B2%B3/">凯洛斯河</a>汇入<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E6%96%AF%E6%B2%B3/">西瑞斯河</a>的地方。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，刚铎都城<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>的老人、孩子和妇女都被送往图姆拉登谷、<a class="wiki-link" href="/entry/%E6%B4%9B%E6%96%AF%E9%98%BF%E5%B0%94%E9%82%A3%E8%B5%AB/">洛斯阿尔那赫</a>和<a class="wiki-link" href="/entry/%E8%8E%B1%E6%9C%AC%E5%AE%81/">莱本宁</a>避难。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
