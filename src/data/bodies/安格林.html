<h1>安格林</h1>
<p><strong>安格林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Angrim" target="_blank" rel="noopener noreferrer">Angrim</a></strong>），是一位<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>的<a class="wiki-link" href="/entry/%E4%BC%8A%E7%94%B8%E4%BA%BA/">伊甸人</a>。他的生平不详，仅能确定他生活在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>第五世纪左右，并至少拥有一个名叫<a class="wiki-link" href="/entry/%E6%88%88%E5%88%A9%E5%A7%86/">戈利姆</a>的儿子，后者是追随<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E5%B8%8C%E5%B0%94/">巴拉希尔</a>的十二名亡命徒之一。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
