<h1>加索尔</h1>
<p><strong>加索尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/gathol" target="_blank" rel="noopener noreferrer">gathol</a></strong>），是<a class="wiki-link" href="/entry/%E5%BA%93%E5%85%B9%E9%83%BD%E8%AF%AD/">库兹都语</a>中意为“要塞”的单词，目前仅在<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E6%88%88%E6%96%AF%E7%89%B9/">加比加索尔</a> (Gabilgathol) 一词中出现过。</p>
