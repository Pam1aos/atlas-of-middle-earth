<h1>无尽阶梯</h1>
<p><strong>无尽阶梯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Endless_Stair" target="_blank" rel="noopener noreferrer">Endless Stair</a></strong>）是一道蜿蜒的阶梯，从<a class="wiki-link" href="/entry/%E5%A2%A8%E7%91%9E%E4%BA%9A/">卡扎督姆</a>最深处的厅堂一直延伸到<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B8%83%E8%BF%AA%E5%B0%94/">银齿峰</a>顶的<a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E4%B9%8B%E5%A1%94/">都林之塔</a>。阶梯非常漫长，因此而得名。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>晚期，普遍认知是无尽阶梯位置已不可考，或是已经被毁，甚至一些矮人也认为无尽阶梯只存在于传说之中。但巫师<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>追踪<a class="wiki-link" href="/entry/%E9%83%BD%E6%9E%97%E7%9A%84%E5%85%8B%E6%98%9F/">都林的克星</a>直到无尽阶梯的顶端，证明事实并非如此<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
