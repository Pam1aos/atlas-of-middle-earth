<h1>安-森那斯</h1>
<p><strong>安-森那斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ann-thennath" target="_blank" rel="noopener noreferrer">Ann-thennath</a></strong>），是一种<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>语诗歌的体裁，它很难被翻译成<a class="wiki-link" href="/entry/%E8%A5%BF%E9%83%A8%E8%AF%AD/">通用语</a>而不失去神韵。在<a class="wiki-link" href="/entry/%E9%A3%8E%E4%BA%91%E9%A1%B6/">风云顶</a>上，阿拉贡为霍比特人们所吟唱的关于<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>与<a class="wiki-link" href="/entry/%E9%9C%B2%E8%A5%BF%E6%81%A9/">露西恩</a>的长诗，其原文就是以安-森那斯创作的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
