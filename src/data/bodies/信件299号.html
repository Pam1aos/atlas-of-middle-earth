<p><strong>信件299号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_299" target="_blank" rel="noopener noreferrer">Letter 299</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给罗根·格林的一封信，写信日期为1967年12月12日。托尔金感谢了格林的评论<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>格林曾评论过《大伍屯的铁匠》，并写道:“寻找意义就是把球切开，寻找它的活力。”托尔金感谢格林的评论，尤其是关于活力的评论。托尔金还说，这个故事不适合儿童阅读。</p>
