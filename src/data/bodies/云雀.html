<h1>云雀</h1>
<p><strong>云雀</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Larks" target="_blank" rel="noopener noreferrer">Larks</a></strong>）是一种擅长鸣唱的鸟类，它的<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名称是“<strong>利茹林</strong>”。在诺多之王<a class="wiki-link" href="/entry/%E8%8A%AC%E5%A8%81/">芬威</a>丧妻后，他前去<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%BC%E9%AD%81%E6%8F%90%E5%B0%94/">塔尼魁提尔山</a>拜访挚友<a class="wiki-link" href="/entry/%E8%8B%B1%E6%A0%BC%E5%A8%81/">英格威</a>，以寻求慰藉。当他走近英格威的家宅时，英格威的女儿<a class="wiki-link" href="/entry/%E8%8C%B5%E8%BF%AA%E4%B8%9D/">茵迪丝</a>远远地看见了他，并唱起一首欢欣的歌曲，其美妙“如同穹苍中利茹林的歌喉一般”。于是，芬威对茵迪丝一见钟情，他们次年就成婚了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
