<p><strong>普莉西拉·托尔金</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Priscilla_Tolkien" target="_blank" rel="noopener noreferrer">Priscilla Tolkien</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>唯一的女儿，是<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>、<a class="wiki-link" href="/entry/%E8%BF%88%E5%85%8B%E5%B0%94%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">迈克尔·托尔金</a>和<a class="wiki-link" href="/entry/%E7%BA%A6%E7%BF%B0%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">约翰·托尔金</a>的妹妹。她在退休前是一名社会工作者。</p>
<p>普莉西拉·托尔金自<a class="wiki-link" href="/entry/1986%E5%B9%B4/">1986年</a>起担任<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E5%AD%A6%E7%A4%BE/">托尔金学社</a>的名誉副主席，直至去世。多年来，她也是牛津聚会协会成员的主人。</p>
