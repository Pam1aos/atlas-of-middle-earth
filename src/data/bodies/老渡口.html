<h1>老渡口</h1>
<p><strong>老渡口</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Ford" target="_blank" rel="noopener noreferrer">Old Ford</a></strong>），是指<a class="wiki-link" href="/entry/%E8%80%81%E5%AF%86%E6%9E%97%E8%B7%AF/">老密林路</a>和<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>交叉点的一片渡河浅滩，位于<a class="wiki-link" href="/entry/%E5%8D%A1%E5%B0%94%E5%B2%A9/">卡尔岩</a>下游大约四十英里。老渡口处曾有一座桥梁，它在<a class="wiki-link" href="/entry/%E6%9C%80%E5%90%8E%E8%81%94%E7%9B%9F%E5%A4%A7%E6%88%98/">最后联盟大战</a>期间得到拓宽加固，以供最后联盟大军通过。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>但到<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>后期，并无记载提及老渡口处仍有桥梁存在，很可能它已经失修倒塌了。</p>
