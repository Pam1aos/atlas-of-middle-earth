<h1>9月6日</h1>
<h2>现实世界</h2>
<ul>
<li>1939年－演员戈登·里德出生，他为1981年版《魔戒》广播剧配音，饰山迪曼，以及艾森加德的斯那嘎与魔多的斯那嘎。</li>
<li>1949年－作家罗伯特·福斯特出生，他是《中洲导读大全》的作者。</li>
<li>1973年－J·R·R·托尔金的安魂弥撒在牛津市海丁顿地区的帕多瓦圣安东尼教堂举行，神父罗伯特·默里出席。</li>
<li>1992年－广播剧《汤姆·邦巴迪尔历险记》第一部分在BBC播出。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元3019年－返乡的弗罗多一行在看得见墨瑞亚群山的地方停下。</li>
</ul>
