<h1>渡口小路</h1>
<p><strong>渡口小路</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ferry_Lane" target="_blank" rel="noopener noreferrer">Ferry Lane</a></strong>），是指通往<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87%E6%B8%A1%E5%8F%A3/">雄鹿镇渡口</a>的小路。这条路起自<a class="wiki-link" href="/entry/%E4%B8%BB%E9%81%93(%E5%A4%8F%E5%B0%94)/">主道</a>，入口的标志是两根高大的白柱子，赫然耸现在路的右边。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>渡口小路长约一百码，路很直，维护得很好，用刷白的大石镶边。路的终点通向河边，那里有处宽阔的木制码头，即雄鹿镇渡口。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
<p><a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>正是在渡口小路的入口处与载着<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>的<a class="wiki-link" href="/entry/%E5%86%9C%E5%A4%AB%E9%A9%AC%E6%88%88%E7%89%B9/">农夫马戈特</a>的马车相遇。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
