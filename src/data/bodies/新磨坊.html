<h1>新磨坊</h1>
<p><strong>新磨坊</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/New_Mill" target="_blank" rel="noopener noreferrer">New Mill</a></strong>），是痘王<a class="wiki-link" href="/entry/%E6%B4%9B%E7%B4%A2%C2%B7%E8%90%A8%E5%85%8B%E7%BB%B4%E5%B0%94-%E5%B7%B4%E9%87%91%E6%96%AF/">洛索</a>拆除<a class="wiki-link" href="/entry/%E7%A3%A8%E5%9D%8A%E4%B8%BB%E5%B1%B1%E8%BF%AA%E6%9B%BC/">山迪曼</a>的<a class="wiki-link" href="/entry/%E8%80%81%E7%A3%A8%E5%9D%8A/">老磨坊</a>后，重新搭建的磨坊。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E7%BA%AA%E5%B9%B4/">夏尔历</a>1418年，痘王洛索在去<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>之前就买下了山迪曼的磨坊。他在搬到袋底洞不久后，便拆除了老磨坊，弄来一帮长相丑陋的人类,,也就是<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>，盖了这座新磨坊。山迪曼的儿子<a class="wiki-link" href="/entry/%E6%B3%B0%E5%BE%B7%C2%B7%E5%B1%B1%E8%BF%AA%E6%9B%BC/">泰德</a>在里头帮他们干活。痘王的打算是，“磨得更多更快”。秋收时，<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">沙基</a>来到<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>。他们不再在新磨坊磨谷物，而是整天作业，排放污染，令霍比屯不得安宁。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
