<p><strong>寡妇朗布尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Widow_Rumble" target="_blank" rel="noopener noreferrer">Widow Rumble</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一位<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>后，寡妇朗布尔照顾着<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>的父亲<a class="wiki-link" href="/entry/%E6%B1%89%E5%A7%86%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">汉姆法斯特</a>。这是使山姆放心从<a class="wiki-link" href="/entry/%E8%A2%8B%E4%B8%8B%E8%B7%AF/">袋下路</a>搬到<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>的原因之一。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<blockquote>
<p>“但你知道你家老头住得很近，寡妇朗布尔会把他照顾得很好。”<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>—— 弗罗多·巴金斯</p>
</blockquote>
