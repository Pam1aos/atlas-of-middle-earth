<h1>Catherine Chmiel</h1>
<p><strong>Catherine Chmiel</strong>,全名 Catherine Karina Chmiel-Gugulska。她是一位出色的波兰插画家，绘制了大量与托尔金作品相关的优秀插画。Catherine是波兰托尔金协会的成员。她还为粉丝自制电影希望的诞生进行了概念设计。</p>
