<h1>弯梯</h1>
<p><strong>弯梯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Winding_Stair" target="_blank" rel="noopener noreferrer">Winding Stair</a></strong>）是<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F%E7%9A%84%E9%98%B6%E6%A2%AF/">奇立斯乌苟的阶梯</a>中的第二段，比<a class="wiki-link" href="/entry/%E7%9B%B4%E6%A2%AF/">直梯</a>更长但相对平缓。</p>
<p>攀上直梯后，继续攀登一段数英里长没有阶梯的通道，然后通过一段位于峭壁与悬崖之间宽敞崎岖的岩架，就可以抵达弯梯。弯梯并非开凿于山体之中，而是在山体外侧盘旋上升。它的最后一段路程逐渐变直，通往一处可以休息的平台。从这里，道路通向<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F/">奇立斯乌苟</a>隘口。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
