<h1>万鸟之王</h1>
<p><strong>万鸟之王</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/King_of_All_Birds" target="_blank" rel="noopener noreferrer">King of All Birds</a></strong>）是<a class="wiki-link" href="/entry/%E9%B9%B0%E7%8E%8B/">鹰王</a>拥有的一个头衔。这个头衔是它在<a class="wiki-link" href="/entry/%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">五军之战</a>后获得的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>为感谢<a class="wiki-link" href="/entry/%E5%A4%A7%E9%B9%B0/">大鹰</a>在五军之战中提供的援助，<a class="wiki-link" href="/entry/%E9%93%81%E8%B6%B3%E6%88%B4%E5%9B%A0/">铁足戴因</a>献给鹰王一顶金冠，发誓世世代代与大鹰结为盟友；<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>鹰王手下的十五名首领也戴上了矮人打造的黄金项圈。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
