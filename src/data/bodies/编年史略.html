<h1>编年史略</h1>
<p>《<strong>编年史略</strong>》（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Tale_of_Years" target="_blank" rel="noopener noreferrer">The Tale of Years</a></strong>）是一部编年史。该书很有可能是在<a class="wiki-link" href="/entry/%E5%A4%A7%E6%96%AF%E5%AF%86%E5%A5%A5/">大斯密奥</a>汇总的，<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里阿道克·白兰地鹿</a>从<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>收集的材料对这本书的完成有所助益。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>《魔戒》<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E9%99%84%E5%BD%95%E4%BA%8C/">附录二</a>给出的是该书经过大幅缩写的版本。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
