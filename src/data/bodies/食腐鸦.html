<p>Alan Lee</p>
<p><strong>食腐鸦</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gorcrows" target="_blank" rel="noopener noreferrer">Gorcrows</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的民间传说里的一种乌鸦。传说食腐鸦和可怕的水怪<a class="wiki-link" href="/entry/%E7%BC%AA%E5%88%A9%E6%99%AE/">缪利普</a>生活在同一片沼泽地，它们栖息在腐烂的河滩旁的垂柳上，即使在睡梦中依然发出着嘶哑的啼鸣。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“食腐鸦”（Gorcrows）这一名称来自古英语，它由<code>gore</code>（“污秽”）和<code>crow</code>（“乌鸦”）两部分组成。在现实生活中，这其实是 <a class="ext-link" href="https://en.m.wikipedia.org/wiki/Carrion_crow" target="_blank" rel="noopener noreferrer">小嘴乌鸦</a> 的古英语别称，这种鸟类性喜食腐，因而得名。</p>
