<p><strong>阿纳瑞安</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Anárion" target="_blank" rel="noopener noreferrer">Anárion</a></strong>）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字，意为“太阳之子”。这个名字可以指以下人物。</p>
<ul>
<li>阿纳瑞安，埃兰迪尔的次子，与伊熙尔杜一同创建了刚铎王国，开创了刚铎国王的世系。</li>
<li>塔尔-阿纳瑞安，努门诺尔第八位君主。</li>
</ul>
