<p><strong>杰拉德·曼法斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gerard_Manface" target="_blank" rel="noopener noreferrer">Gerard Manface</a></strong>），牛津大学万灵学院。一位职业律师和业余登山者，经常旅行。他有许多孩子，而且为他们写了许多未出版的书和故事。他很少出现在概念社，是弗兰克利一位特别的朋友，但不是牛津的居民。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
