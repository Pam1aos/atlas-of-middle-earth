<p><strong>傲足太太</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mrs_Proudfoot" target="_blank" rel="noopener noreferrer">Mrs. Proudfoot</a></strong>），是电影<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%8A%A4%E6%88%92%E4%BD%BF%E8%80%85/">《指环王：护戒使者》</a>中原创的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Megan Edwards 饰演。</p>
<h2>生平</h2>
<p>傲足太太在<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E6%8A%A4%E6%88%92%E4%BD%BF%E8%80%85/">《指环王：护戒使者》</a>中短暂出境，没有台词。她是<a class="wiki-link" href="/entry/%E5%9F%83%E4%BD%9B%E6%8B%89%E5%BE%B7%C2%B7%E5%82%B2%E8%B6%B3/">埃佛拉德·傲足</a>性情乖戾的妻子；当埃佛拉德对巫师<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>的烟火流露出喜爱的表情时，她向丈夫投去了严厉的眼神，后者急忙收敛。</p>
