<h1>绞架草</h1>
<p><strong>绞架草</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gallows-weed" target="_blank" rel="noopener noreferrer">Gallows-weed</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>民间诗歌<a class="wiki-link" href="/entry/%E7%BC%AA%E5%88%A9%E6%99%AE/">《缪利普》</a>中提及的一种植物。根据诗歌所说，要寻找水怪<a class="wiki-link" href="/entry/%E7%BC%AA%E5%88%A9%E6%99%AE/">缪利普</a>，需要翻过莫洛克山脉、穿越托德沼泽，再经过“长着上吊树和绞架草的森林”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
