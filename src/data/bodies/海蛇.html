<p><strong>海蛇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sea-serpents" target="_blank" rel="noopener noreferrer">Sea-serpents</a></strong>），又称<strong>鱼龙</strong>，是一种仅知其名的神秘生物，它们可能属于<a class="wiki-link" href="/entry/%E6%81%B6%E9%BE%99/">恶龙</a>的一种。海蛇的<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名称是<code>lingwilóke</code>，<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称是<code>lhimlug</code>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
