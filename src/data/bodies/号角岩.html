<h1>号角岩</h1>
<p><strong>号角岩</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hornrock" target="_blank" rel="noopener noreferrer">Hornrock</a></strong>）是<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E6%B7%B1%E8%B0%B7/">海尔姆深谷</a>北侧峭壁的一块突出的巨大岩石，位于峭壁南端的山脚下，也就是<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86%E5%85%B3%E5%8F%A3/">海尔姆关口</a>的东北方。<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97/">洛汗</a>的伟大堡垒<a class="wiki-link" href="/entry/%E5%8F%B7%E8%A7%92%E5%A0%A1/">号角堡</a>便是建立在号角岩之上，<a class="wiki-link" href="/entry/%E6%B7%B1%E8%B0%B7%E9%98%B2%E5%BE%A1%E5%A2%99/">深谷防御墙</a>亦是从号角岩上建起，延续到海尔姆深谷南端的峭壁上。</p>
