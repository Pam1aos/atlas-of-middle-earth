<h1>哈尔洛斯塔</h1>
<p><strong>哈尔洛斯塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hyarrostar" target="_blank" rel="noopener noreferrer">Hyarrostar</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>东南方向的海岬，生长着大批多种多样的树木。自<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">塔尔-阿勒达瑞安</a>时代起，那里就有大种植园，为造船提供树木。哈尔洛斯塔与<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%8A%AA%E6%96%AF%E5%A1%94/">哈尔努斯塔</a>被一片漫长的海岸分得很开，而那片海岸海洋与陆地平缓过渡，这在努门诺尔是独一无二的（努门诺尔几乎所有临海的地方都是悬崖）。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>Hyarrostar是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“东南方的土地”。由表示南方的前缀<code>hyar-</code>、表示东方的中缀（来自于<code>rómen</code> “东方”）<code>-ro-</code>以及表示土地的后缀<code>-sta</code>构成。结尾的<code>-r</code>表示复数。</p>
