<h1>2019年托尔金大会</h1>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E5%A4%A7%E4%BC%9A(%E6%B6%88%E6%AD%A7%E4%B9%89)/">消歧义页面</a>。</p>
<p><strong>2019年托尔金大会</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tolkien_2019" target="_blank" rel="noopener noreferrer">Tolkien 2019</a></strong>），是<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E9%87%91%E5%AD%A6%E7%A4%BE/">托尔金学社</a>于8月7日至11日英国伯明翰举办的会议，以庆祝托尔金学社成立五十周年。本次大会共550人参加。</p>
<h2>嘉宾</h2>
<p>本次会议邀请的嘉宾包括：迪米特拉·费米、<a class="wiki-link" href="/entry/%E7%BA%A6%E7%BF%B0%C2%B7%E5%8A%A0%E6%80%9D/">约翰·加思</a>、伊曼纽尔·杰勒德、<a class="wiki-link" href="/entry/%E9%9F%A6%E6%81%A9%C2%B7G.%20%E5%93%88%E8%92%99%E5%BE%B7/">韦恩·G·哈蒙德</a>、<a class="wiki-link" href="/entry/%E8%89%BE%E4%BC%A6%C2%B7%E6%9D%8E/">艾伦·李</a>、凯瑟琳·麦基尔文、<a class="wiki-link" href="/entry/%E6%B3%B0%E5%BE%B7%C2%B7%E7%BA%B3%E5%8F%B2%E5%AF%86%E6%96%AF/">泰德·纳史密斯</a>、<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E8%92%82%E5%A8%9C%C2%B7%E6%96%AF%E5%8D%A1%E5%B0%94/">克里斯蒂娜·斯卡尔</a>、<a class="wiki-link" href="/entry/%E5%B8%83%E8%8E%B1%E6%81%A9%C2%B7%E8%A5%BF%E5%B8%83%E5%88%A9/">布莱恩·西布利</a>、<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E5%B8%8C%E6%AF%94/">汤姆·希比</a>、大卫·威克斯。</p>
