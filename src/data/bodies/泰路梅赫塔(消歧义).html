<p><strong>泰路梅赫塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Telumehtar" target="_blank" rel="noopener noreferrer">Telumehtar</a></strong>），在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中意为“天空的勇士”，可以指称：</p>
<ul>
<li>星座美尼尔玛卡的别名，衍生自泰理梅克塔。</li>
<li>泰路梅赫塔·乌姆巴达奇尔，刚铎的第二十八位国王。</li>
</ul>
