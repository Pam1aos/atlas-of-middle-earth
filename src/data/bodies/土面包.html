<h1>土面包</h1>
<p><strong>土面包</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Earth-bread" target="_blank" rel="noopener noreferrer">Earth-bread</a></strong>），是一种只有<a class="wiki-link" href="/entry/%E7%9F%AE%E4%BA%BA/">矮人</a>才知道的根茎类食物。它的表皮之下洁白丰润，煮熟后味道有点像是面包。矮人既不愿意告诉其他种族这种根块的名字，也不外传采掘它们的办法，因为他们担心不知节制的人类会把所有的薯根都挖光。在食物短缺的冬季，土面包是十分重要的存粮。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>和<a class="wiki-link" href="/entry/%E7%9A%8B%E5%B0%94%E6%B0%91/">皋尔民</a>匪帮藏身于<a class="wiki-link" href="/entry/%E9%98%BF%E8%92%99%E5%A6%82%E5%85%B9/">阿蒙如兹山</a>时，他们依靠小矮人<a class="wiki-link" href="/entry/%E5%AF%86%E5%A7%86/">密姆</a>分享的土面包度过了寒冬。不过，密姆拒绝把土面包分给匪帮成员之一的<a class="wiki-link" href="/entry/%E4%B9%8C%E6%8B%89%E5%BE%B7/">乌拉德</a>，因为乌拉德出言顶撞过他。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
