<p><strong>大桥客栈</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bridge_Inn" target="_blank" rel="noopener noreferrer">Bridge Inn</a></strong>）靠近<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E6%A1%A5/">白兰地桥</a>，位于白兰地河西岸上。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>魔戒大战期间，在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>被大种人的<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍</a>占领后，大桥客栈遭到拆除，取而代之的是几座阴郁、死气沉沉的守卫房。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
