<h1>艾伦萨加山</h1>
<p><strong>艾伦萨加山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Írensaga" target="_blank" rel="noopener noreferrer">Írensaga</a></strong>），是<a class="wiki-link" href="/entry/%E7%99%BD%E8%89%B2%E5%B1%B1%E8%84%89/">白色山脉</a>北侧的一座高大山峰，形状如同锯齿。<a class="wiki-link" href="/entry/%E7%A5%A0%E8%BE%B9%E8%B0%B7/">祠边谷</a>与<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E7%A5%A0/">黑蛮祠</a>要塞坐落在艾伦萨加山、<a class="wiki-link" href="/entry/%E5%B0%96%E5%88%BA%E5%B1%B1/">尖刺山</a>与<a class="wiki-link" href="/entry/%E5%BE%B7%E7%BB%B4%E8%8E%AB%E4%BC%AF%E6%A0%BC%E5%B1%B1/">德维莫伯格山</a>等三座高峰的环抱内。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>艾伦萨加（Írensaga）是一个古英语词汇，意为“铁锯齿”，因为山峰的形状如同锯齿。</p>
