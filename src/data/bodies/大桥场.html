<h1>大桥场</h1>
<p><strong>大桥场</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bridgefields" target="_blank" rel="noopener noreferrer">Bridgefields</a></strong>），位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>，比邻<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E6%A1%A5/">白兰地桥</a>，<a class="wiki-link" href="/entry/%E5%B0%8F%E6%B2%B3/">小河</a>经此流入<a class="wiki-link" href="/entry/%E5%B7%B4%E5%85%B0%E9%83%BD%E5%9B%A0%E6%B2%B3/">白兰地河</a>。大桥场西部坐落小镇<a class="wiki-link" href="/entry/%E7%99%BD%E7%8A%81%E6%B2%9F/">白犁沟</a>和<a class="wiki-link" href="/entry/%E5%8D%9A%E6%9D%B0%E6%B4%A5/">博杰津</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>博杰津以作为<a class="wiki-link" href="/entry/%E5%8D%9A%E5%B0%94%E6%9D%B0%E5%AE%B6%E6%97%8F/">博尔杰家族</a>的家而著称，身为家族成员之一的<a class="wiki-link" href="/entry/%E5%BC%97%E9%9B%B7%E5%BE%B7%E5%8A%A0%C2%B7%E5%8D%9A%E5%B0%94%E6%9D%B0/">弗雷德加·博尔杰</a>参与了弗罗多前往<a class="wiki-link" href="/entry/%E5%B9%BD%E8%B0%B7/">幽谷</a>的征途。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
