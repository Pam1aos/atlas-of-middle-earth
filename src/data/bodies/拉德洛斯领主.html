<h1>拉德洛斯领主</h1>
<p><strong>拉德洛斯领主</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lord_of_Ladros" target="_blank" rel="noopener noreferrer">Lord of Ladros</a></strong>），对<a class="wiki-link" href="/entry/%E5%A4%9A%E6%9D%BE%E5%B0%BC%E5%AE%89/">多松尼安</a>的<a class="wiki-link" href="/entry/%E6%8B%89%E5%BE%B7%E6%B4%9B%E6%96%AF/">拉德洛斯</a>高地有统治权，这个头衔由<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>的<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">人类</a>世代相传。</p>
<p>第一位拉德洛斯领主是<a class="wiki-link" href="/entry/%E6%B3%A2%E9%9A%86/">波隆</a>之子<a class="wiki-link" href="/entry/%E6%B3%A2%E6%B4%9B%E7%B1%B3%E5%B0%94(%E6%8B%89%E5%BE%B7%E6%B4%9B%E6%96%AF%E9%A2%86%E4%B8%BB)/">波洛米尔</a>。他担任族长时，<a class="wiki-link" href="/entry/%E8%8A%AC%E7%BD%97%E5%BE%B7/">芬罗德·费拉贡德</a>将这片土地赠予他，因贝奥家族已忠心为他效力多年。波洛米尔之后，他的儿子<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%9B%BD%E5%B0%94/">布瑞国尔</a>继承了这个头衔，随后则是布瑞国尔的长子<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%9B%BD%E6%8B%89%E6%96%AF/">布瑞国拉斯</a>。</p>
<p><a class="wiki-link" href="/entry/%E9%AA%A4%E7%81%AB%E4%B9%8B%E6%88%98/">骤火之战</a>中，多松尼安被<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>攻陷，布瑞国拉斯战死。于是他的弟弟<a class="wiki-link" href="/entry/%E5%B7%B4%E6%8B%89%E5%B8%8C%E5%B0%94/">巴拉希尔</a>带领仍忠于他的那些人在多松尼安流浪，拉德洛斯领主不复存在。</p>
