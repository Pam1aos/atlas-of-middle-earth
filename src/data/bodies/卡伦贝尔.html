<p><strong>卡伦贝尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Calembel" target="_blank" rel="noopener noreferrer">Calembel</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的一个小镇。</p>
<h2>地理</h2>
<p>卡伦贝尔位于<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的封地<a class="wiki-link" href="/entry/%E6%8B%89%E6%A2%85%E9%A1%BF/">拉梅顿</a>，坐落在<a class="wiki-link" href="/entry/%E5%A5%87%E5%88%A9%E5%B0%94%E6%B2%B3/">奇利尔河</a>岸边。从<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E8%B5%AB/">埃瑞赫</a>到<a class="wiki-link" href="/entry/%E4%BD%A9%E6%8B%89%E5%9F%BA%E5%B0%94/">佩拉基尔</a>的大道经过这个小镇。</p>
<h2>历史</h2>
<p>在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>中，许多卡伦贝尔的男人离家去征战。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月9日，留在卡伦贝尔的人听说了<a class="wiki-link" href="/entry/%E5%B1%B1%E4%B8%AD%E4%B9%8B%E6%B0%91/">亡者</a>即将到来的传言，全都逃到了山里。<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>率领灰衣劲旅和亡者来到卡伦贝尔时，发现小镇已经空无一人。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><strong>卡伦贝尔</strong>（Calembel）意为“绿色的小镇”。该词可能是由<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>中的<code>calen</code>（“绿色的”）和<code>pel</code>（“围篱”）组合而成。</p>
