<h1>黄油菊家族</h1>
<p><strong>黄油菊家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Butterbur_Family" target="_blank" rel="noopener noreferrer">Butterbur Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>的一个古老的家族，世代经营<a class="wiki-link" href="/entry/%E8%B7%83%E9%A9%AC%E5%AE%A2%E6%A0%88/">跃马客栈</a>。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，跃马客栈的老板是<a class="wiki-link" href="/entry/%E9%BA%A6%E6%9B%BC%C2%B7%E9%BB%84%E6%B2%B9%E8%8F%8A/">麦曼·黄油菊</a>。</p>
<h2>名字与词源</h2>
<p>黄油菊（Butterbur）是一种菊科植物，因叶子常用来包裹黄油而得名。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
