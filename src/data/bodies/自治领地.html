<h1>自治领地</h1>
<p><strong>自治领地</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Folklands" target="_blank" rel="noopener noreferrer">Folklands</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一些家族自治的区域，如<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%9C%B0/">图克地</a>。夏尔可以分为四区，它们又各自分为数片自治领地，以一些古老望族的姓氏冠名。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
