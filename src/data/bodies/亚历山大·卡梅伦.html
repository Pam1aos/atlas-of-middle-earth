<p>亚历山大·卡梅伦（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Alexander_Cameron" target="_blank" rel="noopener noreferrer">Alexander Cameron</a></strong>），牛津大学埃克塞特学院，生于1935年。现代历史学家，对西班牙和南美历史特别感兴趣。他收藏硬币和邮票，弹自动钢琴。没有人记得他被邀请加入俱乐部，也不知道他为什么来，但他仍不时出现。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
