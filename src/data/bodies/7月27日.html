<h1>7月27日</h1>
<h2>现实世界</h2>
<ul>
<li>1938年－J·R·R·托尔金写下一封信（信件32号）。</li>
<li>1956年－J·R·R·托尔金写下一封信（信件192号）。</li>
<li>1966年－J·R·R·托尔金接待了不速之客J·S·瑞安和汉斯约尔格·莫德尔迈尔。</li>
<li>1972年－J·R·R·托尔金为自己的书桌写下真实性证书，以便拍卖。</li>
<li>2007年－第三届中洲角色扮演大会（MerpCon）举办，为期三天（7月27日-29日）。</li>
<li>2023年－第二十四届托尔金大会举办，为期四天（7月27日-30日）。</li>
</ul>
