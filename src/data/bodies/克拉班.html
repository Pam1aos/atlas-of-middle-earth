<p>John Howe</p>
<p><strong>克拉班</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Crebain" target="_blank" rel="noopener noreferrer">Crebain</a></strong>），是生活在<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>和<a class="wiki-link" href="/entry/%E9%BB%91%E8%9B%AE%E5%9C%B0/">黑蛮地</a>的一种大<a class="wiki-link" href="/entry/%E4%B9%8C%E9%B8%A6/">乌鸦</a>。</p>
<h2>历史</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年1月8日，当护戒远征队抵达<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%90%89%E5%AE%89/">埃瑞吉安</a>地区时，一大群克拉班从他们头上飞过。<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>推测，这些乌鸦可能是敌人（特别是<a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>）的间谍，正在侦察<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>和<a class="wiki-link" href="/entry/%E6%A0%BC%E7%93%A6%E6%96%AF%E7%BD%97%E6%B2%B3/">灰水河</a>之间的所有地区。因为这群乌鸦的缘故，远征队被迫尽快离开埃瑞吉安。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“克拉班”（Crebain）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>词汇，但它起源于人类的语言。<code>Crebain</code>是复数形式，其单数形式是<code>Craban</code>。</p>
