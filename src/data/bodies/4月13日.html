<h1>4月13日</h1>
<h2>现实世界</h2>
<ul>
<li>1902年－演员戈弗里·肯顿出生。他为1955年版《魔戒》广播剧配音，饰阿拉贡和玛布隆。</li>
<li>1944年－J·R·R·托尔金写下一封信（信件60号）。</li>
<li>2005年－翻译家沃尔夫冈·克雷格去世。他生前将J·R·R·托尔金的多部作品翻译成德语。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元2510年－伊奥希奥德大军接近多古尔都，洛丝罗瑞恩散出白雾驱退阴影，遮蔽大军的动向。</li>
<li>第三纪元3018年－甘道夫向弗罗多揭示，比尔博的戒指就是至尊戒。</li>
</ul>
