<p><strong>埃雅仁都尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eärendur_(disambiguation" target="_blank" rel="noopener noreferrer">Eärendur</a>)</strong>），是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>姓名，意为“大海的仆从”。它可以指代下列角色：</p>
<ul>
<li>埃雅仁都尔（生于第二纪元361年）：努门诺尔第三代国王塔尔-阿门迪尔的次子。</li>
<li>埃雅仁都尔（生于第二纪元晚期）：第十五代安督尼依亲王。</li>
<li>埃雅仁都尔（第三纪元640年 - 861年）：第十代及末代阿尔诺国王，阿尔诺王国在他死后分裂。</li>
</ul>
