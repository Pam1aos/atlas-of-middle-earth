<h1>哈拉德路</h1>
<p><strong>哈拉德路</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Harad_Road" target="_blank" rel="noopener noreferrer">Harad Road</a></strong>），是指连接刚铎王国境内的<a class="wiki-link" href="/entry/%E4%BC%8A%E5%B8%8C%E5%88%A9%E6%81%A9/">伊希利恩</a>封邑与遥远的<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7/">哈拉德地区</a>的长途道路。这条大道起自<a class="wiki-link" href="/entry/%E4%BC%8A%E5%B8%8C%E5%88%A9%E6%81%A9/">伊希利恩</a>，随后一路南去，先后越过<a class="wiki-link" href="/entry/%E6%B3%A2%E7%BD%97%E6%96%AF%E6%B2%B3%E6%B8%A1%E5%8F%A3/">波罗斯河渡口</a>、<a class="wiki-link" href="/entry/%E5%8D%97%E5%88%9A%E9%93%8E/">南刚铎</a>和<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E8%83%BD%E6%B2%B3/">哈尔能河</a>，最后深入哈拉德地区。</p>
<p>哈拉德路是由刚铎人的工艺铺设而成的。它的修建时间并不清楚，但可能是在<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E9%97%A8%E8%BE%BE%E5%A5%87%E5%B0%94%E4%BA%8C%E4%B8%96/">哈尔门达奇尔二世</a>的执政时期，当时刚铎王国的威势远达南方的哈拉德诸国，双方沿着哈拉德路进行商业贸易。随着刚铎的国力衰颓，哈拉德路逐渐变成了人迹罕至的古道，但它在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期再度启用，被当做<a class="wiki-link" href="/entry/%E5%93%88%E6%8B%89%E5%BE%B7%E4%BA%BA/">哈拉德人</a>大军入侵刚铎的军事通道。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
