<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>小集市</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lesser_Market" target="_blank" rel="noopener noreferrer">Lesser Market</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的一处集市广场，规模逊于<a class="wiki-link" href="/entry/%E5%A4%A7%E9%9B%86%E5%B8%82/">大集市</a>。<a class="wiki-link" href="/entry/%E7%AB%96%E7%90%B4%E5%AE%B6%E6%97%8F/">竖琴家族</a>领主<a class="wiki-link" href="/entry/%E8%90%A8%E5%B0%94%E7%94%98%E7%89%B9/">萨尔甘特</a>的家宅位于小集市。刚多林陷落之战中，<a class="wiki-link" href="/entry/%E5%9B%BE%E5%B0%94%E5%B7%A9/">图尔巩</a>命令萨尔甘特支援在大集市激战的<a class="wiki-link" href="/entry/%E9%87%91%E8%8A%B1%E5%AE%B6%E6%97%8F/">金花家族</a>，但怯懦的萨尔甘特隐瞒了命令，只让竖琴家族防守自家所在的小集市。竖琴家族的战士等得心焦，最终违抗了萨尔甘特的命令，擅自前往王之广场加入战斗。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
