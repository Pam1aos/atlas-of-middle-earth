<h1>盖米尔(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>

<p><strong>盖米尔</strong>可以指：</p>
<h2>第一纪的精灵</h2>
<p>两位生活在<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>：</p>
<ul>
<li>盖米尔(古伊林之子)，于骤火之战被魔苟斯的军队俘虏。</li>
<li>盖米尔(奇尔丹的信使)，一位被奇尔丹派去纳国斯隆德送信的诺多精灵。</li>
</ul>
<h2>早期版本中的精灵</h2>
<ul>
<li>阿米那斯，与盖米尔(奇尔丹的信使)同行的精灵，在早期版本中曾被称为盖米尔。</li>
<li>芬威，芬国昐的父亲，在the Lay of the Fall of Gondolin中被称为盖米尔。</li>
</ul>
