<p><strong>信件114号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_114" target="_blank" rel="noopener noreferrer">Letter 114</a></strong>），是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E4%BC%91%C2%B7%E5%B8%83%E7%BD%97%E6%A0%B9/">休·布罗根</a>的一封信，写信日期为1948年4月7日。托尔金介绍了自己的一些作品<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>布罗根读了<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E4%B9%A6%E7%B1%8D)/">《霍比特人》</a>，写信询问托尔金书中所讲述的世界。托尔金向他介绍了<a class="wiki-link" href="/entry/%E5%93%88%E8%8E%AB%E5%86%9C%E5%A4%AB%E8%B4%BE%E5%B0%94%E6%96%AF/">《哈莫农夫贾尔斯》</a>和未完成的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">《精灵宝钻》</a>和<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92(%E4%B9%A6%E7%B1%8D)/">《魔戒》</a>。</p>
