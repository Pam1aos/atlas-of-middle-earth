<h1>直梯</h1>
<p><strong>直梯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Straight_Stair" target="_blank" rel="noopener noreferrer">Straight Stair</a></strong>），是<a class="wiki-link" href="/entry/%E5%A5%87%E7%AB%8B%E6%96%AF%E4%B9%8C%E8%8B%9F%E7%9A%84%E9%98%B6%E6%A2%AF/">奇立斯乌苟的阶梯</a>中的第一段，陡峭而狭窄。</p>
<p>直梯始于<a class="wiki-link" href="/entry/%E5%9F%83%E6%96%90%E5%B0%94%E5%BA%A6%E9%98%BF%E6%96%AF/">埃斐尔度阿斯</a>山路上的一处圆形拐角，在岩石的石壁上开凿了楼梯。直梯两侧都有墙，然而十分陡峭，梯级狭窄且高低不一。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>末期，直梯的台阶已经风化磨损，易滑且随时可能崩落。攀上直梯后会到达一处没有修建阶梯的缓坡，随后就是第二段更长但相对平缓的阶梯<a class="wiki-link" href="/entry/%E5%BC%AF%E6%A2%AF/">弯梯</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
