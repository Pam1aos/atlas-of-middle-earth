<h1>邮局局长</h1>
<p><strong>邮局局长</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Postmaster" target="_blank" rel="noopener noreferrer">Postmaster</a></strong>），是主管夏尔<a class="wiki-link" href="/entry/%E9%82%AE%E9%80%92%E6%9C%8D%E5%8A%A1/">邮递服务</a>的长官，由<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87%E5%B8%82%E9%95%BF/">大洞镇市长</a>兼任。邮递服务和<a class="wiki-link" href="/entry/%E6%B2%BB%E5%AE%89%E8%AD%A6%E5%A4%87/">治安警备</a>是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>仅有的两种公共服务，其中邮政工作尤其繁忙。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
