<p><strong>信件303号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_303" target="_blank" rel="noopener noreferrer">Letter 303</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给尼古拉斯·托马斯的一封信，写信日期为1968年5月6日。关于托尔金和<a class="wiki-link" href="/entry/%E8%90%A8%E5%B0%94%E9%9C%8D%E7%A3%A8%E5%9D%8A/">萨尔霍磨坊</a><sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金简要地描述了萨尔霍磨坊和磨坊主在托尔金年轻时的重要性，说磨坊主和他的儿子是充满惊奇和恐惧的人物。</p>
