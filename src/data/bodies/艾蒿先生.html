<p><strong>艾蒿先生</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mr._Mugwort" target="_blank" rel="noopener noreferrer">Mr. Mugwort</a></strong>），是<a class="wiki-link" href="/entry/%E5%B8%83%E7%90%86/">布理</a>的霍比特人。在<a class="wiki-link" href="/entry/%E8%B7%83%E9%A9%AC%E5%AE%A2%E6%A0%88/">跃马客栈</a>，他目睹了<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>戴上戒指的全过程，此后当弗罗多取下戒指后，他与<a class="wiki-link" href="/entry/%E9%BA%A6%E6%9B%BC%C2%B7%E9%BB%84%E6%B2%B9%E8%8F%8A/">麦曼·黄油菊</a>发生争论，坚称看到了弗罗多凭空消失。弗罗多听见对话后，走上前试图安抚众人，但并未起效。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
