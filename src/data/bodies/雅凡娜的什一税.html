<h1>雅凡娜的什一税</h1>
<p><strong>雅凡娜的什一税</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tithe_of_Yavanna" target="_blank" rel="noopener noreferrer">Tithe of Yavanna</a></strong>）是<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>的一种农业制度，规定谷物收获后，需将十分之一的种子撒回田间。</p>
<p>在《<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2%E7%9A%84%E8%87%AA%E7%84%B6%E5%92%8C%E6%9C%AC%E8%B4%A8/">中洲的自然和本质</a>》中，托尔金提到，维林诺的谷物是自生的，只需收割和将十分之一的种子撒回田间即可。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
