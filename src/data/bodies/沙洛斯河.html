<p><strong>沙洛斯河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Thalos" target="_blank" rel="noopener noreferrer">Thalos</a></strong>），是六条发源自<a class="wiki-link" href="/entry/%E8%93%9D%E8%89%B2%E5%B1%B1%E8%84%89/">蓝色山脉</a>、流经<a class="wiki-link" href="/entry/%E6%AC%A7%E8%A5%BF%E7%91%9E%E5%AE%89%E5%BE%B7/">欧西瑞安德</a>、最终汇入<a class="wiki-link" href="/entry/%E7%9B%96%E7%90%86%E5%AE%89%E6%B2%B3/">盖理安河</a>的河流之中的第二条，位于<a class="wiki-link" href="/entry/%E9%98%BF%E6%96%AF%E5%8D%A1%E6%B2%B3/">阿斯卡河</a>与<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%9E%97%E6%B2%B3/">莱戈林河</a>之间<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。“沙洛斯”之名来源于<a class="wiki-link" href="/entry/%E4%BC%8A%E5%B0%94%E7%A7%91%E5%B0%94%E8%AF%AD/">伊尔科尔语</a>中的thalos（“激流”）一词。</p>
<p>沙洛斯河对于人类而言有着重要的历史意义: <a class="wiki-link" href="/entry/%E8%80%81%E8%B4%9D%E5%A5%A5/">贝奥</a>与他的追随者们，即最早来到<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的人类们，曾在它上游的河谷中安营扎寨，随后被<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>之王<a class="wiki-link" href="/entry/%E8%8A%AC%E7%BD%97%E5%BE%B7/">芬罗德</a>发现<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
