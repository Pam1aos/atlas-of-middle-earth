<p>哥伦布·阿迪提（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Colombo_Arditi" target="_blank" rel="noopener noreferrer">Colombo Arditi</a></strong>），生于1940年。意大利语教授。喜欢唱歌，是名男低音，他还喜欢游泳和滚木球戏，收集书籍和猫。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
