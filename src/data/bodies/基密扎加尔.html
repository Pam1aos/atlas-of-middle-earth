<p><strong>基密扎加尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gimilzagar" target="_blank" rel="noopener noreferrer">Gimilzagar</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>第十八位国王<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E5%8D%A1%E5%B0%94%E9%A9%AC%E5%A5%87%E5%B0%94/">塔尔-卡尔马奇尔</a>的次子，他是<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E5%B8%95%E8%93%9D%E6%8F%90%E5%B0%94/">塔尔-帕蓝提尔</a>的母亲<a class="wiki-link" href="/entry/%E5%8D%B0%E9%BD%90%E5%B0%94%E8%B4%9D%E4%B8%9D/">印齐尔贝丝</a>的祖先<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p>基密扎加尔（Gimilzagar）是阿督耐克语，意为“星剑”。</p>
