<h1>鳗鱼</h1>
<p><strong>鳗鱼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Eels" target="_blank" rel="noopener noreferrer">Eels</a></strong>），是一种鱼类。第二纪元的<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a><a class="wiki-link" href="/entry/%E8%A5%BF%E5%88%A9%E5%B0%94%E6%B2%B3/">西利尔河</a>下游附近的池塘和沼泽中盛产鳗鱼。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
