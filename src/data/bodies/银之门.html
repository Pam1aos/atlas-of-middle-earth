<h1>银之门</h1>
<p><strong>银之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Silver" target="_blank" rel="noopener noreferrer">Gate of Silver</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第五道大门。银之门的护墙低矮宽厚，由白大理石筑成，墙上有五个庞大的大理石球，之间的扶墙由银架搭建。大门的形状如同一个三段的圆环，在大门的上方正中央的大理石球上立着白树<a class="wiki-link" href="/entry/%E6%B3%B0%E5%B0%94%E4%BD%A9%E7%91%9E%E5%AE%89/">泰尔佩瑞安</a>的雕塑。门前站着许多白衣的弓箭手，门后的庭院以绿白两色大理石铺地，庭院的两侧各站着一百名身穿银甲、头戴白冠头盔的卫士。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>银之门后面的一道大门是<a class="wiki-link" href="/entry/%E9%87%91%E4%B9%8B%E9%97%A8/">金之门</a>。一条笔直的白色道路向<a class="wiki-link" href="/entry/%E9%87%91%E4%B9%8B%E9%97%A8/">金之门</a>延伸，路旁有着草坪和众多洁白的微洛斯花，其中还点缀着许多金色小花。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
