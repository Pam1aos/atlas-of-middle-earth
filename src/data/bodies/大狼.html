<h1>大狼</h1>
<p><strong>大狼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Wolf_(dog" target="_blank" rel="noopener noreferrer">Wolf</a>)</strong>），是<a class="wiki-link" href="/entry/%E8%B1%86%E5%9B%AD%E5%BA%84/">豆园庄</a>主人<a class="wiki-link" href="/entry/%E5%86%9C%E5%A4%AB%E9%A9%AC%E6%88%88%E7%89%B9/">农夫马戈特</a>驯养的三条像狼一样的大狗之一（另外两条是<a class="wiki-link" href="/entry/%E5%88%A9%E7%88%AA/">利爪</a>和<a class="wiki-link" href="/entry/%E5%B0%96%E7%89%99/">尖牙</a>）。当<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>造访豆园庄时，这三条大狗拦住了陌生的弗罗多和山姆，直到马戈特下令方才后退；但它们没有理会熟悉的皮平。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
