<h1>南大道</h1>
<p><strong>南大道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/South_Road" target="_blank" rel="noopener noreferrer">South Road</a></strong>），指<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">南北大道</a>在<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>以南、<a class="wiki-link" href="/entry/%E4%BD%A9%E6%8B%89%E5%9F%BA%E5%B0%94/">佩拉基尔</a>以北的路段，是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>境内的一条要道。</p>
<p>南大道始于<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>，向南延伸穿过<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E/">佩兰诺平野</a>周围的<a class="wiki-link" href="/entry/%E6%8B%89%E9%A9%AC%E6%96%AF%E5%9F%83%E9%9C%8D%E5%B0%94/">拉马斯埃霍尔</a>外墙，在<a class="wiki-link" href="/entry/%E5%9F%83%E8%8C%B9%E4%BC%8A%E6%B2%B3%E6%B8%A1%E5%8F%A3/">埃茹伊河渡口</a>越过<a class="wiki-link" href="/entry/%E5%9F%83%E8%8C%B9%E4%BC%8A%E6%B2%B3/">埃茹伊河</a>，最后抵达<a class="wiki-link" href="/entry/%E4%BD%A9%E6%8B%89%E5%9F%BA%E5%B0%94/">佩拉基尔</a>。南大道的路面宽阔铺石，道路的东侧有一条翠绿的宽马道平行延伸。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间、<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E4%BA%94-%E7%AC%AC%E5%9B%9B%E7%AB%A0/">刚铎围城</a>前夕，刚铎<a class="wiki-link" href="/entry/%E5%8D%97%E6%96%B9%E5%B0%81%E9%82%91/">南方封地</a>的诸将领就是从南大道前来援助米那斯提力斯。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
