<p><strong>信件222e号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_222e" target="_blank" rel="noopener noreferrer">Letter 222e</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给简·尼夫的一封信，写信日期为1960年4月4日。托尔金给他的姑妈寄了自己的书稿<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金又给他的姑妈寄了<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB/">《精灵宝钻》</a>的其中一部分。他为内容杂乱无章而道歉，并表示以后会给她寄去更有趣的东西。</p>
