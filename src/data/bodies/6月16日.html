<h1>6月16日</h1>
<h2>现实世界</h2>
<ul>
<li>1895年－墨象社成员沃伦·刘易斯出生。</li>
<li>1939年－作家大卫·麦克丹尼尔出生，他创立了第一个托尔金粉丝团体“The Fellowship of the Ring”，随后出版了四期《帕蓝提尔》杂志（I-Palantir）。</li>
<li>1989年－演员约翰·韦斯特布鲁克去世。他曾为1978年版《魔戒》动画电影配音，饰树须。</li>
<li>2003年：<ul>
<li>《不列颠作家：经典，卷二》（British Writers: Classics, Volume II）出版。</li>
<li>《2004年托尔金年历》出版。</li>
</ul>
</li>
</ul>
