<h1>马松屋</h1>
<p><strong>马松屋</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mathom-house" target="_blank" rel="noopener noreferrer">Mathom-house</a></strong>），是位于<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>的一座博物馆。顾名思义，博物馆里的展品都是所谓<a class="wiki-link" href="/entry/%E9%A9%AC%E6%9D%BE/">马松</a>，即<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>认为收之无用、弃之可惜的物件。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>马松屋的馆藏包括许多武器装备，其中最为珍贵的展品是<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>从<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%C2%B7%E6%A9%A1%E6%9C%A8%E7%9B%BE/">梭林</a>手中获赠的<a class="wiki-link" href="/entry/%E7%A7%98%E9%93%B6%E7%94%B2/">秘银甲</a>。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2942年，比尔博从<a class="wiki-link" href="/entry/%E5%AD%A4%E5%B1%B1/">孤山</a>返回家乡，随后把这件锁子甲借给马松屋展出。<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3001年，比尔博在永远离开夏尔之前取回了秘银衫。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup></p>
