<p>John Howe</p>
<p><strong>恩特饮料</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ent-draughts" target="_blank" rel="noopener noreferrer">Ent-draughts</a></strong>），是一种<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>用河水酿制的有魔力的饮料。它们尝起来就像是清水，不过带有淡淡的森林气息，或者是比较浓郁的大地的味道。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>与<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>住在<a class="wiki-link" href="/entry/%E6%A0%91%E9%A1%BB/">树须</a>家里时，曾有幸品尝过两次恩特饮料。饮料的效果从脚趾直达头顶，令人感到焕然一新，充满活力；他们的头发甚至都因为饮料而竖了起来，变得更长也更卷曲。恩特饮料所具有的生长的魔力在这两个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>身上体现得淋漓尽致：<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>喝过饮料之后长高了三英寸之多，这使他们成为有史以来最高的霍比特人。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
