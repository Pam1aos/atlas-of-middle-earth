<h1>奈莎美尔达</h1>
<p><strong>奈莎美尔达</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nessamelda" target="_blank" rel="noopener noreferrer">Nessamelda</a></strong>），是一种长青的<a class="wiki-link" href="/entry/%E8%8A%B3%E9%A6%99%E6%A0%91/">芳香树</a>。它由<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚</a>的<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>带至<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>，主要种植在努门诺尔西部的<a class="wiki-link" href="/entry/%E5%B0%BC%E8%A5%BF%E5%A7%86%E9%98%BF%E5%8B%92%E8%BE%BE/">尼西姆阿勒达</a>地区，很可能从未在<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>生长。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>奈莎美尔达（Nessamelda）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字，意为“<a class="wiki-link" href="/entry/%E5%A5%88%E8%8E%8E/">奈莎</a>的挚爱”，由<code>Nessa</code>（<a class="wiki-link" href="/entry/%E7%BB%B4%E6%8B%89/">维拉</a>之一<a class="wiki-link" href="/entry/%E5%A5%88%E8%8E%8E/">奈莎</a>的名字）和<code>melda</code>（“被爱的”）组成。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
