<p><strong>信件98a号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_98a" target="_blank" rel="noopener noreferrer">Letter 98a</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E6%96%AF%E6%89%98%E5%BC%97%C2%B7%E6%89%98%E5%B0%94%E9%87%91/">克里斯托弗·托尔金</a>的一封信，写信日期为1945年4月29日。克里斯托弗从南非休假回家了<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>克里斯托弗离开家15个月后，刚刚从南非休假回来。托尔金写道，在如此短暂的时间里再次见到他，让他回想起了离别的痛苦。他一如既往的送上了祝福和祈祷。</p>
