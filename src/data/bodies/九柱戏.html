<h1>九柱戏</h1>
<p><strong>九柱戏</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ninepins" target="_blank" rel="noopener noreferrer">Ninepins</a></strong>），是现代保龄球运动的前身，主要流行于欧洲。九柱戏的玩家需要将一个一般没有指孔的球滚下球道，以击倒球道尽头的九只木制球瓶。</p>
<p>在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>也存在九柱戏这种运动，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>就在这项运动上花费过不少时间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
