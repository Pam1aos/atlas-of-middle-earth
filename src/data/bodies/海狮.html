<h1>海狮</h1>
<p><strong>海狮</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Sealions" target="_blank" rel="noopener noreferrer">Sealions</a></strong>），是一种生存在海洋里的哺乳动物。在早期的中洲作品里，它们和<a class="wiki-link" href="/entry/%E7%8B%AC%E8%A7%92%E9%B2%B8/">独角鲸</a>一起为海神<a class="wiki-link" href="/entry/%E4%B9%8C%E6%AC%A7%E7%89%9F/">乌欧牟</a>拉车。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
