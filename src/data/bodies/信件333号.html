<p><strong>信件333号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_333" target="_blank" rel="noopener noreferrer">Letter 333</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1972年3月16日。托尔金搬家了<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金刚刚搬到默顿街21号，还在把他的东西从普尔搬出去。托尔金对雷纳说，他喜欢这所房子，尤其是附近那一堆由大学拥有和经营的炽热的鲜花，并邀请雷纳和他的妻子过来。</p>
