<h1>小洞镇</h1>
<p><strong>小洞镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Little_Delving" target="_blank" rel="noopener noreferrer">Little Delving</a></strong>）是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的一座村庄。它坐落在夏尔<a class="wiki-link" href="/entry/%E8%A5%BF%E5%8C%BA/">西区</a>的东北部、<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>的北边。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
