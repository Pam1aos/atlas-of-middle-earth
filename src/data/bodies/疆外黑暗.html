<h1>疆外黑暗</h1>
<p><strong>疆外黑暗</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nether_Darkness" target="_blank" rel="noopener noreferrer">Nether Darkness</a></strong>）是<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>最南边日月照不到的一块区域。第二纪元时，<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E4%BA%BA/">努门诺尔人</a>曾航行至此。这块区域很有可能是一片荒凉的不毛之地。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
