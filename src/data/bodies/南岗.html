<h1>南岗</h1>
<p><strong>南岗</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/South_Downs" target="_blank" rel="noopener noreferrer">South Downs</a></strong>），是<a class="wiki-link" href="/entry/%E9%A3%8E%E4%BA%91%E4%B8%98%E9%99%B5/">风云丘陵</a>以南、<a class="wiki-link" href="/entry/%E5%8F%A4%E5%86%A2%E5%B2%97/">古冢岗</a>以东的丘陵地带。这是一片光秃秃的阴郁荒地。<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">绿大道</a>将南岗和古冢岗分隔东西，<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东西大道</a>将南岗和风云丘陵分隔南北。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
