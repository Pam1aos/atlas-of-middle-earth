<h1>Juliana Pinho</h1>
<p><strong>Juliana Pinho</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Juliana_Pinho" target="_blank" rel="noopener noreferrer">Juliana Pinho</a></strong>）是一位巴西籍女艺术家，她创作了许多奇幻题材的作品，个人风格强烈。她也创作了一些关于托尔金作品中较为冷门角色的作品。Juliana Pinho 授权本维基使用她的作品，详见授权信息。</p>
