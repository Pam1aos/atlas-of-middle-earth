<h1>西马克元帅</h1>
<p><strong>西马克元帅</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Marshal_of_the_West-mark" target="_blank" rel="noopener noreferrer">Marshal of the West-mark</a></strong>）是<a class="wiki-link" href="/entry/%E9%A9%AC%E5%85%8B%E5%85%83%E5%B8%85/">马克元帅</a>中的一员，负责统领西马克军团。西马克元帅是一个新的头衔，由洛汗王<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>结束后创立，首位西马克元帅是<a class="wiki-link" href="/entry/%E5%9F%83%E8%82%AF%E5%B8%83%E5%85%B0%E5%BE%B7/">埃肯布兰德</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>西马克元帅的辖区是<a class="wiki-link" href="/entry/%E8%A5%BF%E9%A9%AC%E5%85%8B/">西马克</a>，即<a class="wiki-link" href="/entry/%E9%9B%AA%E6%B2%B3/">雪河</a>与<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9%E6%B2%B3/">恩特河</a>以西的洛汗王国的广阔土地，是按军队的组织方式划分的军事管辖区，与之相对的是<a class="wiki-link" href="/entry/%E4%B8%9C%E9%A9%AC%E5%85%8B/">东马克</a>。西马克元帅与<a class="wiki-link" href="/entry/%E4%B8%9C%E9%A9%AC%E5%85%8B%E5%85%83%E5%B8%85/">东马克元帅</a>与地位平等，取代了原先的<a class="wiki-link" href="/entry/%E9%A9%AC%E5%85%8B%E7%9A%84%E7%AC%AC%E4%BA%8C%E5%85%83%E5%B8%85/">第二元帅</a>与<a class="wiki-link" href="/entry/%E9%A9%AC%E5%85%8B%E7%9A%84%E7%AC%AC%E4%B8%89%E5%85%83%E5%B8%85/">第三元帅</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
