<h1>明迪布河</h1>
<p><strong>明迪布河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mindeb" target="_blank" rel="noopener noreferrer">Mindeb</a></strong>），是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的一条河流，为<a class="wiki-link" href="/entry/%E8%A5%BF%E7%91%9E%E5%AE%89%E6%B2%B3/">西瑞安河</a>的北部支流。</p>
<p>明迪布河发源于<a class="wiki-link" href="/entry/%E6%88%88%E5%9F%9A%E6%B4%9B%E6%96%AF%E5%B1%B1%E8%84%89/">戈埚洛斯山脉</a>中的<a class="wiki-link" href="/entry/%E9%98%BF%E9%82%A3%E8%B5%AB%E5%B0%8F%E9%81%93/">阿那赫小道</a>附近，一条不知名的、源于<a class="wiki-link" href="/entry/%E5%85%8B%E7%91%9E%E8%B5%9B%E6%A0%BC%E6%9E%97/">克瑞赛格林峰</a>的河流注入明迪布河。河流西岸是名叫<a class="wiki-link" href="/entry/%E4%B8%81%E5%B7%B4%E5%B0%94/">丁巴尔</a>的旷野，东岸是南顿埚塞布谷和<a class="wiki-link" href="/entry/%E5%B0%BC%E5%B0%94%E5%A4%9A%E7%91%9E%E6%96%AF%E6%A3%AE%E6%9E%97/">尼尔多瑞斯森林</a>。明迪布河的下游构成多瑞亚斯王国的边境线，这一部分水域位于<a class="wiki-link" href="/entry/%E7%BE%8E%E4%B8%BD%E5%AE%89%E7%8E%AF%E5%B8%A6/">美丽安环带</a>之内。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
