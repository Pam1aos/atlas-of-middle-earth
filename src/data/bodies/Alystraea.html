<h1>Alystraea</h1>
<p><strong>Alystraea</strong>，另用名 <strong>Annamare</strong>，是一位新加坡女性艺术家，其画作以<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">《精灵宝钻》</a>的内容为主。她也在 Fanfiction 和 AO3 等网站上创作同人文。她授权本维基使用她的画作，详见授权信息。</p>
