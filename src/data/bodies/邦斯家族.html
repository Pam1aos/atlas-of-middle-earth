<h1>邦斯家族</h1>
<p><strong>邦斯家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bunce_Family" target="_blank" rel="noopener noreferrer">Bunce Family</a></strong>），是一个<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。<a class="wiki-link" href="/entry/%E7%B1%B3%E8%8E%AB%E8%8E%8E%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">米莫莎·邦斯</a>是家族中唯一有记载的成员。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆怀斯·甘姆吉</a>的诗歌《小伙子派瑞》中提到，有一位老邦斯太太住在<a class="wiki-link" href="/entry/%E5%A4%A7%E6%B4%9E%E9%95%87/">大洞镇</a>。不清楚这个角色是基于现实原型，还是纯属霍比特人民间创作的杜撰。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
