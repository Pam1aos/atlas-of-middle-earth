<p><strong>阿弗洛斯河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Afros" target="_blank" rel="noopener noreferrer">Afros</a></strong>）是一条位于<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚</a>的河流，在<a class="wiki-link" href="/entry/%E5%A1%94%E8%8A%99%E6%B4%9B%E8%B4%9D%E5%B0%94%E6%A1%A5/">塔芙洛贝尔桥</a>下汇入<a class="wiki-link" href="/entry/%E6%A0%BC%E8%8C%B9%E4%BC%8A%E5%B0%94%E6%B2%B3/">格茹伊尔河</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
