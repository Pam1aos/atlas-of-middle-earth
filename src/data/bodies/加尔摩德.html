<p><strong>加尔摩德</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gálmód" target="_blank" rel="noopener noreferrer">Gálmód</a></strong>）是第三纪元晚期的一位洛希尔人。此名仅见于<a class="wiki-link" href="/entry/%E7%94%98%E9%81%93%E5%A4%AB/">甘道夫</a>对<a class="wiki-link" href="/entry/%E6%A0%BC%E9%87%8C%E9%A9%AC/">格里马</a>的称呼“<strong>加尔摩德之子格里马</strong>”之中，由此我们可以得知加尔摩德是<a class="wiki-link" href="/entry/%E6%A0%BC%E9%87%8C%E9%A9%AC/">格里马</a>的父亲。除此之外，我们对他一无所知<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名称释义</h2>
<p><em>Gálmód</em> 一词源于古英语中意为“轻浮、放荡”的词汇。</p>
