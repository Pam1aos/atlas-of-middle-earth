<h1>独角鲸</h1>
<p><strong>独角鲸</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Narwhals" target="_blank" rel="noopener noreferrer">Narwhals</a></strong>），是一种生活在海洋中的哺乳动物。独角鲸属于齿鲸，它的独角事实上是一根长牙。在早期的中洲相关作品中，海神<a class="wiki-link" href="/entry/%E4%B9%8C%E6%AC%A7%E7%89%9F/">乌欧牟</a>穿梭于大海的车辆据说是由独角鲸和海狮共同拖动的。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
