<h1>汤姆·邦巴迪尔历险记(诗歌)</h1>
<blockquote>
<p><strong>这篇文章尚不完整，欢迎帮助魔戒中文维基扩展它。你可以在这里找到需要扩展的词条列表。</strong></p>

<blockquote>
<p>本词条叙述的对象是一首描写<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94/">汤姆·邦巴迪尔</a>在<a class="wiki-link" href="/entry/%E8%80%81%E6%9E%97%E5%AD%90/">老林子</a>中的奇遇的诗歌。想要了解收录了本诗的同名诗集，请参看《<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94%E5%8E%86%E9%99%A9%E8%AE%B0/">汤姆·邦巴迪尔历险记</a>》。</p>
</blockquote>
<p>《<strong>汤姆·邦巴迪尔历险记</strong>》（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/The_Adventures_of_Tom_Bombadil_(poem" target="_blank" rel="noopener noreferrer">The Adventures of Tom Bombadil</a>)</strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>所写的一首长诗，初于<a class="wiki-link" href="/entry/1934%E5%B9%B4/">1934年</a>发表于《牛津杂志》上，后被收录至同名诗集《<a class="wiki-link" href="/entry/%E6%B1%A4%E5%A7%86%C2%B7%E9%82%A6%E5%B7%B4%E8%BF%AA%E5%B0%94%E5%8E%86%E9%99%A9%E8%AE%B0/">汤姆·邦巴迪尔历险记</a>》中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
