<h1>泰格林溪谷</h1>

<p><strong>泰格林溪谷</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ravines_of_Taeglin" target="_blank" rel="noopener noreferrer">Ravines of Taeglin</a></strong>）位于<a class="wiki-link" href="/entry/%E6%B3%B0%E6%A0%BC%E6%9E%97%E6%B2%B3/">泰格林河</a>延<a class="wiki-link" href="/entry/%E5%B8%83%E7%91%9E%E5%B8%8C%E5%B0%94%E6%A3%AE%E6%9E%97/">布瑞希尔森林</a>外围而下之处。<a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林·图伦拔</a>就是从这里爬到<a class="wiki-link" href="/entry/%E6%A0%BC%E5%8A%B3%E9%BE%99/">格劳龙</a>的肚皮下面，并用黑剑<a class="wiki-link" href="/entry/%E5%8F%A4%E5%B0%94%E6%A1%91/">古尔桑</a>解决了他。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
