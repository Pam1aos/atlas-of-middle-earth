<h1>埃尔达娜湾</h1>
<p><strong>埃尔达娜湾</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bay_of_Eldanna" target="_blank" rel="noopener noreferrer">Bay of Eldanna</a></strong>），是努门诺尔岛西部海岸上的宽阔海湾，它的北面是<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E6%96%AF%E5%A1%94/">安督斯塔</a>海角，南面是<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E5%8A%AA%E6%96%AF%E5%A1%94/">哈尔努斯塔</a>海角。埃尔达娜湾的开口自北向南约有一百余英里宽，它是整座努门诺尔岛上最大的海湾。<a class="wiki-link" href="/entry/%E5%8A%AA%E6%81%A9%E9%83%BD%E5%9B%A0%E5%B0%BC%E6%B2%B3/">努恩都因尼河</a>从埃尔达娜湾注入大海。</p>
<p>埃尔达娜海湾的开口朝向西方，亦即朝向努门诺尔以西的<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E5%9F%83%E7%91%9E%E8%A5%BF%E4%BA%9A/">托尔埃瑞西亚岛</a>和<a class="wiki-link" href="/entry/%E7%BB%B4%E6%9E%97%E8%AF%BA/">维林诺</a>，因此在第二纪元早期，从西方前来造访努门诺尔王国的埃尔达精灵都会泊船在<a class="wiki-link" href="/entry/%E5%8A%AA%E6%81%A9%E9%83%BD%E5%9B%A0%E5%B0%BC%E6%B2%B3/">努恩都因尼河</a>入海口处的<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E6%B3%B7%E8%BF%AA/">埃尔达泷迪港</a>。事实上，埃尔达娜这个地名本身，其意思就是“朝向<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE/">埃尔达</a>”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
