<h1>6月20日</h1>
<h2>现实世界</h2>
<ul>
<li>1934年－艺术家海因茨·埃德尔曼出生。他为《魔戒》的第一个德语译本绘制封面。</li>
<li>2012年－《瓦格纳与托尔金：神话缔造者》（Wagner and Tolkien: Mythmakers）出版。</li>
<li>2024年－第十一届神话大会举办，为期四天（6月20日-23日）。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元3018年－索隆同时进攻刚铎与黑森林王国，咕噜趁乱逃脱。安格玛巫王率军攻打欧斯吉利亚斯，随后与六位戒灵偷偷渡过安都因河，波洛米尔与法拉米尔率军摧毁大桥，守住城市西岸。魔戒大战正式开始。</li>
</ul>
