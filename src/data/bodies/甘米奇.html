<h1>甘米奇</h1>
<p>甘米奇（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gamwich" target="_blank" rel="noopener noreferrer">Gamwich</a></strong>）是夏尔的村庄，也是<a class="wiki-link" href="/entry/%E6%B1%89%E5%A7%86%E6%B3%95%E6%96%AF%E7%89%B9%C2%B7%E7%94%98%E7%B1%B3%E5%A5%87/">汉姆法斯特·甘米奇</a>的家乡。该村庄名称是“甘米奇”家族名称的来源，后变体为<a class="wiki-link" href="/entry/%E7%94%98%E5%A7%86%E5%90%89%E5%AE%B6%E6%97%8F/">甘姆吉</a>。该村庄以制造绳索而闻名。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><em><strong>Gamwich</strong></em> 由<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E8%AF%AD/">霍比特语</a> <em>Galabas</em> 翻译而来，意为“比赛村庄”。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
