<p><strong>长谷叶</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Longbottom_Leaf" target="_blank" rel="noopener noreferrer">Longbottom Leaf</a></strong>），是最优质的三种家产<a class="wiki-link" href="/entry/%E7%83%9F%E6%96%97%E8%8D%89/">烟斗草</a>之一（另外两种是<a class="wiki-link" href="/entry/%E8%80%81%E6%89%98%E6%AF%94/">老托比</a>和<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%BA%E4%B9%8B%E6%98%9F/">南区之星</a>）。<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>南区的<a class="wiki-link" href="/entry/%E9%95%BF%E8%B0%B7%E9%95%87/">长谷</a>是最早种植烟斗草的地区，因此长谷叶很可能是最古老的烟草品种之一。<a class="wiki-link" href="/entry/%E5%90%B9%E5%8F%B7%E5%AE%B6%E6%97%8F/">吹号家族</a>是长谷叶的生产者，盛装长谷叶的木桶上打着他们家族的商标。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p><a class="wiki-link" href="/entry/%E8%90%A8%E8%8C%B9%E6%9B%BC/">萨茹曼</a>偷偷地在<a class="wiki-link" href="/entry/%E8%89%BE%E6%A3%AE%E5%8A%A0%E5%BE%B7/">艾森加德</a>储藏了数桶上好的长谷叶，专供自己享用。艾森加德被攻破之后，<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>和<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>在废墟里发现了其中的两小桶，他们和<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>与<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>分享了这些烟叶。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
