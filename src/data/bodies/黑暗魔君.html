<h1>黑暗魔君</h1>
<p><strong>黑暗魔君</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dark_Lord" target="_blank" rel="noopener noreferrer">Dark Lord</a></strong>），是中洲自由民族对历史上两位大敌的称呼：一位是<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>的兄弟<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">米尔寇</a>（<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>），一位是堕落的迈雅<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">索隆</a>。</p>
