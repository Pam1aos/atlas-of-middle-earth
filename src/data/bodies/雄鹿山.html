<p><strong>雄鹿山</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Buck_Hill" target="_blank" rel="noopener noreferrer">Buck Hill</a></strong>）是一座俯瞰<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a><a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E9%95%87/">雄鹿镇</a>的丘陵，<a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF%E5%AE%B6%E6%97%8F/">白兰地鹿家</a>的<a class="wiki-link" href="/entry/%E6%96%AF%E5%AF%86%E5%A5%A5/">祖宅</a><a class="wiki-link" href="/entry/%E7%99%BD%E5%85%B0%E5%9C%B0%E5%8E%85/">白兰地厅</a>就开凿在其中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
