<p><strong>乌巴尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ulbar" target="_blank" rel="noopener noreferrer">Ulbar</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a><a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%8B%89%E5%9D%A6/">哈尔拉坦</a>手下的一位牧羊人，也是<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">塔尔-阿勒达瑞安</a>的船手<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>生平</h2>
<p>乌巴尔住在<a class="wiki-link" href="/entry/%E5%9F%83%E6%A2%85%E7%91%9E%E4%BE%9D/">埃梅瑞依</a>，他加入了<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>的冒险者公会，成为水手，并与王子一同出海。王子回程后受到了妻子的冷遇，却看到乌巴尔的妻子盛情欢迎，不禁心情郁闷。王子以一个苦涩的回答回复了乌巴尔之子<a class="wiki-link" href="/entry/%E4%BB%A5%E5%B7%B4%E5%B0%94/">以巴尔</a>关于男孩何时可以出航的问题后，并赠给乌巴尔的妻子一个红色的珠宝，这是<a class="wiki-link" href="/entry/%E5%90%89%E5%B0%94-%E5%8A%A0%E6%8B%89%E5%BE%B7/">吉尔-加拉德</a>送给他的<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p><em>Ulbar</em>是一个阿督耐克语词汇，但意义不明。</p>
