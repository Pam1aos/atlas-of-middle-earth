<h1>阿尔达之面纱</h1>
<p><strong>阿尔达之面纱</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Veil_of_Arda" target="_blank" rel="noopener noreferrer">Veil of Arda</a></strong>）是环绕着<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E8%BE%BE/">阿尔达</a>世界的一个区域，它的具体定义不详，但可能是指大气层。“阿尔达之面纱”属于<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>的统治范围。</p>
<blockquote>
<p>他（曼威）热爱阿尔达的风和云，和一切气息流动的领域：上至穹苍，下达深渊，远及“阿尔达之面纱”的极限边界，近至吹拂草地的微风。因此他的别名是苏利牟，“阿尔达气息的主宰”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>—— 《维拉本纪》</p>
</blockquote>
