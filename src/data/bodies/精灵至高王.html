<h1>精灵至高王</h1>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E8%87%B3%E9%AB%98%E7%8E%8B(%E6%B6%88%E6%AD%A7%E4%B9%89)/">消歧义页面</a>。</p>
<p><strong>精灵至高王</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/High_King_of_the_Elves" target="_blank" rel="noopener noreferrer">High King of the Elves</a></strong>），是<a class="wiki-link" href="/entry/%E5%87%A1%E9%9B%85%E6%97%8F/">凡雅族</a>精灵<a class="wiki-link" href="/entry/%E8%8B%B1%E6%A0%BC%E5%A8%81/">英格威</a>的头衔。他居住于神圣的塔尼魁提尔山，侍奉维拉之首<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>，被奉为所有<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>共同的王。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
