<h1>埃伦弥瑞(星辰)</h1>
<blockquote>
<p>本词条叙述的对象是一颗星辰。想要了解<a class="wiki-link" href="/entry/%E5%87%A1%E9%9B%85%E6%97%8F/">凡雅族</a>精灵诗人，请参看<a class="wiki-link" href="/entry/%E5%9F%83%E4%BC%A6%E5%BC%A5%E7%91%9E(%E5%87%A1%E9%9B%85%E7%B2%BE%E7%81%B5)/">埃伦弥瑞(凡雅精灵)</a>。</p>
</blockquote>
<p><strong>埃伦弥瑞</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Elemmírë" target="_blank" rel="noopener noreferrer">Elemmírë</a></strong>）是<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生子女</a>创造的星辰<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。根据<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的手稿，它可能对应现实中的水星<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</p>
<img class="wiki-img" src="/images/300px-树影Dairon｛传说中的螺号君｝_-_埃伦弥瑞_Elemmírë.webp" alt="" loading="lazy" decoding="async" /><p>多瑞亚斯的戴隆</p>
<h2>名字与语源</h2>
<p>埃伦弥瑞（Elemmírë），在<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>中的意思是“珠宝之星”：elen（“星”），mírë（“宝物”，“珠宝”）。</p>
