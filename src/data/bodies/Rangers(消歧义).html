<h1>Rangers(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>Rangers</strong>在书中可能指代两类人员。由于其含义不同，中文翻译时的用字亦稍作区分。</p>
<ul>
<li>游民，即北方的游民，指阿尔诺灭亡后流浪在埃利阿多的北方杜内丹人遗民。</li>
<li>突击队员，即伊希利恩突击队的成员，指伊希利恩沦陷后，由当地人的后代组成的刚铎特殊作战部队成员，负责在此地与敌军游击作战。</li>
</ul>
