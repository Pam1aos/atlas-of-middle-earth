<p><strong>那祖格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Narzug" target="_blank" rel="noopener noreferrer">Narzug</a></strong>），是电影<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E5%8F%B2%E7%9F%9B%E9%9D%A9%E4%B9%8B%E6%88%98/">《霍比特人：史矛革之战》</a>中原创的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>角色，由演员 Ben Mitchell 饰演。</p>
<h2>生平</h2>
<p>那祖格是<a class="wiki-link" href="/entry/%E6%B3%A2%E5%B0%94%E6%A0%BC/">波尔格</a>的手下之一，他参加了波尔格对<a class="wiki-link" href="/entry/%E8%A5%BF%E5%B0%94%E5%87%A1%E7%B2%BE%E7%81%B5/">森林精灵</a>发起的突袭，在混战中被<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>和<a class="wiki-link" href="/entry/%E9%99%B6%E7%91%9E%E5%B0%94/">陶瑞尔</a>生擒。莱戈拉斯和陶瑞尔将他带到<a class="wiki-link" href="/entry/%E7%91%9F%E5%85%B0%E6%9D%9C%E4%BC%8A/">瑟兰杜伊</a>的面前，瑟兰杜伊逼问他为何波尔格会追杀<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>，那祖格说出了梭林一行计划收复<a class="wiki-link" href="/entry/%E5%AD%A4%E5%B1%B1/">孤山</a>的情报，并向陶瑞尔透露，矮人<a class="wiki-link" href="/entry/%E5%A5%87%E5%8A%9B/">奇力</a>命不久矣，因为他中了魔古尔之毒。他还叫嚣道，自己的主人侍奉<a class="wiki-link" href="/entry/%E7%B4%A2%E9%9A%86/">至尊者</a>，森林精灵很快将遭灭顶之灾。瑟兰杜伊最终不耐烦地砍掉了他的脑袋。</p>
