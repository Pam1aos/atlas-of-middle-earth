<h1>艾森格里姆·图克(消歧义)</h1>
<blockquote>
<p><strong>这是一个消歧义页</strong>，罗列了有相同或相近的标题，但内容不同的条目。如果您是通过某条目的内部链接而转到本页，希望您能协助修正该处的内部链接，将它指向正确的条目。</p>
</blockquote>
<p><strong>艾森格里姆·图克</strong>可以代表三名不同的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>，他们都曾担任过<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>。</p>
<ul>
<li>艾森格里姆一世·图克（<a class="ext-link" href="https://tolkiengateway.net/wiki/Isengrim_Took_I" target="_blank" rel="noopener noreferrer">Isengrim Took I</a>）是夏尔最早的长官之一。</li>
<li>艾森格里姆二世·图克（<a class="ext-link" href="https://tolkiengateway.net/wiki/Isengrim_Took_II" target="_blank" rel="noopener noreferrer">Isengrim Took II</a>）是夏尔第22任长官。</li>
<li>艾森格里姆三世·图克（<a class="ext-link" href="https://tolkiengateway.net/wiki/Isengrim_Took_III" target="_blank" rel="noopener noreferrer">Isengrim Took III</a>）是夏尔第27任长官。</li>
</ul>
