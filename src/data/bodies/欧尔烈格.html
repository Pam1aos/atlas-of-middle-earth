<p><strong>欧尔烈格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Orleg" target="_blank" rel="noopener noreferrer">Orleg</a></strong>），是<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a><a class="wiki-link" href="/entry/%E5%9B%BE%E6%9E%97%C2%B7%E5%9B%BE%E4%BC%A6%E6%8B%94/">图林</a>的匪帮中的一名亡命徒。他是在泰格林沿岸树林中狩猎的<a class="wiki-link" href="/entry/%E7%9A%8B%E5%B0%94%E6%B0%91/">皋尔民</a>或“狼人”的一名成员。当匪帮在图林的领导下向南迁徙时，他们遭遇了一队向南抢掠的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>。图林和欧尔烈格在侦察奥克时被它们发现，奥克向西边<a class="wiki-link" href="/entry/%E7%BA%B3%E5%9B%BD%E6%96%AF%E9%9A%86%E5%BE%B7/">纳国斯隆德</a>附近的荒野追击。在这里欧尔烈格被乱箭射死，而图林成功逃脱，花了很久回到匪帮的营地。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
