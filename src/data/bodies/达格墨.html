<h1>达格墨</h1>
<p><strong>达格墨</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dagmor" target="_blank" rel="noopener noreferrer">Dagmor</a></strong>）是<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦·埃尔哈米安</a>的佩剑。凭借着弓箭和这把宝剑，<a class="wiki-link" href="/entry/%E8%B4%9D%E4%BC%A6/">贝伦</a>不仅得以逃脱<a class="wiki-link" href="/entry/%E9%AD%94%E8%8B%9F%E6%96%AF/">魔苟斯</a>的追猎，而且杀死了他的许多爪牙，令整片<a class="wiki-link" href="/entry/%E5%A4%9A%E6%9D%BE%E5%B0%BC%E5%AE%89/">多松尼安</a>的黑暗势力都领略了恐怖和死亡。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“达格墨”（Dagmor）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称，意为“黑暗的杀戮者”。</p>
