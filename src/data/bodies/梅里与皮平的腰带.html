<h1>梅里与皮平的腰带</h1>
<p><strong>梅里与皮平的腰带</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Merry_and_Pippin's_belts" target="_blank" rel="noopener noreferrer">Merry and Pippin&#39;s belts</a></strong>），是指<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%BE%B7%E7%91%9E%E5%B0%94/">加拉德瑞尔</a>送给<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>的赠礼。当护戒远征队启程离开<a class="wiki-link" href="/entry/%E6%B4%9B%E4%B8%9D%E7%BD%97%E7%91%9E%E6%81%A9/">洛丝罗瑞恩森林</a>时，远征队里的每一位成员，都得到了森林的统治者<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%BE%B7%E7%91%9E%E5%B0%94/">加拉德瑞尔</a>赐予的礼物。其中，<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>获得的是两条“银色小腰带，扣环做得像朵金花”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
