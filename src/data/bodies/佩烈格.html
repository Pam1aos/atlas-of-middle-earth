<p><strong>佩烈格</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Peleg" target="_blank" rel="noopener noreferrer">Peleg</a></strong>）是一个出现于早期设定中的角色。在最早版本的《刚多林的陷落》一文中，他被设定为<a class="wiki-link" href="/entry/%E5%8D%B0%E5%A4%9A/">印多</a>之子、<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>之父<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。而在<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">《精灵宝钻》</a>中，<a class="wiki-link" href="/entry/%E8%83%A1%E5%A5%A5/">胡奥</a>才是图奥的父亲。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
