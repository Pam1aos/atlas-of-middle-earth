<h1>南区之星</h1>
<p><strong>南区之星</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Southern_Star" target="_blank" rel="noopener noreferrer">Southern Star</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>最优质的三种家产烟斗草之一（另外两种是<a class="wiki-link" href="/entry/%E8%80%81%E6%89%98%E6%AF%94/">老托比</a>和<a class="wiki-link" href="/entry/%E9%95%BF%E8%B0%B7%E5%8F%B6/">长谷叶</a>），它应该生长在夏尔南区温暖的<a class="wiki-link" href="/entry/%E9%95%BF%E8%B0%B7%E9%95%87/">长谷</a>一带。这种烟草名称里的“星”字，指的可能是烟斗草的星型花朵。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
