<p><strong>费伦</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Feren" target="_blank" rel="noopener noreferrer">Feren</a></strong>），是《霍比特人》系列电影中原创的<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97%E7%8E%8B%E5%9B%BD/">森林王国</a>精灵角色，由演员 Simon London 饰演。</p>
<h2>生平</h2>
<p>费伦首次登场于<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E5%8F%B2%E7%9F%9B%E9%9D%A9%E4%B9%8B%E6%88%98/">《霍比特人：史矛革之战》</a>中。<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>乘酒桶从森林精灵的监狱里逃跑后，费伦遵<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>的吩咐吹响警戒号角，命令精灵们关闭<a class="wiki-link" href="/entry/%E5%AF%86%E6%9E%97%E6%B2%B3/">密林河</a>上的闸门。不过，精灵随后遭到了<a class="wiki-link" href="/entry/%E6%B3%A2%E5%B0%94%E6%A0%BC/">波尔格</a>率领的<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">半兽人</a>小队的突袭，而矮人<a class="wiki-link" href="/entry/%E5%A5%87%E5%8A%9B/">奇力</a>趁乱重新打开了闸门，梭林一行得以脱逃。</p>
<p><a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>中，费伦被精灵王<a class="wiki-link" href="/entry/%E7%91%9F%E5%85%B0%E6%9D%9C%E4%BC%8A/">瑟兰杜伊</a>派往<a class="wiki-link" href="/entry/%E9%95%BF%E6%B9%96%E9%95%87/">长湖镇</a>附近，传令让莱戈拉斯返回<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>，同时也告诉<a class="wiki-link" href="/entry/%E9%99%B6%E7%91%9E%E5%B0%94/">陶瑞尔</a>，她已经被逐出王国。<a class="wiki-link" href="/entry/%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">五军之战</a>时，费伦担任瑟兰杜伊的副官，他在瑟兰杜伊意图撤军时，吹响了集结号角。</p>
