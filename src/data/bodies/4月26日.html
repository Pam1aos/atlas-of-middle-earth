<h1>4月26日</h1>
<h2>现实世界</h2>
<ul>
<li>1923年－J·R·R·托尔金在《泰晤士文学增刊》上发表书评《神圣的少女时代》（Holy Maidenhood）。</li>
<li>1981年－《魔戒》广播剧第八集在BBC播出。</li>
<li>1999年－奇幻网站独一之戒（TheOneRing.net）上线。</li>
<li>2003年－《指环王：双塔奇兵》在中国大陆公映。</li>
<li>2010年－西蒙·托尔金发表文章《追随祖父的脚步》。</li>
</ul>
<h2>阿尔达世界</h2>
<ul>
<li>第三纪元2941年－梭林等一众矮人拜访比尔博，甘道夫说服梭林带上比尔博参加远征。</li>
</ul>
