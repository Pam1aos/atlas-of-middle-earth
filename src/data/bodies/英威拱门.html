<p>《失落的传说之书》</p>
<p>熬夜编程的蛋花汤</p>
<p><strong>英威拱门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Arch_of_Inwë" target="_blank" rel="noopener noreferrer">Arch of Inwë</a></strong>），是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>城内<a class="wiki-link" href="/entry/%E6%B3%89%E4%BA%95%E4%B9%8B%E5%9C%B0/">泉井之地</a>广场的西面入口。它的名称显然和英威相关，但原因不详。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E7%9A%84%E9%99%B7%E8%90%BD/">刚多林陷落</a>时，<a class="wiki-link" href="/entry/%E5%8A%A0%E5%B0%94%E5%A4%9A/">加尔多</a>带领<a class="wiki-link" href="/entry/%E7%BB%BF%E6%A0%91%E5%AE%B6%E6%97%8F/">绿树家族</a>在泉井之地抵挡试图从英威拱门侵入广场的奥克大军。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
