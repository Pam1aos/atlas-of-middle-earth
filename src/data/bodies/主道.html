<h1>主道</h1>
<p>有一些其他的词条可能与此词条重名或近似，请参阅<a class="wiki-link" href="/entry/%E4%B8%BB%E9%81%93(%E6%B6%88%E6%AD%A7%E4%B9%89)/">消歧义页面</a>。</p>
<p><strong>主道</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Causeway_(Gondor" target="_blank" rel="noopener noreferrer">Causeway</a>)</strong>），是一条连接着欧斯吉利亚斯城和<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E/">佩兰诺平野</a>的带有护墙的堤道。它起自欧斯吉利亚斯的渡口和诸桥，最后经由一扇有<a class="wiki-link" href="/entry/%E4%B8%BB%E9%81%93%E5%8F%8C%E5%A0%A1/">主道双堡</a>把守着的大门，穿过佩兰诺平野的外墙<a class="wiki-link" href="/entry/%E6%8B%89%E9%A9%AC%E6%96%AF%E5%9F%83%E9%9C%8D%E5%B0%94/">拉马斯埃霍尔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
