<p>Alan Lee</p>
<p><strong>石之门</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gate_of_Stone" target="_blank" rel="noopener noreferrer">Gate of Stone</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97%E4%B8%83%E9%97%A8/">刚多林七门</a>中的第二道大门。一道巨墙建在谷壁之间，石之门便是巨墙中一座庞大的拱门，拱门上方正中悬挂着一盏白灯，而门由一整块漆黑光滑的巨岩堵住。大门后的庭院站着许多灰衣卫士。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>石之门后面的一道大门是<a class="wiki-link" href="/entry/%E9%9D%92%E9%93%9C%E4%B9%8B%E9%97%A8/">青铜之门</a>，两门之间只有一小段距离。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
