<p><strong>德尔沃林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Dervorin" target="_blank" rel="noopener noreferrer">Dervorin</a></strong>）是<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间<a class="wiki-link" href="/entry/%E5%87%9B%E6%A0%BC%E7%BD%97%E8%B0%B7%E5%9C%B0/">凛格罗谷地</a>领主的儿子。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年3月9日，德尔沃林率领三百名步兵抵达<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>，前来援助这座大敌当前的主城。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>德尔沃林参加了随后打响的<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>。鉴于歌颂阵亡将士的《<a class="wiki-link" href="/entry/%E8%92%99%E5%BE%B7%E5%A0%A1%E5%A2%93%E5%86%A2%E4%B9%8B%E6%AD%8C/">蒙德堡墓冢之歌</a>》中没有提及他，所以他可能从战争中幸存了下来。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
