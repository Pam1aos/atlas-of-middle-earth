<h1>掘小洞家族</h1>
<p><strong>掘小洞家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Smallburrow_Family" target="_blank" rel="noopener noreferrer">Smallburrow Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，<a class="wiki-link" href="/entry/%E7%BD%97%E5%AE%BE%C2%B7%E6%8E%98%E5%B0%8F%E6%B4%9E/">罗宾·掘小洞</a>是出生于<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E5%B1%AF/">霍比屯</a>的<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6/">夏警</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<section class="footnotes"><h2 class="fn-title">注释</h2><ol><li id="fn-1"><a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92III-%E7%8E%8B%E8%80%85%E5%BD%92%E6%9D%A5/">魔戒III-王者归来</a>，<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92-%E5%8D%B7%E5%85%AD-%E7%AC%AC%E5%85%AB%E7%AB%A0/">卷VI-第八章</a>，夏尔平乱。 <a class="fn-back" href="#fnref-1">↩</a></li></ol></section>
