<h1>夏尔民军</h1>
<p><strong>夏尔民军</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Shire-muster" target="_blank" rel="noopener noreferrer">Shire-muster</a></strong>），是指<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>在紧急状况时召集的临时武装，夏尔<a class="wiki-link" href="/entry/%E9%95%BF%E5%AE%98/">长官</a>兼任民军的指挥官。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>的历史中没有夏尔民军被召集的记载，但在<a class="wiki-link" href="/entry/%E7%BB%BF%E9%87%8E%E4%B9%8B%E6%88%98/">绿野之战</a>和<a class="wiki-link" href="/entry/%E5%82%8D%E6%B0%B4%E9%95%87%E4%B9%8B%E6%88%98/">傍水镇之战</a>期间，这种情况可能发生过。</p>
