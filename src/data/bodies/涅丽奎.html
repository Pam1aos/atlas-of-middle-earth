<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>

<blockquote>
<p><strong>这个词条描述的对象仅出现于《失落的传说》，即<a class="wiki-link" href="/entry/%E4%BC%A0%E8%AF%B4%E6%95%85%E4%BA%8B%E9%9B%86/">传说故事集</a>的原始版本。</strong> 慎将该作设定套用至其他作品，它们可能产生矛盾。</p>

<p><strong>涅丽奎</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nielíqui" target="_blank" rel="noopener noreferrer">Nielíqui</a></strong>），是《失落的传说》里<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E7%B1%B3/">欧洛米</a>与<a class="wiki-link" href="/entry/%E7%93%A6%E5%A8%9C/">瓦娜</a>的女儿。</p>
