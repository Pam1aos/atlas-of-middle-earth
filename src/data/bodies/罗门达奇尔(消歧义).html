<p><strong>罗门达奇尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Rómendacil_(disambiguation" target="_blank" rel="noopener noreferrer">Rómendacil</a>)</strong>），可以指以下两位刚铎国王：</p>
<ul>
<li>罗门达奇尔一世是刚铎的第八代国王，亦是刚铎历史上第一位抗击东夷侵略的国王。</li>
<li>罗门达奇尔二世是刚铎的第十九代国王。</li>
</ul>
