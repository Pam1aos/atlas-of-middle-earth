<h1>蓝希尔·拉玛斯</h1>
<p><strong>蓝希尔·拉玛斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lanthir_Lamath" target="_blank" rel="noopener noreferrer">Lanthir Lamath</a></strong>），是<a class="wiki-link" href="/entry/%E6%AC%A7%E8%A5%BF%E7%91%9E%E5%AE%89%E5%BE%B7/">欧西瑞安德</a>的一座瀑布，<a class="wiki-link" href="/entry/%E8%BF%AA%E5%A5%A5/">迪奥·埃路希尔</a>的房屋位于瀑布旁边。蓝希尔·拉玛斯是<a class="wiki-link" href="/entry/%E8%BF%AA%E5%A5%A5/">迪奥</a>的女儿<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E6%B1%B6/">埃尔汶</a>姓名的来源：“埃尔汶”意为“星光水花”，因为她生在一个繁星满天的夜里，彼时蓝希尔·拉玛斯瀑布水花飞溅、星光闪耀。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>蓝希尔·拉玛斯（Lanthir Lamath）是一个<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>地名，意为“回声瀑布”，其中 <em>lanthir</em> 意为“瀑布”，<em>lamath</em> 是 <em>lam</em>（“回声”）的复数形式。</p>
