<h1>蛮荒森林</h1>
<p><strong>蛮荒森林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Wild_Wood" target="_blank" rel="noopener noreferrer">Wild Wood</a></strong>）是一片位于<a class="wiki-link" href="/entry/%E5%A5%8E%E7%BB%B4%E8%80%B6%E8%83%BD/">奎维耶能</a>和<a class="wiki-link" href="/entry/%E6%AC%A7%E6%B4%9B%E5%8D%A1%E5%B0%BC/">欧洛卡尼</a><sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>附近的古老森林，<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>孩童在此地初次迎来曙光。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
