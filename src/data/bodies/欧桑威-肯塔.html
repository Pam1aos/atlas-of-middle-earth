<h1>欧桑威-肯塔</h1>
<blockquote>
<p><strong>这个词条的名称并非官方译名，因为它尚未拥有官方译名。</strong> 本维基参考世纪文景版译名表或其他资料，暂定词条译名。</p>
</blockquote>
<p><strong>《欧桑威-肯塔》</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ósanwe-kenta" target="_blank" rel="noopener noreferrer">Ósanwe-kenta</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>撰写的一篇关于欧桑威（Ósanwe），即“<a class="wiki-link" href="/entry/%E6%84%8F%E5%BF%B5%E4%BA%A4%E6%B5%81/">意念交流</a>”的手稿，完成于1959-1960年间。该手稿经过<a class="wiki-link" href="/entry/%E5%8D%A1%E5%B0%94%C2%B7%E9%9C%8D%E6%96%AF%E6%B3%B0%E7%89%B9/">卡尔·F·霍斯泰特</a>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Carl_F._Hostetter" target="_blank" rel="noopener noreferrer">Carl F. Hostetter</a></strong>）的编辑整理和注释后，刊登于著名托尔金研究杂志<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E8%AF%AD%E9%80%9A%E8%AE%AF/">《精灵语通讯》</a>第三十九期（出版于1998年）。</p>
