<h1>掷铁环</h1>
<p><strong>掷铁环</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Quoits" target="_blank" rel="noopener noreferrer">Quoits</a></strong>）是一项投掷类的游戏。玩家需要将铁环（或是绳圈）抛过一定距离，使其套在竖立于地面的一根刺状物上。</p>
<p>在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>也存在掷铁环这项游戏，<a class="wiki-link" href="/entry/%E6%AF%94%E5%B0%94%E5%8D%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">比尔博·巴金斯</a>就在它上面花费过不少时间。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
