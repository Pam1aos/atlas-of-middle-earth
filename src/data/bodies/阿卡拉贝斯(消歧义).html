<p><strong>阿卡拉贝斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Akallabêth" target="_blank" rel="noopener noreferrer">Akallabêth</a></strong>）是一个<a class="wiki-link" href="/entry/%E9%98%BF%E7%9D%A3%E8%80%90%E5%85%8B%E8%AF%AD/">阿督耐克语</a>名称，这个名字可以指以下事物。</p>
<ul>
<li>努门诺尔，阿卡拉贝斯是努门诺尔的昆雅语名称“亚特兰提”——即“沉沦之地”的变式。</li>
<li>努门诺尔沦亡史，《精灵宝钻》的第四大部分。</li>
</ul>
