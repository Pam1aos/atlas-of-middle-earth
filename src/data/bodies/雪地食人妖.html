<p><strong>雪地食人妖</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Snow-trolls" target="_blank" rel="noopener noreferrer">Snow-trolls</a></strong>）是一种存在与否存疑的<a class="wiki-link" href="/entry/%E9%A3%9F%E4%BA%BA%E5%A6%96/">食人妖</a>。在<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的全部作品中，对雪地食人妖仅仅只有一句间接的记载：<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<blockquote>
<p>他（<a class="wiki-link" href="/entry/%E6%B5%B7%E5%B0%94%E5%A7%86/">海尔姆</a>）会独自外出，一身全白，如同雪地食人妖一样潜入敌人的营地……</p>
<p>—— 《魔戒》附录一，“埃奥尔家族”</p>
</blockquote>
<p>假如雪地食人妖确实存在，它们可能浑身覆盖着白色的皮毛，居住于寒冷的雪地环境：例如<a class="wiki-link" href="/entry/%E8%BF%B7%E9%9B%BE%E5%B1%B1%E8%84%89/">迷雾山脉</a>的雪岭，或是极北的佛洛德地区。</p>
