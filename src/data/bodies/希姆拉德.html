<p>希姆拉德（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Himlad" target="_blank" rel="noopener noreferrer">Himlad</a></strong>）是一片位于东<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>的寒冷平原，位于<a class="wiki-link" href="/entry/%E9%98%BF%E6%B4%9B%E6%96%AF%E6%B2%B3/">阿洛斯河</a>与<a class="wiki-link" href="/entry/%E5%87%AF%E9%9A%86%E6%B2%B3/">凯隆河</a>之间；它通过<a class="wiki-link" href="/entry/%E9%98%BF%E6%A0%BC%E9%9A%86%E9%9A%98%E5%8F%A3/">阿格隆隘口</a>在北方与<a class="wiki-link" href="/entry/%E6%B4%9B%E4%B8%9D%E8%93%9D/">洛丝蓝平原</a>接壤<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<p>在安格班合围期间，<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%B7%A9/">凯勒巩</a>与<a class="wiki-link" href="/entry/%E5%BA%93%E8%8C%B9%E8%8A%AC/">库茹芬</a>镇守于此地<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。它于<a class="wiki-link" href="/entry/%E9%AA%A4%E7%81%AB%E4%B9%8B%E6%88%98/">骤火之战</a>期间沦陷<sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup>。</p>
<h2>名字与词源</h2>
<p>此名来源于him（“凉爽”）和lad（“平原”）。<sup class="fn-ref"><a href="#fn-4" id="fnref-4">4</a></sup></p>
