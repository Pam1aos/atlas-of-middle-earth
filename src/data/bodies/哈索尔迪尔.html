<p><strong>哈索尔迪尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hatholdir" target="_blank" rel="noopener noreferrer">Hatholdir</a></strong>），是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>人，出自<a class="wiki-link" href="/entry/%E5%93%88%E5%A4%9A%E5%AE%B6%E6%97%8F/">哈多家族</a>。他是努门诺尔第五位君主<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E7%BE%8E%E5%B0%BC%E5%B0%94%E9%83%BD%E5%B0%94/">塔尔-美尼尔都尔</a>的好友，他的儿子<a class="wiki-link" href="/entry/%E6%AC%A7%E5%B0%94%E5%93%88%E5%B0%94%E5%A4%9A/">欧尔哈尔多</a>与公主<a class="wiki-link" href="/entry/%E7%88%B1%E6%9E%97%E5%A6%AE%E5%B0%94/">爱林妮尔</a>成婚，生下了<a class="wiki-link" href="/entry/%E6%A2%AD%E9%9A%86%E6%89%98/">梭隆托</a><sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p>哈索尔迪尔（Hatholdir）是<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名字，其中<em>hathol</em>意为“斧锋”，<code>-dir</code>为阳性后缀。</p>
