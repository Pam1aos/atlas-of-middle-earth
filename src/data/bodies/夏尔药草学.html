<h1>夏尔药草学</h1>
<p><strong>夏尔药草学</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Herblore_of_the_Shire" target="_blank" rel="noopener noreferrer">Herblore of the Shire</a></strong>），是<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里阿道克·白兰地鹿</a>在<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>后撰写的一本著作。</p>
<p>该书考证了吸食<a class="wiki-link" href="/entry/%E7%83%9F%E6%96%97%E8%8D%89/">烟斗草</a>这一习俗的起源。<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>在书中指出，烟斗草原产自<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>，被杜内丹人飘洋过海带到<a class="wiki-link" href="/entry/%E4%B8%AD%E6%B4%B2/">中洲</a>，又从<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3%E8%B0%B7/">安都因河谷</a>下游沿着<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">南北大道</a>传入<a class="wiki-link" href="/entry/%E5%9F%83%E5%88%A9%E9%98%BF%E5%A4%9A/">埃利阿多</a>；<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>是最早学会吸烟的民族，第一个人工种植烟斗草的霍比特人是<a class="wiki-link" href="/entry/%E6%89%98%E5%8D%9A%E5%BE%B7%C2%B7%E5%90%B9%E5%8F%B7/">托博德·吹号</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
