<h1>新堡镇</h1>
<p><strong>新堡镇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Newbury" target="_blank" rel="noopener noreferrer">Newbury</a></strong>），是<a class="wiki-link" href="/entry/%E9%9B%84%E9%B9%BF%E5%9C%B0/">雄鹿地</a>东北边的城镇，在<a class="wiki-link" href="/entry/%E5%85%8B%E9%87%8C%E5%85%8B%E6%B4%BC/">克里克洼</a>北边，东侧邻近<a class="wiki-link" href="/entry/%E6%A0%91%E7%AF%B1/">树篱</a>。</p>
<h2>词源</h2>
<p><code>Bury</code>源自古英语<code>burch</code>，意为“坚固的圈地”。加上新堡镇靠近树篱，表明新堡镇也许是作为最近的一道防卫，用于抵御<a class="wiki-link" href="/entry/%E8%80%81%E6%9E%97%E5%AD%90/">老林子</a>的入侵者。</p>
