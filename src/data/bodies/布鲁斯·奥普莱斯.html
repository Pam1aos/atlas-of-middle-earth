<p><strong>布鲁斯·奥普莱斯</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Bruce_Allpress" target="_blank" rel="noopener noreferrer">Bruce Allpress</a></strong>），是一位新西兰演员，曾在<a class="wiki-link" href="/entry/%E6%8C%87%E7%8E%AF%E7%8E%8B%EF%BC%9A%E5%8F%8C%E5%A1%94%E5%A5%87%E5%85%B5/">指环王：双塔奇兵</a>中饰演<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94%E5%A4%9A(%E7%94%B5%E5%BD%B1%E8%A7%92%E8%89%B2)/">阿尔多</a>。</p>
