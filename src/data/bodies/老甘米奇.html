<p><strong>老甘米奇</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Old_Gammidge" target="_blank" rel="noopener noreferrer">Old Gammidge</a></strong>），是<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA(%E7%B3%BB%E5%88%97%E7%94%B5%E5%BD%B1)/">《霍比特人》系列电影</a>中原创的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>角色，由新西兰演员 Stephen Gledhill 饰演。</p>
<h2>生平</h2>
<p>老甘米奇首次登场于《霍比特人：意外之旅》加长版中，他在<a class="wiki-link" href="/entry/%E7%BB%BF%E9%BE%99%E9%85%92%E9%A6%86/">绿龙酒馆</a>外的集市上有一个短暂的镜头。<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA%EF%BC%9A%E4%BA%94%E5%86%9B%E4%B9%8B%E6%88%98/">《霍比特人：五军之战》</a>中，他出席了售卖<a class="wiki-link" href="/entry/%E8%A2%8B%E5%BA%95%E6%B4%9E/">袋底洞</a>的拍卖会。</p>
