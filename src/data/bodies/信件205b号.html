<p><strong>信件205b号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_205b" target="_blank" rel="noopener noreferrer">Letter 205b</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给荷兰书店老板赛斯·欧博特的一封信，写信日期为1958年4月2日。托尔金感谢了欧博特先生<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金写信感谢赛斯·欧博特先生，提及他访问荷兰一事，他说自己越早能去那里越好。</p>
