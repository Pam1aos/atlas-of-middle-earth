<h1>夏警局</h1>
<p><strong>夏警局</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Shirriff-house" target="_blank" rel="noopener noreferrer">Shirriff-house</a></strong>），是指<a class="wiki-link" href="/entry/%E6%81%B6%E6%A3%8D%E5%B8%AE/">恶棍帮</a>占领<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>时期，在夏尔的许多地方新建的、供<a class="wiki-link" href="/entry/%E5%A4%8F%E8%AD%A6/">夏警</a>驻扎的简陋建筑物。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年11月1日，<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>返回夏尔后，在<a class="wiki-link" href="/entry/%E8%9B%99%E6%B3%BD%E5%B1%AF/">蛙泽屯</a>被夏警逮捕，他们在蛙泽屯的夏警局过了一夜。这是蛙泽屯西端的一幢丑陋单层砖房，带狭窄的窗户，砌得歪歪扭扭，它属于夏警<a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA%E7%AC%AC%E4%B8%80%E9%83%A8%E9%98%9F/">东区第一部队</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>恶棍帮被赶出夏尔后，所有夏警局都被拆毁，拆下来的砖头被用来修补许多老旧的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>洞府，让它们更干燥、更温暖舒适。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></p>
