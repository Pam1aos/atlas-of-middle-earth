<p><strong>信件162号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_162" target="_blank" rel="noopener noreferrer">Letter 162</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给<a class="wiki-link" href="/entry/%E9%9B%B7%E7%BA%B3%C2%B7%E6%98%82%E6%B8%A9/">雷纳·昂温</a>的一封信，写信日期为1954年4月18日。托尔金让小儿子解决了地图的事情<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>克里斯托弗重新绘制了托尔金在第三卷所涉及的地区的地图草稿。他希望它能获得批准，并指出比例正好是一般地图的5倍。</p>
