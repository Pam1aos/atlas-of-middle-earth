<p><strong>阿尔-萨卡索尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Ar-Sakalthôr" target="_blank" rel="noopener noreferrer">Ar-Sakalthôr</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>第二十二位君主。</p>
<h2>生平</h2>
<p>阿尔-萨卡索尔出生于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>2876年，是<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94-%E8%BE%9B%E6%8B%89%E6%9D%BE/">阿尔-辛拉松</a>之子。他依照祖父<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94-%E9%98%BF%E7%9D%A3%E9%82%A3%E9%9C%8D%E5%B0%94/">阿尔-阿督那霍尔</a>时代以来的传统，使用阿督耐克语的称号。而他的<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>头衔是塔尔-法拉斯西安。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>这位国王于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%BA%8C%E7%BA%AA%E5%85%83/">第二纪元</a>3033年继承王位，他死后，他的儿子<a class="wiki-link" href="/entry/%E9%98%BF%E5%B0%94-%E5%9F%BA%E5%AF%86%E4%BD%90%E5%B0%94/">阿尔-基密佐尔</a>继位。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称与含义</h2>
<p>Sakalthôr和昆雅名Falassion都意为“海岸之子”。</p>
