<p><strong>燕麦庄</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Oatbarton" target="_blank" rel="noopener noreferrer">Oatbarton</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E5%8C%97%E5%8C%BA/">北区</a>的村庄或城镇，<a class="wiki-link" href="/entry/%E5%8D%97%E5%8C%97%E5%A4%A7%E9%81%93/">北大道</a>从燕麦庄通向<a class="wiki-link" href="/entry/%E4%B8%9C%E5%A4%A7%E9%81%93/">东大道</a>。具体地点不详，因为在<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94%E4%B8%80%E9%9A%85/">夏尔一隅</a>地图中没有标识这个地方。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
