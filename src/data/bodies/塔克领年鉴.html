<h1>塔克领年鉴</h1>
<p><strong>塔克领年鉴</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Year-book_of_Tuckborough" target="_blank" rel="noopener noreferrer">Year-book of Tuckborough</a></strong>），又称<strong>黄皮书</strong>，是保存至<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>末期的最重要的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>史书之一。该年鉴最早的条目始于<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>前至少900年，亦即<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>2100年左右。它记载了<a class="wiki-link" href="/entry/%E5%9B%BE%E5%85%8B%E5%AE%B6%E6%97%8F/">图克家族</a>中的出生、婚娶和死亡等情况，也包括土地交易和夏尔大事之类的内容，其中有关编年史和家谱的记载被《红皮书》多次引用。《塔克领年鉴》还保存了<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E8%AF%AD/">霍比特语</a>中星期的古老名称：Sterrendei、Sunnendei、Monendei、Trewesdei、Hevenesdei、Meresdei、Hihdei。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
