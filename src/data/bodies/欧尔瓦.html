<p>雅凡娜</p>
<p>Ted Nasmith</p>
<p><strong>欧尔瓦</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Olvar" target="_blank" rel="noopener noreferrer">Olvar</a></strong>），指生根于地、会成长之物。泛指植物。</p>
<p>欧尔瓦是“大地之后”<a class="wiki-link" href="/entry/%E9%9B%85%E5%87%A1%E5%A8%9C/">雅凡娜</a>的所造之物。其中，又数树木最受雅凡娜重视。雅凡娜担心<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94%E7%9A%84%E5%84%BF%E5%A5%B3/">伊露维塔的儿女</a>到来后，会随心所欲地支配和处置她的造物。因而她向<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>提出诉求，希望树木能为所有生根在地的植物代言，惩罚滥伐之人。而后<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94/">伊露维塔</a>回应了雅凡娜的诉求，许诺在<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生儿女</a>力量仍然强盛、<a class="wiki-link" href="/entry/%E4%BA%BA%E7%B1%BB/">次生儿女</a>尚年轻之时，将有蒙受召唤而来的神灵与<a class="wiki-link" href="/entry/%E5%87%AF%E5%B0%94%E7%93%A6/">凯尔瓦</a>和欧尔瓦为伴。其中的一部分会定居下来，受到尊崇，令人生畏。这便是“百树的牧人”——<a class="wiki-link" href="/entry/%E6%81%A9%E7%89%B9/">恩特</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
