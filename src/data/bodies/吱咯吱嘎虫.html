<h1>吱咯吱嘎虫</h1>
<p><strong>吱咯吱嘎虫</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Neekerbreekers" target="_blank" rel="noopener noreferrer">Neekerbreekers</a></strong>），是大量分布于<a class="wiki-link" href="/entry/%E8%9A%8A%E6%B0%B4%E6%B3%BD/">蚊水泽</a>的一种昆虫，夜晚时发出吱咯吱嘎的鸣叫，声音类似蛐蛐。<a class="wiki-link" href="/entry/%E5%BC%97%E7%BD%97%E5%A4%9A%C2%B7%E5%B7%B4%E9%87%91%E6%96%AF/">弗罗多</a>、<a class="wiki-link" href="/entry/%E5%B1%B1%E5%A7%86%E6%80%80%E6%96%AF%C2%B7%E7%94%98%E5%A7%86%E5%90%89/">山姆</a>、<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>等人穿越蚊水泽时，饱受这种昆虫骚扰，“吱咯吱嘎虫”是山姆根据这种昆虫的叫声，给它们取的名字。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
