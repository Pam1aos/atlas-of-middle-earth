<h1>卡尔明登</h1>
<p><strong>卡尔明登</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Calmindon" target="_blank" rel="noopener noreferrer">Calmindon</a></strong>），是<a class="wiki-link" href="/entry/%E6%89%98%E5%B0%94%E4%B9%8C%E5%A6%AE/">托尔乌妮</a>岛上的一座高大灯塔；托尔乌妮是努门诺尔岛东部罗门娜湾当中的一个小岛，乃是海后<a class="wiki-link" href="/entry/%E4%B9%8C%E5%A6%AE/">乌妮</a>亲手所设。卡尔明登的建造者是伟大的努门诺尔航海家、努门诺尔第六代国王<a class="wiki-link" href="/entry/%E5%A1%94%E5%B0%94-%E9%98%BF%E5%8B%92%E8%BE%BE%E7%91%9E%E5%AE%89/">阿勒达瑞安</a>，罗门娜港是他进行航海活动的基地，也是由他领导的<a class="wiki-link" href="/entry/%E6%8E%A2%E9%99%A9%E8%80%85%E5%85%AC%E4%BC%9A/">探险者公会</a>的所在地，因此有必要修建一座灯塔。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>卡尔明登（Calmindon）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名称，直译即为“灯塔”。</p>
