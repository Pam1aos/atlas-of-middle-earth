<h1>努阿斯森林</h1>
<p><strong>努阿斯森林</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Núath" target="_blank" rel="noopener noreferrer">Woods of Núath</a></strong>），是<a class="wiki-link" href="/entry/%E8%B4%9D%E7%83%88%E7%91%9E%E5%AE%89%E5%BE%B7/">贝烈瑞安德</a>西北部的一片森林。它主要分布在<a class="wiki-link" href="/entry/%E5%9F%83%E7%91%9E%E5%BE%B7%E5%A8%81%E6%96%AF%E6%9E%97/">埃瑞德威斯林</a>山脉西段支脉的南侧，从<a class="wiki-link" href="/entry/%E7%BA%B3%E6%B4%9B%E6%A0%BC%E6%B2%B3/">纳洛格河</a>的上游延伸到<a class="wiki-link" href="/entry/%E8%83%BD%E5%AE%81%E6%B2%B3/">能宁河</a>的源头处。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%AE%9D%E9%92%BB(%E4%B9%A6%E7%B1%8D)/">《精灵宝钻》</a>的正文和地图中没有提及这个地名，它仅出现在<a class="wiki-link" href="/entry/%E6%9C%AA%E5%AE%8C%E7%9A%84%E4%BC%A0%E8%AF%B4/">《未完的传说》</a>中。<a class="wiki-link" href="/entry/%E9%87%91%E6%A0%BC%E6%BC%93%E6%96%AF%E6%B2%B3/">金格漓斯河</a>就发源于此。</p>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>495年，<a class="wiki-link" href="/entry/%E6%B2%83%E9%9A%86%E5%A8%81/">沃隆威</a>和<a class="wiki-link" href="/entry/%E5%9B%BE%E5%A5%A5/">图奥</a>在前往<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的旅途中穿越了努阿斯森林，当时已值寒冬，大雪落在森林的枯叶上。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
