<h1>埃敏阿尔能领主</h1>
<p><strong>埃敏阿尔能领主</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Lord_of_Emyn_Arnen" target="_blank" rel="noopener noreferrer">Lord of Emyn Arnen</a></strong>）是<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">埃莱萨王</a>赐予<a class="wiki-link" href="/entry/%E6%B3%95%E6%8B%89%E7%B1%B3%E5%B0%94/">法拉米尔</a>及其<a class="wiki-link" href="/entry/%E8%83%A1%E6%9E%97%E5%AE%B6%E6%97%8F/">家族</a>继承人的一个头衔，通过这个头衔，法拉米尔可以以<a class="wiki-link" href="/entry/%E4%BC%8A%E5%B8%8C%E5%88%A9%E6%81%A9%E4%BA%B2%E7%8E%8B/">伊希利恩亲王</a>的名义获封并居住在位于<a class="wiki-link" href="/entry/%E5%8D%97%E4%BC%8A%E5%B8%8C%E5%88%A9%E6%81%A9/">南伊希利恩</a>的<a class="wiki-link" href="/entry/%E5%9F%83%E6%95%8F%E9%98%BF%E5%B0%94%E8%83%BD/">埃敏阿尔能</a>丘陵之中。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>埃敏阿尔能坐落于<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>在大河以东的领土之上，其也是<a class="wiki-link" href="/entry/%E5%9F%83%E6%95%8F%E9%98%BF%E5%B0%94%E8%83%BD%E7%9A%84%E8%83%A1%E6%9E%97/">埃敏阿尔能的胡林</a>的家乡，此人是宰相家族的首领，也是法拉米尔的祖先之一。</p>
