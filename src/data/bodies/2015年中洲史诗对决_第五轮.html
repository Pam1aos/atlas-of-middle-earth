<h1>2015年中洲史诗对决/第五轮</h1>
<p>经过四轮的投票，我们终于决出了四方胜者！来先为他们欢呼一下吧：</p>
<img class="wiki-img" src="/images/160px-Jenny_Dolfen_-_Aragorn_Son_of_Arathorn.webp" alt="Jenny Dolfen - Aragorn Son of Arathorn.jpg" loading="lazy" decoding="async" /><p><a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a></p>
<p>是杜内丹人第16代也是最后一代族长。他是伊熙尔杜第39代直系后裔，是他的时代里最伟大的人类。在魔戒大战中，他领导人类对抗索隆的邪恶势力；他帮助护戒远征队完成了销毁至尊戒的任务、彻底消灭了大敌；在战后，他建立了阿尔诺与刚铎联合王国，阿尔诺与刚铎再次团结在了一起。</p>
