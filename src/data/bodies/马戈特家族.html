<h1>马戈特家族</h1>
<p><strong>马戈特家族</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Maggot_Family" target="_blank" rel="noopener noreferrer">Maggot Family</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a>的<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>家族。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>时期，<a class="wiki-link" href="/entry/%E5%86%9C%E5%A4%AB%E9%A9%AC%E6%88%88%E7%89%B9/">农夫马戈特</a>和他的<a class="wiki-link" href="/entry/%E9%A9%AC%E6%88%88%E7%89%B9%E5%A4%AA%E5%A4%AA/">太太</a>在<a class="wiki-link" href="/entry/%E6%B3%BD%E5%9C%B0/">泽地</a>经营农场<a class="wiki-link" href="/entry/%E8%B1%86%E5%9B%AD%E5%BA%84/">豆园庄</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>根据<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>的说法，马戈特（Maggot）这个名字来自<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E8%AF%AD/">霍比特语</a>。现存的记载里没有给出这个名字的含意。托尔金特别指出，这个名字不能与英语中的maggot（意为“蛆虫”）相混淆。他表示这种情况只是一种巧合，并没有词源上的联系。</p>
