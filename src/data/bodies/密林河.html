<p>比尔博</p>
<p>J.R.R.托尔金</p>
<p><strong>密林河</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Forest_River" target="_blank" rel="noopener noreferrer">Forest River</a></strong>），是<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>北部的一条大河。它发源于<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97/">黑森林</a>以北的<a class="wiki-link" href="/entry/%E7%81%B0%E8%89%B2%E5%B1%B1%E8%84%89/">灰色山脉</a>，往东南方向奔流，在<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5%E5%9B%BD%E7%8E%8B%E7%9A%84%E5%AE%AB%E6%AE%BF/">精灵国王的宫殿</a>附近和<a class="wiki-link" href="/entry/%E9%AD%94%E6%B3%95%E6%B2%B3/">魔法河</a>汇合，最后注入<a class="wiki-link" href="/entry/%E9%95%BF%E6%B9%96/">长湖</a>。</p>
<p>木筏精灵在密林河上为<a class="wiki-link" href="/entry/%E9%BB%91%E6%A3%AE%E6%9E%97%E7%8E%8B%E5%9B%BD/">森林王国</a>和<a class="wiki-link" href="/entry/%E9%95%BF%E6%B9%96%E9%95%87/">长湖镇</a>运送货物：他们将装有货物的木桶扎成木筏，然后划着木筏往来于两地之间。埃瑞博远征期间，<a class="wiki-link" href="/entry/%E6%A2%AD%E6%9E%97%E5%92%8C%E4%BC%99%E4%BC%B4%E4%BB%AC/">梭林和伙伴们</a>正是藏身在运货木桶中，才得以从<a class="wiki-link" href="/entry/%E7%91%9F%E5%85%B0%E6%9D%9C%E4%BC%8A/">瑟兰杜伊</a>的地牢里逃脱。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
