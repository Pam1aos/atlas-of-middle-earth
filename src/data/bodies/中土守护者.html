<h1>中土守护者</h1>
<p><strong>中土守护者</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Guardians_of_Middle-earth" target="_blank" rel="noopener noreferrer">Guardians of Middle-earth</a></strong>），是由Monolith Productions开发、华纳发行的主机MOBA游戏。主机版于2012年12月4日登陆PS3和Xbox 360平台，PC版于2013年8月29日通过Steam等平台发售。2018年-2019年间，游戏悄然从所有平台下架，所有服务器也关闭。开发商或发行商没有发布任何官方公告。</p>
