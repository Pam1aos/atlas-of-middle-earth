<h1>蒙德堡墓冢</h1>
<p><strong>蒙德堡墓冢</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Mounds_of_Mundburg" target="_blank" rel="noopener noreferrer">Mounds of Mundburg</a></strong>），是<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E/">佩兰诺平野</a>上、<a class="wiki-link" href="/entry/%E5%AE%89%E9%83%BD%E5%9B%A0%E6%B2%B3/">安都因河</a>河畔的墓冢群，埋葬着<a class="wiki-link" href="/entry/%E4%BD%A9%E5%85%B0%E8%AF%BA%E5%B9%B3%E9%87%8E%E4%B9%8B%E6%88%98/">佩兰诺平野之战</a>中阵亡的<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E%E4%BA%BA/">刚铎人</a>、<a class="wiki-link" href="/entry/%E6%B4%9B%E5%B8%8C%E5%B0%94%E4%BA%BA/">洛希尔人</a>和北方杜内丹人将士。<a class="wiki-link" href="/entry/%E8%92%99%E5%BE%B7%E5%A0%A1%E5%A2%93%E5%86%A2%E4%B9%8B%E6%AD%8C/">《蒙德堡墓冢之歌》</a>颂唱了佩兰诺平野之战和蒙德堡墓冢。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p><strong>蒙德堡</strong>（Mundburg）是<a class="wiki-link" href="/entry/%E6%B4%9B%E6%B1%97%E8%AF%AD/">洛汗语</a>对<a class="wiki-link" href="/entry/%E7%B1%B3%E9%82%A3%E6%96%AF%E6%8F%90%E5%8A%9B%E6%96%AF/">米那斯提力斯</a>城的称呼。</p>
