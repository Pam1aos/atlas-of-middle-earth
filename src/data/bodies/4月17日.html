<h1>4月17日</h1>
<h2>现实世界</h2>
<ul>
<li>1950年－斯坦利·昂温写信给J·R·R·托尔金，表明自己拒绝在尚未审核收尾工作之际出版《精灵宝钻》。</li>
<li>1959年：<ul>
<li>J·R·R·托尔金写下一封信（信件215号）。</li>
<li>演员肖恩·宾出生，他在《指环王：护戒使者》中扮演波洛米尔。</li>
</ul>
</li>
<li>1967年－J·R·R·托尔金给J·D·吉尔伯特写了一封信。</li>
<li>2010年：<ul>
<li>托尔金学社在英国布莱顿举行年会。</li>
<li>托尔金传奇将名字改为中洲传奇。</li>
</ul>
</li>
<li>2015年－魔戒中文维基建立。</li>
</ul>
