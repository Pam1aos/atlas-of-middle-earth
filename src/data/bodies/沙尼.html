<h1>沙尼</h1>
<p><strong>沙尼</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Tharni" target="_blank" rel="noopener noreferrer">Tharni</a></strong>）是<a class="wiki-link" href="/entry/%E5%88%9A%E9%93%8E/">刚铎</a>的主要流通货币之一，其<a class="wiki-link" href="/entry/%E8%BE%9B%E8%BE%BE%E8%AF%AD/">辛达语</a>名称是<strong>卡那斯</strong>。沙尼是一种银币，一沙尼等于四分之一<a class="wiki-link" href="/entry/%E5%8D%A1%E6%96%AF%E5%A1%94%E5%B0%94/">卡斯塔尔</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p><em>tharni</em> 是<a class="wiki-link" href="/entry/%E8%A5%BF%E9%83%A8%E8%AF%AD/">西部语</a>，意为“四分之一”，其辛达语为 <em>canath</em>。</p>
