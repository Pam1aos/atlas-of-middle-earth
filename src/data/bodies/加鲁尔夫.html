<p><strong>加鲁尔夫</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Gárulf" target="_blank" rel="noopener noreferrer">Gárulf</a></strong>）是<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>麾下<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E9%9B%B7%E5%BE%B7/">伊奥雷德</a>中的一位骑兵。</p>
<h2>生平</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年2月29日，加鲁尔夫作为<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>麾下家族军队的一员，参加了消灭<a class="wiki-link" href="/entry/%E4%B9%8C%E6%A0%BC%E9%B2%81%E5%85%8B/">乌格鲁克</a>等<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>的战斗。他不幸在战斗中罹难，被战友葬在了<a class="wiki-link" href="/entry/%E8%8C%83%E8%B4%A1%E6%A3%AE%E6%9E%97/">范贡森林</a>的边缘。但他的坐骑<a class="wiki-link" href="/entry/%E5%93%88%E8%8B%8F%E8%B4%B9%E5%B0%94/">哈苏费尔</a>幸存了下来，后来被<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>赠给了<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名称释义</h2>
<p>“加鲁尔夫”（Gárulf）这个名称是古英语，它由<code>Gár</code>（“长矛”）和<code>ulf</code>（“狼”）组成。</p>
