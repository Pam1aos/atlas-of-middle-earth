<h1>东方阿瓦瑞语</h1>
<p><strong>东方阿瓦瑞语</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/East_Avarin" target="_blank" rel="noopener noreferrer">East Avarin</a></strong>），是<a class="wiki-link" href="/entry/%E9%98%BF%E7%93%A6%E7%91%9E%E8%AF%AD/">阿瓦瑞语</a>的一个分支，被部分<a class="wiki-link" href="/entry/%E9%98%BF%E7%93%A6%E7%91%9E/">阿瓦瑞</a>使用，我们对于这种语言知之甚少。</p>
