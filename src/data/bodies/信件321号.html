<p><strong>信件321号</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Letter_321" target="_blank" rel="noopener noreferrer">Letter 321</a></strong>）是<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>寄给P·洛克的一封信，写信日期为1971年2月4日。托尔金解释了洞穴的灵感来源<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>内容梗概</h2>
<p>托尔金写道，他最高兴的是洛克对“闪闪发光的洞穴”的描述，其他评论家都没有特别提到这一点。托尔金说他是根据切达峡谷的洞穴创作的。他曾在1940年再次造访过这些地方，但他的主要记忆来自于蜜月期间的一次造访。</p>
