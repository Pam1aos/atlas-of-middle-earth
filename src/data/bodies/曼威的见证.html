<h1>曼威的见证</h1>
<p><strong>曼威的见证</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Witnesses_of_Manwë" target="_blank" rel="noopener noreferrer">Witnesses of Manwë</a></strong>），是指<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>的<a class="wiki-link" href="/entry/%E7%BE%8E%E5%B0%BC%E5%B0%94%E5%A1%94%E7%8E%9B/">美尼尔塔玛</a>山顶的三只<a class="wiki-link" href="/entry/%E5%A4%A7%E9%B9%B0/">大鹰</a>。美尼尔塔玛山是尊崇<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94/">伊露维塔</a>的圣地，三只大鹰是圣山上仅有的鸟类，人们相信它们是<a class="wiki-link" href="/entry/%E6%9B%BC%E5%A8%81/">曼威</a>从<a class="wiki-link" href="/entry/%E9%98%BF%E9%97%A8%E6%B4%B2/">阿门洲</a>派遣来的，负责守护美尼尔塔玛和<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>全境。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<p>平时，每当有人靠近美尼尔塔玛山顶，三只大鹰就会立刻现身，落在山顶西面边缘的三块岩石上。但在<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94%E5%9B%BD%E7%8E%8B/">努门诺尔国王</a>于美尼尔塔玛山主持的<a class="wiki-link" href="/entry/%E4%BC%8A%E9%9C%B2%E7%BB%B4%E5%A1%94/">伊露维塔</a>祭典（<a class="wiki-link" href="/entry/%E4%B8%80%E5%A6%82%E7%A5%88%E5%B0%94%E6%A2%85/">一如祈尔梅</a>、<a class="wiki-link" href="/entry/%E4%B8%80%E5%A6%82%E8%8E%B1%E5%A1%94%E5%88%97/">一如莱塔列</a>、<a class="wiki-link" href="/entry/%E4%B8%80%E5%A6%82%E5%90%AB%E5%A1%94%E5%88%97/">一如含塔列</a>）期间，它们并不降落，而是在人们的头上盘旋。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
