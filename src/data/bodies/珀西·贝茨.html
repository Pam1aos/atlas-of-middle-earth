<p><strong>珀西·贝茨</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Percy_Bates" target="_blank" rel="noopener noreferrer">Percy Bates</a></strong>），全名珀西·埃利·贝茨爵士（Sir Percy Elly Bates），生于<a class="wiki-link" href="/entry/1879%E5%B9%B4/">1879年</a><a class="wiki-link" href="/entry/5%E6%9C%8812%E6%97%A5/">5月12日</a>，卒于<a class="wiki-link" href="/entry/1946%E5%B9%B4/">1946年</a><a class="wiki-link" href="/entry/10%E6%9C%8816%E6%97%A5/">10月16日</a>。他是大英帝国勋章爵级大十字爵士（GBE），偶尔列席<a class="wiki-link" href="/entry/%E5%A2%A8%E8%B1%A1%E7%A4%BE/">墨象社</a>的聚会，与<a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">J.R.R. 托尔金</a>相交。</p>
