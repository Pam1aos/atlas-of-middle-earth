<h1>青蛙</h1>
<p><strong>青蛙</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Frogs" target="_blank" rel="noopener noreferrer">Frogs</a></strong>），是一种动物。</p>
<p><a class="wiki-link" href="/entry/J.R.R.%20%E6%89%98%E5%B0%94%E9%87%91/">托尔金</a>经常形容<a class="wiki-link" href="/entry/%E5%92%95%E5%99%9C/">咕噜</a>“像青蛙”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup><sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><sup class="fn-ref"><a href="#fn-3" id="fnref-3">3</a></sup><sup class="fn-ref"><a href="#fn-4" id="fnref-4">4</a></sup></p>
<p><a class="wiki-link" href="/entry/%E5%A4%8F%E5%B0%94/">夏尔</a><a class="wiki-link" href="/entry/%E4%B8%9C%E5%8C%BA/">东区</a>有个村庄叫<a class="wiki-link" href="/entry/%E8%9B%99%E6%B3%BD%E5%B1%AF/">蛙泽屯</a>，可能与青蛙有关。</p>
