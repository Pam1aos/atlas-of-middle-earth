<p><strong>加拉松</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Galadhon" target="_blank" rel="noopener noreferrer">Galadhon</a></strong>），是<a class="wiki-link" href="/entry/%E5%A4%9A%E7%91%9E%E4%BA%9A%E6%96%AF/">多瑞亚斯</a>的一名<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">精灵</a>。他是<a class="wiki-link" href="/entry/%E8%BE%9B%E8%91%9B/">辛葛</a>王的侄子，是王弟<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%8E%AB/">埃尔莫</a>之子。他是<a class="wiki-link" href="/entry/%E5%87%AF%E5%8B%92%E5%8D%9A%E6%81%A9/">凯勒博恩</a>和<a class="wiki-link" href="/entry/%E5%8A%A0%E6%8B%89%E5%B8%8C%E5%B0%94/">加拉希尔</a>的父亲。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
