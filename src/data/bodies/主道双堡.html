<p><strong>主道双堡</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Causeway_Forts" target="_blank" rel="noopener noreferrer">Causeway Forts</a></strong>），是<a class="wiki-link" href="/entry/%E6%8B%89%E9%A9%AC%E6%96%AF%E5%9F%83%E9%9C%8D%E5%B0%94/">拉马斯埃霍尔</a>防御工事的一部分，两座塔堡在此扼守着拉马斯埃霍尔外墙北部的一扇大门，来自欧斯吉利亚斯城的<a class="wiki-link" href="/entry/%E4%B8%BB%E9%81%93/">主道</a>从这里穿过外墙。<a class="wiki-link" href="/entry/%E9%AD%94%E6%88%92%E5%A4%A7%E6%88%98/">魔戒大战</a>期间，<a class="wiki-link" href="/entry/%E6%B3%95%E6%8B%89%E7%B1%B3%E5%B0%94/">法拉米尔</a>奉命坚守主道双堡，阻击从欧斯吉利亚斯蜂拥而来的<a class="wiki-link" href="/entry/%E9%AD%94%E5%A4%9A/">魔多</a>敌军，但他们无法在<a class="wiki-link" href="/entry/%E5%AE%89%E6%A0%BC%E7%8E%9B%E5%B7%AB%E7%8E%8B/">安格玛巫王</a>面前支撑太久，堡垒很快就被攻陷了。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
