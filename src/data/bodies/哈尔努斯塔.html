<h1>哈尔努斯塔</h1>
<p><strong>哈尔努斯塔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Hyarnustar" target="_blank" rel="noopener noreferrer">Hyarnustar</a></strong>）是<a class="wiki-link" href="/entry/%E5%8A%AA%E9%97%A8%E8%AF%BA%E5%B0%94/">努门诺尔</a>西南境的海岬，其西部地区多山，西边和南边海滨是巨大的悬崖，而东部地区气候温暖，土地肥沃，遍布大葡萄园。<a class="wiki-link" href="/entry/%E5%93%88%E5%B0%94%E6%B4%9B%E6%96%AF%E5%A1%94/">哈尔洛斯塔</a>与哈尔努斯塔被一片漫长的海岸分得很开，而那片海岸海洋与陆地平缓过渡，这在努门诺尔是独一无二的（努门诺尔几乎所有临海的地方都是悬崖）。哈尔努斯塔与<a class="wiki-link" href="/entry/%E5%AE%89%E7%9D%A3%E6%96%AF%E5%A1%94/">安督斯塔</a>夹着埃尔达娜湾。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>Hyarnustar是<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>词汇，意为“西南方的土地”。由表示南方的前缀<code>hyar-</code>、表示西方的中缀<code>-nu-</code>以及表示土地的后缀<code>-sta</code>构成。结尾的<code>-r</code>表示复数。</p>
