<p><strong>伊奥泰因</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Éothain" target="_blank" rel="noopener noreferrer">Éothain</a></strong>）是<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>麾下的一名骑兵。在《魔戒》的早期手稿中，曾提及他是<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>的<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E9%9B%B7%E5%BE%B7/">伊奥雷德</a>的队长。</p>
<h2>经历</h2>
<p><a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%89%E7%BA%AA%E5%85%83/">第三纪元</a>3019年2月29日，伊奥泰因作为<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>的<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E9%9B%B7%E5%BE%B7/">伊奥雷德</a>的一员，参与了消灭俘虏<a class="wiki-link" href="/entry/%E6%A2%85%E9%87%8C%E9%98%BF%E9%81%93%E5%85%8B%C2%B7%E7%99%BD%E5%85%B0%E5%9C%B0%E9%B9%BF/">梅里</a>和<a class="wiki-link" href="/entry/%E4%BD%A9%E9%87%8C%E6%A0%BC%E6%9E%97%C2%B7%E5%9B%BE%E5%85%8B/">皮平</a>的一群<a class="wiki-link" href="/entry/%E5%A5%A5%E5%85%8B/">奥克</a>的战斗。</p>
<p>2月30日，在返回<a class="wiki-link" href="/entry/%E5%9F%83%E5%A4%9A%E6%8B%89%E6%96%AF/">埃多拉斯</a>时，他们与<a class="wiki-link" href="/entry/%E9%98%BF%E6%8B%89%E8%B4%A1/">阿拉贡</a>、<a class="wiki-link" href="/entry/%E5%90%89%E5%A7%86%E5%88%A9/">吉姆利</a>与<a class="wiki-link" href="/entry/%E8%8E%B1%E6%88%88%E6%8B%89%E6%96%AF/">莱戈拉斯</a>相遇。伊奥泰因很不信任这三个人，对他们讲述的经历嗤之以鼻，认为那是胡思乱想。他不相信<a class="wiki-link" href="/entry/%E9%9C%8D%E6%AF%94%E7%89%B9%E4%BA%BA/">霍比特人</a>的存在；而当<a class="wiki-link" href="/entry/%E4%BC%8A%E5%A5%A5%E6%A2%85%E5%B0%94/">伊奥梅尔</a>将战马借给阿拉贡等人时，只有伊奥泰因敢于公然提出异议。</p>
<h2>名字与词源</h2>
<p><em>Éothain</em> 由古英语中的 <em>Éoh</em> （“战马”）和 <em>thegn</em> （“战士”）组成。</p>
