<h1>尼西能</h1>
<p><strong>尼西能</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Nísinen" target="_blank" rel="noopener noreferrer">Nísinen</a></strong>），是努门诺尔岛的一片狭长湖泊，位于<a class="wiki-link" href="/entry/%E5%8A%AA%E6%81%A9%E9%83%BD%E5%9B%A0%E5%B0%BC%E6%B2%B3/">努恩都因尼河</a>的下游河段。湖泊的西面不远处，是努门诺尔岛西岸的<a class="wiki-link" href="/entry/%E5%B0%BC%E8%A5%BF%E5%A7%86%E9%98%BF%E5%8B%92%E8%BE%BE/">尼西姆阿勒达</a>地区和<a class="wiki-link" href="/entry/%E5%9F%83%E5%B0%94%E8%BE%BE%E5%A8%9C%E6%B9%BE/">埃尔达娜</a>海港。尼西能湖畔长满了气味芬芳的灌木和花丛。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
<h2>名字与词源</h2>
<p>尼西能（Nísinen）是一个<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅语</a>名字，意为“芬芳之水”，由<code>níse</code>（或<code>nísima</code>，意为“芬芳”）和<code>nen</code>（意为“水”）构成。</p>
