<h1>投石索</h1>
<p><strong>投石索</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Slings" target="_blank" rel="noopener noreferrer">Slings</a></strong>），是一种古老的远程武器。它是一根中央系有小囊的皮制或毛制带，在小囊中装上石弹后，通过高速转动带子来使弹药因为离心力而发射出去，攻击敌人。<a class="wiki-link" href="/entry/%E5%88%9A%E5%A4%9A%E6%9E%97/">刚多林</a>的<a class="wiki-link" href="/entry/%E7%BB%BF%E6%A0%91%E5%AE%B6%E6%97%8F/">绿树家族</a>在装备<a class="wiki-link" href="/entry/%E6%A3%8D%E6%A3%92/">狼牙棒</a>的同时，也配备了投石索。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></p>
