<h1>阿纳瑞玛</h1>
<p><strong>阿纳瑞玛</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Anarríma" target="_blank" rel="noopener noreferrer">Anarríma</a></strong>），是<a class="wiki-link" href="/entry/%E7%93%A6%E5%B0%94%E5%A6%B2/">瓦尔妲</a>为<a class="wiki-link" href="/entry/%E7%B2%BE%E7%81%B5/">首生子女</a>创造的星座<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>。</p>
<h2>名字与词源</h2>
<p>阿纳瑞玛（Anarríma）似乎由<a class="wiki-link" href="/entry/%E6%98%86%E9%9B%85%E8%AF%AD/">昆雅</a>中anar（“太阳”）和ríma（“边，镶边”）组成，意思是“太阳之边”<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>^[请求来源]。</p>
