<p><strong>贝烈国尔</strong>（<strong><a class="ext-link" href="https://tolkiengateway.net/wiki/Belegor" target="_blank" rel="noopener noreferrer">Belegor</a></strong>）是一位<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>的<a class="wiki-link" href="/entry/%E4%BC%8A%E7%94%B8%E4%BA%BA/">伊甸人</a>。</p>
<h2>生平</h2>
<p>贝烈国尔生于<a class="wiki-link" href="/entry/%E7%AC%AC%E4%B8%80%E7%BA%AA%E5%85%83/">第一纪元</a>340年，他是<a class="wiki-link" href="/entry/%E8%B4%9D%E5%A5%A5%E5%AE%B6%E6%97%8F/">贝奥家族</a>族长<a class="wiki-link" href="/entry/%E6%B3%A2%E9%9A%86/">波隆</a>的次子，<a class="wiki-link" href="/entry/%E6%B3%A2%E6%B4%9B%E7%B1%B3%E5%B0%94(%E6%8B%89%E5%BE%B7%E6%B4%9B%E6%96%AF%E9%A2%86%E4%B8%BB)/">波洛米尔</a>是他的兄长。除此之外，贝烈国尔生平不详。</p>
